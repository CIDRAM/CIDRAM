hints_sensitive_pages: "टीप: "संवेदनशील पृष्ठ" म्हणजे काय हे {{Links.ConfigRef.sensitive}} द्वारे निश्चित केले जाते."
hints_shorthand:
 0.: "जर तुमच्या वेबसाइटला LAN किंवा लोकलहोस्ट द्वारे प्रवेश हवा असेल, तर ते अवरोधित करू नका. अन्यथा, तुम्ही हे अवरोधित करू शकता."
 1.: "कोणत्याही डीफॉल्ट स्वाक्षरी फायलीमध्ये हे वापरले जात नाही, परंतु काही वापरकर्त्यांसाठी ते उपयुक्त ठरू शकते म्हणून ते समर्थित आहे."
 2.: "जर तुम्हाला वापरकर्त्यांना प्रॉक्सी द्वारे तुमच्या वेबसाइटवर प्रवेश हवा असेल, तर हे अवरोधित करू नका. अन्यथा, तुम्ही हे अवरोधित करू शकता."
 3.: "स्वाक्षरींमध्ये थेट वापर समर्थित नाही, परंतु विशिष्ट परिस्थितीत ते इतर मार्गांनी वापरले जाऊ शकते."
 4.: "अशा प्रकरणांमध्ये संदर्भित करते जिथे लघुलेखन शब्द अजिबात वापरले जात नाहीत किंवा CIDRAM द्वारे ओळखले जात नाहीत."
 प्रत्येक स्वाक्षरीसाठी एक.: "एका स्वाक्षरीमध्ये अनेक प्रोफाइल वापरता येतात, परंतु त्यामध्ये फक्त एकच लघुलेखन शब्द वापरता येतो. हे शक्य आहे की अनेक लघुलेखन शब्द योग्य असू शकतात, परंतु फक्त एकच वापरता येत असल्याने, आम्ही नेहमीच सर्वात योग्य शब्द वापरण्याचा प्रयत्न करतो."
 प्राधान्य.: "निवडलेला पर्याय नेहमीच न निवडलेल्या पर्यायापेक्षा प्राधान्य देतो. उदाहरणार्थ, जर अनेक लघुलेखन शब्द वापरले जात असतील परंतु त्यापैकी फक्त एकच अवरोधित केला जात आहे असे सेट केले असेल, तरीही विनंती अवरोधित केली जाईल."
 मानवी अंत्यबिंदू आणि क्लाउड सेवा.: "क्लाउड सेवा हा शब्द वेबहोस्टिंग प्रदाते, सर्व्हर फार्म, डेटा सेंटर, किंवा इतर अनेक गोष्टींचा संदर्भ घेऊ शकते. मानवी अंत्यबिंदू म्हणजे एखाद्या व्यक्तीने इंटरनेटवर प्रवेश करण्याच्या पद्धती, जसे की इंटरनेट सेवा प्रदात्याद्वारे. नेटवर्क सहसा फक्त एक किंवा दुसरा प्रदान करते, परंतु कधीकधी दोन्ही देखील प्रदान करू शकते. आम्ही कधीही संभाव्य मानवी अंत्यबिंदूंना क्लाउड सेवा म्हणून ओळखू नये असे उद्दिष्ट ठेवतो. म्हणून, जर क्लाउड सेवांची श्रेणी ज्ञात मानवी अंत्यबिंदूंद्वारे सामायिक केली गेली असेल तर ती वेगळीच काहीतरी म्हणून ओळखली जाऊ शकते. याउलट, आम्ही नेहमीच अशा क्लाउड सेवा ओळखण्याचे उद्दिष्ट ठेवतो, ज्यांच्या श्रेणी कोणत्याही ज्ञात मानवी अंत्यबिंदूंद्वारे सामायिक केल्या जात नाहीत, त्यांना क्लाउड सेवा म्हणून ओळखतो. म्हणून, क्लाउड सेवा म्हणून स्पष्टपणे ओळखली जाणारी विनंती कदाचित कोणत्याही ज्ञात मानवी अंत्यबिंदूंसह त्याची श्रेणी सामायिक करत नाही. त्याचप्रमाणे, हल्ल्यांद्वारे किंवा स्पॅमद्वारे स्पष्टपणे ओळखल्या जाणाऱ्या विनंतीमध्ये कदाचित अशा श्रेणी सामायिक केल्या जातील. तथापि, इंटरनेट सतत बदलत असते आणि श्रेणी नेहमीच खरेदी किंवा विक्री केल्या जात असतात, म्हणून खोट्या सकारात्मक गोष्टींबद्दल जागरूक आणि सतर्क रहा."
hints_time_format: |
 <strong><em>प्लेसहोल्डर – स्पष्टीकरण – 2024-04-30T18:27:49+08:00 वर आधारित उदाहरण.</em></strong><br />
 <code class="s">{yyyy}</code> – वर्ष – उदाहरणार्थ, 2024.<br />
 <code class="s">{yy}</code> – संक्षिप्त वर्ष – उदाहरणार्थ, 24.<br />
 <code class="s">{Mon}</code> – महिन्याचे संक्षिप्त नाव (इंग्रजीमध्ये) – उदाहरणार्थ, Apr.<br />
 <code class="s">{mm}</code> – अग्रगण्य शून्यांसह महिना – उदाहरणार्थ, 04.<br />
 <code class="s">{m}</code> – महिना – उदाहरणार्थ, 4.<br />
 <code class="s">{Day}</code> – दिवसाचे संक्षिप्त नाव (इंग्रजीमध्ये) – उदाहरणार्थ, Tue.<br />
 <code class="s">{dd}</code> – अग्रगण्य शून्यांसह दिवस – उदाहरणार्थ, 30.<br />
 <code class="s">{d}</code> – दिवस – उदाहरणार्थ, 30.<br />
 <code class="s">{hh}</code> – अग्रगण्य शून्यांसह तास (२४ तासांचा वेळ वापरतो) – उदाहरणार्थ, 18.<br />
 <code class="s">{h}</code> – तास (२४ तासांचा वेळ वापरतो) – उदाहरणार्थ, 18.<br />
 <code class="s">{ii}</code> – अग्रगण्य शून्यांसह मिनिट – उदाहरणार्थ, 27.<br />
