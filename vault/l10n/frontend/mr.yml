hints_usemode:
 0: "टीप: श्वेतसूचीबद्ध किंवा सत्यापित आणि अवरोधित नसलेल्या विनंत्यांसाठी कधीही कॅप्चा पूर्ण करण्याची आवश्यकता नाही."
 1: "हे देखील लक्षात ठेवा: कॅप्चा, बॉट्स आणि विविध प्रकारच्या दुर्भावनापूर्ण स्वयंचलित विनंत्यांपासून संरक्षणाचा एक उपयुक्त, अतिरिक्त स्तर प्रदान करू शकतात, परंतु दुर्भावनापूर्ण मानवापासून कोणतेही संरक्षण प्रदान करणार नाहीत."
 2: "सहाय्यक नियमांद्वारे विनंत्या "वापरासाठी चिन्हांकित" केल्या जाऊ शकतात."
 3: "विनंती "संवेदनशील" मानली जाते की नाही हे {{Links.ConfigRef.sensitive}} द्वारे निश्चित केले जाते."
 4: ""स्वाक्षरी मर्यादा" {{Links.ConfigRef.signature_limit}} द्वारे निश्चित केली जाते."
hints_verification:
 ""सकारात्मक" आणि "नकारात्मक" म्हणजे काय?": "विनंतीद्वारे सादर केलेली ओळख पडताळताना, यशस्वी निकालाचे वर्णन "सकारात्मक" किंवा "नकारात्मक" असे केले जाऊ शकते. जर सादर केलेली ओळख खरी ओळख असल्याची पुष्टी झाली तर ती "सकारात्मक" म्हणून वर्णन केली जाईल. जर सादर केलेली ओळख खोटी असल्याचे निश्चित झाले तर ती "नकारात्मक" म्हणून वर्णन केली जाईल. तथापि, अयशस्वी निकालाचे (उदाहरणार्थ, पडताळणी अयशस्वी होते, किंवा सादर केलेल्या ओळखीची सत्यता निश्चित करता येत नाही) वर्णन "सकारात्मक" किंवा "नकारात्मक" असे केले जाणार नाही. त्याऐवजी, अयशस्वी निकालाचे वर्णन फक्त अप्रमाणित असे केले जाईल. जेव्हा विनंतीद्वारे सादर केलेली ओळख पडताळण्याचा कोणताही प्रयत्न केला जात नाही, तेव्हा विनंतीलाही पडताळणी न केलेली म्हणून वर्णन केले जाईल. विनंतीद्वारे सादर केलेली ओळख ओळखली जाते आणि जिथे पडताळणी शक्य असते तिथेच या संज्ञा अर्थपूर्ण ठरतात. ज्या प्रकरणांमध्ये सादर केलेली ओळख वर दिलेल्या पर्यायांशी जुळत नाही किंवा जिथे कोणतीही ओळख सादर केलेली नाही, तेथे वर दिलेले पर्याय अप्रासंगिक ठरतात."
 ""सिंगल-हिट बायपास" म्हणजे काय?": "काही प्रकरणांमध्ये, स्वाक्षरी फायली, मॉड्यूल, किंवा विनंतीच्या इतर अटींमुळे सकारात्मक-सत्यापित विनंती अजूनही अवरोधित केली जाऊ शकते आणि खोटे सकारात्मक टाळण्यासाठी बायपास आवश्यक असू शकतात. जर बायपासचा उद्देश फक्त एकाच उल्लंघनाला हाताळणे असेल, कमी जास्त नाही, तर अशा बायपासचे वर्णन "सिंगल-हिट बायपास" असे करता येईल."
hints_want_to_block: "!! बहुतेक वापरकर्ते कदाचित हे अवरोधित करावे असे वाटतील, मग ते खरे असो किंवा खोटे असो. "सत्यापित करण्याचा प्रयत्न" निवडू नये आणि "सत्यापित नाही विनंत्या अवरोधित करा" निवडून ते साध्य करता येते. तथापि, काही वापरकर्ते अशा विनंत्या पडताळू इच्छित असल्याने (सकारात्मक परवानगी देताना नकारात्मक रोखण्यासाठी), अशा विनंत्या मॉड्यूलद्वारे अवरोधित करण्याऐवजी, अशा विनंत्या हाताळण्यासाठी पर्याय येथे दिले आहेत."
