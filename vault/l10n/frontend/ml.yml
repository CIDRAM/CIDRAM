config:
 abuseipdb: "AbuseIPDB മൊഡ്യൂളിനുള്ള കോൺഫിഗറേഷൻ."
 abuseipdb_api_key: &EnterAPIKey "ദയവായി നിങ്ങളുടെ API കീ ഇവിടെ നൽകുക."
 abuseipdb_build_profiles_from_usage_type: "API നൽകുന്ന ഉപയോഗ തരം ഉപയോഗിച്ച് പ്രൊഫൈലുകൾ നിർമ്മിക്കണോ? False = ഇല്ല. True = അതെ. സ്ഥിരസ്ഥിതി = True."
 abuseipdb_max_age_in_days: "ലുക്കപ്പുകൾ നടത്തുമ്പോൾ റിപ്പോർട്ടുകൾ പരിഗണിക്കുന്നതിനുള്ള പരമാവധി പ്രായം ദിവസങ്ങളിലാണ് (1 നും 365 നും ഇടയിലുള്ള ഒരു സംഖ്യ ആയിരിക്കണം). സ്ഥിരസ്ഥിതി = 365."
 abuseipdb_max_cs_for_captcha: "ഒരു CAPTCHA നൽകുന്നതിന് അനുവദനീയമായ പരമാവധി കോൺഫിഡൻസ് സ്കോർ (0 നും 100 നും ഇടയിലുള്ള ഒരു സംഖ്യ ആയിരിക്കണം). സ്ഥിരസ്ഥിതി = 10."
 abuseipdb_minimum_confidence_score: "ഒരു IP വിലാസം തടയപ്പെടുന്നതിന് CIDRAM-ന് ആവശ്യമായ ഏറ്റവും കുറഞ്ഞ കോൺഫിഡൻസ് സ്കോർ (0 നും 100 നും ഇടയിലുള്ള ഒരു സംഖ്യ ആയിരിക്കണം). സ്ഥിരസ്ഥിതി = 50."
 abuseipdb_minimum_total_reports: "ഒരു IP വിലാസം തടയപ്പെടുന്നതിന് CIDRAM-ന് ആവശ്യമായ ആകെ റിപ്പോർട്ടുകളുടെ ഏറ്റവും കുറഞ്ഞ എണ്ണം. സ്ഥിരസ്ഥിതി = 1."
 abuseipdb_report_back: "നിങ്ങളുടെ API കീ ഉപയോഗിച്ച്, കണ്ടെത്തിയ മോശം പെരുമാറ്റം AbuseIPDB-യിലേക്ക് തിരികെ റിപ്പോർട്ട് ചെയ്യാൻ CIDRAM-നെ അനുവദിക്കണോ?"
 bgpview: "BGPView മൊഡ്യൂളിനായുള്ള കോൺഫിഗറേഷൻ (ഇത് CIDRAM-ന് ഒരു ASN, കൺട്രി കോഡ് ലുക്കപ്പ് സൗകര്യം നൽകുന്നു)."
 experimental: "അസ്ഥിരം/പരീക്ഷണാത്മകം!"
 frontend: "ഫ്രണ്ട്-എൻഡിനായുള്ള കോൺഫിഗറേഷൻ."
 frontend_custom_footer: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും ഏറ്റവും താഴെയായി HTML ആയി ചേർത്തിരിക്കുന്നു. നിയമപരമായ അറിയിപ്പ്, കോൺടാക്റ്റ് ലിങ്ക്, ബിസിനസ്സ് വിവരങ്ങൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
 frontend_custom_header: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും തുടക്കത്തിൽ തന്നെ HTML ആയി ചേർത്തിരിക്കുന്നു. ഒരു വെബ്‌സൈറ്റ് ലോഗോ, വ്യക്തിഗതമാക്കിയ തലക്കെട്ട്, സ്‌ക്രിപ്റ്റുകൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
 frontend_frontend_log: "ഫ്രണ്ട്-എൻഡ് ലോഗിൻ ശ്രമങ്ങൾ രേഖപ്പെടുത്തുന്നതിനുള്ള ഫയൽ. ഒരു ഫയലിൻ്റെ പേര് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 frontend_magnification: &MagnifDesc "ഫോണ്ട് മാഗ്നിഫിക്കേഷൻ. സ്ഥിരസ്ഥിതി = 1."
 frontend_max_login_attempts: "ഫ്രണ്ട്-എൻഡ് ലോഗിൻ ശ്രമങ്ങളുടെ പരമാവധി എണ്ണം. സ്ഥിരസ്ഥിതി = 5."
 general: "പൊതുവായ കോൺഫിഗറേഷൻ (മറ്റ് വിഭാഗങ്ങളിൽ പെടാത്ത ഏതെങ്കിലും കോർ കോൺഫിഗറേഷൻ)."
 general_default_algo: "ഭാവിയിലെ എല്ലാ പാസ്‌വേഡുകൾക്കും സെഷനുകൾക്കും ഏത് അൽഗോരിതം ഉപയോഗിക്കണമെന്ന് നിർവചിക്കുന്നു."
 general_default_timeout: "ബാഹ്യ അഭ്യർത്ഥനകൾക്ക് ഉപയോഗിക്കേണ്ട ഡിഫോൾട്ട് ടൈംഔട്ട്? സ്ഥിരസ്ഥിതി = 12 സെക്കൻഡ്."
 general_ipaddr: "ബന്ധിപ്പിക്കൽ അഭ്യർത്ഥനകളുടെ IP വിലാസം എവിടെ കണ്ടെത്താം? (Cloudflare തുടങ്ങിയ സേവനങ്ങൾക്ക് ഉപയോഗപ്രദമാണ്). സ്ഥിരസ്ഥിതി = REMOTE_ADDR. മുന്നറിയിപ്പ്: നിങ്ങൾ എന്താണ് ചെയ്യുന്നതെന്ന് നിങ്ങൾക്കറിയാമെങ്കിൽ മാത്രം ഇത് മാറ്റുക!"
 general_lang: "CIDRAM-നുള്ള ഡിഫോൾട്ട് ഭാഷ വ്യക്തമാക്കുക."
 general_lang_override: "സാധ്യമാകുമ്പോഴെല്ലാം HTTP_ACCEPT_LANGUAGE അനുസരിച്ച് പ്രാദേശികവൽക്കരിക്കണോ? True = അതെ [സ്ഥിരസ്ഥിതി]; False = ഇല്ല."
 general_numbers: "അക്കങ്ങൾ എങ്ങനെ പ്രദർശിപ്പിക്കാനാണ് നിങ്ങൾ ഇഷ്ടപ്പെടുന്നത്? നിങ്ങൾക്ക് ഏറ്റവും ശരിയായി തോന്നുന്ന ഉദാഹരണം തിരഞ്ഞെടുക്കുക."
 general_time_format: "CIDRAM ഉപയോഗിക്കുന്ന തീയതി/സമയ നൊട്ടേഷൻ ഫോർമാറ്റ്. അഭ്യർത്ഥന പ്രകാരം കൂടുതൽ ഓപ്ഷനുകൾ ചേർക്കാവുന്നതാണ്."
 general_time_offset: "മിനിറ്റുകൾക്കുള്ളിൽ സമയമേഖല ഓഫ്‌സെറ്റ്."
 general_timezone: "ഏത് സമയമേഖലയാണ് ഉപയോഗിക്കേണ്ടത് (ഉദാഹരണത്തിന്, Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, തുടങ്ങിയവ). ഇത് നിങ്ങൾക്കായി യാന്ത്രികമായി കൈകാര്യം ചെയ്യാൻ PHP-യെ അനുവദിക്കുന്നതിന് "SYSTEM" വ്യക്തമാക്കുക."
 legal: "നിയമപരമായ ആവശ്യകതകൾക്കായുള്ള കോൺഫിഗറേഷൻ."
 legal_privacy_policy: "ജനറേറ്റ് ചെയ്യുന്ന ഏതൊരു പേജിന്റെയും ഫൂട്ടറിൽ പ്രദർശിപ്പിക്കേണ്ട പ്രസക്തമായ സ്വകാര്യതാ നയത്തിന്റെ വിലാസം. ഒരു URL വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
