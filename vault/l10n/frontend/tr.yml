hints_duration:
 SI.: "Süre, "Uluslararası Birimler Sistemi" kullanılarak tanımlanabilir. Örneğin, <strong>1d2h3min4s</strong> veya <strong>1d 2h 3min 4s</strong> bir gün, iki saat, üç dakika, dört saniye için, veya <strong>5min</strong> sadece beş dakika için."
 Açısal zaman.: "Süre, açısal zaman gösterimi kullanılarak tanımlanabilir. Örneğin, <strong>1d2°3′4″</strong> bir gün, iki saat, üç dakika, dört saniye için, veya <strong>5″</strong> sadece beş saniye için."
 Sade İngilizce.: "Süre, birimler sade İngilizce olarak yazılarak tanımlanabilir. Örneğin, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> bir hafta, iki gün, üç saat, dört dakika, beş saniye için."
 Kısıtlamalar: "Gösterim karıştırılabilir, ancak birimler her zaman büyükten küçüğe tanımlanmalıdır, ve tekrarlanamaz. Örneğin, <strong>1 week 2 days 3′4″</strong> <span class="txtGn">geçerlidir</span> ve doğru anlaşılacaktır, ancak <strong>3′4″ 1 week 2 days</strong> ve <strong>3 hours 3h 3°</strong> <span class="txtRd">geçersizdir</span>. CIDRAM, boşluk kullanıp kullanmadığınızı umursamıyor. Sayılar düz ve biçimlendirilmemiş olmalıdır. Pratiklik için desteklenen en büyük birim bir haftadır. Konfigürasyon güncellendiğinde, CIDRAM süreleri açısal zamana göre normalleştirir."
hints_has_bypass: "* Bu seçenek, <code class="s">bypasses➡used</code> altında bir karşılık gelen bypass'a sahiptir. Karşılık gelen bypass'a için onay kutusunun, bu seçeneği doğrulamaya çalışmak için onay kutusuyla aynı şekilde işaretlendiğinden emin olunması önerilir."
hints_http_response_header_code:
 1.: ""Sessiz mod" etkin olduğunda, <code class="s">general➡silent_mode_response_header_code</code> tarafından tanımlanan HTTP durum mesajı kullanılacaktır (bu en yüksek önceliğe sahiptir)."
 2.: "Talep eden kuruluş ihlal sınırını aştığı için yasaklandığında, "yasaklandı" HTTP durum mesajı kullanılacaktır."
 3.: "Hız sınırlaması nedeniyle engellendiğinde, 429 kullanılacak, veya kaynak çakışmaları nedeniyle engellendiğinde, <code class="s">signatures➡conflict_response</code> tarafından tanımlanan HTTP durum mesajı kullanılacaktır (bu bağlamda hız sınırlaması ve kaynak çatışmaları eşit önceliğe sahiptir)."
 4.: ""HTTP durum kodu değiştirilmesi"ni ayarlayan bir yardımcı kural nedeniyle engellendiğinde, bu HTTP durum kodu değiştirilmesi kullanılacaktır."
 5.: "Yasal sebeplerden dolayı engellendiğinde (başka bir deyişle, "yasal" kısaltma kelimesini kullanan özel bir imza nedeniyle engellendiğinde), "yasal" için HTTP durum mesajı kullanılacaktır."
 6.: "Engellenen diğer tüm istekler için "varsayılan" HTTP durum mesajı kullanılacaktır (bu en düşük önceliğe sahiptir)."
hints_inspection: "* Yalnızca yardımcı kurallarda hata ayıklama amaçlıdır. Engellenen kullanıcılara gösterilmez."
