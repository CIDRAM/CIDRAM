<div class="mainbox">
  <nav class="big">
{nav}
    <div class="ng1 idx">{Indexes}</div>
  </nav>
  <main class="extend">
    <div class="col">
      <div class="s flexstretch">{state_msg}</div>
      <div class="spanner">
        <form action="?{UpdatesFormTarget}" method="POST" name="ufts"><input name="cidram-form-target" type="hidden" value="updates" /><select name="FilterSelector" class="ufts">
          {UpdatesFormTargetControls}
        </select><input type="submit" value="{field.OK}" class="auto" /></form>{UpdateAll}
      </div>
    </div>
    <div class="quad">
      <div class="h2 s">{field.Component}</div>
      <div class="h2 s big">{field.Your version}</div>
      <div class="h2 s big">{field.Latest version}</div>
      <div class="h2f s">{field.Status} | {field.Options}</div>
{Components}    </div>
    <div class="duo">
      <div class="h2 s">{field.Macro}</div>
      <div class="h2f s">{field.Options}</div>
{Macros}    </div>
  </main>
</div>
