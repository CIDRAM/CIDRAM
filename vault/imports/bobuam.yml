Config Defaults:
 bobuam:
  sanity_check:
   type: "string"
   default: "yes"
   choices:
    yes: "response._Yes"
    no: "response._No"
  reason_ambiguous:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_malformed:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_masquerade:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  block_bots:
   type: "string"
   default: "yes"
   choices:
    yes: "response._Yes"
    no: "response._No"
  reason_bot:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  block_eol_browsers:
   type: "string"
   default: "yes"
   choices:
    yes: "response._Yes"
    no: "response._No"
  opera:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  chrome:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  edge:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox_esr:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  safari:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  reason_browser:
   type: "string"
   default: "ReasonMessage.Outdated browser"
   choices:
    ReasonMessage.Outdated browser: "ReasonMessage.Outdated browser"
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  options:
   type: "checkbox"
   default: |
    Masquerade:ForciblyDisableReCAPTCHA
    Masquerade:ForciblyDisableHCaptcha
    Opera:MarkForUseWithReCAPTCHA
    Opera:MarkForUseWithHCaptcha
    Chrome:MarkForUseWithReCAPTCHA
    Chrome:MarkForUseWithHCaptcha
    Edge:MarkForUseWithReCAPTCHA
    Edge:MarkForUseWithHCaptcha
    Firefox:MarkForUseWithReCAPTCHA
    Firefox:MarkForUseWithHCaptcha
    Safari:MarkForUseWithReCAPTCHA
    Safari:MarkForUseWithHCaptcha
   labels:
    MarkForUseWithReCAPTCHA: "label.aux.Mark for use with reCAPTCHA"
    ForciblyDisableReCAPTCHA: "label.aux.Forcibly disable reCAPTCHA"
    MarkForUseWithHCaptcha: "label.aux.Mark for use with HCaptcha"
    ForciblyDisableHCaptcha: "label.aux.Forcibly disable HCaptcha"
   choices:
    Ambiguous: "bobuam_ambiguous"
    Malformed: "bobuam_malformed"
    Masquerade: "bobuam_masquerade"
    SuspectedBot: "bobuam_bot"
    Opera: "{Short.Outdated browser} (OPR/Opera)"
    Chrome: "{Short.Outdated browser} (Chrome/Chromium)"
    Edge: "{Short.Outdated browser} (Edge)"
    Firefox: "{Short.Outdated browser} (Firefox)"
    Safari: "{Short.Outdated browser} (Safari)"
    Other: "{Short.Outdated browser} ({label.Other})"
BOBUAM Token:
 Opera: "110"
 Chrome: "127"
 Edge: "127"
 Firefox: "127"
 Firefox ESR: "127"
 Safari: "17"
