hints_sensitive_pages: "കുറിപ്പ്: ഒരു "സെൻസിറ്റീവ് പേജ്" എന്താണെന്ന് {{Links.ConfigRef.sensitive}} നിർണ്ണയിക്കുന്നു."
hints_shorthand:
 0.: "നിങ്ങളുടെ വെബ്‌സൈറ്റിന് LAN അല്ലെങ്കിൽ localhost വഴി ആക്‌സസ് ആവശ്യമുണ്ടെങ്കിൽ, ഇത് തടയരുത്. ആവശ്യമില്ലെങ്കിൽ, നിങ്ങൾക്ക് ഇത് തടയാൻ കഴിയും."
 1.: "സ്ഥിരസ്ഥിതി ഒപ്പ് ഫയലുകളൊന്നും ഇത് ഉപയോഗിക്കുന്നില്ല, പക്ഷേ ചില ഉപയോക്താക്കൾക്ക് ഇത് ഉപയോഗപ്രദമാകുമെന്നതിനാൽ ഇത് പിന്തുണയ്ക്കുന്നു."
 2.: "പ്രോക്സികൾ വഴി ഉപയോക്താക്കൾക്ക് നിങ്ങളുടെ വെബ്‌സൈറ്റ് ആക്‌സസ് ചെയ്യാൻ കഴിയണമെങ്കിൽ, ഇത് തടയരുത്. ആവശ്യമില്ലെങ്കിൽ, നിങ്ങൾക്ക് ഇത് തടയാൻ കഴിയും."
 3.: "ഒപ്പുകളിൽ നേരിട്ടുള്ള ഉപയോഗം പിന്തുണയ്ക്കുന്നില്ല, പക്ഷേ പ്രത്യേക സാഹചര്യങ്ങളിൽ മറ്റ് മാർഗങ്ങളിലൂടെ ഇത് അഭ്യർത്ഥിക്കാവുന്നതാണ്."
 4.: "ചുരുക്കെഴുത്ത് വാക്കുകൾ ഉപയോഗിക്കാത്തതോ CIDRAM തിരിച്ചറിയാത്തതോ ആയ സാഹചര്യങ്ങളെ സൂചിപ്പിക്കുന്നു."
 ഒപ്പിന് ഒന്ന്.: "ഒരു ഒപ്പിന് ഒന്നിലധികം പ്രൊഫൈലുകൾ ആവശ്യപ്പെടാം, പക്ഷേ ഒരു ചുരുക്കെഴുത്ത് വാക്ക് മാത്രമേ ഉപയോഗിക്കാൻ കഴിയൂ. ഒന്നിലധികം ചുരുക്കെഴുത്ത് വാക്കുകൾ അനുയോജ്യമാകാൻ സാധ്യതയുണ്ട്, പക്ഷേ ഒന്ന് മാത്രമേ ഉപയോഗിക്കാൻ കഴിയൂ എന്നതിനാൽ, ഏറ്റവും അനുയോജ്യമായത് മാത്രം ഉപയോഗിക്കാനാണ് ഞങ്ങൾ ലക്ഷ്യമിടുന്നത്."
 മുൻഗണന.: "തിരഞ്ഞെടുക്കപ്പെട്ട ഒരു ഓപ്ഷൻ എപ്പോഴും തിരഞ്ഞെടുക്കാത്ത ഒരു ഓപ്ഷനേക്കാൾ മുൻഗണന നേടുന്നു. ഉദാഹരണത്തിന്, ഒന്നിലധികം ചുരുക്കെഴുത്ത് വാക്കുകൾ പ്രാബല്യത്തിലും അവയിലൊന്ന് മാത്രമേ തടയപ്പെട്ടിട്ടുള്ളൂ എന്ന് സജ്ജീകരിച്ചിരിക്കുന്നു, അഭ്യർത്ഥന ഇപ്പോഴും തടയപ്പെടും."
 മനുഷ്യ എൻഡ്‌പോയിന്റുകളും ക്ലൗഡ് സേവനങ്ങളും.: "വെബ്‌ഹോസ്റ്റിംഗ് ദാതാക്കൾ, സെർവർ ഫാമുകൾ, ഡാറ്റാ സെന്ററുകൾ, അല്ലെങ്കിൽ മറ്റ് നിരവധി കാര്യങ്ങളെ ക്ലൗഡ് സേവനം പരാമർശിച്ചേക്കാം. ഒരു മനുഷ്യന് ഇന്റർനെറ്റ് ആക്‌സസ് ചെയ്യുന്നതിനുള്ള മാർഗങ്ങളെയാണ് ഹ്യൂമൻ എൻഡ്‌പോയിന്റ് എന്ന് പറയുന്നത്, ഉദാഹരണത്തിന് ഒരു ഇന്റർനെറ്റ് സേവന ദാതാവ് വഴി. ഒരു നെറ്റ്‌വർക്ക് സാധാരണയായി രണ്ടിൽ ഒന്ന് മാത്രമേ നൽകുന്നുള്ളൂ, പക്ഷേ ചിലപ്പോൾ രണ്ടും നൽകിയേക്കാം. മനുഷ്യ എൻഡ്‌പോയിന്റുകളെ ക്ലൗഡ് സേവനങ്ങളായി ഒരിക്കലും തിരിച്ചറിയാതിരിക്കാൻ ഞങ്ങൾ ശ്രമിക്കുന്നു. അതിനാൽ, അറിയപ്പെടുന്ന മനുഷ്യ എൻഡ്‌പോയിന്റുകൾ അതിന്റെ ശ്രേണി പങ്കിടുകയാണെങ്കിൽ ഒരു ക്ലൗഡ് സേവനത്തെ മറ്റെന്തെങ്കിലും ആയി തിരിച്ചറിയാൻ കഴിയും. നേരെമറിച്ച്, അറിയപ്പെടുന്ന മനുഷ്യ എൻഡ്‌പോയിന്റുകൾ പങ്കിടാത്ത ശ്രേണികളുള്ള ക്ലൗഡ് സേവനങ്ങളെ എല്ലായ്പ്പോഴും ക്ലൗഡ് സേവനങ്ങളായി തിരിച്ചറിയാൻ ഞങ്ങൾ ശ്രമിക്കുന്നു. അതിനാൽ, ഒരു ക്ലൗഡ് സേവനമായി വ്യക്തമായി തിരിച്ചറിയപ്പെടുന്ന ഒരു അഭ്യർത്ഥന, അറിയപ്പെടുന്ന ഏതെങ്കിലും മനുഷ്യ എൻഡ്‌പോയിന്റുകളുമായി അതിന്റെ ശ്രേണി പങ്കിടാൻ സാധ്യതയില്ല. അതുപോലെ, ആക്രമണങ്ങളോ സ്പാമുകളോ ഉപയോഗിച്ച് വ്യക്തമായി തിരിച്ചറിയപ്പെടുന്ന ഒരു അഭ്യർത്ഥനയ്ക്ക് അതിന്റെ ശ്രേണികൾ ഉണ്ടായിരിക്കാം. എന്നിരുന്നാലും, ഇന്റർനെറ്റ് എപ്പോഴും ചലനാത്മകമാണ്, നെറ്റ്‌വർക്കുകളുടെ ഉദ്ദേശ്യങ്ങൾ കാലക്രമേണ മാറുന്നു, ശ്രേണികൾ എല്ലായ്പ്പോഴും വാങ്ങുകയോ വിൽക്കുകയോ ചെയ്യുന്നു, അതിനാൽ തെറ്റായ പോസിറ്റീവുകളെ സംബന്ധിച്ച് അറിവുള്ളവരും ജാഗ്രതയുള്ളവരുമായിരിക്കുക."
