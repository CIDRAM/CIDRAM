 Optional security extras module: "Cung cấp một số bảo vệ hạn chế chống vectơ tấn công khác nhau thường được sử dụng trong các yêu cầu."
 PHPMailer: "Cần thiết để sử dụng bất kỳ chức năng nào liên quan đến việc gửi email.<br />{{Links.PHPMailer.PHPMailer}} có sẵn qua giấy phép {{Links.PHPMailer.License}}."
 Project Honeypot module: "Chặn các yêu cầu từ IP được liệt kê tại Project Honeypot."
 Protocol blocker module: "Cung cấp khả năng chặn các giao thức yêu cầu cụ thể thông qua cấu hình (ví dụ, HTTP/0.9, HTTP/1.1, SPDY/3.0, vv)."
 Referrer spam module: "Chặn dựa trên spam giới thiệu thường không cung cấp bất kỳ lợi ích bảo mật có ý nghĩa nào, nhưng trong một số trường hợp, có thể hữu ích cho một số người dùng, để thu thập thêm thông tin về các yêu cầu và để có thể báo cáo nó."
 Stop Forum Spam module: "Bảo vệ các trang đăng ký và đăng nhập đối với các địa chỉ IP do SFS liệt kê."
 Tor blocker module: "Cấm truy cập từ các nút thoát Tor thông qua tra cứu DNSEL (hỗ trợ cả IPv4 và IPv6)."
Glossary: !lazy
 Entries:
  CIDR: |
   "CIDR" là viết tắt của "Classless Inter-Domain Routing" (Định tuyến liên miền không phân lớp), và "CIDR" trong "CIDRAM" xuất phát từ đó. "CIDRAM" là viết tắt của "Classless Inter-Domain Routing Access Manager" (Trình quản lý truy cập định tuyến liên miền không phân lớp).
   Trong ngữ cảnh của CIDRAM, "CIDR" đề cập cụ thể đến các mạng con được biểu diễn bằng ký hiệu CIDR.
  Sai tích cực: |
   Khi thực hiện một xét nghiệm, nếu kết quả xét nghiệm là "dương tính" (nghĩa là các điều kiện xét nghiệm được xác nhận là đúng), nhưng kết quả dự kiến ​​(hay đáng lẽ phải là) "âm tính" (nghĩa là kết quả xét nghiệm sai), thì đó được gọi là "sai tích cực". <em>Tiếng Anh: "false positive". Hay cách khác: "lỗi sai tích cực"; "dương tính giả"; "lỗi dương tính giả"; "báo động giả". Đối với các xét nghiệm y tế, "dương tính giả" cách diễn đạt phổ biến hơn, trong khi đối với lĩnh vực CNTT, "sai tích cực" cách diễn đạt phổ biến hơn, nhưng về cơ bản là tương đương nhau.</em>
   Một số thuật ngữ liên quan là "đúng tích cực" (hay "dương tính thật"), "đúng tiêu cực" (hay "âm tính thật"), và "sai tiêu cực" (hay "âm tính giả"). <em>Tiếng Anh: "true positive", "true negative", "false negative".</em> "Đúng tích cực" là khi cả kết quả xét nghiệm và tình trạng thực tế đều đúng (hay "dương tính"), và "đúng tiêu cực" là khi cả kết quả xét nghiệm và tình trạng thực tế đều sai (hay "âm tính"). Một "đúng tích cực" hay "đúng tiêu cực" được coi là một "suy luận chính xác".
   Ngược lại với "sai tích cực" là "sai tiêu cực". Khi kết quả xét nghiệm là "âm tính", nhưng kết quả dự kiến ​​(hay đáng lẽ phải) là "dương tính", thì đó được gọi là "sai tiêu cực".
   Trong ngữ cảnh của CIDRAM, các thuật ngữ này thường đề cập đến trường hợp CIDRAM chặn thứ gì đó mà nó không nên chặn, hoặc khi nó không chặn được thứ gì đó mà nó đáng lẽ phải chặn. Khi CIDRAM chặn một yêu cầu lẽ ra không bị chặn (ví dụ, do chữ ký không hợp lệ, hết hạn, hoặc không chính xác), hoặc khi nó chặn vì những lý do sai, đó được gọi là "sai tích cực". Khi CIDRAM không chặn được một yêu cầu đáng lẽ phải bị chặn (ví dụ, do các mối đe dọa không lường trước được, thiếu chữ ký, mô-đun bị lỗi, hoặc thiếu sót trong quy trình), đó được gọi là "sai tiêu cực" (mặc dù thường được mô tả là "bỏ sót phát hiện"). <em>Tiếng Anh: "missed detection".</em>
   | | Yêu cầu KHÔNG nên bị chặn | Yêu cầu NÊN bị chặn |
   | Yêu cầu KHÔNG bị chặn | Đúng tiêu cực (suy luận chính xác) | Bỏ sót phát hiện (hay sai tiêu cực) |
   | Yêu cầu bị chặn | Sai tích cực | Đúng tích cực (suy luận chính xác) |
   Nếu bạn gặp phải sai tích cực, trước tiên hãy kiểm tra trang cập nhật, và nếu có bất kỳ thành phần nào được đánh dấu là hết hạn, hãy cập nhật nó. Sau đó, nếu sự cố vẫn tiếp diễn, bạn có thể báo cáo lỗi này trên hệ thống theo dõi lỗi của CIDRAM.
