 API_Rate_Limited: "Упозорење: Чини се да је приступ %s АПИ-ју тренутно ограничен стопом."
 Cookies: "Белешка: ЦИДРАМ користи колачић за аутентификацију пријављивања. Пријављивањем, дајете сагласност да ваш претраживач креира и чува колачић."
 Editing PHP files: "Упозорење: Познато је да нека безбедносна решења за веб хостинг аутоматски забрањују ИП адресе након откривања ПХП ознака у захтевима (нпр., када покушавате да измените ПХП датотеке преко претраживача). ЦИДРАМ нема начина да сазна да ли ваша услуга веб хостинга користи такво безбедносно решење. Да би се избегли такви проблеми, препоручује се не уређивање ПХП датотека на такав начин када је то могуће."
 IP tests are disabled: "Упозорење: ИП тестови су онемогућени! Датотеке потписа се не могу користити док се ово не реши."
 JavaScript required: "Упозорење: Неке фронт-енд функционалности захтевају ЈаваСцрипт. Да бисте осигурали да се цео фронт-енд понаша како се очекује, препоручује се омогућавање ЈаваСцрипт-а."
 Likely to be overwritten: "Упозорење: Датотека коју тренутно уређујете припада компоненти „%s“. Све промене направљене у овој датотеци ће врло вероватно бити преписане следећи пут када се та компонента ажурира."
 Likely to become corrupted: "Упозорење: У датотеци која се тренутно уређује откривени су бајтови који нису UTF8. Датотека ће вероватно бити оштећена ако се измени помоћу ове посебне функције."
 Modules are disabled: "Упозорење: Модули су онемогућени! Модули се не могу користити док се ово не реши."
 No modules are active: "Упозорење: Ниједан модул није омогућен! Модули се могу активирати помоћу страница за конфигурацију или ажурирања."
 No signature files are active: "Упозорење: Ниједан датотеке потписа није активан! Датотеке потписа могу се активирати помоћу страница за конфигурацију или ажурирања."
 Operating in dry run mode: "Упозорење: У режиму рада на суво! Док су у режиму рада на суво, захтеви се и даље проверавају и евидентирају као блок догађаји као и обично, али ништа није блокирано."
 Operating in maintenance mode: "Упозорење: У режиму одржавања! Док је у режиму одржавања, ништа се не проверава, не евидентира, или блокира."
 Page termination is disabled: "Упозорење: Завршетак странице је онемогућен! Захтеви се не могу правилно блокирати док се ово не реши."
 Proceeding will log out all users: "Упозорење: Наставком ће се одјавити сви корисници."
 The auxiliary rules execution stage is currently disabled: "Упозорење: Фаза извршавања помоћних правила је тренутно онемогућена."
