 general_email_notification_when: "Коли надсилати сповіщення після створення."
 general_emailaddr: "Якщо ви бажаєте, ви можете вказати тут адресу електронної пошти яка буде надана користувачам, коли їх заблокують, щоб вони могли використовувати їх як контактну точку для підтримки та/або допомоги у випадку, якщо їх заблокували помилково. УВАГА: Будь-яку адресу електронної пошти яку ви тут надасте, напевно буде отримано спам-ботами та скребками під час її використання тут, тому, якщо ви вирішите вказати тут адресу електронної пошти, наполегливо рекомендуємо переконатися, що адреса електронної пошти яку ви тут надаєте, є одноразовою адресою та/або адресою, яку ви не проти отримати від спаму (іншими словами, ви ймовірно не хочете використовувати свою основну особисту чи основну корпоративну адресу електронної пошти)."
 general_emailaddr_display_style: "Як би ви хотіли, щоб адреса електронної пошти була представлена користувачам?"
 general_fields: "Елементи керування полями під час подій блоку (коли запит заблоковано)."
 general_force_hostname_lookup: "Примусово шукати ім'я хоста? True = Так; False = Ні [Стандарт]. Пошук імен хостів зазвичай виконується «за потребою», але може бути примусовим для всіх запитів. Це може бути корисним для надання більш детальної інформації у файлах журналу, але також може мати дещо негативний вплив на продуктивність."
 general_http_response_header_code: "Яке повідомлення про статус HTTP має надсилати CIDRAM під час блокування запитів?"
 general_ipaddr: "Де знайти IP-адресу вхідних запитів? (Корисно для таких служб як Cloudflare). Стандарт = REMOTE_ADDR. УВАГА: Не змінюйте це, якщо ви не знаєте що робите!"
 general_lang: "Укажіть мову для CIDRAM."
