Config Defaults:
 bobuam:
  what_to_block:
   type: "checkbox"
   default: |
    Ambiguous
    Malformed
    Masquerade
    SuspectedBot
    Outdated
   choices:
    Ambiguous: "label.bobuam.Ambiguous user agents"
    Malformed: "label.bobuam.Clearly malformed user agents"
    Masquerade: "label.bobuam.Masquerade attempts (e_g_, bots pretending to be browsers)"
    SuspectedBot: "label.bobuam.Suspected bots, scrapers, probes, etc"
    Outdated: "label.bobuam.Outdated or end of life browsers (you can set the versions below)"
  reason_ambiguous:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_malformed:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_masquerade:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_bot:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  opera:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  chrome:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  edge:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox_esr:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  safari:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  reason_browser:
   type: "string"
   default: "ReasonMessage.Outdated browser"
   choices:
    ReasonMessage.Outdated browser: "ReasonMessage.Outdated browser"
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  options:
   type: "checkbox"
   default: |
    Masquerade:ForciblyDisableReCAPTCHA
    Masquerade:ForciblyDisableHCaptcha
    Opera:MarkForUseWithReCAPTCHA
    Opera:MarkForUseWithHCaptcha
    Chrome:MarkForUseWithReCAPTCHA
    Chrome:MarkForUseWithHCaptcha
    Edge:MarkForUseWithReCAPTCHA
    Edge:MarkForUseWithHCaptcha
    Firefox:MarkForUseWithReCAPTCHA
    Firefox:MarkForUseWithHCaptcha
    Safari:MarkForUseWithReCAPTCHA
    Safari:MarkForUseWithHCaptcha
   labels:
    MarkForUseWithReCAPTCHA: "label.aux.Mark for use with reCAPTCHA"
    ForciblyDisableReCAPTCHA: "label.aux.Forcibly disable reCAPTCHA"
    MarkForUseWithHCaptcha: "label.aux.Mark for use with hCaptcha"
    ForciblyDisableHCaptcha: "label.aux.Forcibly disable hCaptcha"
   choices:
    Ambiguous: "bobuam_ambiguous"
    Malformed: "bobuam_malformed"
    Masquerade: "bobuam_masquerade"
    SuspectedBot: "bobuam_bot"
    Opera: "{Short.Outdated browser} (OPR/Opera)"
    Chrome: "{Short.Outdated browser} (Chrome/Chromium)"
    Edge: "{Short.Outdated browser} (Edge)"
    Firefox: "{Short.Outdated browser} (Firefox)"
    Safari: "{Short.Outdated browser} (Safari)"
    Other: "{Short.Outdated browser} ({label.Other})"
  token_difference_limit:
   type: "int"
   default: 0
BOBUAM Token:
