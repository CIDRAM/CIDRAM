 Description:
  activate_modules: &MayImpactPerformance "सहसा शिफारस केली जात नाही, कारण असे काही असू शकतात ज्यांची तुम्हाला गरज नसते. गरज नसताना घटक स्थापित करणे आणि सक्रिय करणे कार्यक्षमतेवर नकारात्मक परिणाम करू शकते."
  install_l10n_core: &RecommendKeepingCore "जेव्हा <code>lang_override</code> कॉन्फिगरेशन निर्देश सक्षम केला जातो, जर वापरकर्त्याचा ब्राउझर विशिष्ट भाषा प्राधान्य निर्दिष्ट करतो, जोपर्यंत त्या भाषेसाठी कोर L10N डेटा स्थापित केलेला असतो, तर CIDRAM त्या निर्दिष्ट भाषेत "प्रवेश नाकारला" पृष्ठ प्रदर्शित करण्यास सक्षम असतो. त्यानुसार, सर्व कोर L10N डेटा स्थापित ठेवण्याची शिफारस केली जाते."
  install_l10n_fe: &RecommendFEOnlyNeeded "तुमची पसंतीची भाषा <code>lang</code> कॉन्फिगरेशन निर्देशाद्वारे निर्दिष्ट केली जाऊ शकते. हे पूर्ण झाल्यानंतर, तुमच्या पसंतीच्या भाषेव्यतिरिक्त, तुम्हाला कोणत्याही फ्रंट-एंड L10N डेटाची आवश्यकता असण्याची शक्यता नाही, आणि उपलब्ध डिस्क स्पेस थोडीशी मोकळी करण्यासाठी तुम्हाला तो काढून टाकावा लागू शकतो. तथापि, तुम्ही ते काढून टाकायचे किंवा ठेवायचे ठरवले तरी, त्याचे कोणतेही नुकसान होणार नाही."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
