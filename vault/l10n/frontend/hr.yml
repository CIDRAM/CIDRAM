 general_email_notification_when: "Kada poslati obavijesti nakon generiranja."
 general_emailaddr: "Ako želite, ovdje možete unijeti adresu e-pošte koja će se dati korisnicima kada budu blokirani, a koju će koristiti kao točku kontakta za podršku i/ili pomoć u slučaju da budu blokirani greškom. UPOZORENJE: Koju god adresu e-pošte koju ovdje navedete zasigurno će je prikupiti spambotovi i strugači tijekom njezine upotrebe ovdje, i stoga se snažno preporučuje da, ako ovdje odlučite unijeti adresu e-pošte, osigurate da je adresa e-pošte koju ovdje unesete jednokratna i/ili adresa na kojoj vam nije stalo do neželjene pošte (drugim riječima, vjerojatno ne želite koristiti svoju primarnu osobnu ili primarnu poslovnu adresu e-pošte)."
 general_emailaddr_display_style: "Kako biste željeli da adresa e-pošte bude predstavljena korisnicima?"
 general_fields: "Kontrole za polja tijekom događaja blokiranja (kada je zahtjev blokiran)."
 general_force_hostname_lookup: "Prisilno tražiti naziva hosta? True/Istinito = Da; False/Lažno = Ne [Zadano]. Traženje naziva hosta obično se izvodi po potrebi, ali se može prisilno izvršiti za sve zahtjeve. To može biti korisno kao način pružanja detaljnijih informacija u datotekama dnevnika, ali može imati i blagi negativan učinak na performanse."
 general_http_response_header_code: "Koju HTTP statusnu poruku CIDRAM treba poslati kada blokira zahtjeve?"
 general_ipaddr: "Gdje pronaći IP adresu zahtjeva za povezivanje? (Korisno za usluge kao što je Cloudflare). Zadano = REMOTE_ADDR. UPOZORENJE: Promijenite ovo samo ako znate što radite!"
 general_lang: "Navedite zadani jezik za CIDRAM."
 general_lang_override: "Lokalizirati prema HTTP_ACCEPT_LANGUAGE kad god je to moguće? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 general_numbers: "Kako želite da se prikazuju brojevi? Odaberite primjer koji vam se čini najispravnijim."
 general_request_proxy: "Ako želite da se odlazni zahtjevi šalju putem proxyja, ovdje navedite taj proxy. Ako ne, ostavite ovo prazno."
 general_request_proxyauth: "Ako šaljete odlazne zahtjeve putem proxyja i ako taj proxy zahtijeva korisničko ime i lozinku, ovdje navedite to korisničko ime i lozinku (npr., <code>user:pass</code>). Ako ne, ostavite ovo prazno."
 general_sensitive: "Popis putova koje treba smatrati osjetljivim stranicama. Svaki navedeni put bit će provjeren prema rekonstruiranom URI-ju kada je potrebno. Putanja koja počinje kosom crtom prema naprijed tretirat će se kao literal i podudarati od komponente putanje zahtjeva nadalje. U suprotnom, putanja koja počinje nealfanumeričkim znakom, a završava tim istim znakom (ili tim istim znakom plus opcijska zastavica "i") tretirat će se kao regularni izraz. Bilo koja druga vrsta putanje tretirat će se kao literal i može se podudarati s bilo kojim dijelom URI-ja. Hoće li se put smatrati osjetljivom stranicom može utjecati na ponašanje nekih modula, ali nema nikakav učinak inače."
 general_silent_mode: "Treba li CIDRAM tiho preusmjeriti blokirane pokušaje pristupa umjesto prikazivanja stranice "pristup odbijen"? Ako da, navedite lokaciju na koju želite preusmjeriti blokirane pokušaje pristupa. Ako ne, ostavite ovu varijablu praznu."
 general_silent_mode_response_header_code: "Koju HTTP statusnu poruku trebao poslati CIDRAM kada tiho preusmjerava pokušaje blokiranog pristupa?"
