Glossary: !lazy
 Entries:
  CIDR: |
   "CIDR" é un acrónimo de "Classless Inter-Domain Routing" (Enrutamento interdominio sen clases), de onde provén o "CIDR" en "CIDRAM". "CIDRAM" é un acrónimo de "Classless Inter-Domain Routing Access Manager" (Xestor de acceso a enrutamento interdominio sen clases).
   No contexto de CIDRAM, "CIDR" (ou "CIDRs") refírese especificamente a subredes expresadas mediante a notación CIDR.
  Falso positivo: |
   En xeral, ao realizar unha proba, cando os resultados son "positivos" (é dicir, se se verifica que as condicións da proba son certas), pero se esperaba (ou debería ter sido) "negativos" (é dicir, se os resultados da proba son erróneos), os resultados denomínanse "falsos positivos". <em>Inglés: "false positive". Ou alternativamente: "erro falso positivo"; "falsa alarma".</em>
   Algúns termos relacionados son "verdadeiro positivo", "verdadeiro negativo", e "falso negativo". <em>Inglés: "true positive", "true negative", "false negative".</em> Un "verdadeiro positivo" refírese a cando os resultados da proba e o estado real da condición son ambos verdadeiros (ou "positivos"), e un "verdadeiro negativo" refírese a cando os resultados da proba e o estado real da condición son ambos falsos (ou "negativos"). Un "verdadeiro positivo" ou un "verdadeiro negativo" considérase unha "inferencia correcta".
   O inverso dun "falso positivo" é un "falso negativo". Cando os resultados son "negativos", pero se esperaba (ou debería ter sido) "positivos", os resultados denomínanse "falsos negativos".
   No contexto de CIDRAM, estes termos refírense normalmente a cando CIDRAM bloquea algo que non debería, ou cando non consegue bloquear algo que debería. Cando CIDRAM bloquea unha solicitude que non debería terse bloqueado (por exemplo, debido a sinaturas incorrectas ou desactualizadas), ou cando o fai por razóns incorrectas, tal é un "falso positivo". Cando CIDRAM non consegue bloquear unha solicitude que debería terse bloqueado (por exemplo, debido a ameazas imprevistas, sinaturas ausentes, módulos defectuosos, ou deficiencias no proceso), tal é un "falso negativo" (aínda que normalmente se describe como unha "detección fallida"). <em>Inglés: "missed detection".</em>
   | | A solicitude NON debería ser bloqueada | A solicitude DEBERÍA ser bloqueada |
   | A solicitude NON está bloqueada | Verdadeiro negativo (inferencia correcta) | Detección fallida (ou falso negativo) |
   | A solicitude ESTÁ bloqueada | Falso positivo | Verdadeiro positivo (inferencia correcta) |
   Se atopas falsos positivos, primeiro consulta a páxina de actualizacións e, se algo está marcado como desactualizado, actualízao. Despois diso, se o problema persiste, podes informar do problema no rastreador de problemas de CIDRAM.
  Sinatura: |
   No contexto de CIDRAM, unha sinatura ("signature" en inglés) refírese aos datos, que se atopan dentro dos ficheiros de sinatura e dentro dos módulos, que CIDRAM emprega para determinar se as solicitudes deben ser bloqueadas.
   No caso dos ficheiros de sinatura, unha sinatura consiste normalmente nun CIDR, un comando que representa a acción desexada a realizar cando se atopa unha solicitude dun enderezo IP pertencente a ese CIDR e, no caso de que un enderezo IP estea bloqueado, o motivo polo que se fai. A miúdo agrúpanse como seccións, acompañadas de comentarios, etiquetas, e outros metadatos para proporcionar contexto adicional.
   Un exemplo dunha sinatura do ficheiro de sinaturas IPv4 bogons: {{Excerpts.Bogon signature}}
   No caso dos módulos, unha sinatura normalmente refírese a chamadas no código dos módulos a un método específico responsable de bloquear unha solicitude cando se cumpren condicións específicas.
   Un exemplo hipotético dunha sinatura dun módulo: {{Excerpts.Module signature}}
