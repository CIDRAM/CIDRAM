 200 OK: "200 OK\nNajmanje robustan, ali najprilagođeniji korisniku. Automatizirani zahtjevi će najvjerojatnije protumačiti ovaj odgovor kao pokazatelj da je zahtjev bio uspješan."
 301 Moved Permanently: "301 Moved Permanently (Trajno preseljeno)\nUpućuje klijenta da je preusmjeravanje TRAJNO i da metoda zahtjeva korištena za preusmjeravanje MOŽE biti drugačija od metode zahtjeva korištene za početni zahtjev."
 302 Found: "302 Found (Pronađeno)\nUpućuje klijenta da je preusmjeravanje PRIVREMENO i da metoda zahtjeva korištena za preusmjeravanje MOŽE biti drugačija od metode zahtjeva korištene za početni zahtjev."
 307 Temporary Redirect: "307 Temporary Redirect (Privremeno preusmjeravanje)\nUpućuje klijenta da je preusmjeravanje PRIVREMENO i da metoda zahtjeva korištena za preusmjeravanje NE može razlikovati od metode zahtjeva korištene za početni zahtjev."
 308 Permanent Redirect: "308 Permanent Redirect (Trajno preusmjeravanje)\nUpućuje klijenta da je preusmjeravanje TRAJNO i da metoda zahtjeva korištena za preusmjeravanje NE može razlikovati od metode zahtjeva korištene za početni zahtjev."
 403 Forbidden: "403 Forbidden (Zabranjeno)\nRobusniji, ali manje prilagođen korisniku. Preporučuje se za većinu općih okolnosti."
 409 Conflict: "409 Conflict (Sukob)\nPreporučuje se za sukobe resursa (npr., sukobi spajanja, sukobi pristupa datotekama, itd). Ne preporučuje se u drugim kontekstima."
 410 Gone: "410 Gone (Nestalo)\nMože uzrokovati probleme prilikom rješavanja lažno pozitivnih, jer će neki preglednici pohraniti ovu poruku o statusu u predmemoriju i neće slati sljedeće zahtjeve, čak ni nakon što su deblokirani. Može biti najpoželjnije u nekim kontekstima, za određene vrste prometa."
 418 I_m a teapot: "418 I'm a teapot (Ja sam čajnik)\nReferencira prvoaprilsku šalu ({{Links.RFC2324}}). Vrlo je malo vjerojatno da će ga razumjeti bilo koji klijent, bot, preglednik, ili netko drugi. Namijenjeno za zabavu i praktičnost, ali se općenito ne preporučuje."
 429 Too Many Requests: "429 Too Many Requests (Previše zahtjeva)\nPreporučuje se za ograničavanje brzine, prilikom suočavanja s DDoS napadima, i za sprječavanje poplave. Ne preporučuje se u drugim kontekstima."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (Nije dostupno iz pravnih razloga)\nPreporučuje se prilikom blokiranja prvenstveno iz pravnih razloga. Ne preporučuje se u drugim kontekstima."
 503 Service Unavailable: "503 Service Unavailable (Usluga nije dostupna)\nNajrobustniji, ali najmanje prilagođen korisniku. Preporučuje se za situacije pod napadom, ili za situacije s izrazito upornim neželjenim prometom."
