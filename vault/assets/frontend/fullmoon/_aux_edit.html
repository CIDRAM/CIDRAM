  <a href="?cidram-page=aux-view">{link.View mode}</a> – <a href="?cidram-page=aux-edit">{link.Edit mode}</a><br />

<form id="auxFormMinified" action="?cidram-page=aux-edit" method="POST" style="display:none"><input type="hidden" id="minifiedFormData" name="minifiedFormData" value="" /></form>
<script type="text/javascript">minifyForm('#auxForm','auxFormMinified','minifiedFormData');
const inputContainer = document.getElementById('auxForm');
inputContainer.addEventListener('keydown', function(event) {
  if ((event.target.matches('input[type="text"].flexin')||event.target.matches('input[type="text"].txtf'))&&event.target.value===''&&(event.keyCode===8||event.keyCode===46)) {
    event.target.parentElement.style='display:none';
    if (event.target.parentElement.nextSibling.className==='suggestsActive') {
      event.target.parentElement.nextSibling.className='suggestInactive';
      event.target.parentElement.nextSibling.innerHTML='';
    }
  }
});
</script>
