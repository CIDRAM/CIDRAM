 rate_limiting_hint: "Hãy nhớ rằng giống như mọi tính năng khác của CIDRAM, tính năng giới hạn tốc độ của CIDRAM chỉ có thể được áp dụng cho những trang và tài nguyên mà CIDRAM được kết nối. Điều đó thường có nghĩa là các tài nguyên không phải PHP sẽ không được bảo vệ, ngoại trừ trường hợp được cung cấp rõ ràng bởi các tài nguyên PHP được kết nối. Nếu bạn có thể sử dụng mô-đun máy chủ, cPanel, hoặc một số công cụ mạng khác để áp dụng giới hạn tốc độ, thì tốt hơn nên sử dụng chúng thay vì tính năng giới hạn tốc độ của CIDRAM. Ngoài ra, hãy nhớ rằng người dùng đặc biệt quyết tâm có thể dễ dàng vượt qua giới hạn tốc độ bằng cách thay đổi địa chỉ IP của họ hoặc chuyển sang nhà cung cấp proxy hoặc VPN mà CIDRAM chưa biết, và hãy nhớ rằng việc giới hạn tốc độ có thể gây rất nhiều khó chịu cho người dùng thực sự. Đôi khi điều này là cần thiết, nhưng hiếm khi là mong muốn."
 rate_limiting_max_bandwidth: "Số lượng băng thông tối đa được phép trong khoảng thời gian cho phép trước khi cho phép giới hạn tốc độ cho các yêu cầu trong tương lai. Giá trị 0 sẽ vô hiệu hóa loại giới hạn tốc độ này. Mặc định = 0KB."
 rate_limiting_max_requests: "Số lượng yêu cầu tối đa được phép trong khoảng thời gian cho phép trước khi cho phép giới hạn tốc độ cho các yêu cầu trong tương lai. Giá trị 0 sẽ vô hiệu hóa loại giới hạn tốc độ này. Mặc định = 0."
 rate_limiting_precision_ipv4: "Độ chính xác để sử dụng khi giám sát việc sử dụng IPv4. Giá trị phản ánh kích thước khối CIDR. Đặt thành 32 để có độ chính xác cao nhất. Mặc định = 32."
 rate_limiting_precision_ipv6: "Độ chính xác để sử dụng khi giám sát việc sử dụng IPv6. Giá trị phản ánh kích thước khối CIDR. Đặt thành 128 để có độ chính xác cao nhất. Mặc định = 128."
 rate_limiting_segregate: "Hạn ngạch cho miền và máy chủ lưu trữ nên được tách biệt hoặc chia sẻ? True = Hạn ngạch sẽ được tách biệt. False = Hạn ngạch sẽ được chia sẻ [Mặc định]."
