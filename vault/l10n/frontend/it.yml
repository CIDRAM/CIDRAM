 supplementary_cache_options_memcached_host: "Il valore dell'host Memcached. Predefinito = localhost."
 supplementary_cache_options_memcached_port: "Il valore della porta Memcached. Predefinito = "11211"."
 supplementary_cache_options_pdo_dsn: "Il valore della DSN per PDO. Predefinito = "mysql:dbname=cidram;host=localhost;port=3306"."
 supplementary_cache_options_pdo_password: "La password per PDO."
 supplementary_cache_options_pdo_username: "Il nome utente per PDO."
 supplementary_cache_options_prefix: "Il valore specificato qui verrà anteposto a tutte le chiavi di ingresso della cache. Predefinito = "CIDRAM_". Quando esistono più installazioni sullo stesso server, questo può essere utile per mantenere le loro cache separate l'una dall'altra."
