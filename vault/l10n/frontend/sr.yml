 logging_log_banned_ips: "Укључити блокиране захтеве са забрањених ИП адреса у евиденцију? Истинито = Да [Подразумевано]; Лажно = Не."
 logging_log_rotation_action: "Ротација дневника ограничава број датотека евиденције које би требало да постоје у било ком тренутку. Када се креирају нове датотеке евиденције, ако укупан број датотека евиденције премашује наведено ограничење, биће извршена наведена радња. Овде можете одредити жељену акцију."
 logging_log_rotation_limit: "Ротација дневника ограничава број датотека евиденције које би требало да постоје у било ком тренутку. Када се креирају нове датотеке евиденције, ако укупан број датотека евиденције премашује наведено ограничење, биће извршена наведена радња. Овде можете одредити жељено ограничење. Вредност 0 ће онемогућити ротацију дневника."
 logging_log_sanitisation: "Када се користи фронт-енд страница евиденције за преглед података евиденције, ЦИДРАМ санитираје податке дневника пре него што их прикаже, како би заштитио кориснике од XSS напада и других потенцијалних претњи које подаци евиденције могу да садрже. Међутим, подразумевано, подаци се не санитирају током евидентирања. Ово је да би се осигурало да се подаци евиденције чувају тачно, да би се помогла свака хеуристичка или форензичка анализа која би могла бити неопходна у будућности. Међутим, у случају да корисник покуша да прочита податке дневника користећи спољне алате, и ако ти спољни алати не изврше сопствени процес санитирање, корисник би могао бити изложен XSS нападима. Ако је потребно, можете променити подразумевано понашање користећи ову конфигурациону директиву. Истинито = Санитирајте податке када их евидентирате (подаци се чувају мање прецизно, али XSS ризик је мањи). Лажно = Немојте санитирати податке када их евидентирате (подаци се чувају прецизније, али XSS ризик је већи) [Подразумевано]."
 logging_outbound_request_log: "Датотека за евидентирање резултата свих одлазних захтева. Наведите назив датотеке, или оставите празно да бисте онемогућили."
 logging_report_log: "Датотека за евидентирање свих извештаја послатих спољним АПИ-јима. Наведите назив датотеке, или оставите празно да бисте онемогућили."
