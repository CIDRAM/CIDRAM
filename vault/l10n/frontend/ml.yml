 frontend_custom_footer: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും ഏറ്റവും താഴെയായി HTML ആയി ചേർത്തിരിക്കുന്നു. നിയമപരമായ അറിയിപ്പ്, കോൺടാക്റ്റ് ലിങ്ക്, ബിസിനസ്സ് വിവരങ്ങൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
 frontend_custom_header: "എല്ലാ ഫ്രണ്ട്-എൻഡ് പേജുകളുടെയും തുടക്കത്തിൽ തന്നെ HTML ആയി ചേർത്തിരിക്കുന്നു. ഒരു വെബ്‌സൈറ്റ് ലോഗോ, വ്യക്തിഗതമാക്കിയ തലക്കെട്ട്, സ്‌ക്രിപ്റ്റുകൾ, അല്ലെങ്കിൽ സമാനമായ എല്ലാ പേജുകളിലും ഉൾപ്പെടുത്താൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന സാഹചര്യത്തിൽ ഇത് ഉപയോഗപ്രദമാകും."
