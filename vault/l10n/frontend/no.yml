 200 OK: "200 OK\nMinst robust, men mest brukervennlig. Automatiserte forespørsler vil mest sannsynlig tolke dette svaret som en indikasjon på at forespørselen var vellykket. Anbefales for ikke-blokkerte forespørsler."
 301 Moved Permanently: "301 Moved Permanently (Flyttet permanent)\nInstruerer klienten om at omdirigeringen er PERMANENT, og at forespørselsmetoden som brukes for omdirigeringen KAN være annerledes enn forespørselsmetoden som ble brukt for den første forespørselen."
 302 Found: "302 Found (Funnet)\nInstruerer klienten om at omdirigeringen er MIDLERTIDIG, og at forespørselsmetoden som brukes for omdirigeringen KAN være annerledes enn forespørselsmetoden som ble brukt for den første forespørselen."
 307 Temporary Redirect: "307 Temporary Redirect (Midlertidig omdirigering)\nInstruerer klienten om at omdirigeringen er MIDLERTIDIG, og at forespørselsmetoden som brukes for omdirigeringen IKKE kan være annerledes enn forespørselsmetoden som ble brukt for den første forespørselen."
 308 Permanent Redirect: "308 Permanent Redirect (Permanent omdirigering)\nInstruerer klienten om at omdirigeringen er PERMANENT, og at forespørselsmetoden som brukes for omdirigeringen IKKE kan være annerledes enn forespørselsmetoden som ble brukt for den første forespørselen."
 403 Forbidden: "403 Forbidden (Forbudt)\nMer robust, men mindre brukervennlig. Anbefalt for de fleste generelle betingelser."
 409 Conflict: "409 Konflikt\nAnbefalt for ressurskonflikter (f.eks., flettekonflikter, filtilgangskonflikter, osv). Anbefales ikke i andre sammenhenger."
 410 Gone: "410 Gone (Borte)\nKan forårsake problemer når du løser falske positiver, fordi noen nettlesere vil bufre denne statusmeldingen og ikke sende påfølgende forespørsler, selv etter å ha blitt opphevet blokkeringen. Kan være den mest foretrukne i noen sammenhenger, for visse typer trafikk."
 418 I_m a teapot: "418 I'm a teapot (Jeg er en tekanne)\nRefererer til en aprilsnarr ({{Links.RFC2324}}). Svært usannsynlig å bli forstått av noen klient, bot, nettleser, eller annet. Tilbys for underholdning og bekvemmelighet, men anbefales ikke generelt."
 429 Too Many Requests: "429 Too Many Requests (For mange forespørsler)\nAnbefalt for hastighetsbegrensning, ved håndtering av DDoS-angrep, og for forebygging av flom. Anbefales ikke i andre sammenhenger."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (Utilgjengelig av juridiske årsaker)\nAnbefales ved blokkering primært av juridiske årsaker. Anbefales ikke i andre sammenhenger."
 503 Service Unavailable: "503 Service Unavailable (Tjenesten er utilgjengelig)\nMest robust, men minst brukervennlig. Anbefalt for angrep, eller for ekstremt vedvarende uønsket trafikk."
