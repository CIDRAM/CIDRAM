 200 OK: "200 OK\nMenos robusto, mas mais amigável de usar. As solicitações automatizadas provavelmente interpretarão essa resposta como indicação de que a solicitação foi bem-sucedida. Recomendado para solicitações não bloqueadas."
 301 Moved Permanently: "301 Moved Permanently (Movido Permanentemente)\nInstrui o cliente que o redirecionamento é PERMANENTE, e que o método de solicitação usado para o redirecionamento PODE ser diferente do método de solicitação usado na solicitação inicial."
 302 Found: "302 Found (Encontrado)\nInstrui o cliente que o redirecionamento é TEMPORÁRIO, e que o método de solicitação usado para o redirecionamento PODE ser diferente do método de solicitação usado na solicitação inicial."
 307 Temporary Redirect: "307 Temporary Redirect (Redirecionamento Temporário)\nInstrui o cliente que o redirecionamento é TEMPORÁRIO, e que o método de solicitação usado para o redirecionamento NÃO pode ser diferente do método de solicitação usado para a solicitação inicial."
 308 Permanent Redirect: "308 Permanent Redirect (Redirecionamento Permanente)\nInstrui o cliente que o redirecionamento é PERMANENTE, e que o método de solicitação usado para o redirecionamento NÃO pode ser diferente do método de solicitação usado para a solicitação inicial."
 403 Forbidden: "403 Forbidden (Proibido)\nUm pouco mais robusto, mas um pouco menos amigável de usar. Recomendado para a maioria das circunstâncias gerais."
 409 Conflict: "409 Conflito\nRecomendado para conflitos de recursos (por exemplo, conflitos de mesclagem, conflitos de acesso a arquivos, etc). Não recomendado em outros contextos."
 410 Gone:
  pt-BR: "410 Gone (Se foi)\nPode causar problemas ao resolver falsos positivos, pois alguns navegadores armazenam em cache essa mensagem de status e não enviam solicitações subsequentes, mesmo após terem sido desbloqueadas. Pode ser o mais preferível em alguns contextos, para certos tipos de tráfego."
  pt-PT: "410 Gone (Se foi)\nPode causar problemas ao resolver falsos positivos, pois alguns navegadores armazenam em cache esta mensagem de estado e não enviam solicitações subsequentes, mesmo após terem sido desbloqueadas. Pode ser o mais preferível em alguns contextos, para certos tipos de tráfego."
 418 I_m a teapot: "418 I'm a teapot (Eu sou um bule)\nReferências uma piada de primeiro de abril ({{Links.RFC2324}}). Muito improvável de ser entendido por qualquer cliente, bot, navegador, ou outro. Fornecido para diversão e conveniência, mas geralmente não recomendado."
 429 Too Many Requests: "429 Too Many Requests (Pedidos em excesso)\nRecomendado para limitação de taxa, ao lidar com ataques DDoS, e para prevenção de inundações. Não recomendado em outros contextos."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (Indisponível por motivos legais)\nRecomendado ao bloquear principalmente por motivos legais. Não recomendado em outros contextos."
 503 Service Unavailable: "503 Service Unavailable (Serviço indisponível)\nMais robusto, mas menos amigável de usar. Recomendado para quando sob ataque, ou para lidar com tráfego indesejado extremamente persistente."
