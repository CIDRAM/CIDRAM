  pt-BR: "Ligue CAPTCHAs ao endereço IP do usuário que está completando o CAPTCHA, mas não ao usuário real.\nOs cookies NÃO são usados para identificar usuários. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, ele se aplica a qualquer pessoa que se conecte a partir do mesmo endereço IP."
  pt-PT: "Ligue CAPTCHAs ao endereço IP do utilizador que está a completar o CAPTCHA, mas não ao utilizador real.\nOs cookies NÃO são utilizados para identificar utilizadores. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, aplica-se a qualquer pessoa que se conecte a partir do mesmo endereço IP."
 Lock CAPTCHAs to the user completing the CAPTCHA as well as to their IP address:
  pt-BR: "Ligue os CAPTCHAs ao usuário completando o CAPTCHA, bem como ao seu endereço IP.\nOs cookies são usados para identificar usuários. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, ele se aplica somente ao usuário que concluiu o CAPTCHA e não persistirá se seu endereço IP for alterado."
  pt-PT: "Ligue os CAPTCHAs ao utilizador que está a completar o CAPTCHA, bem como ao seu endereço IP.\nOs cookies são utilizados para identificar os utilizadores. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, aplica-se apenas ao utilizador que concluiu o CAPTCHA e não persistirá se o seu endereço IP for alterado."
 Lock CAPTCHAs to the user completing the CAPTCHA but not to their IP address:
  pt-BR: "Ligue os CAPTCHAs ao usuário completando o CAPTCHA, mas não ao seu endereço IP.\nOs cookies são usados para identificar usuários. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, ele se aplica somente ao usuário que concluiu o CAPTCHA e, enquanto seu cookie permanecer válido, persistirá, mesmo que seu endereço IP seja alterado."
  pt-PT: "Ligue os CAPTCHAs ao utilizador que está a completar o CAPTCHA, mas não ao seu endereço IP.\nOs cookies são utilizados para identificar os utilizadores. Quando o acesso é recuperado devido à conclusão bem-sucedida de um CAPTCHA, aplica-se apenas ao utilizador que concluiu o CAPTCHA e, enquanto o seu cookie permanecer válido, persistirá, mesmo que o seu endereço IP seja alterado."
