hints_aux_stats: "टीप: सहाय्यक नियमांसाठी आकडेवारी ट्रॅक करायची की नाही हे सहाय्यक नियम पृष्ठावरून नियंत्रित केले जाऊ शकते."
hints_cause_fp: "*!! %s मुळे खोटे सकारात्मक येण्याची उच्च शक्यता."
hints_cclookup: "** देश कोड लुकअप कार्यक्षमता आवश्यक आहे (उदाहरणार्थ, IP-API किंवा BGPView मॉड्यूलद्वारे)."
hints_client_hints: "!! हा कमी-एंट्रॉपी क्लायंट सूचना आहे. क्लायंट सूचना ही एक नवीन, प्रायोगिक वेब तंत्रज्ञान आहे जी अद्याप सर्व ब्राउझर आणि प्रमुख क्लायंटमध्ये व्यापकपणे समर्थित नाही. <em>पहा: {{Links.MDN.Client hints}}.</em> जरी क्लायंट सूचना फिंगरप्रिंटिंगसाठी उपयुक्त ठरू शकतात, कारण त्यांना व्यापकपणे पाठिंबा मिळत नाही, तरीही विनंत्यांमध्ये त्यांची उपस्थिती गृहीत धरू नये किंवा त्यावर अवलंबून राहू नये (म्हणजेच, त्यांच्या अनुपस्थितीमुळे अवरोधित करणे ही एक वाईट कल्पना आहे)."
hints_client_honour: "आपण क्लायंटला कसेही सूचना दिल्या तरी, हे लक्षात ठेवणे महत्त्वाचे आहे की क्लायंट काय करायचे ठरवतो यावर आपले कोणतेही नियंत्रण नसते आणि क्लायंट आपल्या सूचनांचे पालन करेल याची कोणतीही हमी नसते."
hints_default_dns:
 वारंवार विचारले जाणारे प्रश्न.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">"default_dns" साठी मी काय वापरू शकतो?</a></em>"
hints_duration:
 SI.: ""आंतरराष्ट्रीय युनिट्स सिस्टम" वापरून कालावधीचे वर्णन करता येते. उदाहरणार्थ, <strong>1d2h3min4s</strong> किंवा <strong>1d 2h 3min 4s</strong> एक दिवस, दोन तास, तीन मिनिटे, चार सेकंदांसाठी, किंवा <strong>5min</strong> फक्त पाच मिनिटांसाठी."
 आर्कटाइम.: "कालावधीचे वर्णन आर्कटाइम नोटेशन वापरून करता येते. उदाहरणार्थ, <strong>1d2°3′4″</strong> एक दिवस, दोन तास, तीन मिनिटे, चार सेकंदांसाठी, किंवा <strong>5″</strong> फक्त पाच सेकंदांसाठी."
 साध्या इंग्रजी.: "साध्या इंग्रजीत एकके लिहून कालावधीचे वर्णन करता येते. उदाहरणार्थ, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> एक आठवडा, दोन दिवस, तीन तास, चार मिनिटे, पाच सेकंदांसाठी."
 मर्यादा.: "नोटेशन मिश्रित केले जाऊ शकते, परंतु युनिट्सचे वर्णन नेहमीच सर्वात मोठ्या ते सर्वात लहान पर्यंत केले पाहिजे, आणि त्यांची पुनरावृत्ती करता येत नाही. उदाहरणार्थ, <strong>1 week 2 days 3′4″</strong> <span class="txtGn">वैध</span> आहे आणि योग्यरित्या समजले जाईल, पण <strong>3′4″ 1 week 2 days</strong> आणि <strong>3 hours 3h 3°</strong> <span class="txtRd">अवैध</span> आहेत. तुम्ही अंतर वापरता की नाही याची CIDRAM ला पर्वा नाही. संख्या साधी आणि स्वरूपित नसलेली असावीत. व्यावहारिकतेसाठी, सर्वात मोठे समर्थित युनिट एक आठवडा आहे. जेव्हा कॉन्फिगरेशन अपडेट केले जाते, तेव्हा CIDRAM कालावधी आर्कटाइममध्ये सामान्य करते."
hints_has_bypass: "* या पर्यायात <code class="s">bypasses➡used</code> अंतर्गत संबंधित बायपास आहे. संबंधित बायपाससाठी आणि पर्याय पडताळण्याचा प्रयत्न करण्यासाठी चेकबॉक्सेस त्याच प्रकारे चिन्हांकित करण्याची शिफारस केली जाते."
hints_http_response_header_code:
 1.: "जेव्हा "सायलेंट मोड" प्रभावी असेल, तेव्हा <code class="s">general➡silent_mode_response_header_code</code> द्वारे परिभाषित केलेला HTTP स्थिती संदेश वापरला जाईल (याला सर्वोच्च प्राधान्य आहे)."
 2.: "जेव्हा विनंती करणाऱ्या घटकाला उल्लंघन मर्यादा ओलांडल्यामुळे बंदी घातली जाते, तेव्हा "बंदी घातली" साठी HTTP स्थिती संदेश वापरला जाईल."
 3.: "दर मर्यादेमुळे अवरोधित केल्यावर, ४२९ वापरले जाईल, किंवा संसाधन संघर्षांमुळे अवरोधित केल्यावर, <code class="s">signatures➡conflict_response</code> द्वारे परिभाषित केलेला HTTP स्थिती संदेश वापरला जाईल (या संदर्भात दर मर्यादा आणि संसाधन संघर्षांना समान प्राधान्य आहे)."
 4.: ""HTTP स्थिती कोड ओव्हरराइड" सेट करणाऱ्या सहाय्यक नियमामुळे अवरोधित केल्यावर, तो HTTP स्थिती कोड ओव्हरराइड वापरला जाईल."
 5.: "कायदेशीर कारणांमुळे अवरोधित केले असल्यास (म्हणजेच, "कायदेशीर" लघुलेखन शब्द वापरणाऱ्या कस्टम स्वाक्षरीमुळे अवरोधित केले असल्यास), "कायदेशीर" साठी HTTP स्थिती संदेश वापरला जाईल."
 6.: "इतर सर्व अवरोधित केलेल्या विनंत्यांसाठी, "डीफॉल्ट" साठी HTTP स्थिती संदेश वापरला जाईल (याला सर्वात कमी प्राधान्य आहे)."
hints_inspection: "* केवळ सहाय्यक नियम डीबग करण्यासाठी आहे. अवरोधित केलेल्या वापरकर्त्यांना दाखवले जात नाही."
hints_ipv6_on_32bit: "टीप: काही ३२-बिट सिस्टीमवर IPv6 लुकअप योग्यरित्या काम करू शकत नाहीत."
hints_logging_datetime: "उपयुक्त टीप: वेळ स्वरूप प्लेसहोल्डर वापरून तुम्ही लॉग फायलींच्या नावांना तारीख/वेळ माहिती जोडू शकता. उपलब्ध वेळ स्वरूप प्लेसहोल्डर {{Links.ConfigRef.time_format}} वर प्रदर्शित केले जातात."
