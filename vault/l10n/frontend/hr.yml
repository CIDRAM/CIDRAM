 rate_limiting: "Konfiguracija za ograničavanje brzine (ne preporučuje se za opću upotrebu)."
 rate_limiting_allowance_period: "Trajanje za praćenje upotrebe. Zadano = 0°0′0″."
 rate_limiting_exceptions: "Iznimke (tj., zahtjevi koji ne bi trebali biti ograničeni brzinom). Relevantno samo kada je omogućeno ograničenje brzine."
 rate_limiting_hint: "Imajte na umu da, kao i kod svih ostalih CIDRAM funkcionalnosti, CIDRAM-ova funkcionalnost ograničavanja brzine može primijeniti samo na one stranice i resurse na koje je CIDRAM povezan. To bi obično značilo da resursi koji nisu iz PHP-a ne bi bili obuhvaćeni osim ako ih eksplicitno opslužuju povezani PHP resursi. Ako možete koristiti serverski modul, cPanel, ili neki drugi mrežni alat za provođenje ograničavanje brzine, bilo bi bolje koristiti to umjesto CIDRAM-ove funkcionalnosti ograničavanja brzine. Također imajte na umu da bi odlučan i uporan korisnik mogao lako zaobići ograničavanje brzine rotiranjem njihove IP adrese ili prelaskom na proxy ili VPN pružatelja usluga o kojem CIDRAM još nije svjestan, i imajte na umu da ograničavanje brzine može biti vrlo frustrirajuće za stvarne krajnje korisnike. Ponekad može biti potrebno, ali rijetko je poželjno."
 rate_limiting_max_bandwidth: "Kolika se propusnost može koristiti unutar dodijeljenog vremena prije budućih zahtjeva koji ograničavaju brzinu. Vrijednost 0 onemogućuje ovu vrstu ograničenja brzine. Zadano = 0KB."
 rate_limiting_max_requests: "Koliko se zahtjeva može poslati unutar dodijeljenog vremena prije nego što se budući zahtjevi ograničavaju brzinu. Vrijednost 0 onemogućuje ovu vrstu ograničenja brzine. Zadano = 0."
 rate_limiting_precision_ipv4: "Preciznost koja se koristi za praćenje upotrebe IPv4. Vrijednost odražava veličinu CIDR bloka. Postavite na 32 za najbolju preciznost. Zadano = 32."
 rate_limiting_precision_ipv6: "Preciznost koja se koristi za praćenje upotrebe IPv6. Vrijednost odražava veličinu CIDR bloka. Postavite na 128 za najbolju preciznost. Zadano = 128."
