 phpmailer_port: "Номер порту для вихідної електронної пошти. Стандарт = 587."
 phpmailer_set_from_address: "Адреса відправника для надсилання електронної пошти через SMTP."
 phpmailer_set_from_name: "Ім'я відправника для надсилання електронної пошти через SMTP."
 phpmailer_skip_auth_process: "Якщо встановити для цієї директиви значення <code>true</code>, PHPMailer пропускатиме звичайний процес автентифікації, який зазвичай відбувається під час надсилання електронної пошти через SMTP. Цього слід уникати, оскільки пропуск цього процесу може піддати вихідну електронну пошту атакам MITM, але може бути необхідним у випадках, коли цей процес перешкоджає PHPMailer підключитися до сервера SMTP."
 phpmailer_smtp_auth: "Ця директива визначає, чи автентифікувати сеанси SMTP (зазвичай її слід залишити окремо)."
