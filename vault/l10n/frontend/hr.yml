hints_duration:
 SI.: "Trajanje se može opisati korištenjem "međunarodnog sustava jedinica". Npr., <strong>1d2h3min4s</strong> ili <strong>1d 2h 3min 4s</strong> za jedan dan, dva sata, tri minute, četiri sekunde, ili <strong>5min</strong> za samo pet minuta."
 Lučnog vremena.: "Trajanje se može opisati pomoću notacije lučnog vremena. Npr., <strong>1d2°3′4″</strong> za jedan dan, dva sata, tri minute, četiri sekunde, ili <strong>5″</strong> za samo pet sekundi."
 Običan engleski.: "Trajanje se može opisati pisanjem jedinica na jednostavnom engleskom jeziku. Npr., <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> za jedan tjedan, dva dana, tri sata, četiri minute, pet sekundi."
 Ograničenja.: "Notacije se mogu miješati, ali jedinice uvijek moraju biti opisane od najveće prema najmanjoj, i ne smiju se ponavljati. Npr., <strong>1 week 2 days 3′4″</strong> je <span class="txtGn">valjan</span> i bit će ispravno shvaćen, ali <strong>3′4″ 1 week 2 days</strong> i <strong>3 hours 3h 3°</strong> su <span class="txtRd">nevažeći</span>. CIDRAM-u je svejedno koristite li razmak ili ne. Brojevi moraju biti čisti i neformatirani. Radi praktičnosti, najveća podržana jedinica je tjedan. Kada se konfiguracija ažurira, CIDRAM normalizira trajanja na lučnog vremena."
hints_has_bypass: "* Ova opcija ima odgovarajuće zaobilaženje pod <code class="s">bypasses➡used</code>. Preporučuje se osigurati da je potvrdni okvir za odgovarajuće zaobilaženje označen na isti način kao i potvrdni okvir za pokušaj provjere ove opcije."
hints_inspection: "* Namijenjen samo za otklanjanje pogrešaka pomoćnih pravila. Ne prikazuje se blokiranim korisnicima."
