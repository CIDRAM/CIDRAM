PrivacyPolicy: "رازداری کی پالیسی"
ReasonMessage:
 Attacks: "آپ کے IP پتہ یا نیٹ ورک سے غیر معمولی ٹریفک کی وجہ سے اس پیج تک آپ کی رسائی مسترد کر دی گئی."
 BadIP: "آپ نے ایک غلط IP پتہ کا استعمال کرتے ہوئے اس صفحہ پر جانے کی کوشش کی کیونکہ اس صفحہ تک آپ کی رسائی منع کر دیا گیا."
 Banned: "اس صفحہ تک آپ کی رسائی اپنے IP پتہ سے پچھلے برے رویے کی وجہ سے انکار کیا گیا تھا."
 Bogon: "اس صفحہ تک آپ کی رسائی منع کر دیا گیا کیونکہ آپ کا IP پتہ ایک bogon ایڈریس کے طور پر تسلیم کیا جاتا ہے، اور bogons سے اس ویب سائٹ سے منسلک کرنے کی ویب سائٹ کے مالک کی طرف سے اجازت نہیں ہے."
 Cloud: "اس صفحہ تک آپ کی رسائی منع کر دیا گیا کیونکہ آپ کا IP پتہ ایک کلاؤڈ سروس سے تعلق رکھنے والے، اور کلاؤڈ سروسز کی جانب سے اس ویب سائٹ سے منسلک ہونے کے طور پر تسلیم کیا جاتا ہے ویب سائٹ کے مالک کی طرف سے اجازت نہیں ہے."
 Conflict: "آپ کی درخواست پر اس وقت کارروائی نہیں ہو سکی، کیونکہ ایسا کرنے کے لیے ضروری وسائل دستیاب نہیں تھا. ممکنہ طور پر دوسری درخواست کے ساتھ تنازع کی وجہ سے، یہ مسئلہ عارضی ہونے کی امید ہے. چند سیکنڈ انتظار کرنے کے بعد دوبارہ کوشش کریں."
 Generic: "اس صفحہ تک آپ کی رسائی کی وجہ سے آپ کا IP پتہ یہ ویب سائٹ کی طرف سے استعمال ایک بلیک لسٹ پر درج ایک نیٹ ورک سے تعلق رکھتا مسترد کردی گئی تھی."
 Legal: "قانونی ذمہ داریوں کی وجہ سے آپ کے اس صفحے تک رسائی کا انکار کیا گیا تھا."
 Malware: "اس صفحہ تک آپ کی رسائی سے انکار کر دیا گیا کیونکہ آپ کا IP پتہ مالویئر کا ممکنہ ذریعہ سمجھا جاتا ہے."
 Outdated browser: "آپ کا براؤزر پرانا ہے، اور اس طرح حفاظتی خطرہ ہے. براہ کرم اس سائٹ تک رسائی سے پہلے موجودہ ورژن میں اپ ڈیٹ کریں."
 Proxy: "اس صفحہ تک آپ کی رسائی منع کر دیا گیا کیونکہ آپ کا IP پتہ ایک پراکسی سروس سے تعلق رکھنے والے، اور پراکسی کی خدمات کی طرف سے اس ویب سائٹ سے منسلک ہونے کے طور پر تسلیم کیا جاتا ہے ویب سائٹ کے مالک کی طرف سے اجازت نہیں ہے."
 RL: "آپ اس وقت پیش کی جانے والی زیادہ سے زیادہ بینڈوتھ یا درخواستوں کی تعداد سے تجاوز کر چکے ہیں. دوبارہ کوشش کرنے سے پہلے براہ کرم کم از کم %s انتظار کریں."
 Spam: "اس صفحہ تک آپ کی رسائی سے انکار کر دیا گیا کیونکہ آپ کا IP پتہ سپیم کا ممکنہ ذریعہ سمجھا جاتا ہے."
