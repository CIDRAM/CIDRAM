<div class="mainbox">
  <nav class="big">
{nav}  </nav>
  <main class="extend">
    <div class="col">
      <div class="s flexstretch" id="stateMsg">{state_msg}</div>
    </div>
    <div class="duo h1 fmctrl">
      <div>
        <form id="fmBasePath" action="?cidram-page=file-manager" method="GET">
          <input name="cidram-page" type="hidden" value="file-manager" />
          <datalist id="basepathList">{basepathList}
          </datalist>
          <span class="s flexrow"><input list="basepathList" name="basepath" type="text" value="{basepath}" class="flexin" placeholder="{tip.Specify a directory path, or leave blank to use the CIDRAM base path}" /><input type="submit" value="{field.OK}" class="auto" /></span>
        </form>
      </div>
      <div class="reverse">
        <form enctype="multipart/form-data" action="?cidram-page=file-manager{basepathActionAttach}" method="POST">
          <input name="do_action" type="hidden" value="upload-file" />
          <input name="upload-file" type="file" />
          <input type="submit" value="{field.Upload new file}" />
        </form>
        <form id="fmControl" action="?cidram-page=file-manager{basepathActionAttach}" method="POST" style="display:none">
          <input id="fmControlDoAction" name="do_action" type="hidden" value="" />
          <input id="fmControlFilename" name="filename" type="hidden" value="" />
        </form>
      </div>
    </div>
    <div class="quad">
      <div class="h2 s va" style="order:-4">{field.File} <span id="orderByName" class="navicon pointer down hoverglow" onclick="javascript:y=document.getElementById('orderByName'),y.classList.contains('down')?(y.classList.add('up'),y.classList.remove('down','neutral'),qOrd=document.querySelectorAll('div[data-order-default]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderDefaultRev})):(y.classList.add('down'),y.classList.remove('up','neutral'),qOrd=document.querySelectorAll('div[data-order-default]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderDefault})),z=document.getElementById('orderBySize'),z.classList.add('neutral'),z.classList.remove('up','down'),z=document.getElementById('orderByTime'),z.classList.add('neutral'),z.classList.remove('up','down')"></span></div>
      <div class="h2 s big va" style="order:-3">{field.size.Size} <span id="orderBySize" class="navicon pointer neutral hoverglow" onclick="javascript:y=document.getElementById('orderBySize'),y.classList.contains('down')?(y.classList.add('up'),y.classList.remove('down','neutral'),qOrd=document.querySelectorAll('div[data-order-filesize]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderFilesizeRev})):(y.classList.add('down'),y.classList.remove('up','neutral'),qOrd=document.querySelectorAll('div[data-order-filesize]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderFilesize})),z=document.getElementById('orderByName'),z.classList.add('neutral'),z.classList.remove('up','down'),z=document.getElementById('orderByTime'),z.classList.add('neutral'),z.classList.remove('up','down')"></span> – {field.Last modified} <span id="orderByTime" class="navicon pointer neutral hoverglow" onclick="javascript:y=document.getElementById('orderByTime'),y.classList.contains('down')?(y.classList.add('up'),y.classList.remove('down','neutral'),qOrd=document.querySelectorAll('div[data-order-time]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderTimeRev})):(y.classList.add('down'),y.classList.remove('up','neutral'),qOrd=document.querySelectorAll('div[data-order-time]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderTime})),z=document.getElementById('orderByName'),z.classList.add('neutral'),z.classList.remove('up','down'),z=document.getElementById('orderBySize'),z.classList.add('neutral'),z.classList.remove('up','down')"></span></div>
      <div class="h2 s big va" style="order:-2">{field.Component} – {field.Purpose}</div>
      <div class="h2f s va" style="order:-1">{field.Options}</div>
{FilesData}
    </div>
  </main>
</div>
