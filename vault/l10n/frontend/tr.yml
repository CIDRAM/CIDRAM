 410 Gone: "410 Gone (Gitti)\nYanlış pozitifleri çözerken sorunlara neden olabilir, çünkü bazı tarayıcılar bu durum mesajını önbelleğe alır ve engelleme kaldırıldıktan sonra bile sonraki istekleri göndermez. Belirli trafik türleri için bazı bağlamlarda en çok tercih edileni olabilir."
 418 I_m a teapot: "418 I'm a teapot (Ben bir çaydanlığım)\nBir 1 Nisan şakasına gönderme yapıyor ({{Links.RFC2324}}). Herhangi bir istemci, bot, tarayıcı, veya başka bir şekilde anlaşılması pek olası değildir. Eğlence ve rahatlık için sağlanmıştır, ancak genellikle tavsiye edilmez."
 429 Too Many Requests: "429 Too Many Requests (Çok fazla istek)\nHız sınırlaması, DDoS saldırılarıyla uğraşırken, ve sel önleme için önerilir. Diğer bağlamlarda önerilmez."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (Yasal sebeplerle kullanılamıyor)\nÖncelikle yasal nedenlerle engelleme yapılırken önerilir. Diğer bağlamlarda önerilmez."
 503 Service Unavailable: "503 Service Unavailable (Hizmet kullanılamıyor)\nEn sağlam, ancak en az kullanıcı dostu. Saldırı altındayken veya aşırı derecede kalıcı istenmeyen trafikle uğraşırken önerilir."
