 rate_limiting: "Конфігурація для обмеження швидкості (не рекомендується для загального використання)."
 rate_limiting_allowance_period: "Тривалість відстеження використання. Стандарт = 0°0′0″."
 rate_limiting_exceptions: "Винятки (тобто запити, швидкість яких не повинна бути обмежена). Актуально, лише якщо ввімкнено обмеження швидкості."
 rate_limiting_hint: "Майте на увазі, що як і з усіма іншими функціями CIDRAM, функція обмеження швидкості CIDRAM може бути застосована лише до тих сторінок та ресурсів, до яких підключено CIDRAM. Зазвичай це означало б, що ресурси що не належать до PHP не охоплюватимуться, окрім випадків коли вони явно обслуговуються підключеними ресурсами PHP. Якщо ви можете використовувати серверний модуль, cPanel, або якийсь інший мережевий інструмент для обмеження швидкості, було б краще використовувати його замість функціональність обмеження швидкості CIDRAM. Також майте на увазі, що завзятий та рішучий користувач може легко обійти обмеження швидкості, шляхом зміни їхньої IP-адреси або шляхом переходу на проксі-сервер чи VPN-провайдера, про якого CIDRAM ще не знає, і майте на увазі, що обмеження швидкості може бути дуже дратівливим для реальних кінцевих користувачів. Часом це може бути необхідно, але рідко буває бажаним."
 rate_limiting_max_bandwidth: "Максимальна пропускна здатність, дозволена протягом дозволеного періоду до обмеження швидкості майбутніх запитів. Значення 0 вимикає цей тип обмеження швидкості. Стандарт = 0KB."
 rate_limiting_max_requests: "Максимальна кількість запитів, дозволена протягом дозволеного періоду до обмеження швидкості майбутніх запитів. Значення 0 вимикає цей тип обмеження швидкості. Стандарт = 0."
 rate_limiting_precision_ipv4: "Точність для відстеження використання IPv4. Значення відображає розмір блоку CIDR. Встановіть 32 для найкращої точності. Стандарт = 32."
 rate_limiting_precision_ipv6: "Точність для відстеження використання IPv6. Значення відображає розмір блоку CIDR. Встановіть 128 для найкращої точності. Стандарт = 128."
 rate_limiting_segregate: "Квоти для різних доменів і хостів слід зберігати окремо чи спільно? True = Квоти зберігатимуться окремо. False = Квоти зберігатимуться спільно [Стандарт]."
 sfs: "Конфігурація для модуля Stop Forum Spam."
 signatures: "Конфігурація для сигнатур, файлів сигнатур, модулів, тощо."
 signatures_conflict_response: "Якщо є занадто багато одночасних спроб отримати доступ до тих самих ресурсів (наприклад, одночасні запити до кількох процесів PHP на одній машині для тих самих ресурсів), деякі з цих спроб можуть бути невдалими. У рідкісних і малоймовірних випадках, коли це впливає на файли сигнатурів або модулі, CIDRAM може бути перешкоджено прийняття ефективного рішення щодо запиту. Якщо це станеться, чи потрібно блокувати запит, і яке повідомлення про статус HTTP має надіслати CIDRAM?"
 signatures_default_tracktime: "Час протягом якого потрібно відстежувати IP-адреси. Стандарт = 7d0°0′0″ (1 тиждень)."
 signatures_infraction_limit: "Максимальна кількість порушень, яких може спричинити IP-адреса, перш ніж її буде забанено відстеженням IP-адреси. Стандарт = 10."
 signatures_shorthand: "Елементи керування для що робити із запитом, коли є позитивний збіг із сигнатуром, який використовує наведені скорочення."
 signatures_tracking_override: "Дозволити модулям перевизначати параметри відстеження? True = Так [Стандарт]; False = Ні."
 supplementary_cache_options: "Додаткові параметри кешу. Зауважте: Зміна цих значень може призвести до виходу з системи."
 supplementary_cache_options_enable_apcu: "Визначає, чи слід спробувати використовувати APCu для кешування. Стандарт = True."
 supplementary_cache_options_enable_memcached: "Визначає, чи слід спробувати використовувати Memcached для кешування. Стандарт = False."
