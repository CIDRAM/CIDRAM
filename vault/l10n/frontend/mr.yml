 logging_log_rotation_limit: "लॉग रोटेशन कोणत्याही वेळी अस्तित्वात असलेल्या लॉग फायलींची संख्या मर्यादित करते. जेव्हा नवीन लॉग फायली तयार केल्या जातात, तेव्हा लॉग फायलींची एकूण संख्या निर्दिष्ट मर्यादेपेक्षा जास्त असल्यास, निर्दिष्ट क्रिया केली जाईल. तुम्ही येथे इच्छित मर्यादा निर्दिष्ट करू शकता. ० चे मूल्य लॉग रोटेशन अक्षम करेल."
 logging_log_sanitisation: "लॉग डेटा पाहण्यासाठी फ्रंट-एंड लॉग पृष्ठ वापरताना, CIDRAM लॉग डेटा प्रदर्शित करण्यापूर्वी तो सॅनिटायझेशन करते, जेणेकरून वापरकर्त्यांना XSS हल्ल्यांपासून आणि लॉग डेटामध्ये असलेल्या इतर संभाव्य धोक्यांपासून संरक्षण मिळेल. तथापि, डीफॉल्टनुसार, लॉगिंग दरम्यान डेटा निर्जंतुक केला जात नाही. भविष्यात आवश्यक असलेल्या कोणत्याही ह्युरिस्टिक किंवा फॉरेन्सिक विश्लेषणास मदत करण्यासाठी, लॉग डेटा अचूकपणे जतन केला जाईल याची खात्री करण्यासाठी हे केले जाते. तथापि, जर वापरकर्ता बाह्य साधनांचा वापर करून लॉग डेटा वाचण्याचा प्रयत्न करतो आणि जर ती बाह्य साधने स्वतःची सॅनिटायझेशन प्रक्रिया करत नसतील, तर वापरकर्त्याला XSS हल्ल्यांना सामोरे जावे लागू शकते. आवश्यक असल्यास, तुम्ही या कॉन्फिगरेशन निर्देशाचा वापर करून डीफॉल्ट वर्तन बदलू शकता. True = डेटा लॉग करताना तो सॅनिटायझेशन करा (डेटा कमी अचूकपणे जतन केला जातो, परंतु XSS धोका कमी असतो). False = लॉगिंग करताना डेटा सॅनिटायझेशन करू नका (डेटा अधिक अचूकपणे जतन केला जातो, परंतु XSS धोका जास्त असतो) [डीफॉल्ट]."
