 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.pt.md\#o-que-posso-usar-para-default_dns" hreflang="pt">O que posso usar para "default_dns"?</a></em>"
hints_duration:
 SI.: "A duração pode ser descrita usando o "Sistema Internacional de Unidades". Por exemplo, <strong>1d2h3min4s</strong> ou <strong>1d 2h 3min 4s</strong> por um dia, duas horas, três minutos, quatro segundos, ou <strong>5min</strong> por apenas cinco minutos."
 Tempo de arco.: "A duração pode ser descrita usando a notação de tempo de arco. Por exemplo, <strong>1d2°3′4″</strong> por um dia, duas horas, três minutos, quatro segundos ou <strong>5″</strong> por apenas cinco segundos."
 Inglês simples.: "A duração pode ser descrita escrevendo as unidades em inglês simples. Por exemplo, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> por uma semana, dois dias, três horas, quatro minutos, cinco segundos."
 Restrições.: "A notação pode ser mista, mas as unidades devem sempre ser descritas da maior para a menor, e não podem ser repetidas. Por exemplo, <strong>1 week 2 days 3′4″</strong> é <span class="txtGn">válido</span> e será entendido corretamente, mas <strong>3′4″ 1 week 2 days</strong> e <strong>3 hours 3h 3°</strong> são <span class="txtRd">inválidos</span>. O CIDRAM não se importa se você está usando espaçamento ou não. Os números devem ser simples e não formatados. Por praticidade, a maior unidade suportada é uma semana. Quando a configuração é atualizada, o CIDRAM normaliza as durações para o tempo de arco."
hints_has_bypass: "* Esta opção tem um bypass correspondente em <code class="s">bypasses➡used</code>. É recomendável que a caixa de seleção para o bypass correspondente esteja marcado da mesma forma que a caixa de seleção para tentar verificar esta opção."
hints_http_response_header_code:
 1.:
  pt-BR: "Quando o "modo silencioso" estiver em vigor, a mensagem de status HTTP definida por <code class="s">general➡silent_mode_response_header_code</code> será usada (isso tem a maior precedência)."
  pt-PT: "Quando o "modo silencioso" estiver em vigor, a mensagem de estado HTTP definida por <code class="s">general➡silent_mode_response_header_code</code> será utilizada (que tem a maior precedência)."
 2.:
  pt-BR: "Quando a entidade solicitante for banida por exceder o limite de infrações, a mensagem de status HTTP para "banido" será usada."
  pt-PT: "Quando a entidade requerente for banida por exceder o limite de infrações, a mensagem de estado HTTP para "banido" será utilizada."
 3.:
  pt-BR: "Quando bloqueado devido à limitação de taxa, 429 será usado, ou quando bloqueado devido a conflitos de recursos, a mensagem de status HTTP definida por <code class="s">signatures➡conflict_response</code> será usada (a limitação de taxas e os conflitos de recursos têm igual precedência neste contexto)."
  pt-PT: "Quando bloqueado devido à limitação de taxa, 429 será utilizado, ou quando bloqueado devido a conflitos de recursos, a mensagem de estado HTTP definida por <code class="s">signatures➡conflict_response</code> será utilizada (a limitação de taxas e os conflitos de recursos têm igual precedência neste contexto)."
 4.:
  pt-BR: "Quando bloqueado devido a uma regra auxiliar que define uma "substituição do código de status HTTP", essa substituição do código de status HTTP será usada."
  pt-PT: "Quando bloqueado devido a uma regra auxiliar que define uma "substituição do código de estado HTTP", esta substituição do código de estado HTTP será utilizada."
 5.:
  pt-BR: "Quando bloqueado por motivos legais (por exemplo, quando bloqueado devido a uma assinatura personalizada que usa a palavra abreviada "legais"), a mensagem de status HTTP para "legais" será usada."
  pt-PT: "Quando bloqueado por motivos legais (por exemplo, quando bloqueado devido a uma assinatura personalizada que utiliza a palavra abreviada "legais"), a mensagem de estado HTTP para "legais" será utilizada."
 6.:
  pt-BR: "Para todas as outras solicitações bloqueadas, a mensagem de status HTTP para "padrão" será usada (isso tem a menor precedência)."
  pt-PT: "Para todos os outros solicitações bloqueados, a mensagem de estado HTTP para "padrão" será utilizada (que tem a menor precedência)."
