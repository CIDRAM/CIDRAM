 Editing PHP files: "മുന്നറിയിപ്പ്: ചില വെബ്‌ഹോസ്റ്റിംഗ് സുരക്ഷാ പരിഹാരങ്ങൾ അഭ്യർത്ഥനകൾക്കുള്ളിൽ PHP ടാഗുകൾ കണ്ടെത്തുമ്പോൾ IP വിലാസങ്ങൾ യാന്ത്രികമായി നിരോധിക്കുന്നതായി അറിയപ്പെടുന്നു (ഉദാഹരണത്തിന്, ഒരു ബ്രൗസർ വഴി PHP ഫയലുകൾ പരിഷ്കരിക്കാൻ ശ്രമിക്കുമ്പോൾ). നിങ്ങളുടെ വെബ്‌ഹോസ്റ്റിംഗ് സേവനം അത്തരമൊരു സുരക്ഷാ പരിഹാരം ഉപയോഗിക്കുന്നുണ്ടോ എന്ന് അറിയാൻ CIDRAM-ന് ഒരു മാർഗവുമില്ല. അത്തരം പ്രശ്നങ്ങൾ ഒഴിവാക്കാൻ, സാധ്യമാകുമ്പോഴെല്ലാം PHP ഫയലുകൾ അത്തരത്തിൽ എഡിറ്റ് ചെയ്യാതിരിക്കുന്നതാണ് നല്ലത്."
