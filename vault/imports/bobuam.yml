Config Defaults:
 bobuam:
  what_to_block:
   type: "checkbox"
   default: |
    Ambiguous
    Malformed
    Masquerade
    SuspectedBot
    Outdated
   choices:
    Ambiguous: "label.bobuam.Ambiguous user agents"
    Malformed: "label.bobuam.Clearly malformed user agents"
    Masquerade: "label.bobuam.Masquerade attempts (e_g_, bots pretending to be browsers)"
    SuspectedBot: "label.bobuam.Suspected bots, scrapers, probes, etc"
    Outdated: "label.bobuam.Outdated or end of life browsers (you can set the versions below)"
  reason_ambiguous:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_malformed:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_masquerade:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  reason_bot:
   type: "string"
   default: "denied"
   choices:
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  opera:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  chrome:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  edge:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  firefox_esr:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  safari:
   type: "int"
   default: 0
   hints: "bobuam_hint_default_value"
  reason_browser:
   type: "string"
   default: "ReasonMessage.Outdated browser"
   choices:
    ReasonMessage.Outdated browser: "ReasonMessage.Outdated browser"
    denied: "denied"
   preview: "allow_other"
   allow_other: true
  options:
   type: "checkbox"
   default: |
    Masquerade:ForciblyDisableHCaptcha
    Masquerade:ForciblyDisableFriendlyCaptcha
    Masquerade:ForciblyDisableCloudflareTurnstile
    Opera:MarkForUseWithHCaptcha
    Opera:MarkForUseWithFriendlyCaptcha
    Opera:MarkForUseWithCloudflareTurnstile
    Chrome:MarkForUseWithHCaptcha
    Chrome:MarkForUseWithFriendlyCaptcha
    Chrome:MarkForUseWithCloudflareTurnstile
    Edge:MarkForUseWithHCaptcha
    Edge:MarkForUseWithFriendlyCaptcha
    Edge:MarkForUseWithCloudflareTurnstile
    Firefox:MarkForUseWithHCaptcha
    Firefox:MarkForUseWithFriendlyCaptcha
    Firefox:MarkForUseWithCloudflareTurnstile
    Safari:MarkForUseWithHCaptcha
    Safari:MarkForUseWithFriendlyCaptcha
    Safari:MarkForUseWithCloudflareTurnstile
   labels: *CaptchaChoicesForModules
   choices:
    Ambiguous: "bobuam_ambiguous"
    Malformed: "bobuam_malformed"
    Masquerade: "bobuam_masquerade"
    SuspectedBot: "bobuam_bot"
    Opera: "{Short.Outdated browser} (OPR/Opera)"
    Chrome: "{Short.Outdated browser} (Chrome/Chromium)"
    Edge: "{Short.Outdated browser} (Edge)"
    Firefox: "{Short.Outdated browser} (Firefox)"
    Safari: "{Short.Outdated browser} (Safari)"
    Other: "{Short.Outdated browser} ({label.Other})"
BOBUAM Token:
 # Opera v117 initial stable release 2025.03.27 <https://blogs.opera.com/desktop/>
 Opera: "117"
 # Chrome v134 initial stable release 2025.03.04 <https://developer.chrome.com/release-notes>
 Chrome: "134"
 # Edge v135 initial stable release 2025.03.13 <https://learn.microsoft.com/en-us/deployedge/microsoft-edge-release-schedule>
 Edge: "135"
 # Firefox and Firefox ESR v136 initial stable release 2025.03.04 <https://en.wikipedia.org/wiki/Firefox_version_history>
 Firefox: "136"
 Firefox ESR: "136"
 # Safari v18 initial stable release 2024.09.16 <https://developer.apple.com/documentation/safari-release-notes>
 Safari: "18"
