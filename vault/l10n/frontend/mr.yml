 200 OK: "200 OK (ठीक आहे)\nकमीत कमी मजबूत, पण सर्वात वापरकर्ता-अनुकूल. स्वयंचलित विनंत्या बहुधा या प्रतिसादाचा अर्थ विनंती यशस्वी झाल्याचे संकेत म्हणून घेतील. ब्लॉक न केलेल्या विनंत्यांसाठी शिफारस केलेले."
 301 Moved Permanently: "301 Moved Permanently (कायमचे स्थलांतरित झाले)\nक्लायंटला सूचना देते की पुनर्निर्देशन कायमचे आहे, आणि पुनर्निर्देशनासाठी वापरलेली विनंती पद्धत सुरुवातीच्या विनंतीसाठी वापरल्या जाणाऱ्या विनंती पद्धतीपेक्षा वेगळी असू शकते."
 302 Found: "302 Found (सापडले)\nक्लायंटला सूचना देते की पुनर्निर्देशन तात्पुरते आहे, आणि पुनर्निर्देशनासाठी वापरलेली विनंती पद्धत सुरुवातीच्या विनंतीसाठी वापरल्या जाणाऱ्या विनंती पद्धतीपेक्षा वेगळी असू शकते."
 307 Temporary Redirect: "307 Temporary Redirect (तात्पुरते पुनर्निर्देशन)\nक्लायंटला सूचना देते की पुनर्निर्देशन तात्पुरते आहे, आणि पुनर्निर्देशनासाठी वापरलेली विनंती पद्धत सुरुवातीच्या विनंतीसाठी वापरल्या जाणाऱ्या विनंती पद्धतीपेक्षा वेगळी असू शकत नाही."
 308 Permanent Redirect: "308 Permanent Redirect (कायमचे पुनर्निर्देशन)\nक्लायंटला सूचना देते की पुनर्निर्देशन कायमचे आहे, आणि पुनर्निर्देशनासाठी वापरलेली विनंती पद्धत सुरुवातीच्या विनंतीसाठी वापरल्या जाणाऱ्या विनंती पद्धतीपेक्षा वेगळी असू शकत नाही."
 403 Forbidden: "403 Forbidden (निषिद्ध)\nअधिक मजबूत, पण कमी वापरकर्ता-अनुकूल. बहुतेक सामान्य परिस्थितींसाठी शिफारस केलेले."
 409 Conflict: "409 Conflict (संघर्ष)\nसंसाधन संघर्षांसाठी शिफारस केलेले (उदाहरणार्थ, विलीनीकरण संघर्ष, फाइल प्रवेश संघर्ष, इ). इतर संदर्भात शिफारस केलेली नाही."
 410 Gone: "410 Gone (गेले)\nखोट्या पॉझिटिव्हचे निराकरण करताना समस्या उद्भवू शकतात, कारण काही ब्राउझर हा स्थिती संदेश कॅश करतील आणि पुढील विनंत्या पाठवणार नाहीत, आता अवरोधित न झाल्यानंतरही. काही संदर्भात, विशिष्ट प्रकारच्या रहदारीसाठी सर्वात श्रेयस्कर असू शकते."
 418 I_m a teapot: "418 I'm a teapot (मी चहाची भांडी आहे)\nएप्रिल फूलच्या विनोदाचे संदर्भ ({{Links.RFC2324}}). कोणत्याही क्लायंट, बॉट, ब्राउझर, किंवा इतरांना ते समजण्याची शक्यता खूपच कमी आहे. मनोरंजन आणि सोयीसाठी प्रदान केले आहे, परंतु सहसा शिफारस केलेली नाही."
 429 Too Many Requests: "429 Too Many Requests (खूप जास्त विनंत्या)\nदर मर्यादित करण्यासाठी, DDoS हल्ल्यांना सामोरे जाताना, आणि पूर प्रतिबंधासाठी शिफारसित. इतर संदर्भात शिफारस केलेली नाही."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (कायदेशीर कारणांमुळे उपलब्ध नाही)\nप्रामुख्याने कायदेशीर कारणांसाठी अवरोधित करताना शिफारस केली जाते. इतर संदर्भात शिफारस केलेली नाही."
 503 Service Unavailable: "503 Service Unavailable (सेवा उपलब्ध नाही)\nसर्वात मजबूत, परंतु कमीत कमी वापरकर्ता-अनुकूल. हल्ला होत असताना, किंवा अत्यंत सततच्या अवांछित रहदारीला तोंड देण्यासाठी शिफारस केलेले."
