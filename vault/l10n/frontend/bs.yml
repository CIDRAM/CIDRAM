tip:
 2FA Sent: "Poruka e-pošte koja sadrži dvofaktorni kod za autentifikaciju poslana je na vašu adresu e-pošte. Potvrdite ovaj kod u nastavku da dobijete pristup front-endu. Ako niste primili ovu e-poštu, pokušajte se odjaviti, pričekajte 10 minuta, i ponovo se prijavite da biste primili novu e-poštu koja sadrži novi kod."
 Accounts: "Stranica računa vam omogućava da kontrolišete ko može da pristupi CIDRAM front-endu."
 Actions menu: "Blokiranje dodaje 1 broju potpisa. Zaobilaženjem se od broja potpisa oduzima 1. Bijela lista postavlja broj potpisa na 0 i prekida obradu, čime se u potpunosti preskaču sva sljedeća pravila. Siva lista postavlja broj potpisa na 0, ali ne prekida obradu. Profiliranje ne utiče na broj potpisa, ali je korisno kada je potrebna složenija logika za određivanje da li treba izvršiti druge vrste radnji, jer se generisani profili mogu povezati sa uslovima narednih pravila. Nakon obrade, ako je broj potpisa 1 ili veći, zahtjev će biti blokiran."
 Aggregator: "Agregator vam omogućava da izrazite IP adrese, CIDR-ove, i mrežne maske na najmanji mogući način. Unesite podatke koji će biti agregirani i pritisnite "OK"."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Prihvaćena vrijednost je bilo koji CIDR s rasponom koji pokriva IP adresu zahtjeva. Npr., 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, itd bi bili prihvaćeni za 1.2.3.4. Da bi se izbjegli lažno pozitivni, uži rasponi (npr., 1.2.3.4/32) su generalno poželjniji od širih raspona (npr., 0.0.0.0/1). Stranica kalkulatora može se koristiti za pronalaženje CIDR-ova koji imaju raspone koji pokrivaju određenu IP adresu."
 Auxiliary Rules Modes: "Režim pregleda prikazuje pomoćna pravila kao sažetu listu radi lakšeg čitanja. Pravila na listi se mogu proširiti i prikazati dodatni detalji klikom na njih. Opcije za izvoz ili brisanje pravila će se prikazati kada kliknete na trigram (☰). Redoslijed pravila se može promijeniti metodom prevuci i ispusti, prevlačenjem pravila s postojeće pozicije na željenu poziciju. Za izmjenu pomoćnih pravila potreban je režim uređivanja, polja koja se mogu uređivati i opcije za dodavanje novih uslova, webhookova, ili druge logike pravilima po potrebi na stranici. Nova pomoćna pravila mogu se kreirati putem bilo kojeg režima."
 Auxiliary Rules Priority: "Prioritet (najviši➡(jednaka🔄ekvivalentno)➡najniže):"
 Auxiliary Rules Webhooks: "Kada se pravilo pokrene, CIDRAM će pokušati obavijestiti sve povezane webhookove o događaju. Webhook je URL adresa koja može primati POST podatke, i može biti korisna ako postoji eksterna usluga, aplikacija, skripta itd hostovana na potpuno drugoj mreži od CIDRAM-a, a koju želite obraditi podacima koje generira CIDRAM o zahtjevu."
 Auxiliary Rules: "Ovu stranicu možete koristiti za kreiranje, brisanje, i modificiranje pomoćnih pravila za CIDRAM."
 Backup: "Ova stranica se može koristiti za uvoz/izvoz vaše konfiguracije, pomoćnih pravila, itd. Ovo može biti korisno ako trebate migrirati podatke na različite instalacije ili različite glavne verzije."
 Cache Data: "Ovdje možete pregledati sadržaj keša."
 Calculator: "Kalkulator vam omogućava da izračunate CIDR-ove i mrežne maske IP adrese."
 Click the component name for more details: "Kliknite na naziv komponente za više detalja."
 Configuration: "Stranica za konfiguraciju vam omogućava da modificirate konfiguraciju za CIDRAM sa front-enda."
 Enter IP address here: "Ovdje unesite IP adresu."
 Enter IP address here (optional): "Ovdje unesite IP adresu."
 Enter IP addresses here: "Ovdje unesite IP adrese."
 Enter input here: "Ovdje unesite unos."
 Enter queries here: "Ovdje unesite upite."
 Enter query here (optional): "Ovdje unesite upit (opcionalno)."
 Enter referrer here (optional): "Ovdje unesite upućivača (opcionalno)."
 Enter user agent here (optional): "Ovdje unesite korisničkog agenta (opcionalno)."
 Enter user agents here: "Ovdje unesite korisničke agente."
 File Manager: "Upravitelj datoteka vam omogućava brisanje, uređivanje, otpremanje, i preuzimanje datoteka. Koristite oprezno (ovim možete pokvariti instalaciju)."
 Greeting: "Zdravo, %s."
 Home: "Ovo je početna stranica za CIDRAM front-end. Odaberite vezu iz navigacijskog menija na lijevoj strani da nastavite."
 How many infractions to incur: "Koliko prekršaja treba napraviti."
 IP Testing: "Stranica za testiranje IP-a vam omogućava da testirate da li su IP adrese blokirane trenutno instaliranim potpisima."
 IP Tracking: "Stranica za praćenje IP adresa vam omogućava da provjerite status praćenja IP adresa, da provjerite koje su od njih zabranjene, i ako je potrebno, da uklonite zabrane ili status praćenja."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Ako zahtjev dolazi s IPv6 adrese koja pripada rasponu koji koristi IPv6 mehanizam tranzicije (npr., 6to4, Teredo, ISATAP, itd), polje "IP adresa (riješeno)" bit će popunjeno IPv4 adresom u koju se ta IPv6 adresa prevodi prema tom IPv6 mehanizmu tranzicije (npr., ako "IP adresa" je "2002:c0a8:1::", "IP adresa (riješeno)" će biti "192.168.0.1"). U svim ostalim slučajevima, polja "IP adresa (riješeno)" i "IP adresa" bit će ista."
 Intersector: "Intersektor se može koristiti za određivanje zajedničkih faktora iz dva skupa raspona."
 Logs: "Izaberite datoteku evidencije sa liste ispod da vidite sadržaj te datoteke evidencije."
 Number of seconds until it expires: "Broj sekundi do isteka."
 Numeric comparison: "Da biste koristili numeričko poređenje, odaberite direktno poređenje nizova ili automatsko otkrivanje metoda, osigurajte da je vrijednost uslova numerička, i stavite prefiks željenim operatorom.<br />Npr., za uslove "jednako", &gt;=2 daje ≥2, &lt;=2 daje ≤2, za uslove "nije jednako", &gt;=2 daje ≱2, &lt;=2 daje ≰2, itd."
 Range Tables: "Ova stranica prikazuje neke osnovne statističke informacije o IP rasponima pokrivenim trenutno aktivnim datotekama potpisa."
 Rate Limiting: "Ova stranica prikazuje trenutnu upotrebu kvote i dostupnost u pogledu ograničenja brzine."
 Rate limiting is currently disabled: "Bilješka: Ograničenje brzine je trenutno onemogućeno, ali se može omogućiti putem konfiguracijske stranice."
 Report to AbuseIPDB: "Ova stranica se može koristiti za prijavu IP adresa u AbuseIPDB, ili za brisanje prethodnih izvještaja u slučaju da je IP adresa prijavljena greškom."
 Sections List: "Ova stranica navodi koji odjeljci postoje u trenutno aktivnim datotekama potpisa."
 See the documentation: "Pogledajte <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>dokumentaciju</a> za informacije o različitim konfiguracijskim direktivama i njihovoj svrsi."
 Server log snippets, abuse details, etc: "Isječci dnevnika servera, detalji o zloupotrebi, itd."
 Signature File Fixer: "Popravljač datoteka potpisa pruža način otkrivanja i rješavanja potencijalnih problema u datotekama potpisa."
 Specify a URL, or leave blank to disregard: "Navedite URL, ili ostavite prazno da zanemarite."
 Specify a value, or leave blank to disregard: "Navedite vrijednost, ili ostavite prazno da zanemarite."
 Statistics tracking is currently disabled: "Bilješka: Praćenje statistike je trenutno onemogućeno, ali se može omogućiti putem konfiguracijske stranice."
 Statistics: "Ova stranica prikazuje neke osnovne statistike upotrebe u vezi sa vašom instalacijom CIDRAM-a."
 Subtractor: "Subtractor se može koristiti za oduzimanje jednog raspona IP-ova/CIDR-ova/mrežnih maski od drugog."
 Updates: "Stranica za ažuriranje vam omogućava da instalirate, deinstalirate, i ažurirate različite komponente CIDRAM-a (osnovni paket, potpise, L10N datoteke, itd)."
 When available, the value of the country code lookup: "Kada je dostupno, vrijednost pretrage koda države je dvocifreni {{Links.ISO.3166}} kod države. Npr., US za Sjedinjene Američke Države, RU za Rusiju, CN za Kinu, itd."
warning: !lazy
 API_Rate_Limited: "Upozorenje: Čini se da je pristup %s API-ju trenutno ograničen stopom."
 Cookies: "Bilješka: CIDRAM koristi kolačić za provjeru autentičnosti prijava. Prijavom dajete pristanak da vaš pretraživač kreira i pohrani kolačić."
 Editing PHP files: "Upozorenje: Poznato je da neka sigurnosna rješenja za web hosting automatski zabranjuju IP adrese nakon otkrivanja PHP tagova unutar zahtjeva (npr., kada pokušavate modificirati PHP datoteke putem pretraživača). CIDRAM nema načina da sazna da li vaš webhosting servis koristi takvo sigurnosno rješenje. Kako bi se izbjegli ovakvi problemi, preporučuje se ne uređivanje PHP datoteka na takav način kada je to moguće."
 IP tests are disabled: "Upozorenje: IP testovi su onemogućeni! Datoteke potpisa se ne mogu koristiti dok se ovo ne riješi."
 JavaScript required: "Upozorenje: Neke front-end funkcionalnosti zahtijevaju JavaScript. Kako biste osigurali da se cijeli front-end ponaša kako se očekuje, preporučuje se omogućavanje JavaScripta."
 Likely to be overwritten: "Upozorenje: Datoteka koju trenutno uređujete pripada komponenti "%s". Sve promjene napravljene u ovoj datoteci će vrlo vjerovatno biti prepisane sljedeći put kada se ta komponenta ažurira."
 Likely to become corrupted: "Upozorenje: U datoteci koja se trenutno uređuje otkriveni su bajtovi koji nisu UTF8. Datoteka će vjerovatno biti oštećena ako se uređuje korištenjem ove posebne funkcije."
 Modules are disabled: "Upozorenje: Moduli su onemogućeni! Moduli se ne mogu koristiti dok se ovo ne riješi."
 No modules are active: "Upozorenje: Nijedan modul nije omogućen! Moduli se mogu aktivirati pomoću stranica za konfiguraciju ili ažuriranja."
 No signature files are active: "Upozorenje: Nijedan datoteka potpisa nije omogućen! Datoteke potpisa mogu se aktivirati pomoću stranica za konfiguraciju ili ažuriranja."
 Operating in dry run mode: "Upozorenje: U režimu rada na suho! Dok je u režimu rada na suho, zahtjevi se i dalje provjeravaju i evidentiraju kao blok događaji kao i obično, ali ništa nije blokirano."
 Operating in maintenance mode: "Upozorenje: U režimu održavanja! Dok je u režimu održavanja, ništa se ne provjerava, ne evidentira, ili blokira."
 Page termination is disabled: "Upozorenje: Završetak stranice je onemogućen! Zahtjevi se ne mogu ispravno blokirati dok se ovo ne riješi."
 Proceeding will log out all users: "Upozorenje: Nastavkom će se odjaviti svi korisnici."
 The auxiliary rules execution stage is currently disabled: "Upozorenje: Faza izvršavanja pomoćnih pravila je trenutno onemogućena."
 This account is not using a valid password: "Upozorenje: Ovaj račun ne koristi važeću lozinku!"
 Using the default password: "Upozorenje: Korištenje zadane lozinke!"
