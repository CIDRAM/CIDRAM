<div class="mainbox">
  <nav class="big">
{nav}  </nav>
  <main class="extend">
    <form action="?cidram-page=intersector" method="POST">
      <div class="col">
        <div class="s flexstretch">{state_msg}</div>
        <div class="h1f center s flexstretch">A<br /><textarea name="A" title="A">{Intersector_A}</textarea></div>
        <div class="h1f center s flexstretch">B<br /><textarea name="B" title="B">{Intersector_B}</textarea></div>
      </div>
      <div class="duo">
        <div class="h1 center">{OutputFormat}</div>
        <div class="h1f center"><input type="submit" value="{field.OK} [0]" accesskey="0" /></div>
      </div><!-- Output Begin -->
      <div class="col">
        <div class="h1f s flexstretch">
          <div class="center">{label.Intersect} (A∩B)<br /><textarea id="rangeOutput" readonly>{Intersector_AB}</textarea></div>
          <div class="clipMar"><span class="navicon clipboard" onclick="javascript:if(navigator.clipboard){navigator.clipboard.writeText(getElementById('rangeOutput').value);getElementById('rangeSvg_copied').className='sFade'}else{getElementById('rangeSvg_failed').style.className='sFade'}"></span><span id="rangeSvg_copied" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtGn">{response.Copied}</span></span><span id="rangeSvg_failed" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtRd">{response.Failed}</span></span></div>
        </div>
      </div><!-- Output End -->
    </form>
  </main>
</div>
