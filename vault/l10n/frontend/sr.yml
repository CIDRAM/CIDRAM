Glossary: !lazy
 Entries:
  CIDR/ЦИДР: |
   „CIDR“ је скраћеница за „Classless Inter-Domain Routing“ (Безкласно међудоменско рутирање), одакле потиче „CIDR“ у „CIDRAM“, при чему је „CIDRAM“ (или „ЦИДРАМ“) скраћеница за „Classless Inter-Domain Routing Access Manager“ (Менаџер приступа безкласно међудоменско рутирање).
   У контексту ЦИДРАМ-а, „CIDR“ или „ЦИДР“ (или „ЦИДР-ове“) се посебно односи на подмреже изражене коришћењем CIDR нотације (ЦИДР нотације).
  Лажно позитиван: |
   Генерално, приликом извођења теста, када су резултати теста „позитивни“ (тј., услови теста се испоставе тачним), али се очекивало да буду (или је требало да буду) „негативни“ (тј., резултати теста су погрешни), то се назива „лажно позитивним“. <em>Енглески: „false positive“. Алтернативно: „лажно позитивна грешка“; „лажни аларм“.</em>
   Неки сродни термини су „истински позитиван“, „истински негативан“, и „лажно негативан“. <em>Енглески: „true positive“, „true negative“, „false negative“.</em> „Истински позитиван“ се односи на то када су и резултати теста и стварно стање стања тачни (или „позитивни“), а „истински негативан“ се односи на то када су и резултати теста и стварно стање стања истински (или „негативни“). „Истински позитиван“ или „истински негативан“ резултат се сматра „тачним закључком“.
   Инверз „лажно позитивног“ је „лажно негативан“. Када су резултати теста „негативни“, али се очекивало да буду (или је требало да буду) „позитивни“, резултати се називају „лажно негативни“.
   У контексту ЦИДРАМ-а, ови термини се обично односе на то када ЦИДРАМ блокира нешто што не би требало, или када не успе да блокира нешто што би требало. Када ЦИДРАМ блокира захтев који није требало да буде блокиран (нпр., због лоших, застарелих, или нетачних потписа), или када то учини из погрешних разлога, то је „лажно позитиван“. Када ЦИДРАМ не успе да блокира захтев који је требало да буде блокиран (нпр., због непредвиђених претњи, недостајућих потписа, неисправних модула, или недостатака у процесу), то је „лажно негативно“ (мада се обично описује као „пропуштено откривање“). <em>Енглески: „missed detection“.</em>
   | | Захтев НЕ треба блокиран | Захтев ТРЕБА блокиран |
   | Захтев НИЈЕ блокиран | Истински негативан (тачним закључком) | Пропуштено откривање (или лажно негативан) |
   | Захтев ЈЕСТЕ блокиран | Лажно позитиван | Истински позитиван (тачним закључком) |
   Ако наиђете на лажно позитивне, прво проверите страницу са ажурирањима и, ако је нешто означено као застарело, ажурирајте то. Након тога, ако проблем и даље постоји, можете пријавити проблем на ЦИДРАМ-овом систему за праћење проблема.
  Потпис: |
   У контексту ЦИДРАМ-а, потпис („signature“ на енглеском) се односи на податке који се налазе у датотекама потписа и у модулима, које ЦИДРАМ користи да би утврдио да ли захтеви треба да буду блокирани.
   У случају датотека потписа, потпис се обично састоји од ЦИДР-а, команде која представља жељену радњу коју треба предузети када се наиђе на захтев са ИП адресе која припада том ЦИДР-у, а у случају да је ИП адреса блокирана, разлог за то. Често ће бити груписани као одељци, праћени коментарима, ознакама и другим метаподацима како би се пружио додатни контекст.
   Пример потписа из IPv4 богона датотеке потписа: {{Excerpts.Bogon signature}}
   У случају модула, потпис се обично односи на позиве у коду модула ка одређеној методи одговорној за блокирање захтева када су испуњени одређени услови.
   Хипотетички пример потписа из модула: {{Excerpts.Module signature}}
