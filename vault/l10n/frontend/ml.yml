 Updates: "അപ്ഡേറ്റ്സ് പേജ് നിങ്ങളെ CIDRAM-ന്റെ വിവിധ ഘടകങ്ങൾ (കോർ പാക്കേജ്, ഒപ്പുകൾ, L10N ഫയലുകൾ, മുതലായവ) ഇൻസ്റ്റാൾ ചെയ്യാനും, അൺഇൻസ്റ്റാൾ ചെയ്യാനും, അപ്ഡേറ്റ് ചെയ്യാനും അനുവദിക്കുന്നു."
