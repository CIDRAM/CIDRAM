hints_usemode:
 0: "കുറിപ്പ്: വൈറ്റ്‌ലിസ്റ്റ് ചെയ്‌തതോ പരിശോധിച്ചുറപ്പിച്ചതോ തടയാത്തതോ ആയ അഭ്യർത്ഥനകൾക്ക് ഒരിക്കലും ഒരു CAPTCHA പൂർത്തിയാക്കേണ്ടതില്ല."
 1: "ഇതും ശ്രദ്ധിക്കുക: ബോട്ടുകൾക്കും വിവിധതരം ക്ഷുദ്രകരമായ ഓട്ടോമേറ്റഡ് അഭ്യർത്ഥനകൾക്കുമെതിരെ ഉപയോഗപ്രദവും അധികവുമായ ഒരു സംരക്ഷണ പാളി നൽകാൻ CAPTCHA-കൾക്ക് കഴിയും, എന്നാൽ ക്ഷുദ്രകരമായ ഒരു മനുഷ്യനിൽ നിന്ന് ഒരു സംരക്ഷണവും നൽകില്ല."
 2: "സഹായ നിയമങ്ങൾ വഴി അഭ്യർത്ഥനകൾ "ഉപയോഗത്തിനായി അടയാളപ്പെടുത്താം"."
 3: "ഒരു അഭ്യർത്ഥന "സെൻസിറ്റീവ്" ആയി കണക്കാക്കണോ എന്ന് നിർണ്ണയിക്കുന്നത് {{Links.ConfigRef.sensitive}} ആണ്."
 4: ""ഒപ്പ് പരിധി" നിർണ്ണയിക്കുന്നത് {{Links.ConfigRef.signature_limit}} ആണ്."
hints_verification:
 ""പോസിറ്റീവ്", "നെഗറ്റീവ്" എന്താണ്?": "ഒരു അഭ്യർത്ഥനയിലൂടെ അവതരിപ്പിക്കുന്ന ഐഡന്റിറ്റി പരിശോധിക്കുമ്പോൾ, വിജയകരമായ ഒരു ഫലത്തെ "പോസിറ്റീവ്" അല്ലെങ്കിൽ "നെഗറ്റീവ്" എന്ന് വിശേഷിപ്പിക്കാം. അവതരിപ്പിക്കുന്ന ഐഡന്റിറ്റി യഥാർത്ഥ ഐഡന്റിറ്റിയാണെന്ന് സ്ഥിരീകരിക്കുമ്പോൾ, അതിനെ "പോസിറ്റീവ്" എന്ന് വിശേഷിപ്പിക്കും. അവതരിപ്പിക്കുന്ന ഐഡന്റിറ്റി വ്യാജമാണെന്ന് സ്ഥിരീകരിക്കുമ്പോൾ, അതിനെ "നെഗറ്റീവ്" എന്ന് വിശേഷിപ്പിക്കും. എന്നിരുന്നാലും, ഒരു വിജയകരമല്ലാത്ത ഫലത്തെ (ഉദാഹരണത്തിന്, സ്ഥിരീകരണം പരാജയപ്പെടുന്നു, അല്ലെങ്കിൽ അവതരിപ്പിച്ച ഐഡന്റിറ്റിയുടെ ആധികാരികത നിർണ്ണയിക്കാൻ കഴിയുന്നില്ല) "പോസിറ്റീവ്" അല്ലെങ്കിൽ "നെഗറ്റീവ്" എന്ന് വിശേഷിപ്പിക്കില്ല. പകരം, വിജയിക്കാത്ത ഒരു ഫലത്തെ സ്ഥിരീകരിക്കാത്തത് എന്ന് മാത്രമേ വിശേഷിപ്പിക്കും. ഒരു അഭ്യർത്ഥനയിൽ ഹാജരാക്കുന്ന ഐഡന്റിറ്റി പരിശോധിക്കാൻ ശ്രമിക്കാത്തപ്പോൾ, ആ അഭ്യർത്ഥനയെ അതുപോലെ പരിശോധിച്ചുറപ്പിക്കാത്തതായി വിശേഷിപ്പിക്കും. അഭ്യർത്ഥന അവതരിപ്പിക്കുന്ന ഐഡന്റിറ്റി തിരിച്ചറിയുന്നതിനാൽ സ്ഥിരീകരണം സാധ്യമാകുന്ന സന്ദർഭത്തിൽ മാത്രമേ ഈ പദങ്ങൾക്ക് അർത്ഥമുണ്ടാകൂ. മുകളിൽ നൽകിയിരിക്കുന്ന ഓപ്ഷനുകളുമായി ഐഡന്റിറ്റി പൊരുത്തപ്പെടുന്നില്ലെങ്കിൽ, അല്ലെങ്കിൽ ഒരു ഐഡന്റിറ്റിയും അവതരിപ്പിക്കാത്തപ്പോൾ, മുകളിൽ നൽകിയിരിക്കുന്ന ഓപ്ഷനുകൾ അപ്രസക്തമാകും."
 ""സിംഗിൾ-ഹിറ്റ് ബൈപാസുകൾ" എന്താണ്?": "ചില സന്ദർഭങ്ങളിൽ, ഒപ്പ് ഫയലുകൾ, മൊഡ്യൂളുകൾ, അല്ലെങ്കിൽ അഭ്യർത്ഥനയുടെ മറ്റ് വ്യവസ്ഥകൾ കാരണം ഒരു അഭ്യർത്ഥന പോസിറ്റീവ് ആണെന്ന് സ്ഥിരീകരിച്ചു ഇപ്പോഴും തടഞ്ഞേക്കാം, തെറ്റായ പോസിറ്റീവുകൾ ഒഴിവാക്കാൻ ബൈപാസുകൾ ആവശ്യമായി വന്നേക്കാം. ഒരു ബൈപാസ് ഒരു ലംഘനം മാത്രമേ കൈകാര്യം ചെയ്യാൻ ഉദ്ദേശിച്ചിട്ടുള്ളൂവെങ്കിൽ, അതിൽ കൂടുതലോ കുറവോ അല്ല, അത്തരമൊരു ബൈപാസിനെ "സിംഗിൾ-ഹിറ്റ് ബൈപാസ്" എന്ന് വിശേഷിപ്പിക്കാം."
hints_want_to_block: "!! ഇത് യഥാർത്ഥമാണോ വ്യാജമാണോ എന്നത് പരിഗണിക്കാതെ, മിക്ക ഉപയോക്താക്കളും ഇത് തടയപ്പെടണമെന്ന് ആഗ്രഹിക്കും. "പരിശോധിക്കാൻ ശ്രമിക്കണോ" തിരഞ്ഞെടുക്കാതിരിക്കുകയും "പരിശോധിച്ചുറപ്പിക്കാത്ത അഭ്യർത്ഥനകൾ തടയുക" തിരഞ്ഞെടുക്കുകയും ചെയ്തുകൊണ്ട് അത് നേടാനാകും. എന്നിരുന്നാലും, ചില ഉപയോക്താക്കൾക്ക് അത്തരം അഭ്യർത്ഥനകൾ പരിശോധിക്കാൻ കഴിയണമെന്നുള്ളതിനാൽ (പോസിറ്റീവ് അനുവദിക്കുമ്പോൾ തന്നെ നെഗറ്റീവുകൾ തടയുന്നതിന്), മൊഡ്യൂളുകൾ വഴി അത്തരം അഭ്യർത്ഥനകൾ തടയുന്നതിനുപകരം, അത്തരം അഭ്യർത്ഥനകൾ കൈകാര്യം ചെയ്യുന്നതിനുള്ള ഓപ്ഷനുകൾ ഇവിടെ നൽകിയിരിക്കുന്നു."
info_cli: !lazy
 by_default_ips: |
  സ്ഥിരസ്ഥിതിയായി, എല്ലാ ഒപ്പ് ഫയലുകൾ, എല്ലാ മൊഡ്യൂളുകൾ, എല്ലാ ഓക്സിലറി
  നിയമങ്ങൾ, സോഷ്യൽ മീഡിയ പരിശോധന, തിരയൽ എഞ്ചിൻ പരിശോധന എന്നിവയ്‌ക്കെതിരെയും
  IP വിലാസങ്ങൾ പരീക്ഷിക്കപ്പെടുന്നു.
  --no-ban    നിരോധിച്ചിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുന്നത് തടയുന്നു.
  --no-sig    ഒപ്പ് ഫയലുകൾക്കെതിരായ പരിശോധന തടയുന്നു.
  --no-mod    മൊഡ്യൂളുകൾക്കെതിരായ പരിശോധന തടയുന്നു.
  --no-sev    തിരയൽ എഞ്ചിൻ പരിശോധന തടയുന്നു.
  --no-smv    സോഷ്യൽ മീഡിയ പരിശോധന തടയുന്നു.
  --no-ov     മറ്റ് പരിശോധനകളെ തടയുന്നു.
  --no-aux    ഓക്സിലറി നിയമങ്ങൾക്കെതിരായ പരിശോധന തടയുന്നു.
 cidram_cli_mod: "CIDRAM CLI മോഡ്."
 ipv4_ipv6_are_: |
  IPv4/IPv6 രണ്ടും പിന്തുണയ്ക്കുന്നു. ഉദ്ധരണികൾ ഉപയോഗിക്കുന്നതിലൂടെ, *എല്ലാ*
  CLI മോഡ് പ്രവർത്തനങ്ങൾക്കും മൾട്ടിലൈൻ ഇൻപുട്ട് സാധ്യമാണ്  (ഉദാഹരണത്തിന്,
  ഒരൊറ്റ പ്രവർത്തനത്തിൽ ഒന്നിലധികം IP വിലാസങ്ങൾ പരീക്ഷിക്കാൻ):
 or_depending_o: |
  ആദ്യം മുതൽ അവസാനം വരെ അല്ലെങ്കിൽ അവസാനം മുതൽ ആദ്യം വരെ ശൃംഖലയാക്കണോ
  വേണ്ടയോ എന്നതിനെ ആശ്രയിച്ച്:
 or_to_aggregat: "അല്ലെങ്കിൽ, അവയെ നെറ്റ്മാസ്കുകളായി സംയോജിപ്പിക്കാൻ:"
 or_using_comma: "മൾട്ടിലൈനുകൾക്ക് പകരം കോമകൾ ഉപയോഗിക്കുന്നത് (അത് അതുതന്നെ ചെയ്യുന്നു):"
 the_signature_: "ഒപ്പുകളുടെ ഫിക്സർ CLI വഴിയും ഉപയോഗിക്കാം:"
 to_calculate_c: "ഒരു IP വിലാസത്തിൽ നിന്ന് CIDR-കൾ കണക്കാക്കാൻ:"
 to_test_whethe: "ഒരു IP വിലാസം CIDRAM തടഞ്ഞിട്ടുണ്ടോ എന്ന് പരിശോധിക്കാൻ:"
 to_quit_type_q: |
  പുറത്തുകടക്കാൻ, "q", "quit", അല്ലെങ്കിൽ "exit" എന്ന് ടൈപ്പ് ചെയ്യുക,
  തുടർന്ന് Enter (എന്റർ) അമർത്തുക.
 you_can_also_a: "നിങ്ങൾക്ക് IP-കളും CIDR-കളും സംയോജിപ്പിക്കാനും കഴിയും:"
 you_can_also_c: |
  നിങ്ങൾക്ക് കമാൻഡുകൾ ഒരുമിച്ച് ചെയിൻ ചെയ്യാനും കഴിയും (ഈ ഉദാഹരണം ചില
  ഫയലുകളിൽ നിന്ന് വായിക്കുകയും, അവയുടെ ഉള്ളടക്കം സമാഹരിക്കുകയും, തുടർന്ന്
  സമാഹരിച്ച ഡാറ്റ output.dat-ലേക്ക് എഴുതുകയും ചെയ്യുന്നു):
 you_can_also_r: "ഇതുപോലുള്ള ഫയലുകളിൽ നിന്നും നിങ്ങൾക്ക് വായിക്കാം:"
 you_can_also_u: |
  നിങ്ങൾക്ക് വേണമെങ്കിൽ പകരം കോമകൾ ഉപയോഗിക്കാം (ഇത് മൾട്ടിലൈനുകൾ
  ഉപയോഗിക്കുന്നതുപോലെയാണ് കണക്കാക്കുന്നത്, പക്ഷേ നിങ്ങൾ ഉദ്ധരണികൾ
  ഉപയോഗിക്കേണ്ടതില്ല, രണ്ടും ഒരുമിച്ച് കൂട്ടിക്കലർത്തരുത്.):
 you_can_also_w: "നിങ്ങൾക്ക് ഇതുപോലുള്ള ഫയലുകളിലേക്കും എഴുതാം:"
 you_can_print_: |
  നിങ്ങൾക്ക് സ്ക്രീനിൽ ഡാറ്റ ഇതുപോലെ പ്രിന്റ് ചെയ്യാൻ കഴിയും (കമാൻഡുകൾ ചെയിൻ
  ചെയ്യുമ്പോൾ ചിലപ്പോൾ ഉപയോഗപ്രദമാകും):
