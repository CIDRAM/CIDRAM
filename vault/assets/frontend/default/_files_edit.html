<div class="mainbox">
  <nav class="big">
{nav}  </nav>
  <main class="extend">
    <form action="?cidram-page=file-manager{basepathActionAttach}" method="POST">
      <div class="col">
        <div class="s flexstretch">{state_msg}</div>
        <input name="do_action" type="hidden" value="edit-file" />
        <input name="filename" type="hidden" value="{filename}" />
        <div class="ng2 s">{link.File Manager} – {filename}</div>
        <div class="ng1"><textarea id="efta" name="content" onchange="javascript:wfp(this.value)" onkeyup="javascript:wfp(this.value)">{content}</textarea><script type="text/javascript">wfp(document.getElementById('efta').value)</script></div>
        <div class="spanner"><input type="submit" value="{field.Edit}" /> <input type="reset" value="{field.Reset}" /></div>
      </div>
    </form>
  </main>
</div>
