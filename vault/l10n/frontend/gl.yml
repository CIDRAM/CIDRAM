macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "Xeralmente non recomendado, xa que é probable que haxa algúns que non necesites. Instalar e activar compoñentes cando non son necesarios pode afectar negativamente o rendemento."
  install_l10n_core: &RecommendKeepingCore "Cando a directiva de configuración <code>lang_override</code> está activada, se o navegador dun usuario especifica unha preferencia de idioma particular, sempre que estean instalados os datos básicos de L10N para ese idioma, CIDRAM poderá mostrar a páxina de "acceso denegado" nese idioma especificado. En consecuencia, recoméndase ter instalados todos os datos básicos de L10N."
  install_l10n_fe: &RecommendFEOnlyNeeded "O seu idioma preferido pódese especificar mediante a directiva de configuración <code>lang</code>. Unha vez feito isto, é improbable que necesites ningún dato do front-end L10N que non sexa o para o teu idioma preferido, e é posible que queiras eliminalos para liberar marxinalmente espazo no disco dispoñible. Non obstante, se decide eliminalo ou mantelo, de calquera xeito, non debería facer ningún dano."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
