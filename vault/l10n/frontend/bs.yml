hints_shorthand:
 0.: "Ako vašoj web stranici treba pristup putem LAN-a ili localhost-a, nemojte blokirati ovo. U suprotnom, možete blokirati ovo."
 1.: "Nijedna od zadanih datoteka potpisa ovo ne koristi, ali je ipak podržana u slučaju da bi nekim korisnicima mogla biti korisna."
 2.: "Ako trebate da korisnici mogu pristupiti vašoj web stranici putem proksija, nemojte blokirati ovo. U suprotnom, možete blokirati ovo."
 3.: "Direktna upotreba u potpisima nije podržana, ali se može pozvati na drugi način u određenim okolnostima."
 4.: "Odnosi se na slučajeve u kojima se skraćene riječi uopće ne koriste ili ih CIDRAM ne prepoznaje."
 Jedan po potpisu.: "Potpis može pozvati više profila, ali može koristiti samo jednu skraćenu riječ. Moguće je da više skraćenica može biti prikladna, ali kako se može koristiti samo jedna, trudimo se da uvijek koristimo samo najprikladnije."
 Prioritet.: "Odabrana opcija uvijek ima prioritet nad opcijom koja nije odabrana. Npr., ako je u igri više skraćenih riječi, ali je samo jedna od njih postavljena kao blokirana, zahtjev će i dalje biti blokiran."
 Ljudske krajnje tačke i usluge u oblaku.: "Usluga u oblaku može se odnositi na dobavljače web hostinga, farme servera, centre podataka, ili bilo koji broj drugih stvari. Ljudska krajnja tačka se odnosi na način na koji čovjek pristupa internetu, kao što je putem provajdera internetskih usluga. Mreža obično pruža samo jedno ili drugo, ali ponekad može pružiti i jedno i drugo. Trudimo se da nikada ne identifikujemo potencijalne ljudske krajnje tačke kao usluge u oblaku. Stoga se usluga u oblaku može identificirati kao nešto drugo ako njen opseg dijele poznate ljudske krajnje tačke. Nasuprot tome, mi pokušavamo uvijek identificirati usluge u oblaku, čiji rasponi ne dijele nijedna poznata ljudska krajnja tačka, kao usluge u oblaku. Stoga, zahtjev koji je eksplicitno identificiran kao usluga u oblaku vjerovatno ne dijeli svoj opseg ni sa jednom poznatom ljudskom krajnjom tačkom. Isto tako, zahtjev koji je eksplicitno identificiran napadima ili neželjenom poštom vjerovatno dijeli takve opsege. Međutim, internet je uvijek u fluktuaciji, svrhe mreža se mijenjaju s vremenom, a rasponi se uvijek kupuju ili prodaju, stoga budite svesni i oprezni u pogledu lažnih pozitivnih rezultata."
hints_time_format: |
 <strong><em>Čuvar mjesta – Objašnjenje – Primjer zasnovan na 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – Godina – Npr., 2024.<br />
 <code class="s">{yy}</code> – Skraćena godina – Npr., 24.<br />
 <code class="s">{Mon}</code> – Skraćeni naziv mjeseca (na engleskom) – Npr., Apr.<br />
 <code class="s">{mm}</code> – Mjesec sa vodećim nulama – Npr., 04.<br />
 <code class="s">{m}</code> – Mjesec – Npr., 4.<br />
 <code class="s">{Day}</code> – Skraćeni naziv dana (na engleskom) – Npr., Tue.<br />
 <code class="s">{dd}</code> – Dan sa vodećim nulama – Npr., 30.<br />
 <code class="s">{d}</code> – Dan – Npr., 30.<br />
 <code class="s">{hh}</code> – Sat sa vodećim nulama (koristi 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{h}</code> – Sat (koristi 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{ii}</code> – Minuta sa vodećim nulama – Npr., 27.<br />
 <code class="s">{i}</code> – Minuta – Npr., 27.<br />
 <code class="s">{ss}</code> – Sekunde sa vodećim nulama – Npr., 49.<br />
 <code class="s">{s}</code> – Sekunde – Npr., 49.<br />
 <code class="s">{tz}</code> – Vremenska zona (bez dvotočke) – Npr., +0800.<br />
 <code class="s">{t:z}</code> – Vremenska zona (sa dvotočkom) – Npr., +08:00.
hints_usemode:
 0: "Bilješka: Zahtjevi na bijeloj listi, ili provjereni i neblokirani zahtjevi, nikada ne moraju ispuniti CAPTCHA."
 1: "Također imajte na umu: CAPTCHA mogu pružiti koristan, dodatni sloj zaštite od botova i raznih vrsta zlonamjernih automatiziranih zahtjeva, ali neće pružiti nikakvu zaštitu od zlonamjernog ljudi."
 2: "Zahtjevi se mogu "označiti za upotrebu" putem pomoćnih pravila."
 3: "Da li se zahtjev smatra "osjetljivim" određuje se pomoću {{Links.ConfigRef.sensitive}}."
hints_verification:
 "Šta su "pozitivi" i "negativi"?": "Prilikom provjere identiteta predstavljenog zahtjevom, uspješan ishod bi se mogao opisati kao "pozitivan" ili "negativan". U slučaju da se potvrdi da je predstavljeni identitet pravi identitet, on bi bio opisan kao "pozitivan". U slučaju da se potvrdi da je predstavljeni identitet falsifikovan, on bi bio opisan kao "negativan". Međutim, neuspješan ishod (npr., provjera ne uspije, ili se ne može utvrditi istinitost predstavljenog identiteta) ne bi se opisali kao "pozitivan" ili "negativan". Umjesto toga, neuspješan ishod bi se jednostavno opisao kao neprovjeren. Kada se ne pokuša provjeriti identitet predstavljen u zahtjevu, zahtjev bi također bio opisan kao neprovjeren. Termini imaju smisla samo u kontekstu u kojem se prepoznaje identitet predstavljen u zahtjevu, a samim tim i gdje je verifikacija moguća. U slučajevima kada predstavljeni identitet ne odgovara gore navedenim opcijama, ili kada identitet nije predstavljen, gore navedene opcije postaju nevažne."
 "Šta su "zaobilaženje jednim pogotkom"?": "U nekim slučajevima, pozitivno verificiran zahtjev može i dalje biti blokiran zbog datoteka potpisa, modula, ili drugih uvjeta zahtjeva, a zaobilaženje može biti potrebno kako bi se izbjegli lažno pozitivni. U slučaju kada je zaobilaženje namijenjeno rješavanju tačno jednog prekršaja, ni više ni manje, takvo zaobilaženje bi se moglo opisati kao "zaobilaženje jednim pogotkom"."
hints_want_to_block: "!! Većina korisnika će vjerovatno htjeti da se ovo blokira, bez obzira na to da li je stvarno ili lažno. To se može postići tako da se ne odabere "pokušati provjeriti", već da se odabere "blokirati neprovjerene zahtjeve". Međutim, budući da neki korisnici možda žele moći provjeriti takve zahtjeve (kako bi blokirali negativne, a dozvolili pozitivne), umjesto blokiranja takvih zahtjeva putem modula, ovdje su date opcije za rukovanje takvim zahtjevima."
