macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "Općenito se ne preporučuje, jer vjerovatno postoje neki koji vam neće trebati. Instaliranje i aktiviranje komponenti kada nisu potrebne može negativno utjecati na performanse."
  install_l10n_core: &RecommendKeepingCore "Kada je omogućena direktiva konfiguracije <code>lang_override</code>, ako korisnikov preglednik odredi određenu jezičnu preferenciju, sve dok su instalirani osnovni L10N podaci za taj jezik, CIDRAM može prikazati stranicu "pristup odbijen" na tom određenom jeziku. Sukladno tome, preporučuje se da svi osnovni L10N podaci ostanu instalirani."
  install_l10n_fe: &RecommendFEOnlyNeeded "Vaš željeni jezik može se odrediti putem konfiguracijske direktive <code>lang</code>. Nakon što je to učinjeno, vjerojatno vam neće trebati nikakvi L10N podaci s front-enda osim onih za vaš željeni jezik, te ih je možda bolje ukloniti kako biste neznatno oslobodili prostor na disku. U svakom slučaju, neće uzrokovati nikakvu štetu."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
