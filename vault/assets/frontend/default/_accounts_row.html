    <tr id="{AccID}">
      <input id="{AccID}username" type="hidden" value="{AccUsername}" />
      <td class="h1 big"><div class="s">{AccUsername}</div><small>{AccWarnings}</small></td>
      <td class="h1 big"><div class="s">{AccPermissions}</div></td>
      <td class="h1 big"><input id="{AccID}password" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:this.value.length>0?(w('pwdWarn{AccID}',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value)||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':''))):w('pwdWarn{AccID}','')" onkeyup="javascript:this.value.length>0?(w('pwdWarn{AccID}',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value)||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':''))):w('pwdWarn{AccID}','')" /><small><br /><span id="pwdWarn{AccID}"></span></small></td>
      <td class="h1f extend">
        <div class="s big">
          <select id="{AccID}do" class="auto" title="{field.Options}">
            <option value="update-password">{field.Set new password}</option><option value="delete-account">{field.Delete account}</option>
          </select><input type="button" value="{field.OK}" class="auto" onclick="javascript:acc('{AccID}username','{AccID}password','{AccID}','{AccID}do')" />
        </div>
        <div class="s mob">
          <div class="s">{AccUsername}</div><small>{AccWarnings}</small><br /><em>{AccPermissions}</em><br />
          <input id="{AccID}passwordmob" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:this.value.length>0?(w('pwdWarn{AccID}Mob',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value)||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':''))):w('pwdWarn{AccID}Mob','')" onkeyup="javascript:this.value.length>0?(w('pwdWarn{AccID}Mob',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value)||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':''))):w('pwdWarn{AccID}Mob','')" /><small><br /><span id="pwdWarn{AccID}Mob"></span></small><br />
          <select id="{AccID}domob" class="auto" title="{field.Options}"><option value="update-password">{field.Set new password}</option><option value="delete-account">{field.Delete account}</option></select><br />
          <input type="button" value="{field.OK}" class="auto" onclick="javascript:acc('{AccID}username','{AccID}passwordmob','{AccID}','{AccID}domob')" />
        </div>
      </td>
    </tr>
