Config Defaults:
 shodandb:
  api_base:
   type: "string"
   default: "https://internetdb.shodan.io"
   See also:
    Shodan InternetDB: "https://internetdb.shodan.io/"
  api_header:
   type: "string"
   default: ""
  lookup_strategy:
   type: "int"
   default: 2
   choices:
    0: "label.None"
    1: "label.Every request"
    2: "label.Requests for sensitive pages only"
   style: "radio"
   hints: "hints_sensitive_pages"
  timeout_limit:
   type: "int"
   default: 12
  timeout_rl:
   type: "duration"
   default: "1°0′0″"
  tr069_ports:
   type: "string"
   default: "7547,30005"
   value_preg_filter:
    ~[^\d,\-]~: ""
   See also:
    TR-069 (Wikipedia): "https://en.wikipedia.org/wiki/TR-069"
  noteworthy_ports:
   type: "string"
   default: "21,22,23,25,80,81,110,137,138,139,143,443,445,554,2323,3389,5900,5901,8000,8080,8443,9000,20005,37777,52869"
   value_preg_filter:
    ~[^\d,\-]~: ""
  proxy_ports:
   type: "string"
   default: "1080,3128,4145,4153,5678,6588,8080,8081,8118,8123,8888,9050,9051,9150"
   value_preg_filter:
    ~[^\d,\-]~: ""
  ports_action:
   type: "checkbox"
   default: |
    Noteworthy:Profile
    Proxy:Block
    Proxy:Profile
    Proxy:Report
    Proxy:Options
   labels:
    Block: "checkbox.Block it"
    Profile: "checkbox.Profile it"
    Report: "checkbox.Report it"
    Options: "checkbox.Apply CAPTCHA options"
   choices:
    Noteworthy: "⁰ {label.Noteworthy ports}"
    Proxy: "¹ {label.Proxy ports}"
    Any: "² {label.Any ports}"
   nonsense: |
    Noteworthy:Report
    Any:Report
   hints: "hints_ports_action"
  options:
   type: "checkbox"
   default: ""
   choices: *CaptchaChoicesForModules
  expire_good:
   type: "duration"
   default: "1d0°0′0″"
  expire_bad:
   type: "duration"
   default: "1°0′0″"
Cache Prefetch:
 ShodanDB-429: ""
Problems:
 - "if {CIDRAM.Cache Prefetch.ShodanDB-429}==1 then warn warning.API_Rate_Limited ShodanDB module"
