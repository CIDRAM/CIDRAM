 Editing PHP files: "Uyarı: Bazı web barındırma güvenlik çözümlerinin, istekler içinde PHP etiketlerini algıladıktan sonra IP adreslerini otomatik olarak yasakladığı bilinmektedir (örneğin, bir tarayıcı aracılığıyla PHP dosyalarını değiştirmeye çalışırken). CIDRAM, web barındırma hizmetinizin böyle bir güvenlik çözümü kullanıp kullanmadığını bilmenin hiçbir yoluna sahip değildir. Bu tür sorunlardan kaçınmak için PHP dosyalarını mümkün olduğunca bu şekilde düzenlememeniz önerilir."
