macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "Geralmente não é recomendado, pois é provável que haja alguns de que você não precisa. Instalar e ativar componentes quando não são necessários pode afetar negativamente o desempenho."
  install_l10n_core: &RecommendKeepingCore {"pt-BR": "Quando a diretiva de configuração <code>lang_override</code> está habilitada, se o navegador de um usuário especifica uma preferência de idioma em particular, contanto que os dados L10N core para esse idioma estejam instalados, o CIDRAM é capaz de exibir a página "acesso negado" nesse idioma especificado. Como tal, é recomendável manter todos os dados do L10N core instalados.", "pt-PT": "Quando a diretiva de configuração <code>lang_override</code> está habilitada, se o navegador de um utilizador especifica uma preferência de idioma em particular, contanto que os dados L10N core para esse idioma estejam instalados, o CIDRAM é capaz de exibir a página "acesso negado" nesse idioma especificado. Como tal, é recomendável manter todos os dados do L10N core instalados."}
  install_l10n_fe: &RecommendFEOnlyNeeded "Seu idioma preferido pode ser especificado por meio da diretiva de configuração <code>lang</code>. Uma vez feito isso, é improvável que você precise de quaisquer dados do L10N front-end além do seu idioma preferido e pode querer removê-los para liberar um pouco do espaço disponível em disco. Porém, se você optar por removê-lo ou mantê-lo, de qualquer forma, não deve causar nenhum dano."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
