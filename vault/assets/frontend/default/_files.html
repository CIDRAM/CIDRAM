<div class="mainbox">
  <nav class="big">
{nav}  </nav>
  <main class="extend">
    <div class="col">
      <div class="s flexstretch" id="stateMsg">{state_msg}</div>
      <div class="spanner">
        <form enctype="multipart/form-data" action="?cidram-page=file-manager" method="POST">
          <input name="do_action" type="hidden" value="upload-file" />
          <input type="file" name="upload-file" />
          <input type="submit" value="{field.Upload new file}" />
        </form>
        <form id="fmControl" action="?cidram-page=file-manager" method="POST" style="display:none">
          <input id="fmControlDoAction" name="do_action" type="hidden" value="" />
          <input id="fmControlFilename" name="filename" type="hidden" value="" />
        </form>
      </div>
    </div>
    <div class="quad">
      <div class="h2 s">{field.File}</div>
      <div class="h2 s big">{field.size.Size} – {field.Last modified}</div>
      <div class="h2 s big">{field.Component}/{field.Purpose}</div>
      <div class="h2f s">{field.Options}</div>
{FilesData}
    </div>
  </main>
</div>
