 Câu hỏi thường gặp.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.vi.md\#những-gì-tôi-có-thể-sử-dụng-cho-default_dns" hreflang="vi-VN">Những gì tôi có thể sử dụng cho "default_dns"?</a></em>"
hints_duration:
 SI.: "Khoảng thời gian có thể được mô tả bằng cách sử dụng "hệ thống đơn vị quốc tế". V.d., <strong>1d2h3min4s</strong> hoặc <strong>1d 2h 3min 4s</strong> cho một ngày, hai giờ, ba phút, bốn giây, hoặc <strong>5min</strong> cho chỉ năm phút."
 Thời gian góc.: "Khoảng thời gian có thể được mô tả bằng cách sử dụng thời gian góc. V.d., <strong>1d2°3′4″</strong> cho một ngày, hai giờ, ba phút, bốn giây, hoặc <strong>5″</strong> cho chỉ năm giây."
 Tiếng Anh đơn giản.: "Khoảng thời gian có thể được mô tả bằng cách viết các đơn vị bằng tiếng Anh đơn giản. V.d., <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> cho một tuần, hai ngày, ba giờ, bốn phút, năm giây."
 Hạn chế.: "Ký hiệu có thể được trộn lẫn, nhưng các đơn vị phải luôn được mô tả từ lớn nhất đến nhỏ nhất, và không được lặp lại. V.d., <strong>1 week 2 days 3′4″</strong> là <span class="txtGn">hợp lệ</span> và sẽ được hiểu đúng, nhưng <strong>3′4″ 1 week 2 days</strong> và <strong>3 hours 3h 3°</strong> <span class="txtRd">không hợp lệ</span>. CIDRAM không quan tâm đến việc bạn có sử dụng khoảng cách hay không. Các số phải đơn giản và không có định dạng. Đơn vị được hỗ trợ lớn nhất là một tuần. Khi cấu hình được cập nhật, CIDRAM chuẩn hóa khoảng thời gian thành thời gian góc."
hints_has_bypass: "* Tùy chọn này có một đường tránh tương ứng dưới <code class="s">bypasses➡used</code>. Bạn nên đảm bảo rằng hộp kiểm cho đường tránh tương ứng được đánh dấu giống như hộp kiểm để cố gắng xác minh tùy chọn này."
hints_http_response_header_code:
 1.: "Khi "chế độ im lặng" có hiệu lực, thông báo trạng thái HTTP được xác định bởi <code class="s">general➡silent_mode_response_header_code</code> sẽ được sử dụng (thông báo này có mức độ ưu tiên cao nhất)."
 2.: "Khi thực thể yêu cầu bị cấm do vượt quá giới hạn vi phạm, thông báo trạng thái HTTP "bị cấm" sẽ được sử dụng."
 3.: "Khi bị chặn do giới hạn tốc độ, 429 sẽ được sử dụng, hoặc khi bị chặn do xung đột tài nguyên, thông báo trạng thái HTTP được xác định bởi <code class="s">signatures➡conflict_response</code> sẽ được sử dụng (giới hạn tốc độ và xung đột tài nguyên có mức độ ưu tiên ngang nhau trong bối cảnh này)."
 4.: "Khi bị chặn do quy tắc phụ trợ đặt "ghi đè mã trạng thái HTTP", ghi đè mã trạng thái HTTP đó sẽ được sử dụng."
 5.: "Khi bị chặn do nghĩa vụ pháp lý (tức là, khi bị chặn do chữ ký tùy chỉnh sử dụng từ viết tắt "pháp lý"), thông báo trạng thái HTTP cho "pháp lý" sẽ được sử dụng."
 6.: "Đối với tất cả các yêu cầu bị chặn khác, thông báo trạng thái HTTP cho "mặc định" sẽ được sử dụng (thông báo này có mức độ ưu tiên thấp nhất)."
hints_inspection: "* Chỉ dành cho việc gỡ lỗi các quy tắc phụ trợ. Không hiển thị cho người dùng bị chặn."
hints_ipv6_on_32bit: "Lưu ý: Tra cứu IPv6 có thể không hoạt động chính xác trên một số hệ thống 32 bit."
hints_logging_datetime: "Lời khuyên hữu ích: Bạn có thể đính kèm thông tin ngày/giờ vào tên của tập tin nhật ký bằng cách sử dụng phần giữ chỗ định dạng thời gian. Phần giữ chỗ định dạng thời gian có sẵn được hiển thị tại {{Links.ConfigRef.time_format}}."
hints_pdo_dsn:
 Câu hỏi thường gặp.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.vi.md\#user-content-HOW_TO_USE_PDO" hreflang="vi-VN">"PDO DSN" là gì? Làm cách nào tôi có thể sử dụng PDO với CIDRAM?</a></em>"
hints_sensitive_pages: "Lưu ý: Những gì cấu thành một "trang nhạy cảm" được xác định bởi {{Links.ConfigRef.sensitive}}."
hints_shorthand:
 0.: "Nếu trang web của bạn cần truy cập qua mạng LAN hoặc localhost, đừng chặn điều này. Nếu không cần, bạn có thể chặn điều này."
 1.: "Không có tập tin chữ ký mặc định nào sử dụng điều này, nhưng nó vẫn được hỗ trợ trong trường hợp nó có thể hữu ích cho một số người dùng."
 2.: "Nếu bạn cần người dùng có thể truy cập trang web của bạn thông qua proxy, đừng chặn điều này. Nếu không cần, bạn có thể chặn điều này."
 3.: "Sử dụng trực tiếp trong chữ ký không được hỗ trợ, nhưng nó có thể được sử dụng bằng các phương tiện khác trong các trường hợp cụ thể."
 4.: "Đề cập đến các trường hợp mà các từ viết tắt hoàn toàn không được sử dụng, hoặc không được nhận dạng bởi CIDRAM."
 Chỉ một cho mỗi chữ ký.: "Một chữ ký có thể gọi nhiều hồ sơ, nhưng chỉ có thể sử dụng một từ viết tắt. Có thể nhiều từ viết tắt có thể thích hợp, nhưng vì chỉ một có thể được sử dụng, chúng tôi luôn hướng tới việc chỉ sử dụng thích hợp nhất."
 Ưu tiên.: "Một tùy chọn được chọn luôn được ưu tiên hơn một tùy chọn không được chọn. Ví dụ, nếu nhiều từ viết tắt có hiệu lực nhưng chỉ một trong số chúng được đặt là bị chặn, yêu cầu sẽ vẫn bị chặn."
 Điểm cuối của con người và dịch vụ điện toán đám mây.: "Dịch vụ điện toán đám mây có thể đề cập đến các nhà cung cấp dịch vụ lưu trữ web, trang trại máy chủ, trung tâm dữ liệu, hoặc một số thứ khác. Điểm cuối của con người đề cập đến phương tiện mà con người truy cập internet, chẳng hạn như bằng cách của một nhà cung cấp dịch vụ internet. Một mạng thường chỉ cung cấp cái này hoặc cái kia, nhưng đôi khi có thể cung cấp cả hai. Chúng tôi mong muốn không bao giờ xác định các điểm cuối tiềm năng của con người là các dịch vụ điện toán đám mây. Do đó, một dịch vụ điện toán đám mây có thể được xác định là một thứ khác nếu phạm vi của nó được chia sẻ bởi các điểm cuối của con người đã biết. Tương tự như vậy, chúng tôi luôn hướng tới xác định các dịch vụ điện toán đám mây, có phạm vi không được chia sẻ bởi bất kỳ điểm cuối của con người nào đã biết, là dịch vụ điện toán đám mây. Do đó, một yêu cầu được xác định rõ ràng là một dịch vụ điện toán đám mây rất có lẽ không chia sẻ phạm vi của nó với bất kỳ điểm cuối của con người nào đã biết. Tương tự như vậy, một yêu cầu được xác định rõ ràng bởi các cuộc tấn công hoặc nguy cơ rác là có lẽ chia sẻ chúng. Tuy nhiên, internet luôn ở trạng thái thay đổi, mục đích của các mạng thay đổi theo thời gian, và các phạm vi luôn được mua hay bán, vì vậy hãy luôn nhận thức và cảnh giác có liên quan đến nguy cơ sai tích cực."
hints_time_format: |
 <strong><em>Phần giữ chỗ – Giải trình – Ví dụ dựa trên 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – Năm – Ví dụ, 2024.<br />
 <code class="s">{yy}</code> – Năm viết tắt – Ví dụ, 24.<br />
 <code class="s">{Mon}</code> – Tên viết tắt của tháng (bằng tiếng Anh) – Ví dụ, Apr.<br />
 <code class="s">{mm}</code> – Tháng với số 0 đứng đầu – Ví dụ, 04.<br />
 <code class="s">{m}</code> – Tháng – Ví dụ, 4.<br />
 <code class="s">{Day}</code> – Tên viết tắt của ngày (bằng tiếng Anh) – Ví dụ, Tue.<br />
 <code class="s">{dd}</code> – Ngày với số 0 đứng đầu – Ví dụ, 30.<br />
 <code class="s">{d}</code> – Ngày – Ví dụ, 30.<br />
 <code class="s">{hh}</code> – Giờ với số 0 đứng đầu (sử dụng thời gian 24 giờ) – Ví dụ, 18.<br />
 <code class="s">{h}</code> – Giờ (sử dụng thời gian 24 giờ) – Ví dụ, 18.<br />
 <code class="s">{ii}</code> – Phút với số 0 đứng đầu – Ví dụ, 27.<br />
 <code class="s">{i}</code> – Phút – Ví dụ, 27.<br />
 <code class="s">{ss}</code> – Giây với số 0 đứng đầu – Ví dụ, 49.<br />
 <code class="s">{s}</code> – Giây – Ví dụ, 49.<br />
 <code class="s">{tz}</code> – Múi giờ (không có dấu hai chấm) – Ví dụ, +0800.<br />
 <code class="s">{t:z}</code> – Múi giờ (có dấu hai chấm) – Ví dụ, +08:00.
hints_usemode:
 0: "Lưu ý: Các yêu cầu trong danh sách trắng hay đã xác minh và không bị chặn không cần phải hoàn thành CAPTCHA."
 1: "Cũng lưu ý: CAPTCHA có thể cung cấp một lớp bảo vệ bổ sung, hữu ích chống lại bot và các loại yêu cầu tự động độc hại khác nhau, nhưng sẽ không cung cấp bất kỳ biện pháp bảo vệ nào chống lại con người độc hại."
 2: "Yêu cầu có thể được "đánh dấu để sử dụng" thông qua các quy tắc phụ trợ."
 3: "Việc một yêu cầu có được coi là "nhạy cảm" hay không được xác định bởi {{Links.ConfigRef.sensitive}}."
 4: ""Giới hạn chữ ký" được xác định bởi {{Links.ConfigRef.signature_limit}}."
hints_verification:
 ""Tích cực" và "tiêu cực" là gì?": "Khi xác minh danh tính được trình bày bởi một yêu cầu, kết quả thành công có thể được mô tả là "tích cực" hoặc "tiêu cực". Trong trường hợp danh tính được trình bày được xác nhận là danh tính thực, danh tính đó sẽ được mô tả là "tích cực". Trong trường hợp danh tính được trình bày được xác nhận là giả mạo, danh tính đó sẽ được mô tả là "tiêu cực". Tuy nhiên, kết quả không thành công (v.d., xác minh không thành công, hoặc không thể xác định tính xác thực của danh tính được trình bày) sẽ không được mô tả là "tích cực" hoặc "tiêu cực". Thay vào đó, một kết quả không thành công sẽ được mô tả đơn giản là chưa được xác minh. Khi không có nỗ lực xác minh danh tính mà một yêu cầu đưa ra được thực hiện, thì yêu cầu đó cũng sẽ được mô tả là chưa được xác minh. Các điều khoản chỉ có ý nghĩa trong bối cảnh mà danh tính được trình bày bởi một yêu cầu được công nhận và do đó, khi có thể xác minh. Trong trường hợp danh tính được trình bày không khớp với các tùy chọn được cung cấp ở trên, hoặc khi không có danh tính nào được trình bày, các tùy chọn được cung cấp ở trên trở nên không liên quan."
 ""Đường tránh một cú đánh" là gì?": "Trong một số trường hợp, yêu cầu đã được xác minh tích cực vẫn có thể bị chặn do tập tin chữ ký, mô-đun, hoặc các điều kiện khác của yêu cầu, và đường tránh có thể cần thiết để tránh sai tích cực. Trong trường hợp sai tích cực gây ra chính xác một vi phạm, một đường tránh như vậy có thể được mô tả là "đường tránh một cú đánh"."
hints_want_to_block: "!! Hầu hết người dùng có thể sẽ muốn điều này bị chặn, bất kể đó là thật hay giả mạo. Điều đó có thể đạt được bằng cách không chọn "cố gắng xác minh" và chọn "chặn các yêu cầu chưa được xác minh". Tuy nhiên, vì một số người dùng có thể muốn xác minh các yêu cầu đó (để chặn các yêu cầu tiêu cực trong khi cho phép các yêu cầu tích cực), thay vì chặn các yêu cầu đó thông qua các mô-đun, các tùy chọn để xử lý các yêu cầu đó được cung cấp tại đây."
