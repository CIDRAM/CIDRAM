 bobuam_firefox: ""Firefox" ടോക്കണിന്റെ ഏറ്റവും കുറഞ്ഞ അനുവദനീയമായ പതിപ്പ്. ശുപാർശ ചെയ്യുന്നത്: {{BOBUAM Token.Firefox}}."
 bobuam_firefox_esr: "ESR പതിപ്പിനുള്ള "Firefox" ടോക്കണിന്റെ ഏറ്റവും കുറഞ്ഞ അനുവദനീയമായ പതിപ്പ്. ശുപാർശ ചെയ്യുന്നത്: {{BOBUAM Token.Firefox ESR}}."
