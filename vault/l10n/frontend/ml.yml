 logging_apache_style_log: "തടഞ്ഞ എല്ലാ ആക്‌സസ് ശ്രമങ്ങളും രേഖപ്പെടുത്തുന്നതിനുള്ള അപ്പാച്ചെ-ശൈലി ഫയൽ. ഒരു ഫയലിൻ്റെ പേര് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 logging_error_log: "കണ്ടെത്തിയ മാരകമല്ലാത്ത പിശകുകൾ രേഖപ്പെടുത്തുന്നതിനുള്ള ഒരു ഫയൽ. ഒരു ഫയലിൻ്റെ പേര് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 logging_log_banned_ips: "നിരോധിത IP-കളിൽ നിന്നുള്ള തടയപ്പെട്ട അഭ്യർത്ഥനകൾ ലോഗുകളിൽ ഉൾപ്പെടുത്തണോ? True = അതെ [സ്ഥിരസ്ഥിതി]; False = ഇല്ല."
 logging_log_rotation_action: "ലോഗ് റൊട്ടേഷൻ ഒരേ സമയം നിലനിൽക്കേണ്ട ലോഗ് ഫയലുകളുടെ എണ്ണം പരിമിതപ്പെടുത്തുന്നു. പുതിയ ലോഗ് ഫയലുകൾ സൃഷ്ടിക്കുമ്പോൾ, മൊത്തം ലോഗ് ഫയലുകളുടെ എണ്ണം നിർദ്ദിഷ്ട പരിധി കവിയുന്നുവെങ്കിൽ, നിർദ്ദിഷ്ട പ്രവർത്തനം നടപ്പിലാക്കും. നിങ്ങൾക്ക് ആവശ്യമുള്ള പ്രവർത്തനം ഇവിടെ വ്യക്തമാക്കാം."
 logging_log_rotation_limit: "ലോഗ് റൊട്ടേഷൻ ഒരേ സമയം നിലനിൽക്കേണ്ട ലോഗ് ഫയലുകളുടെ എണ്ണം പരിമിതപ്പെടുത്തുന്നു. പുതിയ ലോഗ് ഫയലുകൾ സൃഷ്ടിക്കുമ്പോൾ, മൊത്തം ലോഗ് ഫയലുകളുടെ എണ്ണം നിർദ്ദിഷ്ട പരിധി കവിയുന്നുവെങ്കിൽ, നിർദ്ദിഷ്ട പ്രവർത്തനം നടപ്പിലാക്കും. നിങ്ങൾക്ക് ആവശ്യമുള്ള പരിധി ഇവിടെ വ്യക്തമാക്കാം. 0 ന്റെ മൂല്യം ലോഗ് റൊട്ടേഷൻ പ്രവർത്തനരഹിതമാക്കും."
 logging_log_sanitisation: "ലോഗ് ഡാറ്റ കാണുന്നതിന് ഫ്രണ്ട്-എൻഡ് ലോഗുകൾ പേജ് ഉപയോഗിക്കുമ്പോൾ, XSS ആക്രമണങ്ങളിൽ നിന്നും ലോഗ് ഡാറ്റയിൽ അടങ്ങിയിരിക്കാവുന്ന മറ്റ് സാധ്യതയുള്ള ഭീഷണികളിൽ നിന്നും ഉപയോക്താക്കളെ സംരക്ഷിക്കുന്നതിന്, CIDRAM ലോഗ് ഡാറ്റ പ്രദർശിപ്പിക്കുന്നതിന് മുമ്പ് അത് അണുവിമുക്തമാക്കുന്നു. എന്നിരുന്നാലും, ലോഗ് എൻട്രികൾ എഴുതുമ്പോൾ ഡാറ്റ സാധാരണയായി അണുവിമുക്തമാക്കപ്പെടുന്നില്ല. ഭാവിയിൽ ആവശ്യമായി വന്നേക്കാവുന്ന ഏതെങ്കിലും ഹ്യൂറിസ്റ്റിക് അല്ലെങ്കിൽ ഫോറൻസിക് വിശകലനത്തെ സഹായിക്കുന്നതിന്, ലോഗ് ഡാറ്റ കൃത്യമായി സംരക്ഷിക്കപ്പെടുന്നുണ്ടെന്ന് ഉറപ്പാക്കാനാണ് ഇത്. എന്നിരുന്നാലും, ഒരു ഉപയോക്താവ് ബാഹ്യ ഉപകരണങ്ങൾ ഉപയോഗിച്ച് ലോഗ് ഡാറ്റ വായിക്കാൻ ശ്രമിച്ചാൽ, ആ ബാഹ്യ ഉപകരണങ്ങൾ സ്വന്തമായി അണുനാശിനി പ്രക്രിയ നടത്തുന്നില്ലെങ്കിൽ, ഉപയോക്താവ് XSS ആക്രമണങ്ങൾക്ക് വിധേയമാകാം. ആവശ്യമെങ്കിൽ, ഈ കോൺഫിഗറേഷൻ നിർദ്ദേശം ഉപയോഗിച്ച് നിങ്ങൾക്ക് സാധാരണ സ്വഭാവം മാറ്റാൻ കഴിയും. True = ലോഗ് എൻട്രികൾ എഴുതുമ്പോൾ ഡാറ്റ അണുവിമുക്തമാക്കുക (ഡാറ്റ കൃത്യമായി സൂക്ഷിക്കുന്നത് കുറവാണ്, പക്ഷേ XSS അപകടസാധ്യത കുറവാണ്). False = ലോഗ് എൻട്രികൾ എഴുതുമ്പോൾ ഡാറ്റ അണുവിമുക്തമാക്കരുത് (ഡാറ്റ കൂടുതൽ കൃത്യമായി സംരക്ഷിക്കപ്പെടുന്നു, പക്ഷേ XSS അപകടസാധ്യത കൂടുതലാണ്) [സ്ഥിരസ്ഥിതി]."
