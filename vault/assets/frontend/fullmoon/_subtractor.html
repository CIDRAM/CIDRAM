<div class="s">{state_msg}</div>
<table>
  <form action="?cidram-page=subtractor" method="POST">
    <tr>
      <td colspan="2" class="h3f">
        <div class="center"><span class="s">{label.Minuend} (A)<br /></span><textarea name="A" title="{label.Minuend} (A)">{Subtractor_A}</textarea></div>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="h3f">
        <div class="center"><span class="s">{label.Subtrahend} (B)<br /></span><textarea name="B" title="{label.Subtrahend} (B)">{Subtractor_B}</textarea></div>
      </td>
    </tr>
    <tr>
      <td class="h3">
        <div class="center">
          {OutputFormat}

      </td>
      <td class="h3f">
        <div class="center">
          <input type="submit" value="{field.OK} [0]" accesskey="0" />
        </div>
      </td>
    </tr><!-- Output Begin -->

        <div class="s clipMar"><span class="navicon clipboard" onclick="javascript:if(navigator.clipboard){navigator.clipboard.writeText(getElementById('rangeOutput').value);getElementById('rangeSvg_copied').className='sFade'}else{getElementById('rangeSvg_failed').style.className='sFade'}"></span><span id="rangeSvg_copied" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtGn">{response.Copied}</span></span><span id="rangeSvg_failed" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtRd">{response.Failed}</span></span></div>
      </td>
    </tr><!-- Output End -->
