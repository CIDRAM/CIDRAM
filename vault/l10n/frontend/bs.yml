 legal_privacy_policy: "Adresa relevantne politike privatnosti koja će se prikazati u podnožju svake generisane stranice. Navedite URL, ili ostavite prazno da biste onemogućili."
 legal_pseudonymise_ip_addresses: "Pseudonimizirati IP adrese prilikom prijavljivanja? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 logging: "Konfiguracija koja se odnosi na evidentiranje (isključujući onu koja se odnosi na druge kategorije)."
 logging_apache_style_log: "Datoteka u stilu Apache za evidentiranje svih blokiranih pokušaja pristupa. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_error_log: "Datoteka za evidentiranje svih otkrivenih grešaka koje nisu fatalne. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_log_banned_ips: "Uključiti blokirane zahtjeve sa zabranjenih IP adresa u dnevnike? True/Istinito = Da [Zadano]; False/Lažno = Ne."
 logging_log_rotation_action: "Rotacija dnevnika ograničava broj datoteka dnevnika koji bi trebali postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke evidencije, ako ukupan broj datoteka dnevnika premašuje navedeno ograničenje, navedena radnja će se izvršiti. Ovdje možete odrediti željenu akciju."
 logging_log_rotation_limit: "Rotacija dnevnika ograničava broj datoteka dnevnika koji bi trebali postojati u bilo kojem trenutku. Kada se kreiraju nove datoteke evidencije, ako ukupan broj datoteka dnevnika premašuje navedeno ograničenje, navedena radnja će se izvršiti. Ovdje možete odrediti željeni limit. Vrijednost 0 će onemogućiti rotaciju dnevnika."
 logging_log_sanitisation: "Kada koristite front-end stranicu dnevnika za pregled podataka dnevnika, CIDRAM sanitira podatke dnevnika prije nego što ih prikaže, kako bi zaštitio korisnike od XSS napada i drugih potencijalnih prijetnji koje podaci dnevnika mogu sadržavati. Međutim, prema zadanim postavkama, podaci se ne sanitiraju tokom evidentiranja. Ovo je kako bi se osiguralo da se podaci dnevnika čuvaju točno, kako bi se pomogla svaka heuristička ili forenzička analiza koja bi mogla biti neophodna u budućnosti. Međutim, u slučaju da korisnik pokuša pročitati podatke dnevnika koristeći vanjske alate, i ako ti vanjski alati ne izvrše vlastiti proces sanitiranje, korisnik bi mogao biti izložen XSS napadima. Ako je potrebno, možete promijeniti zadano ponašanje koristeći ovu konfiguracijsku direktivu. True/Istinito = Sanitirajte podatke prilikom evidentiranja (podaci se čuvaju manje precizno, ali XSS rizik je manji). False/Lažno = Nemojte sanitirati podatke prilikom evidentiranja (podaci se čuvaju preciznije, ali XSS rizik je veći) [Zadano]."
 logging_outbound_request_log: "Datoteka za evidentiranje rezultata svih odlaznih zahtjeva. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_report_log: "Datoteka za evidentiranje svih izvještaja poslatih vanjskim API-jima. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_serialised_log: "Serijski datoteka za evidentiranje svih blokiranih pokušaja pristupa. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_standard_log: "Ljudski čitljiv datoteka za evidentiranje svih blokiranih pokušaja pristupa. Navedite naziv datoteke, ili ostavite prazno za onemogućavanje."
 logging_truncate: "Skratiti datoteke dnevnika kada dostignu određenu veličinu? Vrijednost je maksimalna veličina u B/KB/MB/GB/TB do koje datoteka evidencije može narasti prije nego što bude skraćena. Zadana vrijednost od 0KB onemogućuje skraćivanje (datoteke evidencije mogu beskonačno rasti). Bilješka: Odnosi se na pojedinačne log datoteke! Veličina log datoteka se ne razmatra zajedno."
 phpmailer: "Konfiguracija za PHPMailer (koristi se za dvofaktorsku autentifikaciju i za obavještenja putem e-pošte)."
