Abuse category:
 Bad web bot: "खराब वेब बॉट (ईमेल पत्ते आणि सामग्रीसाठी स्क्रॅपिंग, robots.txt न वापरणारे क्रॉलर्स, जास्त संख्येने विनंत्या, वापरकर्ता एजंट स्पूफिंग, इ)."
 Brute-force attacks: "ब्रूट-फोर्स हल्ले (वेबपेज लॉगिन, SMTP, RDP, इत्यादींवर क्रेडेन्शियल ब्रूट-फोर्स हल्ले)."
 Categories (at least one is required): "श्रेणी (किमान एक आवश्यक आहे)"
 CMS blog comment spam: "CMS ब्लॉग टिप्पणी स्पॅम."
 Conjunctive category: "संयोजक श्रेणी (इतर, अधिक विशिष्ट श्रेणींसह संयोजनात वापरा)."
 DDoS attacks: "DDoS हल्ले (सहसा बॉटनेटचा भाग)."
 DNS compromise: "DNS तडजोड (DNS रेकॉर्डमध्ये बदल केल्याने अयोग्य पुनर्निर्देशन होते)."
 DNS poisoning: "DNS विषबाधा."
 Email sender spoofing: "ईमेल पाठवणाऱ्याची फसवणूक."
 Email spam: "ईमेल स्पॅम (स्पॅम ईमेल सामग्री, संक्रमित संलग्नके, फिशिंग ईमेल, इ)."
 Exploited host: "शोषित होस्ट (होस्ट कदाचित मालवेअरने संक्रमित आहे आणि इतर हल्ल्यांसाठी किंवा दुर्भावनापूर्ण सामग्री होस्ट करण्यासाठी वापरला जात आहे)."
 FTP brute-force attacks: "FTP ब्रूट-फोर्स हल्ले."
 Fraudulent VoIP: "बनावट VoIP."
 Fraudulent orders: "बनावट ऑर्डर."
 Hacking: "हॅकिंग."
 IoT targeted: "IoT लक्ष्यित गैरवापर. टिप्पण्यांमध्ये कोणत्या प्रकारच्या डिव्हाइसला लक्ष्य केले गेले याबद्दल माहिती समाविष्ट करा."
 Open proxy, open relay, or tor endpoint: "प्रॉक्सी उघडा, रिले उघडा, किंवा टॉर एंडपॉइंट उघडा."
 Phishing: "फिशिंग वेबसाइट्स आणि/किंवा ईमेल."
 Ping of death: "मृत्यूचा पिंग (मोठ्या आकाराचे IP पॅकेट)."
 Port scans: "पोर्ट स्कॅन (खुल्या बंदरांसाठी आणि असुरक्षित सेवांसाठी स्कॅनिंग)."
 SQL injection: "एसक्यूएल"
 SSH abuse: "SSH चा गैरवापर."
 VPN IP: "VPN IP."
 Web spam: "वेब स्पॅम (टिप्पणी/फोरम स्पॅम, HTTP रेफरर स्पॅम, किंवा इतर CMS स्पॅम)."
 Webapp attacks: "वेबअॅप हल्ले (स्थापित वेबअ‍ॅप्स किंवा CMS, उदाहरणार्थ, वर्डप्रेस, ड्रुपल, phpMyAdmin, इ, किंवा ई-कॉमर्स सोल्यूशन्ससाठी भेद्यता शोधण्याचा आणि त्यांचा फायदा घेण्याचा प्रयत्न करा)."
Extended Description:
 AbuseIPDB module: "AbuseIPDB वर सूचीबद्ध केलेल्या IP पत्त्यांवरून येणाऱ्या विनंत्या ब्लॉक करते."
 BGPView module: "CIDRAM साठी ASN आणि देश कोड लुकअप सुविधा प्रदान करण्यासाठी {{Links.BGPView}} API चा वापर करते, ज्यामुळे ASN आणि देशांना CIDRAM कॉन्फिगरेशनद्वारे ब्लॉक किंवा व्हाइटलिस्ट केले जाऊ शकते आणि फेसबुक विनंत्या सत्यापित करण्यासाठी सोशल नेटवर्किंग पडताळणीसाठी एक साधन प्रदान केले जाते (जर तुम्ही हे मॉड्यूल वापरत असाल, तर तुम्हाला IP-API मॉड्यूल वापरण्याची आवश्यकता नाही, कारण ते समान उद्देशाने काम करतात)."
 Bad TLDs blocker module: "स्पॅमर्स, हॅकर्स, आणि इतर वाईट घटकांद्वारे वारंवार वापरल्या जाणाऱ्या TLD शी संबंधित होस्ट ब्लॉक करते."
 Bad hosts blocker module: "स्पॅमर्स, हॅकर्स, आणि इतर वाईट घटकांद्वारे वारंवार वापरले जाणारे होस्ट ब्लॉक करते."
 Bot user agents module: "अवांछित बॉट्स आणि वाईट क्रियाकलापांशी संबंधित वापरकर्ता एजंटना ब्लॉक करते."
 Bypasses: "डीफॉल्ट स्वाक्षरी बायपास फायली सहसा मुख्य पॅकेजमध्ये समाविष्ट असतात."
 Chart.js: "डोनट चार्ट जनरेट करण्यासाठी फ्रंट-एंड सक्षम करते.<br />{{Links.Chart.js}} हे {{Links.MIT}} परवान्याद्वारे उपलब्ध आहे."
 Cookie scanner module: "धोकादायक कुकीजपासून काही मर्यादित संरक्षण प्रदान करते."
 HTTP version checker module: "CIDRAM कॉन्फिगरेशनद्वारे विशिष्ट प्रोटोकॉल आणि HTTP आवृत्त्या ब्लॉक करणे शक्य करते."
 IP-API module: "CIDRAM साठी ASN आणि देश कोड लुकअप सुविधा प्रदान करण्यासाठी {{Links.IP-API}} API चा वापर करते, ज्यामुळे ASN आणि देशांना CIDRAM कॉन्फिगरेशनद्वारे ब्लॉक किंवा व्हाइटलिस्ट केले जाऊ शकते आणि फेसबुक विनंत्या सत्यापित करण्यासाठी सोशल नेटवर्किंग पडताळणीसाठी एक साधन प्रदान केले जाते (जर तुम्ही हे मॉड्यूल वापरत असाल, तर तुम्हाला BGPView मॉड्यूल वापरण्याची आवश्यकता नाही, कारण ते समान उद्देशाने काम करतात)."
 IPv4: &ExtDesCloud "अवांछित क्लाउड सेवा आणि गैर-मानवी एंडपॉइंट्स ब्लॉक करते."
 IPv4-Bogons: &ExtDesBogons "बोगन/मार्टियन CIDR ब्लॉक करते."
 IPv4-ISPs: &ExtDesISPs "धोकादायक आणि स्पॅमी ISP ब्लॉक करते (मल्टीप्ले नेटवर्क्स समाविष्ट आहेत, ज्यामध्ये मानवी आणि गैर-मानवी एंडपॉइंट्स दोन्ही असू शकतात)."
 IPv4-Nonblocking: &ExtDesNonblocking "प्रोफाइलिंगसाठी उपयुक्त, परंतु स्वतःहून काहीही ब्लॉक करत नाही."
 IPv4-Other: &ExtDesOther "प्रॉक्सी, VPN, आणि इतर विविध अवांछित सेवांसाठी CIDR ब्लॉक करते."
 IPv6: *ExtDesCloud
 IPv6-Bogons: *ExtDesBogons
 IPv6-ISPs: *ExtDesISPs
 IPv6-Nonblocking: *ExtDesNonblocking
 IPv6-Other: *ExtDesOther
 Optional security extras module: "रिक्वेस्टमध्ये वापरल्या जाणाऱ्या विविध अटॅक व्हेक्टरविरुद्ध काही मर्यादित संरक्षण प्रदान करते."
 PHPMailer: "ईमेल पाठवणे समाविष्ट असलेल्या कोणत्याही कार्यक्षमतेचा वापर करण्यासाठी आवश्यक.<br />{{Links.PHPMailer.PHPMailer}} हे {{Links.PHPMailer.License}} परवान्याद्वारे उपलब्ध आहे."
 Project Honeypot module: "प्रोजेक्ट हनीपॉटवर सूचीबद्ध केलेल्या IP अ‍ॅड्रेसवरून येणाऱ्या विनंत्या ब्लॉक करते."
 Protocol blocker module: "कॉन्फिगरेशनद्वारे विशिष्ट विनंती प्रोटोकॉल (उदाहरणार्थ, HTTP/0.9, HTTP/1.1, SPDY/3.0, इ) ब्लॉक करण्याची क्षमता प्रदान करते. टीप: क्लाउडफ्लेअर सारख्या सेवांमधून (ज्या सर्वांसाठी विनंत्या पुनर्लेखन करतात आणि त्याच प्रोटोकॉलचा वापर करतात) जाणाऱ्या वेबसाइटवर याचा कोणताही परिणाम होणार नाही."
 Referrer spam module: "रेफरर स्पॅमवर आधारित ब्लॉक केल्याने सहसा कोणताही अर्थपूर्ण सुरक्षा लाभ मिळत नाही, परंतु काही प्रकरणांमध्ये, काही वापरकर्त्यांसाठी, विनंत्यांबद्दल अधिक माहिती गोळा करण्यासाठी आणि ती तक्रार करण्यास सक्षम होण्यासाठी उपयुक्त ठरू शकते."
 Stop Forum Spam module: "SFS द्वारे सूचीबद्ध केलेल्या IP पत्त्यांपासून नोंदणी आणि लॉगिन पृष्ठांचे संरक्षण करते."
 Tor blocker module: "DNSEL लुकअपद्वारे टोर एक्झिट नोड्समधून प्रवेश प्रतिबंधित करते (IPv4 आणि IPv6 दोन्हींना समर्थन देते)."
