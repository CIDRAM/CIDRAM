 general_emailaddr: "Hvis du vil, du kan levere en e-postadresse her for å bli gitt til brukerne når de er blokkert, for dem å bruke som et kontaktpunkt for støtte og/eller assistanse i tilfelle de blir blokkert feilaktig eller i feil. ADVARSEL: Uansett hvilken e-postadresse du leverer her, det vil helt sikkert bli ervervet av spamboter og skraper i løpet av bruken her, og så, det anbefales sterkt at hvis du velger å levere en e-postadresse her, at du sørger for at e-postadressen du oppgir her er en engangsadresse og/eller en adresse som du ikke bryr deg om å bli spammet (dvs., du vil sannsynligvis ikke bruke dine primære personlige eller primære virksomhets e-postadresser)."
 general_emailaddr_display_style: "Hvordan foretrekker du e-postadressen som skal presenteres for brukerne?"
 general_fields: "Kontroller for feltene under blokkeringshendelser (når en forespørsel er blokkert)."
 general_force_hostname_lookup: "Håndheve vertsnavn-oppslag? True = Ja; False = Nei [Standardverdi]. Vertsnavn-oppslag utføres normalt på en «etter behov» basis, men kan håndheves for alle forespørsler. Å gjøre det kan være nyttig som et middel til å gi mer detaljert informasjon i loggfilene, men kan også ha en litt negativ effekt på ytelsen."
 general_http_response_header_code: "Hvilken HTTP-statusmelding skal CIDRAM sende når blokkerer forespørsler?"
 general_ipaddr: "Hvor finner jeg IP-adressen til å koble til forespørsler? (Nyttig for tjenester som Cloudflare). Standardverdi = REMOTE_ADDR. ADVARSEL: Ikke endre dette med mindre du vet hva du gjør!"
 general_lang: "Angi standardspråket for CIDRAM."
 general_lang_override: "Lokaliser i henhold til HTTP_ACCEPT_LANGUAGE når det er mulig? True = Ja [Standardverdi]; False = Nei."
 general_numbers: "Hvordan foretrekker du at tall vises? Velg eksempelet som passer best for deg."
 general_request_proxy: "Hvis du vil at utgående forespørsler skal sendes via en proxy, spesifiser proxyen her. Hvis ikke, la dette stå tomt."
 general_request_proxyauth: "Hvis du sender utgående forespørsler via en proxy, og proxyen krever brukernavn og passord, spesifiser brukernavn og passord her (f.eks., <code>user:pass</code>). Hvis ikke, la dette stå tomt."
 general_sensitive: "En liste over stier å betrakte som sensitive sider. Hver sti som er oppført vil bli sjekket mot den rekonstruerte URIen når det er nødvendig. En sti som begynner med en skråstrek vil bli behandlet som en bokstavelig, og matchet fra stikomponenten i forespørselen og fremover. Ellers vil en sti som begynner med et ikke-alfanumerisk tegn, og slutter med det samme tegnet (eller det samme tegnet pluss et valgfritt «i»-flagg) behandles som et regulært uttrykk. Enhver annen type sti vil bli behandlet som en bokstavelig, og kan matche fra hvilken som helst del av URI. Hvorvidt en sti anses som en sensitiv side kan påvirke hvordan enkelte moduler oppfører seg, men har ingen effekt ellers."
 general_silent_mode: "Bør CIDRAM stille omdirigere blokkerte tilgangsforsøk i stedet for å vise «tilgang nektet» siden? Hvis ja, spesifiser stedet for å omdirigere blokkerte tilgangsforsøk til. Hvis nei, la denne variablen være tom."
 general_silent_mode_response_header_code: "Hvilken HTTP-statusmelding skal CIDRAM sende under stille omdirigering av forsøk på blokkert tilgang?"
 general_stages: "Kontroller for stadiene i utførelseskjeden (om aktivert, om feil logges, osv)."
 general_statistics: "Kontrollerer hvilken statistisk informasjon som skal spores."
 general_statistics_captchas: "Kontrollerer hvilken statistisk informasjon som skal spores for CAPTCHA-er."
 general_time_format: "Dato/tid notasjonsformat som brukes av CIDRAM. Ytterligere alternativer kan legges på forespørsel."
 general_time_offset: "Tidssone forskjøvet i minutter."
 general_timezone: "Dette brukes til å spesifisere tidssonen som skal brukes (f.eks., Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, osv). Spesifiser «SYSTEM» for å la PHP håndtere dette for deg automatisk."
