tip:
 2FA Sent: "Порука е-поште која садржи двофакторни код за аутентификацију је послата на вашу адресу е-поште. Потврдите овај код у наставку да бисте добили приступ фронт-енду. Ако нисте примили ову е-пошту, покушајте да се одјавите, сачекајте 10 минута, и поново се пријавите да бисте добили нову е-пошту која садржи нови код."
 Accounts: "Страница рачуна вам омогућава да контролишете ко може да приступи ЦИДРАМ фронт-енду."
 Actions menu: "Блокирање додаје 1 броју потписа. Заобилажење одузима 1 од броја потписа. Бела листа поставља број потписа на 0 и прекида обраду, чиме се у потпуности прескачу сва наредна правила. Сива листа поставља број потписа на 0, али не прекида обраду. Профилисање не утиче на број потписа, али је корисно када је потребна сложенија логика да би се утврдило да ли треба извршити друге врсте радњи, јер генерисани профили могу бити повезани са условима наредних правила. Након обраде, ако је број потписа 1 или већи, захтев ће бити блокиран."
 Aggregator: "Агрегатор вам омогућава да изразите ИП адресе, ЦИДР-ове, и мрежне маске на најмањи могући начин. Унесите податке које желите да агрегирани и притисните „ОК“."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Прихваћена вредност је било који CIDR са опсегом који покрива ИП адресу захтева. Нпр., 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, итд би биле прихваћене за 1.2.3.4. Да би се избегли лажно позитивни, ужи опсези (нпр., 1.2.3.4/32) су генерално пожељнији од ширих опсега (нпр., 0.0.0.0/1). Страница калкулатора може се користити да би се пронашло који CIDR-ови имају опсеге који покривају одређену ИП адресу."
 Auxiliary Rules Modes: "Режим прегледа приказује помоћна правила као компактну листу ради лакшег читања. Правила на листи се могу проширити и приказати додатни детаљи кликом на њих. Опције за извоз или брисање правила биће приказане када кликнете на триграм (☰). Правила се могу променити помоћу функције превуци и испусти, превлачењем правила са његове постојеће позиције на жељену позицију. За измену помоћних правила потребан је режим уређивања, поља која се могу уређивати и опције за додавање нових услова, вебхукова, или друге логике правилима по потреби на страници. Нова помоћна правила могу се креирати путем било ког од ових режима."
 Auxiliary Rules Priority: "Приоритет (највиши➡(једнаки🔄еквивалентан)➡најниже):"
 Auxiliary Rules Webhooks: "Када се правило покрене, ЦИДРАМ ће покушати да обавести све повезане вебхукове о догађају. Вебхук је URL адреса способна за примање POST података, и може бити корисна ако постоји екстерна услуга, апликација, скрипта итд хостована на потпуно другој мрежи од ЦИДРАМ-а, за коју желите да обрађује податке које је ЦИДРАМ генерисао о захтеву."
 Auxiliary Rules: "Ову страницу можете користити за креирање, брисање, и измену помоћних правила за ЦИДРАМ."
 Backup: "Ова страница се може користити за увоз/извоз ваше конфигурације, помоћних правила, итд. Ово може бити корисно ако треба да мигрирате податке на различите инсталације или различите главне верзије."
 Cache Data: "Овде можете прегледати садржај кеша."
 Calculator: "Калкулатор вам омогућава да израчунате ЦИДР-ове и мрежне маске ИП адресе."
 Click the component name for more details: "Кликните на назив компоненте за више детаља."
 Configuration: "Конфигурациона страница вам омогућава да измените конфигурацију за ЦИДРАМ са фронт-енда."
 Enter IP address here: "Овде унесите ИП адресу."
 Enter IP address here (optional): "Овде унесите ИП адресу (опционо)."
 Enter IP addresses here: "Овде унесите ИП адресе."
 Enter input here: "Овде унесите унос."
 Enter queries here: "Овде унесите упите."
 Enter query here (optional): "Овде унесите упит (опционо)."
 Enter referrer here (optional): "Овде унесите упућивача (опционо)."
 Enter user agent here (optional): "Овде унесите корисничког агента (опционо)."
 Enter user agents here: "Овде унесите корисничке агенте."
 File Manager: "Менаџер датотека вам омогућава да обришете, уређујете, отпремате, и преузимате датотеке. Користите опрезно (овим можете покварити инсталацију)."
 Glossary: "Глосар описује неке од термина које користи ЦИДРАМ, како би се разјаснило намеравано значење у контексту где се користи."
 Greeting: "Здраво, %s."
 Home: "Ово је почетна страница за ЦИДРАМ фронт-енд. Изаберите везу из навигационог менија са леве стране да бисте наставили."
 How many infractions to incur: "Колико прекршаја треба направити."
 IP Testing: "Страница за тестирање ИП-а вам омогућава да тестирате да ли су ИП адресе блокиране тренутно инсталираним потписима."
 IP Tracking: "Страница за праћење ИП адреса вам омогућава да проверите статус праћења ИП адреса, да проверите које су од њих забрањене, и ако је потребно, да уклоните забране или статус праћења."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Ако захтев долази са IPv6 адресе која припада опсегу који користи IPv6 транзициони механизам (нпр., 6to4, Тередо, ИСАТАП, итд), поље „ИП адреса (решена)“ биће попуњено IPv4 адресом у коју се та IPv6 адреса преводи у оквиру тог IPv6 транзиционог механизма (нпр., ако „ИП адреса“ је „2002:c0a8:1::“, „ИП адреса (решена)“ ће бити „192.168.0.1“). У свим осталим случајевима, поља „ИП адреса (решена)“ и „ИП адреса“ ће бити иста."
 Intersector: "Интерсектор се може користити за одређивање заједничких фактора из два скупа опсега."
 Logs: "Изаберите датотеку евиденције са листе испод да бисте видели садржај те датотеке евиденције."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Имајте на уму да ће тачна вредност ове статистике бити иста као она приказана на страници са статистиком у тренутку обраде правила."
 Number of seconds until it expires: "Број секунди до истека."
 Numeric comparison: "Да бисте користили нумеричко поређење, изаберите директно поређење низова или аутоматско откривање метода, уверите се да је вредност услова нумеричка, и дајте му префикс жељеним оператором.<br />Нпр., за услове „једнако“, &gt;=2 даје ≥2, &lt;=2 даје ≤2, за услове „није једнако“, &gt;=2 даје ≱2, &lt;=2 даје ≰2, итд."
 Range Tables: "Ова страница приказује неке основне статистичке информације о распонима ИП адреса које покривају тренутно активне датотеке потписа."
 Rate Limiting: "Ова страница приказује тренутну употребу квоте и доступност у погледу ограничења брзине."
 Rate limiting is currently disabled: "Белешка: Ограничење брзине је тренутно онемогућено, али се може омогућити преко конфигурационе странице."
 Report to AbuseIPDB: "Ова страница се може користити за пријављивање ИП адреса АбусеИПДБ-у, или за брисање претходних извештаја у случају да је ИП адреса пријављена грешком."
 Sections List: "Ова страница наводи који одељци постоје у тренутно активним датотекама потписа."
 See the documentation: "Погледајте <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>документацију</a> за информације о различитим конфигурационим директивама и њиховој сврси."
 Server log snippets, abuse details, etc: "Исјечци евиденције сервера, детаљи о злоупотреби, итд."
 Signature File Fixer: "Поправљач датотека потписа пружа начин за откривање и решавање потенцијалних проблема у датотекама потписа."
 Specify a URL, or leave blank to disregard: "Наведите URL, или оставите празно да бисте га игнорисали."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Наведите путању директоријума, или оставите празно да бисте користили основну ЦИДРАМ путању."
 Specify a value, or leave blank to disregard: "Наведите вредност, или оставите празно да бисте га игнорисали."
 Statistics tracking is currently disabled: "Белешка: Праћење статистике је тренутно онемогућено, али се може омогућити преко конфигурационе странице."
 Statistics: "Ова страница приказује неке основне статистике употребе у вези са вашом инсталацијом ЦИДРАМ-а."
 Subtractor: "Субтрацтор се може користити за одузимање једног опсега ИП-ова/ЦИДР-ова/мрежних маски од другог."
 Updates: "Страница за ажурирање вам омогућава да инсталирате, деинсталирате, и ажурирате различите компоненте ЦИДРАМ-а (основни пакет, потписе, Л10Н, датотеке, итд)."
 When available, the value of the country code lookup: "Када је доступно, вредност претраге кода земље је двоцифрени {{Links.ISO.3166}} код земље. Нпр., US за Сједињене Државе, RU за Русију, CN за Кину, итд."
