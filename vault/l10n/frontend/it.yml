hints_aux_stats: "Nota: È possibile controllare se tenere traccia delle statistiche per le regole ausiliarie dalla pagina delle regole ausiliarie."
hints_cause_fp: "*!! Alta probabilità di causare falsi positivi a causa di %s."
hints_cclookup: "** Richiede la funzionalità di ricerca del codice paese (ad es., tramite il modulo IP-API o BGPView)."
hints_client_hints: "!! Questo è un suggerimento client a bassa entropia. I suggerimenti client sono una nuova tecnologia Web sperimentale che non è ancora ampiamente supportata in tutti i browser e nei principali client. <em>Guarda anche: {{Links.MDN.Client hints}}.</em> Sebbene i suggerimenti client possano essere utili per il rilevamento delle impronte digitali, poiché non sono ampiamente supportati, la loro presenza nelle richieste non deve essere presupposta né considerata attendibile (cioè, bloccare in base alla loro assenza è una cattiva idea)."
hints_client_honour: "Indipendentemente da come istruiamo il cliente, è importante ricordare che alla fine non abbiamo alcun controllo su ciò che il cliente sceglie di fare, e non c'è alcuna garanzia che il cliente rispetti le nostre istruzioni."
hints_default_dns:
 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.it.md\#cosa-posso-usare-per-default_dns" hreflang="it-IT">Cosa posso usare per "default_dns"?</a></em>"
hints_duration:
 SI.: "La durata può essere descritta utilizzando il "Sistema internazionale di unità". Ad esempio, <strong>1d2h3min4s</strong> o <strong>1d 2h 3min 4s</strong> per un giorno, due ore, tre minuti, quattro secondi, o <strong>5min</strong> per soli cinque minuti."
 Tempo d'arco.: "La durata può essere descritta usando la notazione tempo d'arco. Ad esempio, <strong>1d2°3′4″</strong> per un giorno, due ore, tre minuti, quattro secondi, o <strong>5″</strong> per soli cinque secondi."
 Inglese semplice.: "La durata può essere descritta scrivendo le unità in un inglese semplice. Ad esempio, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> per una settimana, due giorni, tre ore, quattro minuti, cinque secondi."
 Costrizione.: "La notazione può essere mista, ma le unità devono sempre essere descritte dal più grande al più piccolo, e non possono essere ripetute. Ad esempio, <strong>1 week 2 days 3′4″</strong> è <span class="txtGn">valido</span> e sarà compreso correttamente, ma <strong>3′4″ 1 week 2 days</strong> e <strong>3 hours 3h 3°</strong> <span class="txtRd">non sono validi</span>. A CIDRAM non importa se usi la spaziatura. I numeri devono essere semplici e non formattati. Per praticità, l'unità più grande supportata è una settimana. Quando la configurazione viene aggiornato, CIDRAM normalizza le durate in tempo d'arco."
hints_has_bypass: "* Questa opzione ha un bypass corrispondente sotto <code class="s">bypasses➡used</code>. Si consiglia di assicurarsi che la casella di controllo per il bypass corrispondente sia contrassegnato allo stesso modo della casella di controllo per tentare di verificare questa opzione."
hints_http_response_header_code:
 1.: "Quando è attiva la "modalità silenziosa", verrà utilizzato il messaggio di stato HTTP definito da <code class="s">general➡silent_mode_response_header_code</code> (questo ha la precedenza più alta)."
 2.: "Se l'entità richiedente è stata vietata a causa del superamento del limite di infrazione, verrà utilizzato il messaggio di stato HTTP per "vietato"."
 3.: "Se bloccato a causa della limitazione della velocità, verrà utilizzato 429 oppure, in caso di blocco a causa di conflitti di risorse, verrà utilizzato il messaggio di stato HTTP definito da <code class="s">signatures➡conflict_response</code> (in questo contesto, la limitazione della velocità e i conflitti di risorse hanno pari precedenza)."
 4.: "Se bloccato a causa di una regola ausiliaria che imposta un "sostituzione del codice di stato HTTP", verrà utilizzato tale sostituzione del codice di stato HTTP."
 5.: "Se bloccato per motivi legali (ad esempio, se bloccato a causa di una firma personalizzata che utilizza la parola abbreviata "legale"), verrà utilizzato il messaggio di stato HTTP per "legale"."
 6.: "Per tutte le altre richieste bloccate, verrà utilizzato il messaggio di stato HTTP per "default" (questo ha la precedenza più bassa)."
hints_inspection: "* Destinato solo al debug delle regole ausiliarie. Non mostrato agli utenti bloccati."
hints_ipv6_on_32bit: "Nota: Le ricerche IPv6 potrebbero non funzionare correttamente su alcuni sistemi a 32 bit."
hints_logging_datetime: "Consiglio utile: È possibile allegare informazioni su data/ora ai nomi dei file di registro utilizzando i segnaposto del formato ora. I segnaposto del formato ora disponibili vengono visualizzati in {{Links.ConfigRef.time_format}}."
