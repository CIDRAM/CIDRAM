 general_statistics_captchas: "CAPTCHA-കൾക്കായി ട്രാക്ക് ചെയ്യേണ്ട സ്റ്റാറ്റിസ്റ്റിക്കൽ വിവരങ്ങൾ നിയന്ത്രിക്കുന്നു."
 general_time_format: "CIDRAM ഉപയോഗിക്കുന്ന തീയതി/സമയ നൊട്ടേഷൻ ഫോർമാറ്റ്. അഭ്യർത്ഥന പ്രകാരം കൂടുതൽ ഓപ്ഷനുകൾ ചേർക്കാവുന്നതാണ്."
 general_time_offset: "മിനിറ്റുകൾക്കുള്ളിൽ സമയമേഖല ഓഫ്‌സെറ്റ്."
 general_timezone: "ഏത് സമയമേഖലയാണ് ഉപയോഗിക്കേണ്ടത് (ഉദാഹരണത്തിന്, Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, തുടങ്ങിയവ). ഇത് നിങ്ങൾക്കായി യാന്ത്രികമായി കൈകാര്യം ചെയ്യാൻ PHP-യെ അനുവദിക്കുന്നതിന് "SYSTEM" വ്യക്തമാക്കുക."
