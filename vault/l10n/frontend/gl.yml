hints_asnlookup: "** Require a funcionalidade de busca de ASN (por exemplo, a través do módulo IP-API ou BGPView)."
hints_aux_stats: "Nota: Pódese controlar se se deben realizar un seguimento das estatísticas das regras auxiliares desde a páxina de regras auxiliares."
hints_cause_fp: "*!! Alta probabilidade de provocar falsos positivos debido a %s."
hints_cclookup: "** Require a funcionalidade de busca de códigos do país (por exemplo, a través do módulo IP-API ou BGPView)."
hints_client_hints: "!! Esta é unha suxestión de cliente de baixa entropía. As suxestións de clientes son unha tecnoloxía web nova e experimental que aínda non é amplamente compatibles en todos os navegadores e clientes principais. <em>Ver: {{Links.MDN.Client hints}}.</em> Aínda que as suxestións do cliente poden ser útiles para a toma de pegadas dixitais, xa que non son amplamente compatibles, non se debe asumir nin confiar na súa presenza nas solicitudes (é dicir, o bloqueo en función da súa ausencia é unha mala idea)."
hints_client_honour: "Non importa como instruímos ao cliente, é importante lembrar que, en última instancia, non temos control sobre o que elixe facer o cliente e non hai ningunha garantía de que o cliente cumpra as nosas instrucións."
hints_default_dns:
 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">Que podo usar para "default_dns"?</a></em>"
hints_duration:
 SI.: "A duración pódese describir mediante o "Sistema Internacional de Unidades". Por exemplo, <strong>1d2h3min4s</strong> ou <strong>1d 2h 3min 4s</strong> para significar un día, dúas horas, tres minutos, catro segundos, ou <strong>5min</strong> para significar só cinco minutos."
 Tempo de arco.: "A duración pódese describir usando a notación de tempo de arco. Por exemplo, <strong>1d2°3′4″</strong> para significar un día, dúas horas, tres minutos, catro segundos, ou <strong>5″</strong> para significar só 5 segundos."
 Inglés sinxelo.: "A duración pódese describir escribindo as unidades en inglés sinxelo. Por exemplo, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> para significar unha semana, dous días, tres horas, catro minutos, cinco segundos."
 Restricións.: "A notación pódese mesturar, pero as unidades sempre deben describirse de maior a menor, e non se poden repetir. Por exemplo, <strong>1 week 2 days 3′4″</strong> é <span class="txtGn">válido</span> e entenderase correctamente, pero <strong>3′4″ 1 week 2 days</strong> e <strong>3 hours 3h 3°</strong> <span class="txtRd">non</span> son válidos. A CIDRAM non lle importa se utilizas espazos ou non. Os números deben ser sinxelos e sen formato. Por motivos prácticos, a unidade compatible máis grande é unha semana. Cando se actualiza a configuración, CIDRAM normaliza as duracións a tempo de arco."
hints_has_bypass: "* Esta opción ten un bypass correspondente baixo <code class="s">bypasses➡used</code>. Recoméndase asegurarse de que a caixa de verificación do bypass correspondente estea marcada do mesmo xeito que a caixa de verificación para tentar verificar esta opción."
hints_http_response_header_code:
 1.: "Cando o "modo silencioso" estea activo, usarase a mensaxe de estado HTTP definida por <code class="s">general➡silent_mode_response_header_code</code> (esta ten a prioridade máis alta)."
 2.: "Cando a entidade solicitante sexa prohibida por superar o límite de infraccións, usarase a mensaxe de estado HTTP para "prohibido"."
 3.: "Cando estea bloqueado debido á limitación da taxa, usarase 429, ou cando estea bloqueado debido a conflitos de recursos, usarase a mensaxe de estado HTTP definida por <code class="s">signatures➡conflict_response</code> (a limitación da taxa e os conflitos de recursos teñen a mesma prioridade neste contexto)."
 4.: "Cando estea bloqueado debido a unha regra auxiliar que define unha "anulación do código de estado HTTP", usarase esa anulación do código de estado HTTP."
 5.: "Cando estea bloqueado por motivos legais (é dicir, cando estea bloqueado debido a unha sinatura personalizada que usa a palabra abreviada "legal"), usarase a mensaxe de estado HTTP para "legal"."
 6.: "Para todas as outras solicitudes bloqueadas, usarase a mensaxe de estado HTTP para "predeterminado" (esta ten a precedencia máis baixa)."
hints_inspection: "* Destinado só para depurar regras auxiliares. Non se mostra aos usuarios bloqueados."
hints_ipv6_on_32bit: "Nota: É posible que as buscas IPv6 non funcionen correctamente nalgúns sistemas de 32 bits."
hints_logging_datetime: "Consello útil: Podes anexar información de data/hora aos nomes dos ficheiros de rexistro mediante os marcadores de posición do formato de hora. Os marcadores de posición do formato de hora dispoñibles móstranse en {{Links.ConfigRef.time_format}}."
hints_pdo_dsn:
 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-HOW_TO_USE_PDO" hreflang="en-AU">Que é un "PDO DSN"? Como podo usar PDO con CIDRAM?</a></em>"
hints_sensitive_pages: "Nota: O que constitúe unha "páxina sensible" está determinado por {{Links.ConfigRef.sensitive}}."
hints_shorthand:
 0.: "Se o teu sitio web necesita acceso a través da LAN ou localhost, non o bloquees. En caso contrario, podes bloquealo."
 1.: "Ningún dos ficheiros de sinatura predeterminados usa isto, pero ofrécese no caso de que poida ser útil para algúns usuarios."
 2.: "Se precisas que os usuarios poidan acceder ao teu sitio web mediante proxies, non o bloquees. En caso contrario, podes bloquealo."
 3.: "O uso directo nas sinaturas non é posible, pero pode ser invocado por outros medios en circunstancias particulares."
 4.: "Refírese a casos nos que as palabras abreviadas non se usan en absoluto ou non son recoñecidas polo CIDRAM."
 Un por sinatura.: "Unha sinatura pode invocar varios perfís, pero só pode usar unha palabra abreviada. É posible que varias palabras taquigráficas sexan axeitadas, pero como só se pode usar unha, tentamos utilizar sempre só as máis adecuadas."
 Prioridade.: "Unha opción seleccionada sempre ten prioridade sobre unha opción non seleccionada. Por exemplo, se hai varias palabras taquigráficas en xogo pero só unha delas se define como bloqueada, a solicitude seguirá bloqueada."
 Puntos finais humanos e servizos na nube.: "O servizo na nube pode referirse a provedores de aloxamento web, granxas de servidores, centros de datos, ou calquera outra cantidade de cousas. O punto final humano refírese aos medios polos que un humano accede a internet, como a través dun provedor de servizos de internet. Unha rede adoita ofrecer só un ou outro, pero ás veces pode proporcionar ambos. Tentamos nunca identificar os puntos finais humanos potenciais como servizos na nube. Polo tanto, un servizo na nube pode identificarse como outra cousa se o seu alcance é compartido por puntos finais humanos coñecidos. Pola contra, tentamos identificar sempre os servizos na nube, cuxos rangos non son compartidos por ningún punto final humano coñecido, como servizos na nube. Polo tanto, unha solicitude identificada explícitamente como un servizo na nube probablemente non comparta o seu rango con ningún punto final humano coñecido. Así mesmo, unha solicitude identificada explícitamente por ataques ou spam probablemente comparta os seus rangos. Dito isto, internet sempre está en constante cambio, os propósitos das redes cambian co paso do tempo, e os rangos sempre se compran ou venden, polo que permanece consciente e atento aos falsos positivos."
hints_time_format: |
 <strong><em>Marcador de posición – Explicación – Exemplo baseado en 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – O ano – Por exemplo, 2024.<br />
 <code class="s">{yy}</code> – O ano abreviado – Por exemplo, 24.<br />
 <code class="s">{Mon}</code> – O nome abreviado do mes (en inglés) – Por exemplo, Apr.<br />
 <code class="s">{mm}</code> – O mes con ceros ao principio – Por exemplo, 04.<br />
 <code class="s">{m}</code> – O mes – Por exemplo, 4.<br />
 <code class="s">{Day}</code> – O nome abreviado do día (en inglés) – Por exemplo, Tue.<br />
 <code class="s">{dd}</code> – O día con ceros ao principio – Por exemplo, 30.<br />
 <code class="s">{d}</code> – O día – Por exemplo, 30.<br />
 <code class="s">{hh}</code> – A hora con ceros ao principio (utiliza o tempo de 24 horas) – Por exemplo, 18.<br />
 <code class="s">{h}</code> – A hora (utiliza o tempo de 24 horas) – Por exemplo, 18.<br />
 <code class="s">{ii}</code> – O minuto con ceros ao principio – Por exemplo, 27.<br />
 <code class="s">{i}</code> – O minuto – Por exemplo, 27.<br />
 <code class="s">{ss}</code> – O segundo con ceros ao principio – Por exemplo, 49.<br />
 <code class="s">{s}</code> – O segundo – Por exemplo, 49.<br />
 <code class="s">{tz}</code> – O fuso horario (sen dous puntos) – Por exemplo, +0800.<br />
 <code class="s">{t:z}</code> – O fuso horario (con dous puntos) – Por exemplo, +08:00.
hints_usemode:
 0: "Nota: As solicitudes na lista branca ou verificadas e non bloqueadas nunca precisan completar un CAPTCHA."
 1: "Teña en conta tamén: Os CAPTCHA poden proporcionar unha capa adicional útil de protección contra bots e varios tipos de solicitudes automatizadas maliciosas, pero non proporcionarán ningunha protección contra un humano malintencionado."
 2: "As solicitudes poden ser "marcadas para o seu uso" mediante regras auxiliares."
 3: "Se unha solicitude se considera "sensible" vén determinado por {{Links.ConfigRef.sensitive}}."
 4: "O "límite de sinaturas" está determinado por {{Links.ConfigRef.signature_limit}}."
hints_verification:
 "Que son "positivos" e "negativos"?": "Ao verificar a identidade presentada por unha solicitude, un resultado exitoso podería describirse como "positivo" ou "negativo". No caso de que se confirme que a identidade presentada é a verdadeira identidade, se describiría como "positiva". No caso de que se confirme que a identidade presentada está falsificada, se describiría como "negativa". Por outra banda, un resultado infructuoso (por exemplo, a verificación falla, ou non se pode determinar a veracidade da identidade presentada) non se describiría como "positivo" ou "negativo". En cambio, un resultado infructuoso describiríase simplemente como non verificado. Cando non se realice ningún intento de verificar a identidade presentada por unha solicitude, a solicitude tamén se describiría como non verificada. Os termos só teñen sentido no contexto onde se recoñece a identidade presentada por unha solicitude e, polo tanto, onde a verificación é posible. Nos casos en que a identidade presentada non coincide coas opcións indicadas anteriormente, ou nos que non se presenta ningunha identidade, as opcións indicadas anteriormente non serán relevantes."
 "Que son os "bypasses dun só golpe"?": "Nalgúns casos, unha solicitude verificada positivamente aínda pode bloquearse como resultado dos ficheiros de sinatura, módulos, ou outras condicións da solicitude, e é posible que poden ser necesarios bypasses para evitar falsos positivos. No caso de que un bypass teña como finalidade tratar exactamente unha infracción, nin máis nin menos, tal bypass poderíase describir como un "bypass dun só golpe"."
hints_want_to_block: "!! Probablemente, a maioría dos usuarios queren que se bloquee isto, independentemente de se é real ou falsificado. Isto pódese conseguir por non seleccionar "tentar verificar" e seleccionar "bloquear solicitudes non verificadas". Non obstante, debido a que algúns usuarios poden querer verificar tales solicitudes (para bloquear os negativos mentres se permiten os positivos), en lugar de bloquealas mediante módulos, aquí ofrécense opcións para xestionar tales solicitudes."
