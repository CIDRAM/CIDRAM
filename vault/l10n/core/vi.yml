 BadIP: "Truy cập của bạn vào trang này đã bị từ chối bởi vì bạn đã cố gắng truy cập trang này sử dụng một địa chỉ IP không hợp lệ."
 Banned: "Truy cập của bạn vào trang này đã bị từ chối do hành vi xấu trước đó từ địa chỉ IP của bạn."
 Bogon: "Truy cập của bạn vào trang này đã bị từ chối bởi vì địa chỉ IP của bạn được công nhận như một địa chỉ bogon, và kết nối từ bogon đến trang web này không được phép bởi chủ sở hữu trang web."
 Cloud: "Truy cập của bạn vào trang này đã bị từ chối bởi vì địa chỉ IP của bạn được công nhận như thuộc về một dịch vụ điện toán đám mây, và kết nối đến trang web này từ dịch vụ điện toán đám mây không được phép bởi chủ sở hữu trang web."
 Conflict: "Yêu cầu của bạn không thể được xử lý tại thời điểm này vì không có sẵn nguồn tài nguyên cần thiết. Vấn đề này có thể là do xung đột với yêu cầu khác, và dự kiến ​​chỉ là tạm thời. Hãy thử lại sau khi đợi vài giây."
 Generic: "Truy cập của bạn vào trang này đã bị từ chối bởi vì địa chỉ IP của bạn được công nhận như thuộc về một mạng lưới được liệt kê vào danh sách đen được sử dụng bởi trang web này."
 Legal: "Truy cập của bạn vào trang này đã bị từ chối do nghĩa vụ pháp lý."
 Malware: "Truy cập của bạn vào trang này đã bị từ chối bởi vì địa chỉ IP của bạn được coi là nguồn phần mềm độc hại tiềm ẩn."
 Outdated browser: "Trình duyệt của bạn được xác định là đã lỗi thời và do đó một rủi ro bảo mật. Vui lòng cập nhật lên phiên bản hiện tại trước khi truy cập trang web này."
 Proxy: "Truy cập của bạn vào trang này đã bị từ chối bởi vì địa chỉ IP của bạn được công nhận như thuộc về một dịch vụ proxy, và kết nối đến trang web này từ dịch vụ proxy không được phép bởi chủ sở hữu trang web."
 RL: "Bạn đã vượt quá băng thông tối đa hoặc số lượng yêu cầu được phép phục vụ tại thời điểm này. Vui lòng đợi ít nhất %s trước khi thử lại."
