tip:
 2FA Sent: "E-posta adresinize iki faktörlü bir kimlik doğrulama kodu içeren bir e-posta gönderildi. Ön tarafa erişmek için lütfen aşağıdaki kodu doğrulayın. Bu e-postayı almadıysanız, yeni bir kod içeren yeni bir e-posta almak için, çıkış yapmayı, 10 dakika beklemeyi ve tekrar giriş yapmayı deneyin."
 Accounts: "Hesaplar sayfası, CIDRAM ön ucuna kimin erişebileceğini kontrol etmenizi mümkün kılar."
 Actions menu: "Engellemek imza sayısına 1 ekler. Atlamak imza sayısından 1 eksiltiyor. Beyaz listelemek imza sayısını 0'a ayarlar ve işlemeyi sonlandırır, böylece sonraki tüm kurallar tamamen atlanır. Gri listelemek imza sayısını 0'a ayarlar, ancak işlemeyi sonlandırmaz. Profillemek imza sayısını etkilemez, ancak diğer türden eylemlerin gerçekleştirilip gerçekleştirilmeyeceğini belirlemek için daha karmaşık mantığa ihtiyaç duyulduğunda yararlıdır, çünkü oluşturulan profiller sonraki kuralların koşullarına zincirlenebilir. İşlem sonrasında imza sayısı 1 veya daha fazla ise istek engellenecektir."
 Aggregator: "Toplayıcı IP'leri, CIDR'leri, ve ağ maskeleri olabildiğince az şekilde ifade etmenizi sağlar. Birleştirilecek verileri girin ve "Tamam" düğmesine basın."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Kabul edilen değer, isteğin IP adresini kapsayan bir aralığa sahip herhangi bir CIDR'dir. Örneğin, 1.2.3.4 için 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, vb. kabul edilebilir. Yanlış pozitif sonuçlardan kaçınmak için, daha geniş aralıklara (örneğin, 0.0.0.0/1) kıyasla genellikle daha dar aralıklar (örneğin, 1.2.3.4/32) tercih edilir. Hesaplama sayfası, belirtilen bir IP adresini kapsayan aralıklara sahip CIDR'leri bulmak için kullanılabilir."
 Auxiliary Rules Modes: "Görünüm modu, yardımcı kuralları kolay okunabilecek şekilde kompakt bir liste halinde gösterir. Listedeki kuralların üzerine tıklanarak genişletilebilir ve daha fazla ayrıntı görüntülenebilir. Üçlüye (☰) tıklandığında bir kuralı dışa aktarma veya silme seçenekleri gösterilecektir. Kurallar sürükle bırak yöntemiyle yeniden sıralanabilir, kural mevcut konumundan istenilen konuma sürüklenebilir. Yardımcı kuralları değiştirmek için düzenleme modu gereklidir, sayfada kurallara yeni koşullar, webhook'lar, veya diğer mantıklar eklemek için düzenlenebilir alanlar ve seçenekler sağlanmıştır ihtiyaç duyulduğu takdirde. Her iki mod aracılığıyla da yeni yardımcı kurallar oluşturulabilir."
 Auxiliary Rules Priority: "Öncelik (maksimum➡(eşit🔄eşdeğer)➡minimum):"
 Auxiliary Rules Webhooks: "Bir kural tetiklendiğinde, CIDRAM, olayla ilgili bağlı webhookları bildirmeye çalışır. Webhook, POST verilerini alabilen bir URL'dir, ve CIDRAM'ın isteğinizle ilgili ürettiği verileri işlemek istediğiniz harici bir servis, uygulama, betik vb. varsa ve bunlar CIDRAM'dan tamamen farklı bir ağda barındırılıyorsa, webhook'lar yararlı olabilir."
 Auxiliary Rules: "CIDRAM için yardımcı kurallar oluşturmak, silmek ve değiştirmek için bu sayfayı kullanabilirsiniz."
 Backup: "Bu sayfa yapılandırmanızı, yardımcı kurallarınızı, vb. içe/dışa aktarmak için kullanılabilir. Verileri farklı kurulumlar veya farklı ana sürümler arasında taşımanız gerektiğinde bu yararlı olabilir."
 Cache Data: "Burada önbellek içeriğini inceleyebilirsiniz."
 Calculator: "Hesaplayıcı, bir IP adresinin CIDR'lerini ve ağ maskelerini hesaplamanıza olanak tanır."
 Click the component name for more details: "Daha fazla ayrıntı için bileşen adına tıklayın."
 Configuration: "Yapılandırma sayfası, CIDRAM için yapılandırmayı ön uçtan değiştirmenizi mümkün kılar."
 Enter IP address here: "IP adresini buraya girin."
 Enter IP address here (optional): "IP adresini buraya girin (isteğe)."
 Enter IP addresses here: "IP adreslerini buraya girin."
 Enter input here: "Verileri buraya girin."
 Enter queries here: "Buraya sorguları girin."
 Enter query here (optional): "Buraya sorguyu girin (isteğe)."
 Enter referrer here (optional): "Buraya yönlendiriciyi girin (isteğe)."
 Enter user agent here (optional): "Buraya kullanıcı aracısını girin (isteğe)."
 Enter user agents here: "Buraya Kullanıcı aracılarını girin."
 File Manager: "Dosya yöneticisi dosyalarınızı silmenizi, düzenlemenizi, yüklemenizi ve indirmenizi sağlar. Dikkatli kullanın (kurulumunuzu bununla bozabilirsiniz)."
 Greeting: "Merhaba, %s."
 Home: "Bu, CIDRAM ön uçunun ana sayfasıdır. Devam etmek için soldaki gezinme menüsünden bir bağlantı seçin."
 How many infractions to incur: "Kaç tane ihlal yapılacak."
 IP Testing: "IP test sayfası, şu anda yüklü olan imzalarla IP adreslerinin engellenip engellenmediğini test etmenizi sağlar."
 IP Tracking: "IP izleme sayfası, IP adreslerinin izleme durumunu kontrol etmenizi, hangilerinin yasak olduğunu kontrol etmenizi ve isterseniz bunların yasaklanmasını/izlemensini kaldırmanızı kontrol etmenizi sağlar."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Bir istek, bir IPv6 geçiş mekanizması (örneğin, 6to4, Teredo, ISATAP, vb) tarafından kullanılan bir aralığa ait bir IPv6 adresinden bağlanırsa, "IP adresi (çözümlenmiş)" alanı, bu IPv6 adresinin söz konusu IPv6 geçiş mekanizması altında çevrildiği IPv4 adresiyle doldurulacaktır (örneğin, "IP adresi" "2002:c0a8:1::" ise, "IP adresi (çözümlenmiş)" "192.168.0.1" olacaktır). Diğer tüm durumlarda, "IP adresi (çözümlenmiş)" ve "IP adresi" alanları aynı olacaktır."
 Intersector: "Kesişen aracı, iki aralık kümesinden ortak faktörleri belirlemek için kullanılabilir."
 Logs: "Bu günlük dosyasının içeriğini görüntülemek için aşağıdaki listeden bir günlük dosyası seçin."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Bu istatistiğin tam değerinin, kural işlendiği sırada istatistik sayfasında gösterilen değerle aynı olacağını unutmayın."
 Number of seconds until it expires: "Süresi dolana kadar geçen saniye sayısı."
 Numeric comparison: "Sayısal karşılaştırmayı kullanmak için doğrudan dize karşılaştırmasını veya otomatik yöntem algılamayı seçin, koşulun değerinin sayısal olduğundan emin olun, ve istenen operatörün önüne ekleyin.<br />Örneğin, "eşit" koşulları için, &gt;=2, ≥2'yi sağlar, &lt;=2, ≤2'yi sağlar, "eşit değil" koşulları için, &gt;=2, ≱2'yi sağlar, &lt;=2, ≰2'yi sağlar, vb."
 Range Tables: "Bu sayfa, şu anda aktif imza dosyalarının kapsadığı IP aralıkları hakkında bazı temel istatistiksel bilgileri göstermektedir."
 Rate Limiting: "Bu sayfa, hız sınırlamasıyla ilgili olarak mevcut kota kullanımını ve kullanılabilirliğini gösterir."
 Rate limiting is currently disabled: "Not: Hız sınırlaması şu anda devre dışı, ancak yapılandırma sayfası aracılığıyla etkinleştirilebilir."
 Report to AbuseIPDB: "Bu sayfa, IP adreslerini AbuseIPDB'ye bildirmek veya bir IP adresinin hatalı olarak bildirilmesi durumunda önceki raporları silmek için kullanılabilir."
 Sections List: "Bu sayfa şu anda etkin olan imza dosyalarında hangi bölümlerin bulunduğunu listeler."
 See the documentation: "Çeşitli yapılandırma yönergeleri ve amaçlarıyla ilgili bilgi için <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>belgelere</a> bakın."
 Server log snippets, abuse details, etc: "Sunucu günlüğü alıntıları, kötüye kullanım ayrıntıları, vb."
 Signature File Fixer: "İmza dosya tamircisi, imza dosyalarındaki olası sorunları tespit etmek ve çözmek için bir yol sağlar."
 Specify a URL, or leave blank to disregard: "Bir URL belirtin veya dikkate almamak için boş bırakın."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Bir dizin yolu belirtin, veya CIDRAM taban yolunu kullanmak için boş bırakın."
 Specify a value, or leave blank to disregard: "Bir değer belirtin veya dikkate almamak için boş bırakın."
 Statistics tracking is currently disabled: "Not: İstatistik izleme şu anda devre dışı, ancak yapılandırma sayfası aracılığıyla etkinleştirilebilir."
