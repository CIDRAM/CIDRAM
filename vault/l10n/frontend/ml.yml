 bobuam: "ഓപ്ഷണൽ "ബോട്ട് അല്ലെങ്കിൽ ബ്രൗസർ ഉപയോക്തൃ ഏജന്റുകൾ മൊഡ്യൂൾ" കോൺഫിഗറേഷൻ. ഈ മൊഡ്യൂൾ ആവശ്യമില്ലാത്ത ബോട്ടുകളും പഴയ ബ്രൗസറുകളും കണ്ടെത്തുകയും ചില സാനിറ്റി പരിശോധനകൾ നടത്തുകയും ചെയ്യുന്നു."
