 pt-PT: "!! Esta é uma dica do cliente de baixa entropia. As dicas de cliente são uma tecnologia web nova e experimental que ainda não é amplamente suportada em todos os navegadores e principais clientes. <em>Ver: {{Links.MDN.Client hints}}.</em> Embora as dicas do cliente possam ser úteis para a impressão digital, já que não são amplamente suportadas, a sua presença nos solicitações não deve ser assumida nem confiável. (i.e., bloquear com base na ausência é uma má ideia)."
hints_client_honour: "Independentemente de como instruímos o cliente, é importante lembrar que não temos controle sobre o que o cliente escolhe fazer, e não há garantia de que o cliente honrará nossas instruções."
