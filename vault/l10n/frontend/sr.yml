hints_aux_stats: "Белешка: Праћење статистике за помоћна правила може се контролисати са странице помоћних правила."
hints_cause_fp: "*!! Велика вероватноћа изазивања лажних позитивних резултата због %s."
hints_cclookup: "** Захтева функционалност за тражење кодова земаља (нпр., преко ИП-АПИ или БГПВиев модула)."
hints_client_hints: "!! Ово је наговештај клијента са ниском ентропијом. Ово је нова, експериментална веб технологија која још увек није широко подржана. <em>Види: {{Links.MDN.Client hints}}.</em> Иако наговештаји клијената могу бити корисни за узимање отисака прстију, пошто нису широко подржани, њихово присуство у захтевима не треба претпостављати нити се на њих ослањати (тј., блокирање на основу њиховог одсуства је лоша идеја)."
hints_client_honour: "Без обзира на то како дајемо инструкције клијенту, важно је запамтити да на крају немамо контролу над оним што клијент одабере да уради, и да нема гаранције да ће клијент поштовати наша упутства."
hints_default_dns:
 Чпп.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">Шта могу да користим за „default_dns“?</a></em>"
hints_duration:
 SI.: "Трајање се може описати коришћењем „међународног система јединица“. Нпр., <strong>1d2h3min4s</strong> или <strong>1d 2h 3min 4s</strong> за један дан, два сата, три минута, четири секунде, или <strong>5min</strong> за само пет минута."
 Арцтиме.: "Трајање се може описати коришћењем арцтиме нотације. Нпр., <strong>1d2°3′4″</strong> за један дан, два сата, три минута, четири секунде, или <strong>5″</strong> за само пет секунди."
 Обичан енглески.: "Трајање се може описати писањем јединица на обичном енглеском језику. Нпр., <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> за једну недељу, два дана, три сата, четири минута, пет секунди."
 Ограничења.: "Нотације се могу мешати, али јединице увек морају бити описане од највеће до најмање, и не могу се понављати. Нпр., <strong>1 week 2 days 3′4″</strong> је <span class="txtGn">валидан</span> и биће исправно схваћен, али <strong>3′4″ 1 week 2 days</strong> и <strong>3 hours 3h 3°</strong> су <span class="txtRd">неважећи</span>. ЦИДРАМ-у није важно да ли користите размак или не. Бројеви морају бити једноставни и неформатирани. За практичност, највећа подржана јединица је недеља. Када се конфигурација ажурира, ЦИДРАМ нормализује трајање у арцтиме."
hints_has_bypass: "* Ова опција има одговарајуће заобилажење под <code class="s">bypasses➡used</code>. Препоручује се да се осигура да је поље за потврду за одговарајуће заобилажење означено на исти начин као и поље за покушај провере ове опције."
hints_http_response_header_code:
 1.: "Када је на снази „тихи режим“, користиће се HTTP статусна порука дефинисана са <code class="s">general➡silent_mode_response_header_code</code> (ово има највећи приоритет)."
 2.: "Када је ентитет који је поднео захтев забрањен због прекорачења ограничења прекршаја, користиће се HTTP статусна порука за „забрањено“."
 3.: "Када је блокирано због ограничења брзине, користиће се 429, или када је блокирано због сукоба ресурса, користиће се HTTP статусна порука дефинисана са <code class="s">signatures➡conflict_response</code> (ограничавање брзине и сукоби ресурса имају једнак приоритет у овом контексту)."
 4.: "Када је блокирано због помоћног правила које поставља „надјачавање HTTP статусног кода“, користиће се то надјачавање HTTP статусног кода."
 5.: "Када је блокирано из правних разлога (тј., када је блокирано због прилагођеног потписа који користи скраћеницу „правни“), користиће се HTTP статусна порука за „правни“."
 6.: "За све остале блокиране захтеве, користиће се HTTP статусна порука за „подразумевано“ (ово има најнижи приоритет)."
hints_inspection: "* Намењен само за отклањање грешака у помоћним правилима. Не приказује се блокираним корисницима."
hints_ipv6_on_32bit: "Белешка: ИПв6 претраге можда неће радити исправно на неким 32-битним системима."
hints_logging_datetime: "Користан савет: Можете да приложите информације о датуму/времену именима датотека евиденције користећи чуваре места у формату времена. Доступни чувари места формата времена су приказани на {{Links.ConfigRef.time_format}}."
hints_pdo_dsn:
 Чпп.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-HOW_TO_USE_PDO" hreflang="en-AU">Шта је „ПДО ДСН“? Како могу да користим ПДО са ЦИДРАМ-ом?</a></em>"
hints_sensitive_pages: "Белешка: Шта чини „осетљиву страницу“ одређује {{Links.ConfigRef.sensitive}}."
hints_shorthand:
 0.: "Ако вашој веб локацији треба приступ преко ЛАН-а или localhost-а, немојте ово блокирати. У супротном, можете блокирати ово."
 1.: "Ниједна од подразумеваних датотека потписа ово не користи, али је ипак подржана у случају да би могла бити корисна за неке кориснике."
 2.: "Ако вам је потребно да корисници могу да приступе вашој веб локацији преко проксија, немојте блокирати ово. У супротном, можете блокирати ово."
 3.: "Директна употреба у потписима није подржана, али се може позвати на други начин у одређеним околностима."
 4.: "Односи се на случајеве у којима се скраћене речи уопште не користе или их ЦИДРАМ не препознаје."
 Један по потпису.: "Потпис може позвати више профила, али може користити само једну скраћену реч. Могуће је да више скраћених речи може бити погодно, али пошто се може користити само једна, трудимо се да увек користимо само најпогодније."
 Приоритет.: "Изабрана опција увек има приоритет у односу на опцију која није изабрана. Нпр., ако је у игри више скраћених речи, али је само једна од њих подешена као блокирана, захтев ће и даље бити блокиран."
 Људске крајње тачке и услуге у облаку.: "Услуга у облаку се може односити на добављаче веб хостинга, фарме сервера, центре података, или било који број других ствари. Људска крајња тачка се односи на начин на који човек приступа интернету, као што је преко провајдера интернет услуга. Мрежа обично пружа само једно или друго, али понекад може пружити и једно и друго. Трудимо се да никада не идентификујемо потенцијалне људске крајње тачке као услуге у облаку. Стога се услуга у облаку може идентификовати као нешто друго ако њен опсег деле познате људске крајње тачке. Насупрот томе, ми покушавамо да увек идентификујемо услуге у облаку, чије опсеге не деле ниједна позната људска крајња тачка, као услуге у облаку. Стога, захтев који је експлицитно идентификован као услуга у облаку вероватно не дели свој опсег ни са једном познатом људском крајњом тачком. Исто тако, захтев који је експлицитно идентификован нападима или нежељеном поштом вероватно дели такве опсеге. Међутим, интернет је увек у флуктуацији, сврхе мрежа се мењају током времена, а домети се увек купују или продају, па будите свесни и опрезни у погледу лажних позитивних резултата."
hints_time_format: |
 <strong><em>Чувар места – Објашњење – Пример заснован на 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – Година – Нпр., 2024.<br />
 <code class="s">{yy}</code> – Скраћена година – Нпр., 24.<br />
 <code class="s">{Mon}</code> – Скраћени назив месеца (на енглеском) – Нпр., Apr.<br />
 <code class="s">{mm}</code> – Месец са водећим нулама – Нпр., 04.<br />
 <code class="s">{m}</code> – Месец – Нпр., 4.<br />
 <code class="s">{Day}</code> – Скраћени назив дана (на енглеском) – Нпр., Tue.<br />
 <code class="s">{dd}</code> – Дан са водећим нулама – Нпр., 30.<br />
 <code class="s">{d}</code> – Дан – Нпр., 30.<br />
 <code class="s">{hh}</code> – Сат са водећим нулама (користи 24-часовно време) – Нпр., 18.<br />
 <code class="s">{h}</code> – Сат (користи 24-часовно време) – Нпр., 18.<br />
 <code class="s">{ii}</code> – Минут са водећим нулама – Нпр., 27.<br />
 <code class="s">{i}</code> – Минут – Нпр., 27.<br />
 <code class="s">{ss}</code> – Секунде са водећим нулама – Нпр., 49.<br />
 <code class="s">{s}</code> – Секунде – Нпр., 49.<br />
 <code class="s">{tz}</code> – Временска зона (без двотачка) – Нпр., +0800.<br />
 <code class="s">{t:z}</code> – Временска зона (са двотачком) – Нпр., +08:00.
hints_usemode:
 0: "Белешка: Захтеви са беле листе, или верификовани и неблокирани захтеви, никада не морају да доврше ЦАПТЦХА."
 1: "Такође имајте на уму: ЦАПТЦХА могу да обезбеде користан, додатни слој заштите од ботова и разних врста злонамерних аутоматизованих захтева, али неће пружити никакву заштиту од злонамерног људи."
 2: "Захтеви се могу „означити за употребу“ путем помоћних правила."
 3: "Да ли се захтев сматра „осетљивим“ одређује се помоћу {{Links.ConfigRef.sensitive}}."
 4: "„Ограничење потписа“ одређује се помоћу {{Links.ConfigRef.signature_limit}}."
hints_verification:
 "Шта су „позитиви“ и „негативи“?": "Приликом провере идентитета представљеног захтевом, успешан исход би се могао описати као „позитиван“ или „негативан“. У случају да се потврди да је представљени идентитет прави идентитет, он би био описан као „позитиван“. У случају да се потврди да је представљени идентитет фалсификован, он би био описан као „негативан“. Међутим, неуспешан исход (нпр., верификација не успе, или се не може утврдити веродостојност представљеног идентитета) не би био описан као „позитиван“ или „негативан“. Уместо тога, неуспешан исход би био описан једноставно као непроверен. Када није учињен ниједан покушај да се потврди идентитет представљен у захтеву, захтев би такође био описан као непроверен. Термини имају смисла само у контексту у којем се препознаје идентитет представљен у захтеву, а самим тим и када је верификација могућа. У случајевима када представљени идентитет не одговара горе наведеним опцијама, или када идентитет није представљен, горе наведене опције постају неважне."
 "Шта су „заобилажења једним поготком“?": "У неким случајевима, позитивно верификован захтев може и даље бити блокиран као резултат датотека потписа, модула, или других услова захтева, а заобилажења могу бити неопходна како би се избегли лажно позитивни. У случају када је заобилажење намењено за решавање тачно једног прекршаја, ни више ни мање, такво заобилажење би се могло описати као „заобилажења једним поготком“."
hints_want_to_block: "!! Већина корисника ће вероватно желети да се ово блокира, без обзира да ли је стварно или лажно. То се може постићи тако што се не изабра „покушај верификације“ и изабра „блокирати непроверене захтеве“. Међутим, пошто неки корисници можда желе да буду у могућности да верификују такве захтеве (како би блокирали негативне, а дозволили позитивне), уместо блокирања таквих захтева путем модула, овде су дате опције за руковање таквим захтевима."
info_cli: !lazy
 by_default_ips: |
  Стандардно, ИП адресе се тестирају у односу на све датотеке потписа, све
  модуле, сва помоћна правила, и у односу на верификацију на друштвеним
  мрежама и претраживачима.
  --no-ban    Спречава проверу да ли је забрањено.
  --no-sig    Спречава тестирање у односу на датотеке са потписима.
  --no-mod    Спречава тестирање на модулима.
  --no-sev    Спречава верификацију претраживача.
  --no-smv    Спречава верификацију на друштвеним мрежама.
  --no-ov     Спречава друге верификације.
  --no-aux    Спречава тестирање према помоћним правила.
