 rate_limiting_exceptions: "İstisnalar (yani oran sınırlı olmaması gereken istekler). Yalnızca sınırlaması etkin olduğunda geçerlidir."
 rate_limiting_hint: "Diğer tüm CIDRAM özelliklerinde olduğu gibi, CIDRAM'ın hız sınırlama özelliği yalnızca CIDRAM'ın bağlı olduğu sayfalar ve kaynaklar için uygulanabilir. Bu nedenle, PHP dışı kaynaklar, bağlı PHP kaynakları tarafından açıkça sunulmadığı sürece, kapsam dahilinde olmayacaktır. Hız sınırlamasını uygulamak için bir sunucu modülü, cPanel, veya başka bir ağ aracı kullanabiliyorsanız, CIDRAM'ın hız sınırlama özelliği yerine bunları kullanmanız daha iyi olacaktır. Ayrıca, kararlı bir kullanıcı IP adresini döndürerek veya CIDRAM'ın henüz farkında olmadığı bir proxy veya VPN sağlayıcısına geçerek hız sınırlamasını kolayca aşabilir, ve hız sınırlaması gerçek son kullanıcılar için çok can sıkıcı olabilir. Bazen gerekli olabilir, ancak nadiren istenir."
 rate_limiting_max_bandwidth: "Gelecekteki talepleri sınırlayan orandan önce izin süresi içinde izin verilen maksimum bant genişliği miktarı. 0 değeri bu oran sınırlamasını devre dışı bırakır. Varsayılan = 0KB."
 rate_limiting_max_requests: "Gelecekteki istekleri sınırlayan orandan önce izin süresi içinde izin verilen maksimum istek sayısı. 0 değeri bu oran sınırlamasını devre dışı bırakır. Varsayılan = 0."
 rate_limiting_precision_ipv4: "IPv4 kullanımını izlemek için hassaslık. Değer, CIDR blok boyutunu yansıtır. En iyi hassasiyet için 32'ye ayarlayın. Varsayılan = 32."
 rate_limiting_precision_ipv6: "IPv6 kullanımını izlemek için hassaslık. Değer, CIDR blok boyutunu yansıtır. En iyi hassasiyet için 128'e ayarlayın. Varsayılan = 128."
 rate_limiting_segregate: "Farklı alanlar ve ana bilgisayarlar için kotalar ayrılmalı mı yoksa paylaşılmalı mı? True = Kotalar ayrılacak. False = Kotalar paylaşılacak [Varsayılan]."
