Glossary: !lazy
 Entries:
  CIDR: |
   «CIDR» er et akronym for «Classless Inter-Domain Routing», som er der «CIDR» i «CIDRAM» kommer fra. «CIDRAM» er et akronym for «Classless Inter-Domain Routing Access Manager».
   I sammenheng med CIDRAM refererer «CIDR» (eller «CIDRer») spesifikt til undernett uttrykt ved hjelp av CIDR-notasjon.
  Falsk positiv: |
   Generelt sett, når en test utføres og resultatene av testen er «positive» (dvs., at testens betingelser er sanne), men forventet å være (eller burde ha vært) «negative» (dvs., at testens resultater er feilaktige), blir det referert til som en «falsk positiv». <em>Engelsk: «false positive». Eller alternativt: «falsk positiv feil»; «falsk alarm».</em>
   Noen relaterte begreper er «sann positiv», «sann negativ», og «falsk negativ». <em>Engelsk: «true positive», «true negative», «false negative».</em> En «sann positiv» refererer til når både testens resultater og den faktiske tilstanden er sanne (eller «positive»), og en «sann negativ» refererer til når både testens resultater og den faktiske tilstanden er falske (eller «negative»). En «sann positiv» eller en «sann negativ» anses å være en «korrekt slutning».
   Det motsatte av en «falsk positiv» er en «falsk negativ». Når resultatene av testen er «negative», men forventet å være (eller burde ha vært) «positive», blir det referert til som en «falskt negative».
   I sammenheng med CIDRAM refererer disse begrepene vanligvis til når CIDRAM blokkerer noe det ikke burde, eller når det ikke klarer å blokkere noe det burde. Når CIDRAM blokkerer en forespørsel som ikke burde vært blokkert (f.eks., på grunn av dårlige, utdaterte, eller feilaktige signaturer), eller når den gjør det av feil grunner, er dette en «falsk positiv». Når CIDRAM ikke klarer å blokkere en forespørsel som burde vært blokkert (f.eks., på grunn av uforutsette trusler, manglende signaturer, defekte moduler, eller mangler i prosessen), er dette «falsk negativ» (men vanligvis beskrevet som en «misset deteksjon»). <em>Engelsk: «missed detection».</em>
   | | Forespørselen bør IKKE blokkeres | Forespørselen BØR blokkeres |
   | Forespørselen er IKKE blokkert | Sann negativ (korrekt slutning) | Misset deteksjon (eller falsk negativ) |
   | Forespørselen ER blokkert | Falsk positiv | Sann positiv (korrekt slutning) |
   Hvis du støter på falske positiver, først sjekke oppdateringssiden, og hvis noe er merket som utdatert, oppdatere det. Hvis problemet fortsatt vedvarer, du kan rapportere problemet på CIDRAMs problemsporing.
  Signatur: |
   I sammenheng med CIDRAM refererer en signatur til data som finnes i signaturfiler og moduler, og som CIDRAM bruker for å avgjøre om forespørsler skal blokkeres.
   Når det gjelder signaturfiler, består en signatur vanligvis av en CIDR, en kommando som representerer den ønskede handlingen som skal utføres når en forespørsel fra en IP-adresse som tilhører den CIDRen påtreffes, og i tilfelle en IP-adresse er blokkert, årsaken til dette. De vil ofte bli samlet sammen som seksjoner, ledsaget av kommentarer, markering, og andre metadata for å gi ytterligere kontekst.
   Et eksempel på en signatur fra IPv4 bogoner signaturfil: {{Excerpts.Bogon signature}}
   Når det gjelder moduler, refererer en signatur vanligvis til kall i modulenes kode til en spesifikk metode som er ansvarlig for å blokkere en forespørsel når spesifikke betingelser er oppfylt.
   Et hypotetisk eksempel på en signatur fra en modul: {{Excerpts.Module signature}}
