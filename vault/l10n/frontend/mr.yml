 Block negatives: "नकारात्मक गोष्टी ब्लॉक करायच्या?"
 Block non-verified requests: "पडताळणी न केलेल्या विनंत्या ब्लॉक करायच्या?"
 Blocked negatives: "ब्लॉक केलेले नकारात्मक"
