hints_client_hints: "!! Dette er et klienthint med lav entropi. Klienthints er en ny, eksperimentell nettteknologi som ennå ikke støttes bredt på tvers av alle nettlesere og større klienter. <em>Se: {{Links.MDN.Client hints}}.</em> Klienthints kan være nyttige for fingeravtrykk, men siden de ikke er allment støttet, bør deres tilstedeværelse i forespørsler ikke antas eller stoles på (dvs., blokkering basert på deres fravær er en dårlig idé)."
hints_client_honour: "Uansett hvordan vi instruerer klienten, er det viktig å huske at vi til syvende og sist ikke har kontroll over hva klienten velger å gjøre, og det er ingen garanti for at klienten vil respektere instruksjonene våre."
