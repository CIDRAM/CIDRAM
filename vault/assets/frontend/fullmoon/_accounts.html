<div class="nav">{nav}</div>
<hr />
<div class="s" id="stateMsg">{state_msg}</div>
<table>
<tr>
  <td class="h2 big"><div class="s">{field.Username}</div></td>
  <td class="h2 big"><div class="s">{field.Permissions}</div></td>
  <td class="h2 big"><div class="s">{field.Set new password}</div></td>
  <td class="h2f extend"><div class="s"><span class="big">{field.Options}</span><span class="mob">{link.Accounts}</span></div></td>
</tr>
<tr>
  <form action="?cidram-page=accounts" method="POST"><input name="cidram-form-target" type="hidden" value="accounts" /><input name="do" type="hidden" value="create-account" />
    <td class="h1 big"><input name="username" type="text" placeholder="{field.Username}" autocomplete="username" /></td>
    <td class="h1 big"><select name="permissions" title="{field.Permissions}"><option value="1">{label.Complete access}</option><option value="2">{label.Logs access only}</option><option value="3">Cronable</option></select></td>
    <td class="h1 big"><input name="password" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:w('pwdWarn',vulnerablePasswords.includes(this.value)||(this.value.length>0&&this.value.length<8)?'{PassInOnListWarn}':'')" onkeyup="javascript:w('pwdWarn',vulnerablePasswords.includes(this.value)||(this.value.length>0&&this.value.length<8)?'{PassInOnListWarn}':'')"/><small><br /><span id="pwdWarn" class="txtRd"></span></small></td>
    <td class="h1f extend">
      <div class="s big"><input type="submit" value="{field.Create new account}" /></div>
      <div class="s mob">
        <input name="username_mob" type="text" placeholder="{field.Username}" autocomplete="username" /><br />
        <select name="permissions_mob" title="{field.Permissions}"><option value="1">{label.Complete access}</option><option value="2">{label.Logs access only}</option><option value="3">Cronable</option></select><br />
        <input name="password_mob" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:w('pwdWarnMob',vulnerablePasswords.includes(this.value)||(this.value.length>0&&this.value.length<8)?'{PassInOnListWarn}':'')" onkeyup="javascript:w('pwdWarnMob',vulnerablePasswords.includes(this.value)||(this.value.length>0&&this.value.length<8)?'{PassInOnListWarn}':'')"/><small><br /><span id="pwdWarnMob" class="txtRd"></span></small><br />
        <input type="submit" value="{field.Create new account}" />
      </div>
    </td>
  </form>
</tr>
{Accounts}
</table>
