hints_client_hints: "!! Ovo je savjet klijenta s niskom entropijom. Ovo je nova, eksperimentalna web tehnologija koja još nije široko podržana. <em>Vidjeti: {{Links.MDN.Client hints}}.</em> Iako klijentski savjeti mogu biti korisni za otiske prstiju, budući da nisu naširoko podržani, ne treba pretpostavljati niti se na njih oslanjati na njihovu prisutnost u zahtjevima (tj., blokiranje na temelju njihove odsutnosti je loša ideja)."
