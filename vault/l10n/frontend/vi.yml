tip:
 2FA Sent: "Một email chứa mã 2FA đã được gửi đến địa chỉ email của bạn. Vui lòng xác nhận mã này bên dưới để có quyền truy cập vào front-end. Nếu bạn không nhận được email này, thử đăng xuất, đợi 10 phút, và đăng nhập lại để nhận email mới chứa mã mới."
 Accounts: "Trang tài khoản cho phép bạn kiểm soát những người có thể truy cập các front-end CIDRAM."
 Actions menu: "Chặn sẽ thêm 1 vào số lượng chữ ký. Đi qua sẽ trừ 1 vào số lượng chữ ký. Danh sách trắng đặt số lượng chữ ký thành 0 và chấm dứt quá trình xử lý, do đó bỏ qua hoàn toàn mọi quy tắc tiếp theo. Danh sách xám đặt số lượng chữ ký thành 0, nhưng không chấm dứt quá trình xử lý. Việc lập hồ sơ không ảnh hưởng đến số lượng chữ ký, nhưng hữu ích khi cần logic phức tạp hơn để xác định xem có nên thực hiện các loại hành động khác hay không, vì các hồ sơ được tạo có thể được liên kết với các điều kiện của các quy tắc tiếp theo. Sau khi xử lý, nếu số lượng chữ ký là 1 hoặc lớn hơn, yêu cầu sẽ bị chặn."
 Aggregator: "Tập hợp cho phép bạn thể hiện các IP, CIDR, và mặt nạ mạng theo cách nhỏ nhất có thể. Nhập dữ liệu được tập hợp và nhấn "OK"."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Giá trị được chấp nhận là bất kỳ CIDR nào có phạm vi bao phủ địa chỉ IP của yêu cầu. Ví dụ, 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, vv sẽ được chấp nhận cho 1.2.3.4. Để tránh kết quả sai tích cực, các phạm vi hẹp hơn (ví dụ, 1.2.3.4/32) thường được ưu tiên hơn các phạm vi rộng hơn (ví dụ, 0.0.0.0/1). Trang máy tính có thể được sử dụng để tìm ra các dải CIDR nào bao phủ một địa chỉ IP cụ thể."
 Auxiliary Rules Modes: "Chế độ xem hiển thị các quy tắc phụ trợ dưới dạng danh sách nhỏ gọn để dễ đọc. Bạn có thể mở rộng các quy tắc trong danh sách và hiển thị thêm thông tin chi tiết bằng cách nhấp vào chúng. Các tùy chọn để xuất hoặc xóa quy tắc sẽ được hiển thị khi nhấp vào biểu tượng tam giác (☰). Có thể thay đổi thứ tự các quy tắc bằng cách kéo và thả, kéo một quy tắc từ vị trí hiện tại đến vị trí mong muốn. Chế độ chỉnh sửa là cần thiết để sửa đổi các quy tắc phụ trợ, các trường có thể chỉnh sửa và tùy chọn để thêm điều kiện mới, webhook, hoặc logic khác vào các quy tắc khi cần thiết được cung cấp trên trang. Có thể tạo các quy tắc phụ trợ mới thông qua cả hai chế độ."
 Auxiliary Rules Priority: "Sự ưu tiên (cao nhất➡(công bằng🔄tương đương)➡thấp nhất):"
 Auxiliary Rules Webhooks: "Khi một quy tắc được đáp ứng, CIDRAM sẽ cố gắng thông báo cho bất kỳ webhooks nào được kết nối về sự kiện này. Webhook là một URL có khả năng nhận dữ liệu POST, và có thể hữu ích nếu có một dịch vụ, ứng dụng, tập lệnh, vv. bên ngoài được lưu trữ trên một mạng hoàn toàn khác với CIDRAM, mà bạn muốn xử lý dữ liệu do CIDRAM tạo ra về yêu cầu đó."
 Auxiliary Rules: "Bạn có thể sử dụng trang này để tạo, xóa, và sửa đổi các quy tắc phụ trợ cho CIDRAM."
 Backup: "Trang này có thể được sử dụng để nhập/xuất cấu hình của bạn, các quy tắc phụ trợ của bạn, vv. Điều này có thể hữu ích nếu bạn cần di chuyển dữ liệu qua các bản cài đặt khác nhau hoặc các phiên bản chính khác nhau."
 Cache Data: "Ở đây bạn có thể xem lại nội dung của bộ nhớ cache."
 Calculator: "Máy tính cho phép bạn để tính toán CIDR và mặt nạ mạng của một địa chỉ IP."
 Click the component name for more details: "Nhấp vào tên thành phần để biết thêm chi tiết."
 Configuration: "Trang cấu hình cho phép bạn chỉnh sửa các cấu hình CIDRAM từ các front-end."
 Enter IP address here: "Nhập địa chỉ IP ở đây."
 Enter IP address here (optional): "Nhập địa chỉ IP ở đây (tùy chọn)."
 Enter IP addresses here: "Nhập địa chỉ IP ở đây."
 Enter input here: "Nhập đầu vào ở đây."
 Enter queries here: "Nhập truy vấn ở đây."
 Enter query here (optional): "Nhập truy vấn ở đây (tùy chọn)."
 Enter referrer here (optional): "Nhập trang giới thiệu ở đây (tùy chọn)."
 Enter user agent here (optional): "Nhập đại lý người dùng ở đây (tùy chọn)."
 Enter user agents here: "Nhập đại lý người dùng ở đây."
 File Manager: "Quản lý tập tin cho phép bạn xóa bỏ, chỉnh sửa, tải lên, và tải về các tập tin. Sử dụng thận trọng (bạn có thể phá vỡ cài đặt của bạn với điều này)."
 Glossary: "Bảng thuật ngữ mô tả một số thuật ngữ được sử dụng bởi CIDRAM, nhằm làm rõ ý nghĩa dự định trong ngữ cảnh sử dụng."
 Greeting: "Xin chào, %s."
 Home: "Đây là trang chủ cho các front-end CIDRAM. Chọn một liên kết từ thực đơn bên trái để tiếp tục."
 How many infractions to incur: "Có bao nhiêu vi phạm để áp dụng."
 IP Testing: "Trang kiểm tra IP cho phép bạn kiểm tra nếu địa chỉ IP bị chặn bằng các chữ ký hiện đang được cài đặt."
 IP Tracking: "Các trang cho giám sát IP cho phép bạn kiểm tra tình trạng giám sát các địa chỉ IP, để kiểm tra mà trong số họ đã bị cấm, và hủy bỏ giám sát họ nếu bạn muốn làm như vậy."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Nếu yêu cầu kết nối từ địa chỉ IPv6 thuộc dải địa chỉ được sử dụng bởi cơ chế chuyển đổi IPv6 (ví dụ: 6to4, Teredo, ISATAP, vv), trường "địa chỉ IP (giải quyết)" sẽ được điền bằng địa chỉ IPv4 mà địa chỉ IPv6 đó được chuyển đổi thành theo cơ chế chuyển đổi IPv6 đó (ví dụ, nếu "địa chỉ IP" là "2002:c0a8:1::", thì "địa chỉ IP (giải quyết)" sẽ là "192.168.0.1"). Trong tất cả các trường hợp khác, trường "địa chỉ IP (giải quyết)" và trường "địa chỉ IP" sẽ giống nhau."
 Intersector: "Giao nhau có thể được sử dụng để xác định các yếu tố chung từ hai tập hợp phạm vi."
 Logs: "Chọn một bản ghi từ danh sách dưới đây để xem nội dung của bản ghi này."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Lưu ý rằng giá trị chính xác của quy tắc này sẽ giống với giá trị hiển thị trên trang thống kê tại thời điểm quy tắc được xử lý."
 Number of seconds until it expires: "Số giây cho đến khi hết hạn."
 Numeric comparison: "Để sử dụng so sánh số, hãy chọn so sánh chuỗi trực tiếp hoặc phát hiện phương pháp tự động, đảm bảo giá trị của điều kiện là số, và thêm toán tử mong muốn vào đầu nó.<br />Ví dụ, cho điều kiện "bằng", &gt;=2 cung cấp ≥2, &lt;=2 cung cấp ≤2, cho điều kiện "không bằng", &gt;=2 cung cấp ≱2, &lt;=2 cung cấp ≰2, vv."
 Range Tables: "Trang này hiển thị một số thông tin thống kê cơ bản về các phạm vi IP được bao phủ bởi các tập tin chữ ký đang hoạt động."
 Rate Limiting: "Trang này hiển thị hạn ngạch hiện có và được sử dụng liên quan đến giới hạn tốc độ."
 Rate limiting is currently disabled: "Lưu ý: Giới hạn tốc độ hiện bị vô hiệu hóa, nhưng có thể được kích hoạt thông qua trang cấu hình."
 Report to AbuseIPDB: "Trang này có thể được sử dụng để báo cáo địa chỉ IP cho AbuseIPDB, hay để xóa các báo cáo trước đó trong trường hợp địa chỉ IP được báo cáo có lỗi."
 Sections List: "Trang này liệt kê những phần nào tồn tại trong các tập tin chữ ký đang kích hoạt."
 See the documentation: "Xem <a href="{{Links.CIDRAM.Docs Base Path}}readme.vi.md\#user-content-SECTION5" hreflang="vi-VN" rel="noopener external"><span class="navicon documentation"></span>tài liệu</a> để biết thông tin về các chỉ thị cấu hình khác nhau và mục đích của họ."
 Server log snippets, abuse details, etc: "Trích đoạn từ nhật ký máy chủ, chi tiết lạm dụng, vv."
 Signature File Fixer: "Sửa chữa tập tin chữ ký cung cấp một cách để phát hiện và khắc phục các sự cố tiềm ẩn trong các tập tin chữ ký."
 Specify a URL, or leave blank to disregard: "Chỉ định URL, hoặc để trống để bỏ qua."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Chỉ định đường dẫn thư mục, hoặc để trống để sử dụng đường dẫn cơ sở CIDRAM."
 Specify a value, or leave blank to disregard: "Chỉ định một giá trị, hoặc để trống để bỏ qua."
 Statistics tracking is currently disabled: "Lưu ý: Giám sát thống kê hiện bị vô hiệu hóa, nhưng có thể được kích hoạt thông qua trang cấu hình."
 Statistics: "Trang này cho thấy một số thống kê của sử dụng cơ bản liên quan đến cài đặt CIDRAM của bạn."
 Subtractor: "Phép trừ có thể được sử dụng để trừ phạm vi IP/CIDR/mặt nạ mạng từ một phạm vi khác."
 Updates: "Trang cập nhật cho phép bạn cài đặt, gỡ bỏ cài đặt, và cập nhật các gói khác nhau cho CIDRAM (các gói cốt lõi, chữ ký, bổ sung, các tập tin L10N, vv)."
 When available, the value of the country code lookup: "Khi có sẵn, giá trị tra cứu mã quốc gia là mã quốc gia {{Links.ISO.3166}} gồm 2 chữ số. Ví dụ: US (Hoa Kỳ), RU (Nga), CN (Trung Quốc), vv."
warning: !lazy
 API_Rate_Limited: "Cảnh báo: Quyền truy cập vào %s API hiện có vẻ bị giới hạn tốc độ."
 Cookies: "Lưu ý: CIDRAM sử dụng một cookie để xác thực đăng nhập. Bằng cách đăng nhập, bạn đồng ý cho cookie được tạo và lưu trữ bởi trình duyệt của bạn."
 Editing PHP files: "Cảnh báo: Một số giải pháp bảo mật webhosting đã được biết là tự động cấm địa chỉ IP khi phát hiện các thẻ PHP trong các yêu cầu (ví dụ, khi cố gắng chỉnh sửa tập tin PHP thông qua trình duyệt). CIDRAM không có cách nào để biết liệu dịch vụ webhosting của bạn có sử dụng giải pháp bảo mật như vậy hay không. Để tránh những vấn đề như vậy, khuyến khích không chỉnh sửa tập tin PHP theo cách như vậy khi có thể."
 IP tests are disabled: "Cảnh báo: Kiểm tra IP bị vô hiệu hóa! Các tập tin chữ ký không thể được sử dụng cho đến khi điều này được giải quyết."
 JavaScript required: "Cảnh báo: Một số chức năng yêu cầu JavaScript. Để đảm bảo rằng toàn bộ giao diện hoạt động như mong đợi, bạn nên bật JavaScript."
 Likely to be overwritten: "Cảnh báo: Tập tin bạn hiện đang chỉnh sửa thuộc về thành phần, "%s". Bất kỳ thay đổi nào được thực hiện đối với tập tin này rất có thể bị ghi đè vào lần tiếp theo thành phần đó được cập nhật."
 Likely to become corrupted: "Cảnh báo: Đã phát hiện các byte không phải UTF8 trong tập tin hiện đang được chỉnh sửa. Tập tin có thể bị hỏng nếu được chỉnh sửa bằng tiện ích này."
 Modules are disabled: "Cảnh báo: Mô-đun bị vô hiệu hóa! Không thể sử dụng các mô-đun cho đến khi điều này được giải quyết."
 No modules are active: "Cảnh báo: Không có mô-đun nào đang hoạt động! Mô-đun có thể được kích hoạt bằng cách sử dụng các trang cấu hình hay cập nhật."
 No signature files are active: "Cảnh báo: Không có tập tin chữ ký nào đang hoạt động! Tập tin chữ ký có thể được kích hoạt bằng cách sử dụng các trang cấu hình hay cập nhật."
 Operating in dry run mode: "Cảnh báo: Đang hoạt động ở chế độ chạy khô! Khi ở chế độ chạy khô, các yêu cầu vẫn được kiểm tra và ghi lại dưới dạng các sự kiện chặn như bình thường, nhưng không có gì bị chặn."
 Operating in maintenance mode: "Cảnh báo: Đang hoạt động ở chế độ bảo trì! Khi ở chế độ bảo trì, không có gì được kiểm tra, ghi nhật ký, hoặc bị chặn."
 Page termination is disabled: "Cảnh báo: Tính năng chấm dứt trang bị vô hiệu hóa! Yêu cầu không thể bị chặn đúng cách cho đến khi điều này được giải quyết."
 Proceeding will log out all users: "Cảnh báo: Tiếp tục sẽ đăng xuất tất cả người dùng."
 The auxiliary rules execution stage is currently disabled: "Cảnh báo: Giai đoạn thực thi quy tắc phụ trợ hiện đang bị vô hiệu hóa."
 This account is not using a valid password: "Cảnh báo: Tài khoản này không được sử dụng một mật khẩu hợp lệ!"
 Using the default password: "Cảnh báo: Nó là sử dụng mật khẩu mặc định!"
