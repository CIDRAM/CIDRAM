  Optional module which detects unwanted bots, old browsers, and performs some sanity checks.<br />Contains some data from
  the Wordpress plugin "Stop Bad Bots" by William "Bill" Minozzi.<br />(A few webservices bots might need bypasses).
 False Positive Risk: "Medium"
 Version: "2025.243.0"
 Dependencies:
  PHP: "^7.2|^8"
  CIDRAM Core: "^3.7"
  CIDRAM Front-End: "^3"
  l10n/core/{lang}: ">=2025.208"
  l10n/frontend/{lang}: ">=2025.217"
 When Install Succeeds: ["queue message response.please_check_config"]
 When Update Succeeds:
  - "if {Components.Meta.BOBUAM.Version}<2025.186&&{Components.RemoteMeta.BOBUAM.Version}>=2025.186 then queue message <span dir="ltr" lang="en-AU">[BOBUAM 2025.186.0] Added support for Opera (configuration settings should be revised accordingly).</span>"
