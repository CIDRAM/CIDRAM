 signatures_conflict_response:
  pt-BR: "Quando há muitas tentativas simultâneas de acessar os mesmos recursos (por exemplo, solicitações simultâneas para vários processos PHP na mesma máquina para os mesmos recursos), algumas dessas tentativas podem falhar. No caso raro e improvável de isso afetar arquivos de assinatura ou módulos, o CIDRAM pode ser impedido de tomar uma decisão efetiva sobre a solicitação. Se isso acontecer, a solicitação deve ser bloqueada, e qual mensagem de status HTTP o CIDRAM deve enviar?"
  pt-PT: "Quando existem muitas tentativas simultâneas de aceder aos mesmos recursos (por exemplo, solicitações simultâneos para vários processos PHP na mesma máquina para os mesmos recursos), algumas destas tentativas podem falhar. No caso raro e improvável de isto afetar arquivos de assinatura ou módulos, o CIDRAM pode ser impedido de tomar uma decisão eficaz sobre o solicitação. Se isto acontecer, a solicitação deve ser bloqueado, e qual a mensagem de estado HTTP que o CIDRAM deve enviar?"
