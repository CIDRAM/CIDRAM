  pt-BR: "Insira o agente do usuário aqui (opcional)."
  pt-PT: "Insira o agente do utilizador aqui (opcional)."
 Enter user agents here:
  pt-BR: "Insira os agentes do usuário aqui."
  pt-PT: "Insira os agentes do utilizador aqui."
 File Manager:
  pt-BR: "O gerenciador de arquivos permite deletar, editar, carregar e descarregar arquivos. Use com cuidado (você poderia quebrar sua instalação com este)."
  pt-PT: "O gerenciador de arquivos permite deletar, editar, carregar e descarregar arquivos. Use com cuidado (poderia quebrar a sua instalação com este)."
 Glossary:
  pt-BR: "O glossário descreve alguns dos termos usados pelo CIDRAM, para ajudar a esclarecer o significado pretendido no contexto em que são usados."
  pt-PT: "O glossário descreve alguns dos termos utilizados pelo CIDRAM, para ajudar a esclarecer o significado pretendido no contexto em que são utilizados."
 Greeting: "Olá, %s."
 Home: "Esta é a página principal do CIDRAM front-end. Selecione um link no menu de navegação à esquerda para continuar."
 How many infractions to incur: "Quantas infrações incorrer."
 IP Testing: "A página para teste IP permite que você teste se os endereços IP são bloqueados pelas assinaturas atualmente instaladas."
 IP Tracking:
  pt-BR: "A página de monitoração IP permite verificar o status de monitoração de endereços IP, para verificar quais deles foram banidos, e para cancelar monitoração para eles se você quiser fazê-lo."
  pt-PT: "A página de monitorização IP permite verificar o estado de monitorização de endereços IP, para verificar quais deles foram banidos, e para cancelar a monitorização para os mesmos se quiser fazê-lo."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism:
  pt-BR: "Se uma solicitação se conectar a partir de um endereço IPv6 pertencente a um intervalo usado por um mecanismo de transição IPv6 (por exemplo, 6to4, Teredo, ISATAP, etc), o campo "endereço IP (resolvido)" será preenchido com o endereço IPv4 para o qual esse endereço IPv6 é traduzido sob esse mecanismo de transição IPv6 (por exemplo, se o "endereço IP" for "2002:c0a8:1::", o "endereço IP (resolvido)" será "192.168.0.1"). Em todos os outros casos, os campos "endereço IP (resolvido)" e "endereço IP" serão iguais."
  pt-PT: "Se uma solicitação se ligar a partir de um endereço IPv6 pertencente a um intervalo utilizado por um mecanismo de transição IPv6 (por exemplo, 6to4, Teredo, ISATAP, etc), o campo "endereço IP (resolvido)" será preenchido com o endereço IPv4 para o qual esse endereço IPv6 é traduzido ao abrigo deste mecanismo de transição IPv6 (por exemplo, se o "endereço IP" for "2002:c0a8:1::", o "endereço IP (resolvido)" será "192.168.0.1"). Em todos os outros casos, os campos "endereço IP (resolvido)" e "endereço IP" serão iguais."
 Intersector:
  pt-BR: "O intersetor pode ser usado para determinar os fatores comuns de dois conjuntos de alcances."
  pt-PT: "O intersetor pode ser utilizado para determinar os fatores comuns de dois conjuntos de alcances."
 Logs: "Selecionar um arquivo de log da lista abaixo para visualizar o conteúdo desse arquivo de log."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Note que o valor exato desta estatística será o mesmo que o apresentado na página de estatísticas no momento em que a regra é processada."
 Number of seconds until it expires: "Número de segundos até expirar."
 Numeric comparison:
  pt-BR: "Para usar a comparação numérica, selecione comparação direta de strings ou detecção automática de método, certifique-se de que o valor da condição seja numérico, e prefixe-o com o operador desejado.<br />Por exemplo, para condições "iguais", &gt;=2 fornece ≥2, &lt;=2 fornece ≤2, para condições "não iguais", &gt;=2 fornece ≱2, &lt;=2 fornece ≰2, etc."
  pt-PT: "Para usar a comparação numérica, selecione comparação direta de strings ou deteção automática de método, certifique-se de que o valor da condição seja numérico, e prefixe-o com o operador desejado.<br />Por exemplo, para condições "iguais", &gt;=2 fornece ≥2, &lt;=2 fornece ≤2, para condições "não iguais", &gt;=2 fornece ≱2, &lt;=2 fornece ≰2, etc."
 Range Tables: "Esta página mostra algumas informações estatísticas básicas sobre os IPs abrangidos pelos arquivos de assinatura ativos no momento."
 Rate Limiting: "Esta página mostra o uso e a disponibilidade da cota atual em relação à limitação de taxa."
 Rate limiting is currently disabled: "Nota: A limitação de taxa está desativado atualmente, mas pode ser ativado através da página de configuração."
 Report to AbuseIPDB:
  pt-BR: "Esta página pode ser usado para relatar endereços IP ao AbuseIPDB, ou para deletar relatórios anteriores caso um endereço IP tenha sido relatado por engano."
  pt-PT: "Esta página pode ser utilizada para relatar endereços IP ao AbuseIPDB, ou para deletar relatórios anteriores caso um endereço IP tenha sido relatado por engano."
 Sections List:
  pt-BR: "Esta página lista quais seções existem nos arquivos de assinatura atualmente ativos."
  pt-PT: "Esta página lista quais secções existem nos arquivos de assinatura atualmente ativos."
 See the documentation:
  pt-BR: "Consulte a <a href="{{Links.CIDRAM.Docs Base Path}}readme.pt.md\#user-content-SECTION5" hreflang="pt" rel="noopener external"><span class="navicon documentation"></span>documentação</a> para obter informações sobre as várias diretrizes de configuração e seus objetivos."
  pt-PT: "Consulte a <a href="{{Links.CIDRAM.Docs Base Path}}readme.pt.md\#user-content-SECTION5" hreflang="pt" rel="noopener external"><span class="navicon documentation"></span>documentação</a> para obter informações sobre as várias diretrizes de configuração e os seus objetivos."
 Server log snippets, abuse details, etc: "Trechos de log do servidor, detalhes de abuso, etc."
 Signature File Fixer: "O fixador para os arquivos de assinatura fornece uma maneira de detectar e corrigir possíveis problemas em arquivos de assinatura."
 Specify a URL, or leave blank to disregard:
  pt-BR: "Especifique uma URL, ou deixe em branco para desconsiderar."
  pt-PT: "Especifique um URL, ou deixe-o em branco para desconsiderar."
 Specify a directory path, or leave blank to use the CIDRAM base path:
  pt-BR: "Especifique um caminho de diretório, ou deixe em branco para usar o caminho base do CIDRAM."
  pt-PT: "Especifique um caminho de diretório, ou deixe-o em branco para utilizar o caminho base do CIDRAM."
 Specify a value, or leave blank to disregard:
  pt-BR: "Especifique um valor, ou deixe em branco para desconsiderar."
  pt-PT: "Especifique um valor, ou deixe-o em branco para desconsiderar."
 Statistics tracking is currently disabled: "Nota: O monitoramento de estatísticas está desativado atualmente, mas pode ser ativado através da página de configuração."
 Statistics: "Esta página mostra algumas estatísticas de uso básicas relativas à instalação do CIDRAM."
 Subtractor:
  pt-BR: "O subtrator pode ser usado para subtrair um alcance de IPs/CIDRs/máscaras de rede de outro."
  pt-PT: "O subtrator pode ser utilizado para subtrair um alcance de IPs/CIDRs/máscaras de rede de outro."
 Updates: "A página de atualizações permite que você instale, desinstale, e atualize os vários componentes do CIDRAM (o pacote principal, assinaturas, arquivos de L10N, etc)."
 When available, the value of the country code lookup:
  pt-BR: "Quando disponível, o valor da pesquisa de código de país é um código de país {{Links.ISO.3166}} de 2 dígitos. Por exemplo, US para os Estados Unidos, RU para Rússia, CN para China, etc."
  pt-PT: "Quando disponível, o valor da pesquisa de código de país é um código de país {{Links.ISO.3166}} de 2 dígitos. Por exemplo, US para os Estados Unidos, RU para a Rússia, CN para a China, etc."
warning: !lazy
 API_Rate_Limited: "Atenção: O acesso à API %s parece ser atualmente limitado por taxa."
 Cookies: "Nota: CIDRAM usa um cookie para autenticar logins. Ao efetuar o login, você dá seu consentimento para que um cookie seja criado e armazenado pelo seu navegador."
 Editing PHP files:
  pt-BR: "Atenção: Algumas soluções de segurança de hospedagem na web são conhecidas por banir automaticamente endereços IP ao detectar tags PHP em solicitações (por exemplo, ao modificar arquivos PHP por meio de um navegador). O CIDRAM não tem como saber se seu serviço de hospedagem na web usa tal solução de segurança. Para evitar tais problemas, é recomendado não editar arquivos PHP dessa forma quando possível."
  pt-PT: "Atenção: Algumas soluções de segurança de alojamento web são conhecidas por banir automaticamente os endereços IP ao detetar tags PHP em solicitações (por exemplo, ao modificar arquivos PHP por meio de um navegador). O CIDRAM não tem forma de saber se o seu serviço de alojamento web utiliza tal solução de segurança. Para evitar tais problemas, é recomendado não editar arquivos PHP desta forma quando possível."
 IP tests are disabled: "Atenção: Os testes de IP estão desabilitados! Os arquivos de assinatura não podem ser utilizados até que isso seja resolvido."
 JavaScript required: "Atenção: Algumas funcionalidades do front-end requerem JavaScript. Para garantir que todo o front-end se comporte conforme o esperado, é recomendável ativar o JavaScript."
 Likely to be overwritten:
  pt-BR: "Atenção: O arquivo que você está editando no momento pertence ao componente "%s". Quaisquer alterações feitas neste arquivo provavelmente serão sobrescritas na próxima vez que o componente for atualizado."
  pt-PT: "Atenção: O arquivo que está a editar no momento pertence ao componente "%s". Quaisquer alterações feitas neste arquivo provavelmente serão sobrescritas na próxima vez que o componente for atualizado."
 Likely to become corrupted:
  pt-BR: "Atenção: Bytes não UTF8 foram detectados no arquivo que está sendo editado. O arquivo será provavelmente corrompido se editado usando esta funcionalidade específica."
  pt-PT: "Atenção: Bytes não UTF8 foram detectados no arquivo que está a ser editado. O arquivo será provavelmente corrompido se editado utilizando esta funcionalidade específica."
 Modules are disabled: "Atenção: Os módulos estão desabilitados! Os módulos não podem ser utilizados até que isso seja resolvido."
 No modules are active:
  pt-BR: "Atenção: Nenhum módulo está ativo! Os módulos podem ser ativados usando as páginas de configuração ou atualizações."
  pt-PT: "Atenção: Nenhum módulo está ativo! Os módulos podem ser ativados utilizando as páginas de configuração ou atualizações."
 No signature files are active:
  pt-BR: "Atenção: Nenhum arquivo de assinatura está ativo! Os arquivos de assinatura podem ser ativados usando as páginas de configuração ou atualizações."
