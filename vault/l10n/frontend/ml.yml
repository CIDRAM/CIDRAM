 frontend_remotes: "ഘടക മെറ്റാഡാറ്റ ലഭ്യമാക്കാൻ അപ്‌ഡേറ്റ് പേജ് ഉപയോഗിക്കുന്ന വിലാസങ്ങളുടെ ഒരു പട്ടിക. ഒരു പുതിയ പ്രധാന പതിപ്പിലേക്ക് അപ്‌ഗ്രേഡ് ചെയ്യുമ്പോഴോ അപ്‌ഡേറ്റുകൾക്കായി ഒരു പുതിയ ഉറവിടം പ്രയോഗിക്കുമ്പോൾ ഇത് ക്രമീകരിക്കേണ്ടി വന്നേക്കാം, പക്ഷേ സാധാരണ സാഹചര്യങ്ങളിൽ അത് അതേപടി വിടണം."
 frontend_signatures_update_event_log: "ഫ്രണ്ട്-എൻഡ് വഴി ഒപ്പുകൾ അപ്ഡേറ്റ് ചെയ്യുമ്പോൾ രേഖപ്പെടുത്തുന്നതിനായി ഒരു ഫയൽ. ഒരു ഫയലിൻ്റെ പേര് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
