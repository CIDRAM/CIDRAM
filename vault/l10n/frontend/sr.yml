 rate_limiting_hint: "Имајте на уму да, као и код свих осталих ЦИДРАМ функционалности, ЦИДРАМ-ова функционалност ограничавања брзине може применити само на оне странице и ресурсе на које је ЦИДРАМ повезан. То би обично значило да ресурси који нису из PHP-а не би били обухваћени осим тамо где их експлицитно опслужују повезани PHP ресурси. Ако сте у могућности да користите серверски модул, cPanel, или неки други мрежни алат за ограничавање брзине, било би боље да користите то уместо ЦИДРАМ-ове функционалности ограничавања брзине. Такође имајте на уму да би оштар и одлучан корисник могао лако да заобиђе ограничење брзине ротирањем њихове ИП адресе или преласком на прокси или ВПН провајдера о коме ЦИДРАМ још увек није свестан, и имајте на уму да ограничавање брзине може бити веома фрустрирајуће за стварне, реалне крајње кориснике. Понекад може бити потребно, али ретко је пожељно."
