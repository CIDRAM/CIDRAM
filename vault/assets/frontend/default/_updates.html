<div class="mainbox">
  <nav class="big">
{nav}
    <div class="ng1 idx"><div class="subNav">{field.Components}</div><div class="col">{Indexes}
    </div></div>
  </nav>
  <main class="extend">
    <div class="col">
      <div class="s flexstretch">{state_msg}</div>
    </div>
    <div class="duo h1">
      <div class="s va">{label.Components to display}{pair_separator}<span id="dspCtrl" class="navicon dspCtrl stateA hoverglow" onclick="javascript:y=document.getElementById('dspCtrl'),y.classList.contains('stateA')?(y.classList.add('stateR'),y.classList.remove('stateA','stateM','stateL'),qOrd=document.querySelectorAll('[data-is-outdated]'),qOrd.forEach((x)=>{x.style.display=x.dataset.isOutdated==='yes'?'block':'none',document.getElementById('dspText').textContent='{label.Only those with updates available}'})):y.classList.contains('stateR')?(y.classList.add('stateM'),y.classList.remove('stateA','stateR','stateL'),qOrd=document.querySelectorAll('[data-is-installed]'),qOrd.forEach((x)=>{x.style.display=x.dataset.isInstalled==='yes'?'block':'none',document.getElementById('dspText').textContent='{label.Only those installed}'})):y.classList.contains('stateM')?(y.classList.add('stateL'),y.classList.remove('stateA','stateM','stateR'),qOrd=document.querySelectorAll('[data-is-installed]'),qOrd.forEach((x)=>{x.style.display=x.dataset.isInstalled==='yes'?'none':'block',document.getElementById('dspText').textContent='{label.Only those not installed}'})):y.classList.contains('stateL')?(y.classList.add('stateA'),y.classList.remove('stateL','stateM','stateR'),qOrd=document.querySelectorAll('[data-is-outdated],[data-is-installed]'),qOrd.forEach((x)=>{x.style.display='block',document.getElementById('dspText').textContent='{label.All of them}'})):''" aria-labelledby="dspText" tabindex="0" role="button"></span> <span id="dspText">{label.All of them}</span>
      </div>
      <div class="reverse va">
        {UpdateAll}
      </div>
    </div>
    <div class="quad">
      <div class="h2 s" style="order:-4">{field.Component} <span id="orderByID" class="navicon pointer down hoverglow" onclick="javascript:y=document.getElementById('orderByID'),y.classList.contains('down')?(y.classList.add('up'),y.classList.remove('down','neutral'),qOrd=document.querySelectorAll('[data-order-default-rev]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderDefaultRev})):(y.classList.add('down'),y.classList.remove('up','neutral'),qOrd=document.querySelectorAll('[data-order-default]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderDefault})),z=document.getElementById('orderByAZ'),z.classList.add('neutral'),z.classList.remove('up','down'),z=document.getElementById('orderByTime'),z.classList.add('neutral'),z.classList.remove('up','down')" tabindex="0" role="button"></span> ({label.A-Z} <span id="orderByAZ" class="navicon pointer neutral hoverglow" onclick="javascript:y=document.getElementById('orderByAZ'),y.classList.contains('down')?(y.classList.add('up'),y.classList.remove('down','neutral'),qOrd=document.querySelectorAll('[data-order-az-rev]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderAzRev})):(y.classList.add('down'),y.classList.remove('up','neutral'),qOrd=document.querySelectorAll('[data-order-az]'),qOrd.forEach((x)=>{x.style.order=x.dataset.orderAz})),z=document.getElementById('orderByID'),z.classList.add('neutral'),z.classList.remove('up','down'),z=document.getElementById('orderByTime'),z.classList.add('neutral'),z.classList.remove('up','down')" tabindex="0" role="button"></span>)</div>
      <div class="h2 s big" style="order:-3">{field.Your version}</div>
      <div class="h2 s big" style="order:-2">{field.Latest version}</div>
      <div class="h2f s" style="order:-1">{field.Status} | {field.Options}</div>
{Components}    </div>
    <div class="duo">
      <div class="h2 s">{field.Macro}</div>
      <div class="h2f s">{field.Options}</div>
{Macros}    </div>
  </main>
</div>
