 Lock CAPTCHAs to the IP address of the user completing the CAPTCHA but not to the actual user: "Закључајте ЦАПТЦХА провере на ИП адресу корисника који их попуњава, али не и на самог корисника.\nКолачићи се НЕ користе за идентификацију корисника. Када се приступ поново добије због успешног завршетка ЦАПТЦХА провере, то се примењује на свакога ко се повезује са исте ИП адресе."
 Lock CAPTCHAs to the user completing the CAPTCHA as well as to their IP address: "Закључајте ЦАПТЦХА-е за корисника који их попуњава, као и за њихову ИП адресу.\nКолачићи се користе за идентификацију корисника. Када се приступ поново добије због успешног завршетка ЦАПТЦХА провере, то се примењује само на корисника који је завршио ЦАПТЦХА проверу и неће трајати ако се његова ИП адреса промени."
 Lock CAPTCHAs to the user completing the CAPTCHA but not to their IP address: "Закључајте ЦАПТЦХА провере за корисника који их попуњава, али не и за његову ИП адресу.\nКолачићи се користе за идентификацију корисника. Када се приступ поново добије због успешног завршетка ЦАПТЦХА провере, то се примењује само на корисника који је завршио ЦАПТЦХА проверу и остаће активан све док је њихов колачић важећи, чак и ако се њихова ИП адреса промени."
