<div class="mainbox">
  <nav class="big">
{nav}  </nav>
  <main class="extend">
    <form action="?cidram-page=aggregator" method="POST">
      <div class="col">
        <div class="s flexstretch">{state_msg}</div>
        <div class="h1f center flexstretch"><textarea name="input" placeholder="{tip.Enter IP addresses here}">{input}</textarea></div>
      </div>
      <div class="duo">
        <div class="h1 center">{OutputFormat}</div>
        <div class="h1f center"><input type="submit" value="{field.OK} [0]" accesskey="0" /></div>
      </div><!-- Output Begin -->
      <div class="col">
        <div class="h1f s flexstretch">
          {ResultLine}<br />
          <hr />
          <textarea id="rangeOutput" readonly>{output}</textarea>
          <div class="clipMar"><span class="navicon clipboard" onclick="javascript:if(navigator.clipboard){navigator.clipboard.writeText(getElementById('rangeOutput').value);getElementById('rangeSvg_copied').className='sFade'}else{getElementById('rangeSvg_failed').style.className='sFade'}" tabindex="0" role="button"></span><span id="rangeSvg_copied" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtGn">{response.Copied}</span></span><span id="rangeSvg_failed" class="sHide" onanimationend="javascript:this.className='sHide'"><span class="txtRd">{response.Failed}</span></span></div>
        </div>
      </div><!-- Output End -->
    </form>
  </main>
</div>
