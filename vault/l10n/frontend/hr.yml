tip:
 2FA Sent: "E-pošta koja sadrži kod za provjeru autentičnosti u dva faktora poslana je na vašu adresu e-pošte. Potvrdite ovaj kod u nastavku da biste dobili pristup front-endu. Ako niste primili ovu e-poruku, pokušajte se odjaviti, pričekajte 10 minuta, i ponovno se prijavite kako biste primili novu e-poruku koja sadrži novi kod."
 Accounts: "Stranica s računima omogućuje vam kontrolu tko može pristupiti front-endu CIDRAM-a."
 Actions menu: "Blokiranje dodaje 1 broju potpisa. Zaobilaženjem se od broja potpisa oduzima 1. Bijela lista postavlja broj potpisa na 0 i prekida obradu, čime se u potpunosti preskaču sva sljedeća pravila. Siva lista postavlja broj potpisa na 0, ali ne prekida obradu. Profiliranje ne utječe na broj potpisa, ali je korisno kada je potrebna složenija logika za određivanje treba li izvršiti druge vrste radnji, jer se generirani profili mogu povezati s uvjetima sljedećih pravila. Nakon obrade, ako je broj potpisa 1 ili veći, zahtjev će biti blokiran."
 Aggregator: "Agregator vam omogućuje izražavanje IP-ova, CIDR-ova, i mrežnih maski na najmanji mogući način. Unesite podatke koje želite agregirati i pritisnite "OK"."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Prihvaćena vrijednost je bilo koji CIDR s rasponom koji pokriva IP adresu zahtjeva. Npr., 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, itd bi bili prihvaćeni za 1.2.3.4. Kako bi se izbjegli lažno pozitivni, uži rasponi (npr., 1.2.3.4/32) općenito su poželjniji od širih raspona (npr., 0.0.0.0/1). Stranica kalkulatora može se koristiti za pronalaženje CIDR-ova koji imaju raspone koji pokrivaju određenu IP adresu."
 Auxiliary Rules Modes: "Način prikaza prikazuje pomoćna pravila kao sažeti popis radi lakšeg čitanja. Pravila na popisu mogu se proširiti i prikazati dodatni detalji klikom na njih. Opcije za izvoz ili brisanje pravila prikazat će se klikom na trigram (☰). Redoslijed pravila može se promijeniti metodom povlačenja i ispuštanja, povlačenjem pravila s postojećeg položaja na željeni položaj. Za izmjenu pomoćnih pravila potreban je način uređivanja, polja za uređivanje i opcije za dodavanje novih uvjeta, webhookova, ili druge logike pravilima prema potrebi na stranici. Nova pomoćna pravila mogu se kreirati putem bilo kojeg načina."
 Auxiliary Rules Priority: "Prioritet (najviši➡(jednak🔄ekvivalent)➡najniža):"
 Auxiliary Rules Webhooks: "Kada se pravilo pokrene, CIDRAM će pokušati obavijestiti sve povezane web-dojavnike o događaju. Webhook je URL koji može primati POST podatke, i mogao bi biti koristan ako postoji vanjska usluga, aplikacija, skripta itd hostirana na potpuno drugoj mreži od CIDRAM-a, a želite da obrađuje podatke koje generira CIDRAM o zahtjevu."
 Auxiliary Rules: "Ovu stranicu možete koristiti za stvaranje, brisanje, i izmjenu pomoćnih pravila za CIDRAM."
 Backup: "Ova se stranica može koristiti za uvoz/izvoz vaše konfiguracije, pomoćnih pravila, itd. Ovo može biti korisno ako trebate premjestiti podatke na različite instalacije ili različite glavne verzije."
 Cache Data: "Ovdje možete pregledati sadržaj predmemorije."
 Calculator: "Kalkulator vam omogućuje izračunavanje CIDR-ova i mrežnih maski IP adrese."
 Click the component name for more details: "Pritisnite naziv komponente za više pojedinosti."
 Configuration: "Konfiguracijska stranica vam omogućuje izmjenu konfiguracije za CIDRAM s front-enda."
 Enter IP address here: "Ovdje unesite IP adresu."
 Enter IP address here (optional): "Ovdje unesite IP adresu (opcionalno)."
 Enter IP addresses here: "Ovdje unesite IP adrese."
 Enter input here: "Ovdje unesite unos."
 Enter queries here: "Ovdje unesite upite."
 Enter query here (optional): "Ovdje unesite upit (opcionalno)."
 Enter referrer here (optional): "Ovdje unesite referenta (opcionalno)."
 Enter user agent here (optional): "Ovdje unesite korisničkog agenta (opcionalno)."
 Enter user agents here: "Ovdje unesite korisničke agente."
 File Manager: "Upravitelj datoteka omogućuje vam brisanje, uređivanje, učitavanje, i preuzimanje datoteka. Koristite s oprezom (ovo bi moglo pokvariti vašu instalaciju)."
 Greeting: "Zdravo, %s."
 Home: "Ovo je početna stranica za CIDRAM front-end. Za nastavak, odaberite vezu iz navigacijskog izbornika s lijeve strane."
 How many infractions to incur: "Koliko prekršaja treba napraviti."
 IP Testing: "Stranica za testiranje IP-a omogućuje vam da testirate jesu li IP adrese blokirane trenutno instaliranim potpisima."
 IP Tracking: "Stranica za praćenje IP adresa omogućuje vam da provjerite status praćenja IP adresa, da provjerite koje su od njih zabranjene i, ako je potrebno, da uklonite zabrane ili status praćenja."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Ako zahtjev dolazi s IPv6 adrese koja pripada rasponu koji koristi IPv6 mehanizam prijelaza (npr., 6to4, Teredo, ISATAP, itd), polje "IP adresa (riješeno)" bit će popunjeno IPv4 adresom u koju se ta IPv6 adresa prevodi prema tom IPv6 mehanizmu prijelaza (npr., ako "IP adresa" je "2002:c0a8:1::", "IP adresa (riješeno)" bit će "192.168.0.1"). U svim ostalim slučajevima, polja "IP adresa (riješeno)" i "IP adresa" bit će ista."
 Intersector: "Intersektor se može koristiti za određivanje zajedničkih faktora iz dva skupa raspona."
 Logs: "Odaberite datoteku dnevnika s donjeg popisa kako biste vidjeli sadržaj te datoteke dnevnika."
 Number of seconds until it expires: "Broj sekundi do isteka."
 Numeric comparison: "Da biste koristili numeričku usporedbu, odaberite izravnu usporedbu niza ili automatsko otkrivanje metode, osigurajte da je vrijednost uvjeta numerička, i ispred nje dodajte željeni operator.<br />Npr., za uvjete "jednako", &gt;=2 daje ≥2, &lt;=2 daje ≤2, za uvjete "nije jednako", &gt;=2 daje ≱2, &lt;=2 daje ≰2, itd."
 Range Tables: "Ova stranica prikazuje neke osnovne statističke podatke o IP rasponima koje pokrivaju trenutno aktivne datoteke potpisa."
 Rate Limiting: "Ova stranica prikazuje trenutnu iskorištenost kvote i dostupnost u pogledu ograničenja brzine."
 Rate limiting is currently disabled: "Bilješka: Ograničenje brzine trenutno je onemogućeno, ali se može omogućiti putem konfiguracijske stranice."
 Report to AbuseIPDB: "Ova se stranica može koristiti za prijavu IP adresa AbuseIPDB-u, ili za brisanje prethodnih izvješća u slučaju da je IP adresa prijavljena pogreškom."
 Sections List: "Ova stranica navodi koji odjeljci postoje u trenutno aktivnim datotekama potpisa."
 See the documentation: "Pogledajte <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>dokumentaciju</a> za informacije o raznim konfiguracijskim direktivama i njihovim svrhama."
 Server log snippets, abuse details, etc: "Isječci dnevnika poslužitelja, pojedinosti o zlouporabi, itd."
 Signature File Fixer: "Popravljač datoteka potpisa omogućuje otkrivanje i popravljanje potencijalnih problema u datotekama potpisa."
 Specify a URL, or leave blank to disregard: "Navedite URL, ili ostavite prazno da bi se to ignoriralo."
 Specify a value, or leave blank to disregard: "Navedite vrijednost, ili ostavite prazno da bi se to ignoriralo."
 Statistics tracking is currently disabled: "Bilješka: Praćenje statistike trenutno je onemogućeno, ali se može omogućiti putem konfiguracijske stranice."
 Statistics: "Ova stranica prikazuje neke osnovne statistike korištenja u vezi s vašom CIDRAM instalacijom."
 Subtractor: "Oduzimač se može koristiti za oduzimanje jednog raspona IP-ova/CIDR-ova/mrežnih maski od drugog."
 Updates: "Stranica ažuriranja vam omogućuje instaliranje, deinstaliranje, i ažuriranje različitih komponenti CIDRAM-a (temeljni paket, potpisi, L10N datoteke, itd)."
 When available, the value of the country code lookup: "Kada je dostupno, vrijednost pretrage koda države je dvoznamenkasti {{Links.ISO.3166}} kod države. Npr., US za Sjedinjene Američke Države, RU za Rusiju, CN za Kinu, itd."
warning: !lazy
 API_Rate_Limited: "Upozorenje: Čini se da je pristup API-ju %s trenutačno ograničena stopa."
 Cookies: "Bilješka: CIDRAM koristi kolačić za provjeru autentičnosti prijava. Prijavom dajete suglasnost da vaš preglednik kreira i pohranjuje kolačić."
 Editing PHP files: "Upozorenje: Poznato je da neka sigurnosna rješenja webhostinga automatski zabranjuju IP adrese nakon otkrivanja PHP oznaka unutar zahtjeva (npr., kada pokušavate modificirati PHP datoteke putem preglednika). CIDRAM nema načina da sazna koristi li vaša webhosting usluga takvo sigurnosno rješenje. Kako bi se izbjegli takvi problemi, preporuča se ne uređivati PHP datoteke na takav način kada je to moguće."
 IP tests are disabled: "Upozorenje: IP testovi su onemogućeni! Datoteke potpisa ne mogu se koristiti dok se to ne riješi."
 JavaScript required: "Upozorenje: Neke front-end funkcije zahtijevaju JavaScript. Kako biste osigurali da se cijeli front-end ponaša prema očekivanjima, preporučuje se omogućiti JavaScript."
 Likely to be overwritten: "Upozorenje: Datoteka koju trenutno uređujete pripada komponenti "%s". Sve promjene napravljene u ovoj datoteku vrlo će vjerojatno biti prepisane sljedeći put kada se ta komponenta ažurira."
 Likely to become corrupted: "Upozorenje: U datoteci koja se trenutno uređuje otkriveni su bajtovi koji nisu UTF8. Datoteka će se vjerojatno oštetiti ako se uređuje pomoću ovog određenog alata."
 Modules are disabled: "Upozorenje: Moduli su onemogućeni! Moduli se ne mogu koristiti dok se to ne riješi."
 No modules are active: "Upozorenje: Nijedan modul nije omogućen! Moduli se mogu aktivirati pomoću stranica za konfiguraciju ili ažuriranja."
 No signature files are active: "Upozorenje: Nijedan datoteka potpisa nije omogućen! Datoteke potpisa mogu se aktivirati pomoću stranica za konfiguraciju ili ažuriranja."
 Operating in dry run mode: "Upozorenje: U režimu rada na suho! Dok je u režimu rada na suho, zahtjevi se i dalje provjeravaju i bilježe kao blokirani događaji kao i obično, ali ništa nije blokirano."
 Operating in maintenance mode: "Upozorenje: U režimu održavanja! Dok je u režimu održavanja, ništa se ne provjerava, ne bilježi, niti blokira."
 Page termination is disabled: "Upozorenje: Zatvaranje stranice je onemogućeno! Zahtjevi se ne mogu ispravno blokirati dok se ovo ne riješi."
 Proceeding will log out all users: "Upozorenje: Nastavkom će se odjaviti svi korisnici."
 The auxiliary rules execution stage is currently disabled: "Upozorenje: Faza izvršavanja pomoćnih pravila je trenutno onemogućena."
 This account is not using a valid password: "Upozorenje: Ovaj račun ne koristi važeću lozinku!"
 Using the default password: "Upozorenje: Korištenje zadane lozinke!"
