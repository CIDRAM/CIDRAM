 projecthoneypot_max_ts_for_captcha: "Maksimalni skor pretnje koji je dozvoljen za posluživanje CAPTCHA (mora biti broj između 1 i 100). Zadano = 10."
 projecthoneypot_minimum_threat_score: "Minimalni rezultat prijetnje potreban da bi CIDRAM blokirao IP adresu (mora biti broj između 1 i 100). Zadano = 10."
