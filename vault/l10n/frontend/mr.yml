 2FA Sent: "तुमच्या ईमेल पत्त्यावर द्वि-घटक प्रमाणीकरण कोड असलेला ईमेल पाठवला गेला आहे. फ्रंट-एंडमध्ये प्रवेश मिळविण्यासाठी कृपया खालील कोडची पुष्टी करा. जर तुम्हाला हा ईमेल मिळाला नसेल, तर लॉग आउट करून, १० मिनिटे वाट पाहत, आणि पुन्हा लॉग इन करून नवीन कोड असलेला ईमेल मिळवा."
 Accounts: "खाती पृष्ठ तुम्हाला CIDRAM फ्रंट-एंड कोण अॅक्सेस करू शकते हे नियंत्रित करण्याची परवानगी देते."
 Actions menu: "अवरोधित केल्याने स्वाक्षरींच्या संख्येत १ ची भर पडते. बायपास केल्याने स्वाक्षरींच्या संख्येतून १ वजा होतो. श्वेतसूचीबद्ध केल्याने स्वाक्षरींची संख्या ० वर सेट होते आणि प्रक्रिया बंद होते, त्यामुळे पुढील कोणतेही नियम पूर्णपणे वगळले जातात. ग्रेलिस्ट केल्याने स्वाक्षरींची संख्या ० वर सेट करते, परंतु प्रक्रिया समाप्त करत नाही. प्रोफाइल केल्याने स्वाक्षरींच्या संख्येवर परिणाम करत नाही, परंतु इतर प्रकारच्या कृती करायच्या की नाही हे ठरवण्यासाठी अधिक जटिल तर्कशास्त्र आवश्यक असल्यास ते उपयुक्त ठरते, कारण जनरेट केलेले प्रोफाइल पुढील नियमांच्या अटींशी जोडले जाऊ शकतात. प्रक्रिया केल्यानंतर, जर स्वाक्षऱ्यांची संख्या १ किंवा त्याहून अधिक असेल, तर विनंती अवरोधित केली जाईल."
