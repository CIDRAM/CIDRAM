 by_default_ips: |
  डीफॉल्टनुसार, IP पत्ते सर्व स्वाक्षरी फायली, सर्व मॉड्यूल, सर्व सहाय्यक
  नियमांविरुद्ध तपासले जातात, आणि सोशल मीडिया आणि शोध इंजिन पडताळणीच्या
  विरुद्ध तपासले.
  --no-ban    बंदी घातली आहे की नाही हे तपासण्यास प्रतिबंधित करते.
  --no-sig    स्वाक्षरी फायलींविरुद्ध चाचणी प्रतिबंधित करते.
  --no-mod    मॉड्यूल विरुद्ध चाचणी प्रतिबंधित करते.
  --no-sev    शोध इंजिन पडताळणी प्रतिबंधित करते.
  --no-smv    सोशल मीडिया पडताळणी प्रतिबंधित करते.
  --no-ov     इतर पडताळणी प्रतिबंधित करते.
  --no-aux    सहाय्यक नियमांविरुद्ध चाचणी प्रतिबंधित करते.
