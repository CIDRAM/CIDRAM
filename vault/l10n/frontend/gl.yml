tip:
 2FA Sent: "Enviouse un correo electrónico que contén un código de autenticación de dous factores ao teu enderezo de correo electrónico. Confirma este código a continuación para acceder ao front-end. Se non recibiches este correo electrónico, proba a pechar sesión, agardar 10 minutos, e iniciar sesión de novo para recibir un novo correo electrónico que conteña un novo código."
 Accounts: "A páxina de contas permítelle controlar quen pode acceder ao front-end de CIDRAM."
 Actions menu: "Bloquea engade 1 aos sinaturas contan. Bypass resta 1 dos sinaturas contan. Lista branca define os sinaturas contan en 0 e finaliza o procesamento, omitindo así por completo calquera regra posterior. Lista gris define os sinaturas contan en 0, pero non finaliza o procesamento. Perfila non afecta ás sinaturas contan, pero é útil cando se pode precisar unha lóxica máis complexa para determinar se se deben realizar outros tipos de accións, xa que os perfís xerados poderían estar encadeados ás condicións das regras posteriores. Despois do procesamento, se os sinaturas contan é 1 ou superior, a solicitude bloquearase."
 Aggregator: "O agregador permítelle expresar enderezos IP, CIDR, e máscaras de rede da forma máis pequena posible. Introduza os datos a agregar e prema "OK"."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Un valor aceptado é calquera CIDR cun rango que abrangue o enderezo IP da solicitude. Por exemplo, 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, etc serían aceptados para 1.2.3.4. Para evitar falsos positivos, os rangos máis estreitos (por exemplo, 1.2.3.4/32) son xeralmente preferibles aos rangos máis amplos (por exemplo, 0.0.0.0/1). A páxina da calculadora pódese usar para atopar que CIDR teñen rangos que abarcan un enderezo IP específico."
 Auxiliary Rules Modes: "O modo de visualización mostra as regras auxiliares como unha lista compacta para facilitar a lectura. As regras da lista pódense ampliar e mostrar máis detalles facendo clic nelas. Ao premer no trigrama (☰), mostrarase a opción de exportar ou eliminar unha regra. As regras pódense reordenar mediante a función de arrastrar e soltar, arrastrando unha regra desde a súa posición existente ata a posición desexada. O modo de edición é necesario para modificar regras auxiliares, campos editables e opcións para engadir novas condicións, webhooks, ou outra lóxica ás regras segundo sexa necesario proporcionado na páxina. Pódense crear novas regras auxiliares mediante calquera dos modos."
 Auxiliary Rules Priority: "Prioridade (máis alto➡(igual🔄equivalente)➡máis baixo):"
 Auxiliary Rules Webhooks: "Cando se desencadea unha regra, CIDRAM tentará notificar a calquera webhook conectado sobre o evento. Un webhook é un URL capaz de recibir datos POST, e podería ser útil se hai un servizo externo, aplicación, script, etc aloxado nunha rede completamente diferente á de CIDRAM, que queres que xestione os datos xerados por CIDRAM sobre a solicitude."
 Auxiliary Rules: "Podes usar esta páxina para crear, eliminar, e modificar regras auxiliares para CIDRAM."
 Backup: "Esta páxina pódese usar para importar/exportar a súa configuración, regras auxiliares, etc. Isto pode ser útil se precisa migrar os datos entre instalacións diferentes ou versións principais diferentes."
 Cache Data: "Aquí podes revisar o contido da caché."
 Calculator: "A calculadora permítelle calcular os CIDR e as máscaras de rede dun enderezo IP."
 Click the component name for more details: "Fai clic no nome do compoñente para obter máis detalles."
 Configuration: "A páxina de configuración permítelle modificar a configuración de CIDRAM desde o front-end."
 Enter IP address here: "Introduza aquí o enderezo IP."
 Enter IP address here (optional): "Introduza aquí o enderezo IP (opcional)."
 Enter IP addresses here: "Introduza aquí os enderezos IP."
 Enter input here: "Introduza aquí a entrada."
 Enter queries here: "Introduza as consultas aquí."
 Enter query here (optional): "Introduza a consulta aquí (opcional)."
 Enter referrer here (optional): "Introduza o referente aquí (opcional)."
 Enter user agent here (optional): "Introduza aquí o axente de usuario (opcional)."
 Enter user agents here: "Introduza aquí os axentes de usuario."
 File Manager: "O xestor de ficheiros permítelle eliminar, editar, cargar, e descargar ficheiros. Use con precaución (podería romper a súa instalación con isto)."
 Glossary: "O glosario describe parte da terminoloxía empregada por CIDRAM, para axudar a clarificar o significado pretendido no contexto onde se emprega."
 Greeting: "Ola, %s."
 Home: "Esta é a páxina de inicio do front-end de CIDRAM. Selecciona unha ligazón no menú de navegación da esquerda para continuar."
 How many infractions to incur: "Cantas infraccións incorrer."
 IP Testing: "A páxina de proba de IP permítelle comprobar se os enderezos IP están bloqueados polas sinaturas instaladas actualmente."
 IP Tracking: "A páxina de seguimento IP permítelle comprobar o estado de seguimento dos enderezos IP, para comprobar cales delas foron prohibidas, e para desprohibilas/desseguilas se queres facelo."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Se unha solicitude se conecta desde un enderezo IPv6 que pertence a un rango empregado por un mecanismo de transición IPv6 (por exemplo, 6to4, Teredo, ISATAP, etc), o campo "enderezo IP (resolvedo)" cubrirase co enderezo IPv4 ao que se traduce ese enderezo IPv6 segundo ese mecanismo de transición IPv6 (por exemplo, se o "enderezo IP" é "2002:c0a8:1::", o "enderezo IP (resolvedo)" será "192.168.0.1"). En todos os demais casos, os campos "enderezo IP (resolvedo)" e "enderezo IP" serán os mesmos."
 Intersector: "O intersector pódese usar para determinar os factores comúns de dous conxuntos de rangos."
 Logs: "Seleccione un ficheiro de rexistro da lista a continuación para ver o contido dese ficheiro de rexistro."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Ten en conta que o valor exacto desta estatística será o mesmo que o que se mostra na páxina de estatísticas no momento en que se procesa a regra."
 Number of seconds until it expires: "Número de segundos ata que expira."
 Numeric comparison: "Para usar a comparación numérica, seleccione a comparación directa de cadeas ou a detección automática de métodos, asegúrese de que o valor da condición sexa numérico, e prefixo co operador desexado.<br />Por exemplo, para condicións "iguais", &gt;=2 proporciona ≥2, &lt;=2 proporciona ≤2, para condicións "non iguais", &gt;=2 proporciona ≱2, &lt;=2 proporciona ≰2, etc."
 Range Tables: "Esta páxina mostra información estatística básica sobre os rangos de IP cubertos polos ficheiros de sinatura activos actualmente."
 Rate Limiting: "Esta páxina mostra o uso actual da cota e a dispoñibilidade no que respecta á limitación da taxa."
 Rate limiting is currently disabled: "Nota: A limitación de taxas está actualmente desactivada, pero pódese activar a través da páxina de configuración."
 Report to AbuseIPDB: "Esta páxina pódese usar para informar de enderezos IP a AbuseIPDB, ou para eliminar informes anteriores no caso de que se informe dun enderezo IP por erro."
 Sections List: "Esta páxina enumera as seccións que existen nos ficheiros de sinatura activos actualmente."
 See the documentation: "Consulte a <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>documentación</a> para obter información sobre as distintas directivas de configuración e os seus propósitos."
 Server log snippets, abuse details, etc: "Fragmentos de rexistro do servidor, detalles de abusos, etc."
 Signature File Fixer: "O fixador de ficheiros de sinatura ofrece unha forma de detectar e solucionar problemas potenciais nos ficheiros de sinatura."
 Specify a URL, or leave blank to disregard: "Especifique un URL, ou déixeo en branco para ignoralo."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Especifique unha ruta de directorio, ou déixea en branco para usar a ruta base de CIDRAM."
 Specify a value, or leave blank to disregard: "Especifique un valor, ou déixeo en branco para ignoralo."
 Statistics tracking is currently disabled: "Nota: O seguimento das estatísticas está actualmente desactivado, pero pódese activar a través da páxina de configuración."
 Statistics: "Esta páxina mostra algunhas estatísticas básicas de uso sobre a súa instalación de CIDRAM."
 Subtractor: "O restador pódese usar para restar un rango de IP/CIDR/máscara de rede doutro."
 Updates: "A páxina de actualizacións permítelle instalar, desinstalar, e actualizar os distintos compoñentes de CIDRAM (o paquete principal, sinaturas, ficheiros de L10N, etc)."
 When available, the value of the country code lookup: "Cando estea dispoñible, o valor da busca de código de país é un código de país {{Links.ISO.3166}} de 2 díxitos. Por exemplo, US para os Estados Unidos, RU para Rusia, CN para China, etc."
warning: !lazy
 API_Rate_Limited: "Aviso: Parece que o acceso á API %s está actualmente limitado."
 Cookies: "Nota: CIDRAM usa unha cookie para autenticar os inicios de sesión. Ao iniciar sesión, dás o teu consentimento para que o teu navegador cree e almacene unha cookie."
 Editing PHP files: "Aviso: Sábese que algunhas solucións de seguridade de aloxamento web prohiben automaticamente os enderezos IP ao detectar as etiquetas PHP nas solicitudes (por exemplo, ao tentar modificar ficheiros PHP a través dun navegador). CIDRAM non ten medios para saber se o teu servizo de hospedaxe web utiliza unha solución de seguridade deste tipo. Para evitar tales problemas, recoméndase non editar os ficheiros PHP dese xeito cando sexa posible."
 IP tests are disabled: "Aviso: As probas de IP están desactivadas. Os ficheiros de sinatura non se poden usar ata que se resolva."
 JavaScript required: "Aviso: Algunhas funcións do front-end requiren JavaScript. Para garantir que todo o front-end se comporta como se espera, recoméndase activar JavaScript."
 Likely to be overwritten: "Aviso: O ficheiro que estás editando pertence ao compoñente "%s". Calquera cambio feito neste ficheiro é moi probable que se sobrescriba a próxima vez que se actualice ese compoñente."
 Likely to become corrupted: "Aviso: Detectáronse bytes que non son UTF8 no ficheiro que se está a editar actualmente. É probable que o ficheiro se corrompa se se edita usando esta ferramenta en particular."
 Modules are disabled: "Aviso: Os módulos están desactivados! Os módulos non se poden usar ata que se resolva."
 No modules are active: "Aviso: Non hai módulos activos! Os módulos pódense activar mediante as páxinas de configuración ou actualizacións."
 No signature files are active: "Aviso: Non hai ficheiros de sinatura activos. Os ficheiros de sinatura pódense activar mediante as páxinas de configuración ou actualizacións."
 Operating in dry run mode: "Aviso: Funcionando en modo seco! Mentres está no modo seco, as solicitudes seguen comprobadas e rexistradas como eventos de bloqueo como é habitual, pero non se bloquea nada."
 Operating in maintenance mode: "Aviso: Funcionando en modo mantemento! Mentres está en modo de mantemento, nada se verifica, rexistra, ou bloquea."
 Page termination is disabled: "Aviso: A terminación da páxina está desactivada! As solicitudes non se poden bloquear correctamente ata que se resolva."
 Proceeding will log out all users: "Aviso: Ao continuar, pecharase a sesión de todos os usuarios."
 The auxiliary rules execution stage is currently disabled: "Aviso: A fase de execución de regras auxiliares está actualmente desactivada."
 This account is not using a valid password: "Aviso: Esta conta non está a usar un contrasinal válido."
 Using the default password: "Aviso: Usando o contrasinal predeterminado!"
