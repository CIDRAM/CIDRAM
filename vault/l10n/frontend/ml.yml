 general_default_dns: "ഹോസ്റ്റ്നെയിം ലുക്കപ്പുകൾക്കായി ഉപയോഗിക്കേണ്ട DNS സെർവറുകളുടെ ഒരു പട്ടിക. മുന്നറിയിപ്പ്: നിങ്ങൾ എന്താണ് ചെയ്യുന്നതെന്ന് നിങ്ങൾക്കറിയാമെങ്കിൽ മാത്രം ഇത് മാറ്റുക!"
