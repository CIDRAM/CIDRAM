 200 OK: "200 OK (ശരി)\nഏറ്റവും കുറവ് സമഗ്രമായത്, പക്ഷേ ഏറ്റവും ഉപയോക്തൃ സൗഹൃദം. അഭ്യർത്ഥന വിജയകരമായിരുന്നു എന്നതിന്റെ സൂചനയായി ഓട്ടോമേറ്റഡ് അഭ്യർത്ഥനകൾ ഈ പ്രതികരണത്തെ വ്യാഖ്യാനിക്കാൻ സാധ്യതയുണ്ട്. തടയാത്ത അഭ്യർത്ഥനകൾക്ക് ശുപാർശ ചെയ്യുന്നു."
 301 Moved Permanently: "301 Moved Permanently (സ്ഥിരമായി സ്ഥലം മാറ്റി)\nറീഡയറക്‌ട് ശാശ്വതമാണെന്ന് ക്ലയന്റിനോട് നിർദ്ദേശിക്കുന്നു. റീഡയറക്‌ടിനായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതി, പ്രാരംഭ അഭ്യർത്ഥനയ്ക്കായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതിയേക്കാൾ വ്യത്യസ്തമായിരിക്കാം."
 302 Found: "302 Found (കണ്ടെത്തി)\nറീഡയറക്‌ട് താൽക്കാലികമാണെന്ന് ക്ലയന്റിനോട് നിർദ്ദേശിക്കുന്നു. റീഡയറക്‌ടിനായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതി, പ്രാരംഭ അഭ്യർത്ഥനയ്ക്കായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതിയേക്കാൾ വ്യത്യസ്തമായിരിക്കാം."
 307 Temporary Redirect: "307 Temporary Redirect (താൽക്കാലിക റീഡയറക്‌ട്)\nറീഡയറക്‌ട് താൽക്കാലികമാണെന്ന് ക്ലയന്റിനോട് നിർദ്ദേശിക്കുന്നു. റീഡയറക്‌ടിനായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതി, പ്രാരംഭ അഭ്യർത്ഥനയ്ക്കായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതിയേക്കാൾ വ്യത്യസ്തമായിരിക്കരുത്."
 308 Permanent Redirect: "308 Permanent Redirect (സ്ഥിരമായ റീഡയറക്‌ട്)\nറീഡയറക്‌ട് ശാശ്വതമാണെന്ന് ക്ലയന്റിനോട് നിർദ്ദേശിക്കുന്നു. റീഡയറക്‌ടിനായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതി, പ്രാരംഭ അഭ്യർത്ഥനയ്ക്കായി ഉപയോഗിക്കുന്ന അഭ്യർത്ഥന രീതിയേക്കാൾ വ്യത്യസ്തമായിരിക്കരുത്."
 403 Forbidden: "403 Forbidden (നിരോധിച്ചിരിക്കുന്നു)\nകൂടുതൽ സമഗ്രമായത്, പക്ഷേ ഉപയോക്തൃ സൗഹൃദം കുറവാണ്. മിക്ക സാഹചര്യങ്ങൾക്കും ഇത് ശുപാർശ ചെയ്യുന്നു."
 409 Conflict: "409 Conflict (സംഘർഷം)\nവിഭവ വൈരുദ്ധ്യങ്ങൾക്ക് (ഉദാഹരണത്തിന്, ലയന വൈരുദ്ധ്യങ്ങൾ, ഫയൽ ആക്‌സസ് വൈരുദ്ധ്യങ്ങൾ, മുതലായവ) ഇത് ശുപാർശ ചെയ്യുന്നു. മറ്റ് സന്ദർഭങ്ങളിൽ ശുപാർശ ചെയ്യുന്നില്ല."
 410 Gone: "410 Gone (പോയി)\nതെറ്റായ പോസിറ്റീവുകൾ പരിഹരിക്കുമ്പോൾ പ്രശ്നങ്ങൾ സൃഷ്ടിച്ചേക്കാം, കാരണം ചില ബ്രൗസറുകൾ ഈ സ്റ്റാറ്റസ് സന്ദേശം കാഷെ ചെയ്യുകയും തുടർന്നുള്ള അഭ്യർത്ഥനകൾ അയയ്ക്കാതിരിക്കുകയും ചെയ്യും, അവയുടെ തടയൽ നീക്കം ചെയ്തതിനുശേഷവും. ചില പ്രത്യേക തരം ട്രാഫിക്കുകൾക്ക്, ചില സന്ദർഭങ്ങളിൽ ഏറ്റവും അഭികാമ്യമായിരിക്കാം."
 418 I_m a teapot: "418 I'm a teapot (ഞാൻ ഒരു ചായക്കോട്ടയാണ്)\nഒരു ഏപ്രിൽ ഫൂൾ തമാശ ({{Links.RFC2324}}) പരാമർശിക്കുന്നു. ഏതെങ്കിലും ക്ലയന്റ്, ബോട്ട്, ബ്രൗസർ, അല്ലെങ്കിൽ മറ്റേതെങ്കിലും രീതിയിൽ മനസ്സിലാക്കാൻ സാധ്യത വളരെ കുറവാണ്. വിനോദത്തിനും സൗകര്യത്തിനും വേണ്ടി നൽകിയിരിക്കുന്നു, പക്ഷേ സാധാരണയായി ശുപാർശ ചെയ്യുന്നില്ല."
 429 Too Many Requests: "429 Too Many Requests (വളരെയധികം അഭ്യർത്ഥനകൾ)\nനിരക്ക് പരിമിതപ്പെടുത്തുന്നതിനും, DDoS ആക്രമണങ്ങൾ കൈകാര്യം ചെയ്യുമ്പോഴും, വെള്ളപ്പൊക്ക പ്രതിരോധത്തിനും ശുപാർശ ചെയ്യുന്നു. മറ്റ് സന്ദർഭങ്ങളിൽ ശുപാർശ ചെയ്യുന്നില്ല."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (നിയമപരമായ കാരണങ്ങളാൽ ലഭ്യമല്ല)\nനിയമപരമായ കാരണങ്ങളാൽ തടയുമ്പോൾ ശുപാർശ ചെയ്യുന്നു. മറ്റ് സന്ദർഭങ്ങളിൽ ശുപാർശ ചെയ്യുന്നില്ല."
 503 Service Unavailable: "503 Service Unavailable (സേവനം ലഭ്യമല്ല)\nഏറ്റവും സമഗ്രമായത്, പക്ഷേ ഏറ്റവും കുറഞ്ഞ ഉപയോക്തൃ സൗഹൃദം. ആക്രമണത്തിന് വിധേയമാകുമ്പോഴോ വളരെ വലിയ അനാവശ്യ ട്രാഫിക് കൈകാര്യം ചെയ്യുമ്പോഴോ ശുപാർശ ചെയ്യുന്നു."
