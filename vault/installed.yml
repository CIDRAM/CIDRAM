BOBUAM:
 Extended Description: >
  Optional module which detects unwanted bots, old browsers, and performs some sanity checks.<br />Contains some data from
  the Wordpress plugin "Stop Bad Bots" by William "Bill" Minozzi.<br />(A few webservices bots might need bypasses).
 False Positive Risk: "Medium"
 Version: "2026.76.0"
 Dependencies:
  PHP: "^7.2|^8"
  CIDRAM Core: "^4"
  l10n/core/{lang}: ">=2026.55"
  l10n/frontend/{lang}: ">=2026.55"
 When Install Succeeds: ["queue message response.please_check_config"]
 When Update Succeeds:
  - "if {Components.Meta.BOBUAM.Version}<2026.58&&{Components.RemoteMeta.BOBUAM.Version}>=2026.58 then queue message <span dir="ltr" lang="en-AU">[BOBUAM 2026.58.0] Removed three configuration directives (sanity_check, block_bots, and block_eol_browsers). Added a new configuration directive (what_to_block). All available block options enabled by default. You *may* want to revise your configuration accordingly.</span>"
