config:
 abuseipdb: "AbuseIPDB मॉड्यूलसाठी कॉन्फिगरेशन."
 abuseipdb_api_key: &EnterAPIKey "कृपया तुमची API की येथे प्रविष्ट करा."
 abuseipdb_build_profiles_from_usage_type: "API द्वारे परत केलेल्या वापर प्रकाराचा वापर करून प्रोफाइल तयार करायचे? False = नाही. True = होय. डीफॉल्ट = True."
 abuseipdb_max_age_in_days: "लुकअप करताना अहवाल विचारात घेतले जातील अशा दिवसांमधील कमाल वय (१ आणि ३६५ मधील संख्या असणे आवश्यक आहे). डीफॉल्ट = 365 (३६५)."
 abuseipdb_max_cs_for_captcha: "CAPTCHA देण्यासाठी परवानगी असलेला कमाल आत्मविश्वास स्कोअर (० आणि १०० मधील संख्या असणे आवश्यक आहे). डीफॉल्ट = 10 (१०)."
 abuseipdb_minimum_confidence_score: "CIDRAM ला IP पत्ता ब्लॉक करण्यासाठी आवश्यक असलेला किमान आत्मविश्वास स्कोअर (० आणि १०० मधील संख्या असणे आवश्यक आहे). डीफॉल्ट = 50 (५०)."
 abuseipdb_minimum_total_reports: "CIDRAM ला IP पत्ता ब्लॉक करण्यासाठी आवश्यक असलेल्या एकूण अहवालांची किमान संख्या. डीफॉल्ट = 1 (१)."
 abuseipdb_report_back: "तुमच्या API कीचा वापर करून CIDRAM ला AbuseIPDB ला आढळलेल्या वाईट वर्तनाची तक्रार करण्याची परवानगी द्यायची का?"
 bgpview: "BGPView मॉड्यूलसाठी कॉन्फिगरेशन (CIDRAM साठी ASN आणि देश कोड लुकअप सुविधा प्रदान करते)."
 bgpview_blocked_asns: &ConfigBlockedASNs "मॉड्यूल जुळवल्यावर ब्लॉक करायच्या ASN ची यादी."
