 quic_positive_action: "Hvilken handling skal CIDRAM utføre når den møter en forespørsel fra Quic cloud? Standard handling = Bypassere."
 rate_limiting: "Konfigurasjon for hastighetsbegrensning (anbefales ikke til generell bruk)."
 rate_limiting_allowance_period: "Varigheten for å spore bruk. Standardverdi = 0°0′0″."
 rate_limiting_exceptions: "Unntak (dvs, forespørsler som ikke bør være hastighetsbegrenset). Relevant bare når hastighetsbegrensning er aktivert."
 rate_limiting_hint: "Husk at akkurat som med all annen CIDRAM-funksjonalitet, kan CIDRAMs hastighetsbegrensningsfunksjonalitet bare håndheves for de sidene og ressursene som CIDRAM er koblet til. Det ville vanligvis bety at ikke-PHP-ressurser ikke ville bli dekket, bortsett fra der de eksplisitt betjenes av tilkoblede PHP-ressurser. Hvis du kan bruke en servermodul, cPanel, eller et annet nettverksverktøy for å håndheve hastighetsbegrensning, er det bedre å bruke det i stedet for CIDRAMs hastighetsbegrensningsfunksjonalitet. Husk også at en ivrig og målrettet bruker enkelt kan omgå hastighetsbegrensning ved å rotere IP-adressen sin, eller ved å bytte til en proxy eller VPN-leverandør som CIDRAM ennå ikke er klar over, og husk at hastighetsbegrensning kan være veldig irriterende for faktiske sluttbrukere. Det kan til tider være nødvendig, men er sjelden ønskelig."
 rate_limiting_max_bandwidth: "Maksimal båndbredde tillatt innenfor tillatelsesperioden før hastighetsbegrensende fremtidige forespørsler. En verdi på 0 deaktiverer denne typen hastighetsbegrensende. Standardverdi = 0KB."
 rate_limiting_max_requests: "Maksimalt antall forespørsler tillatt innen tillatelsesperioden før hastighetsbegrensende fremtidige forespørsler. En verdi på 0 deaktiverer denne typen hastighetsbegrensende. Standardverdi = 0."
 rate_limiting_precision_ipv4: "Presisjonen som skal brukes til å spore IPv4-bruk. Verdi speiler CIDR-blokkstørrelse. Sett til 32 for best presisjon. Standardverdi = 32."
 rate_limiting_precision_ipv6: "Presisjonen som skal brukes til å spore IPv6-bruk. Verdi speiler CIDR-blokkstørrelse. Sett til 128 for best presisjon. Standardverdi = 128."
 rate_limiting_segregate: "Bør kvoter for forskjellige domener og verter adskilles eller deles? True = Kvoter vil bli adskilt. False = Kvoter vil bli delt [Standardverdi]."
 sfs: "Konfigurasjon for Stop Forum Spam modulen."
 signatures: "Konfigurasjon for signaturer, signaturfiler, moduler, osv."
 signatures_conflict_response: "Når det er for mange samtidige forsøk på å få tilgang til de samme ressursene (f.eks., samtidige forespørsler til flere PHP-prosesser på samme maskin for de samme ressursene), kan noen av disse forsøkene mislykkes. I det sjeldne og usannsynlige tilfellet at dette påvirker signaturfiler eller moduler, kan CIDRAM bli forhindret fra å ta en effektiv avgjørelse om forespørselen. Hvis dette skjer, bør forespørselen blokkeres, og hvilken HTTP-statusmelding skal CIDRAM sende?"
