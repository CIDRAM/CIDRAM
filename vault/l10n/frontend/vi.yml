 captcha_messages: "Tin nhắn sẽ được hiển thị cùng với CAPTCHA."
 captcha_nonblocked_status_code: "Mã trạng thái nào nên được sử dụng khi hiển thị CAPTCHA cho các yêu cầu không bị chặn?"
 captcha_signature_limit: "Số lượng chữ ký tối đa được phép trước khi đề nghị CAPTCHA bị rút lại. Mặc định = 1."
 captcha_turnstile_secret: &TurnstileCred "Nếu bạn muốn sử dụng Cloudflare Turnstile với CIDRAM, bạn sẽ cần nhập giá trị vào đây. Nếu không, bạn có thể bỏ qua điều này."
 captcha_turnstile_sitekey: *TurnstileCred
 captcha_usemode: "Khi nào nên cung cấp CAPTCHA? Bạn có thể chỉ định hành vi ưu tiên cho từng nhà cung cấp được hỗ trợ tại đây."
 components: "Cấu hình để kích hoạt và vô hiệu hóa các thành phần được sử dụng bởi CIDRAM. Thường được điền bởi trang cập nhật, nhưng cũng có thể được quản lý từ đây để kiểm soát tốt hơn và cho các thành phần tùy chỉnh không được công nhận bởi trang cập nhật."
 components_events: "Trình xử lý sự kiện. Thường được sử dụng để sửa đổi cách CIDRAM hoạt động trong nội bộ hoặc để cung cấp chức năng bổ sung."
 components_imports: "Nhập khẩu. Thường được sử dụng để cung cấp thông tin cấu hình của một thành phần cho CIDRAM."
 components_ipv4: "Tập tin chữ ký IPv4."
 components_ipv6: "Tập tin chữ ký IPv6."
 components_modules: "Mô-đun."
 experimental: "Không ổn định / Thử nghiệm!"
 extras: "Cấu hình cho mô-đun của các tính năng bổ sung bảo mật tùy chọn."
 extras_remove_headers: "Xóa các tiêu đề không cần thiết và có thể hữu ích cho kẻ tấn công."
 extras_signatures: "Những loại chữ ký nào nên được tôn vinh?"
