 <code class="s">{m}</code> – Місяць – Наприклад, 4.<br />
 <code class="s">{Day}</code> – Скорочена назва дня (англійською мовою) – Наприклад, Tue.<br />
 <code class="s">{dd}</code> – День з початковими нулями – Наприклад, 30.<br />
