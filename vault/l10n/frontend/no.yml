 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">Hva kan jeg bruke for «default_dns»?</a></em>"
hints_duration:
 SI.: "Varighet kan beskrives ved hjelp av «International System of Units». F.eks., <strong>1d2h3min4s</strong> eller <strong>1d 2h 3min 4s</strong> for én dag, to timer, tre minutter, fire sekunder, eller <strong>5min</strong> for bare fem minutter."
 Buetid.: "Varighet kan beskrives ved bruk av buetidsnotasjon. F.eks., <strong>1d2°3′4″</strong> for én dag, to timer, tre minutter, fire sekunder, eller <strong>5″</strong> for bare fem sekunder."
 Vanlig engelsk.: "Varighet kan beskrives ved å skrive enhetene på vanlig engelsk. F.eks., <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> for én uke, to dager, tre timer, fire minutter, fem sekunder."
 Begrensninger.: "Notasjon kan blandes, men enheter må alltid beskrives fra størst til minste, og kan ikke gjentas. F.eks., <strong>1 week 2 days 3′4″</strong> er <span class="txtGn">gyldig</span> og vil bli forstått riktig, men <strong>3′4″ 1 week 2 days</strong> og <strong>3 hours 3h 3°</strong> er <span class="txtRd">ugyldige</span>. CIDRAM bryr seg ikke om du bruker mellomrom eller ikke. Tall må være enkle og uformaterte. For praktiske formål er den største støttede enheten en uke. Når konfigurasjonen oppdateres, normaliserer CIDRAM varighetene til buetid."
hints_has_bypass: "* Dette alternativet har en tilsvarende bypass under <code class="s">bypasses➡used</code>. Uansett om avmerkingsboksen for å forsøke å bekrefte dette alternativet er valgt, anbefales det å sørge for at avkrysningsboksen for den tilsvarende forbikjøringen er den samme."
hints_http_response_header_code:
 1.: "Når «stille modus» er aktiv, vil HTTP-statusmeldingen definert av <code class="s">general➡silent_mode_response_header_code</code> bli brukt (dette har høyest prioritet)."
 2.: "Når den forespørrende enheten er utestengt på grunn av overskridelse av overtredelsesgrensen, vil HTTP-statusmeldingen for «utestengt» bli brukt."
 3.: "Når den er blokkert på grunn av hastighetsbegrensning, vil 429 bli brukt, eller når den er blokkert på grunn av ressurskonflikter, vil HTTP-statusmeldingen definert av <code class="s">signatures➡conflict_response</code> bli brukt (hastighetsbegrensning og ressurskonflikter har like stor prioritet i denne sammenhengen)."
 4.: "Når den er blokkert på grunn av en tilleggsregel som angir en «HTTP-statuskode overstyring», vil den HTTP-statuskode overstyringen bli brukt."
 5.: "Når den er blokkert av juridiske årsaker (dvs., når den er blokkert på grunn av en tilpasset signatur som bruker stenografiorden «juridiske»), vil HTTP-statusmeldingen for «juridiske» bli brukt."
 6.: "For alle andre blokkerte forespørsler vil HTTP-statusmeldingen for «standardverdi» bli brukt (dette har lavest prioritet)."
hints_inspection: "* Kun ment for feilsøking av tilleggsregler. Ikke vist for blokkerte brukere."
hints_ipv6_on_32bit: "Merk: IPv6-oppslag fungerer kanskje ikke riktig på enkelte 32-biters systemer."
