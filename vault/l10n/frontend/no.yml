 logging_apache_style_log: "Apache-stil fil for å logge alle blokkerte tilgangsforsøk. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_error_log: "En fil for logging av eventuelle ikke-fatale feil som er oppdaget. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_log_banned_ips: "Inkluder blokkerte forespørsler fra utestengt IP-adresser i loggfilene? True = Ja [Standardverdi]; False = Nei."
 logging_log_rotation_action: "Loggrotasjon begrenser antall loggfiler som bør eksistere til enhver tid. Når nye loggfiler blir opprettet, hvis det totale antall loggfiler overskrider den angitte grensen, den angitte handlingen vil bli utført. Du kan angi ønsket handling her."
 logging_log_rotation_limit: "Loggrotasjon begrenser antall loggfiler som bør eksistere til enhver tid. Når nye loggfiler blir opprettet, hvis det totale antall loggfiler overskrider den angitte grensen, den angitte handlingen vil bli utført. Du kan angi ønsket grense her. En verdi på 0 deaktiverer loggrotasjon."
 logging_log_sanitisation: "Når du bruker frontend loggene siden for å vise loggdata, CIDRAM sanitiserer loggdataene før de vises, for å beskytte brukere mot XSS-angrep og andre mulige trusler som loggdataene kan inneholde. Men som standard, data blir ikke sanitisert under logging. Dette er for å sikre at loggdata blir bevart nøyaktig, for å hjelpe enhver heuristisk analyse som kan være nødvendig i fremtiden. Men hvis en bruker forsøker å lese loggdata ved hjelp av eksterne verktøy, og hvis de eksterne verktøyene ikke utfører sin egen sanitetsprosess, brukeren kan bli utsatt for XSS-angrep. Om nødvendig kan du endre standardoppførselen ved hjelp av dette konfigurasjonsdirektivet. True = Sanitiser data når du logger på det (dataene blir bevart mindre nøyaktig, men XSS-risikoen er lavere). False = Ikke sanitiser data når du logger på det (dataene blir bevart mer nøyaktig, men XSS-risikoen er høyere) [Standardverdi]."
 logging_outbound_request_log: "En fil for å logge resultatene av eventuelle utgående forespørsler. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_report_log: "En fil for logging av rapporter sendt til eksterne APIer. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_serialised_log: "Serialisert fil å logge av alle blokkerte tilgangsforsøk. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_standard_log: "Menneskelig-lesbar fil for å logge av alle blokkerte tilgangsforsøk. Angi et filnavn, eller la det være tomt for å deaktivere."
 logging_truncate: "Skjær loggfiler når de kommer til en viss størrelse? Verdi er den maksimale størrelsen i B/KB/MB/GB/TB som en loggfil kan vokse til før den blir avkortet. Standardverdi på 0KB deaktiverer avkorting (loggfilene kan vokse på ubestemt tid). Merk: Gjelder for individuelle loggfiler! Størrelsen på loggfiler anses ikke kollektivt."
 phpmailer: "Konfigurasjon for PHPMailer (brukes til tofaktorautentisering og for e-postvarsler)."
 phpmailer_add_reply_to_address: "Svaradressen for å sitere når du sender e-post via SMTP."
 phpmailer_add_reply_to_name: "Svarnavnet til å sitere når du sender e-post via SMTP."
 phpmailer_event_log: "En fil for å logge alle hendelser i forhold til PHPMailer. Angi et filnavn, eller la det være tomt for å deaktivere."
