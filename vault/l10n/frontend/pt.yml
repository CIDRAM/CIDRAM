Some useful links:
 pt-BR: |+
  Alguns links úteis:<br />
      <ul class="pieul">
        <li><span class="comCat" role="region" aria-controls="menuTRCIDRAM" aria-expanded="false">Ferramentas, recursos, etc para o CIDRAM.</span>
          <ul class="comSub" id="menuTRCIDRAM">
            <li>{{Links.CIDRAM.Bitbucket}} – Local de backup do repositório.</li>
            <li>{{Links.CIDRAM.Codeberg}} – Local de backup do repositório.</li>
            <li>{{Links.CIDRAM.Extras}} – Vários extras.</li>
            <li>{{Links.CIDRAM.Issues}} – Página de problemas para CIDRAM (apoio, assistência, etc).</li>
            <li>{{Links.CIDRAM.WordPress}} – WordPress plugin para CIDRAM.</li>
          </ul>
        </li>
        <li><span class="comCat" role="region" aria-controls="menuGFC" aria-expanded="false">Grupos, fóruns, comunidades, etc.</span>
          <ul class="comSub" id="menuGFC">
            <li>{{Links.PHP.Earth.Facebook}} – PHP recursos de aprendizagem e discussão.</li>
            <li><a href="https://www.stopforumspam.com/forum/" rel="noopener noreferrer external">Fórum@Stop Forum Spam</a> – Fórum de discussão útil sobre como parar o spam do fórum.</li>
          </ul>
        </li>
        <li><span class="comCat" role="region" aria-controls="menuOUTRS" aria-expanded="false">Outras ferramentas, recursos, serviços, etc que são úteis.</span>
          <ul class="comSub" id="menuOUTRS">
            <li>{{Links.SFS}} – Mantém um banco de dados de spammers de fórum conhecidos. Útil para proteger sites e fóruns contra spammers.</li>
            <li><a href="https://bgp.he.net/" hreflang="en-US" rel="noopener noreferrer external">Hurricane Electric BGP Toolkit</a> – Obter CIDRs de ASNs, determinar relações de ASNs, descobrir ASNs com base em nomes de rede, etc.</li>
