 Don_t block the request: "Đừng chặn yêu cầu.\nNếu bạn muốn các yêu cầu chỉ bị chặn khi bạn chắc chắn rằng chúng là ác ý, hoặc thích thận trọng hơn với sai tích cực (với cái giá là thỉnh thoảng có lưu lượng truy cập không mong muốn đi qua), chọn cái này. Nếu bạn muốn yêu cầu bị chặn nếu bạn không chắc chắn chúng là vô hại, hoặc thích giữ cảnh giác (với cái giá là thỉnh thoảng có sai tích cực), chọn một trong những tùy chọn có sẵn khác."
