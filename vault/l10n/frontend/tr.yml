 general_force_hostname_lookup: "Hostname aramayı zorla? Doğru/True = Evet; Yanlış/False = Hayır [Varsayılan]. Hostname aramaları normal olarak ihtiyaçlara göre yapılır, ancak tüm istekler için zorla çalıştırılabilir. Bu, günlük dosyalarında daha ayrıntılı bilgi sağlama aracı olarak kullanışlı olabilir, ancak performans üzerinde de olumsuz bir etkisi olabilir."
 general_http_response_header_code: "İstekleri engellerken CIDRAM hangi HTTP durum mesajını göndermelidir?"
 general_ipaddr: "Bağlama isteklerinin IP adresi nerede bulunur? (Cloudflare gibi hizmetler için yararlıdır). Varsayılan = REMOTE_ADDR. UYARI: Ne yaptığınızı bilmiyorsanız bunu değiştirmeyin!"
 general_lang: "CIDRAM için varsayılan dili belirleyin."
 general_lang_override: "Mümkün olduğunda, HTTP_ACCEPT_LANGUAGE uyarınca yerelleştirilsin mi? Doğru/True = Evet [Varsayılan]; Yanlış/False = Hayır."
 general_numbers: "Numaraların görüntülenmesini nasıl tercih edersiniz? Size en uygun görünen örneği seçin."
 general_request_proxy: "Giden isteklerin bir proxy üzerinden gönderilmesini istiyorsanız, burada proxy'yi belirtin. Değilse, burayı boş bırakın."
 general_request_proxyauth: "Giden istekleri bir proxy üzerinden gönderiyorsanız ve bu proxy bir kullanıcı adı ve parola gerektiriyorsa, burada bu kullanıcı adını ve parolayı belirtin (örneğin, <code>user:pass</code>). Değilse, burayı boş bırakın."
 general_sensitive: "Hassas sayfalar olarak değerlendirilecek yolların listesi. Listelenen her yol, gerektiğinde yeniden oluşturulmuş URI'ye göre kontrol edilecektir. Eğik çizgi ile başlayan bir yol değişmez bilgi olarak ele alınır ve isteğin yol bileşeninden itibaren eşleştirilir. Alfasayısal olmayan bir karakterle başlayan ve aynı karakterle (veya aynı karakter artı isteğe bağlı bir "i" bayrağıyla) biten bir yol, düzenli ifade olarak ele alınacaktır. Diğer herhangi bir yol hazır bilgi olarak ele alınır ve URI'nin herhangi bir bölümünden eşleşebilir. Bir yolun hassas sayfa olarak görülmesi, bazı modüllerin davranışını etkileyebilir, ancak başka bir etkisi yoktur."
 general_silent_mode: "CIDRAM, "erişim reddedildi" sayfasını göstermek yerine, engellenen erişim girişimlerini sessizce yönlendirmeli mi? Yanıt evet ise, engellenen erişim girişimleri için yeniden yönlendirilecek konumu belirtin. Yanıt hayır ise, bu değişkeni boş bırakın."
 general_silent_mode_response_header_code: "Engellenen erişim denemelerini sessizce yeniden yönlendirirken CIDRAM hangi HTTP durum mesajını göndermelidir?"
 general_stages: "Yürütme zincirinin aşamaları için kontroller (etkin olup olmadığı, hataların günlüğe kaydedilip kaydedilmediği, vb)."
 general_statistics: "Hangi istatistiksel bilgilerin izleneceğini kontrol eder."
 general_statistics_captchas: "CAPTCHA'lar için hangi istatistiksel bilgilerin izleneceğini kontrol eder."
 general_time_format: "CIDRAM tarafından kullanılan tarih/saat gösterimi biçimi. İsteğe bağlı olarak ek seçenekler eklenebilir."
 general_time_offset: "Dakika cinsinden zaman dilimi farkı."
 general_timezone: "Kullanılacak saat dilimini belirtir (örneğin, Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, vb). PHP'nin bunu sizin için otomatik olarak yapmasına izin vermek için "SYSTEM" i belirtin."
 ipapi: "IP-API modülü için yapılandırma (CIDRAM için bir ASN ve ülke kodu arama olanağı sağlar)."
