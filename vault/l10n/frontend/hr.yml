hints_shorthand:
 0.: "Ako vašoj web stranici treba pristup putem LAN-a ili localhost-a, nemojte blokirati ovo. U suprotnom, možete blokirati ovo."
 1.: "Nijedna od zadanih datoteka potpisa ovo ne koristi, ali je svejedno podržano u slučaju da bi moglo biti korisno nekim korisnicima."
 2.: "Ako želite da korisnici mogu pristupiti vašoj web stranici putem proxyja, nemojte blokirati ovo. U suprotnom, možete blokirati ovo."
 3.: "Izravna upotreba u potpisima nije podržana, ali se može pozvati drugim sredstvima u određenim okolnostima."
 4.: "Odnosi se na slučajeve u kojima se skraćene riječi uopće ne koriste ili ih CIDRAM ne prepoznaje."
 Jedan po potpisu.: "Potpis može pozvati više profila, ali može koristiti samo jednu skraćenu riječ. Moguće je da više skraćenih riječi može biti prikladno, ali kako se može koristiti samo jedna, nastojimo uvijek koristiti samo najprikladniju."
 Prioritet.: "Odabrana opcija uvijek ima prioritet nad opcijom koja nije odabrana. Npr., ako je više skraćenih riječi u igri, ali je samo jedna od njih postavljena kao blokirana, zahtjev će i dalje biti blokiran."
 Ljudske krajnje točke i usluge u oblaku.: "Usluga u oblaku može se odnositi na pružatelje usluga web hostinga, farme poslužitelja, podatkovne centre, ili bilo koje druge stvari. Ljudska krajnja točka odnosi se na način na koji čovjek pristupa internetu, primjerice putem davatelja internetskih usluga. Mreža obično pruža samo jedno ili drugo, ali ponekad može pružiti oboje. Nastojimo nikada ne identificirati potencijalne ljudske krajnje točke kao usluge u oblaku. Stoga se usluga u oblaku može identificirati kao nešto drugo ako njezin raspon dijele poznate ljudske krajnje točke. Suprotno tome, nastojimo uvijek identificirati usluge u oblaku, čije domete ne dijele nijedna poznata ljudska krajnja točka, kao usluge u oblaku. Stoga, zahtjev koji je izričito identificiran kao usluga u oblaku vjerojatno ne dijeli svoj raspon s bilo kojom poznatom ljudskom krajnjom točkom. Isto tako, zahtjev koji je eksplicitno identificiran napadima ili neželjenom poštom vjerojatno dijeli takve raspone. Međutim, internet je uvijek u tijeku, svrhe mreža se mijenjaju s vremenom, a rasponi se uvijek kupuju ili prodaju, stoga budite svjesni i budni u pogledu lažno pozitivnih."
hints_time_format: |
 <strong><em>Čuvar mjesta – Obrazloženje – Primjer temeljen na 2024-04-30T18:27:49+08:00.</em></strong><br />
 <code class="s">{yyyy}</code> – Godina – Npr., 2024.<br />
 <code class="s">{yy}</code> – Skraćena godina – Npr., 24.<br />
 <code class="s">{Mon}</code> – Skraćeni naziv mjeseca (na engleskom) – Npr., Apr.<br />
 <code class="s">{mm}</code> – Mjesec s vodećim nulama – Npr., 04.<br />
 <code class="s">{m}</code> – Mjesec – Npr., 4.<br />
 <code class="s">{Day}</code> – Skraćeni naziv dana (na engleskom) – Npr., Tue.<br />
 <code class="s">{dd}</code> – Dan s vodećim nulama – Npr., 30.<br />
 <code class="s">{d}</code> – Dan – Npr., 30.<br />
 <code class="s">{hh}</code> – Sat s vodećim nulama (koristi se 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{h}</code> – Sat (koristi se 24-satno vrijeme) – Npr., 18.<br />
 <code class="s">{ii}</code> – Minuta s vodećim nulama – Npr., 27.<br />
 <code class="s">{i}</code> – Minuta – Npr., 27.<br />
 <code class="s">{ss}</code> – Sekunde s vodećim nulama – Npr., 49.<br />
 <code class="s">{s}</code> – Sekunde – Npr., 49.<br />
 <code class="s">{tz}</code> – Vremenska zona (bez dvotočke) – Npr., +0800.<br />
 <code class="s">{t:z}</code> – Vremenska zona (s dvotočkom) – Npr., +08:00.
hints_usemode:
 0: "Bilješka: Zahtjevi s popisa dopuštenih, ili provjereni i neblokirani zahtjevi, nikada ne moraju ispuniti CAPTCHA."
 1: "Također imajte na umu: CAPTCHA može pružiti koristan, dodatni sloj zaštite od botova i raznih vrsta zlonamjernih automatiziranih zahtjeva, ali neće pružiti nikakvu zaštitu od zlonamjernih ljudi."
 2: "Zahtjevi se mogu "označiti za upotrebu" putem pomoćnih pravila."
 3: "Smatra li se zahtjev "osjetljivim" određuje se pomoću {{Links.ConfigRef.sensitive}}."
hints_verification:
 "Što su "pozitivi" i "negativi"?": "Prilikom provjere identiteta predstavljenog zahtjevom, uspješan ishod mogao bi se opisati kao "pozitivan" ili "negativan". U slučaju da se potvrdi da je predstavljeni identitet pravi identitet, on bi se opisao kao "pozitivan". U slučaju da se potvrdi da je prikazani identitet krivotvoren, on bi se opisao kao "negativan". Međutim, neuspješan ishod (npr., neuspješna provjera, ili se ne može utvrditi vjerodostojnost prikazanog identiteta) ne bi se opisao kao "pozitivan" ili "negativan". Umjesto toga, neuspješan ishod bi se jednostavno opisao kao neprovjeren. Ako se ne pokuša provjeriti identitet predstavljen zahtjevom, zahtjev bi se također opisao kao neprovjeren. termini imaju smisla samo u kontekstu u kojem je identitet predstavljen zahtjevom prepoznat, i stoga, gdje je provjera moguća. U slučajevima kada prikazani identitet ne odgovara gore navedenim opcijama, ili kada identitet nije predstavljen, gore navedene opcije postaju nevažne."
 "Što su "zaobilaženje jednim pogotkom"?": "U nekim slučajevima, pozitivno verificiran zahtjev može i dalje biti blokiran zbog datoteka potpisa, modula, ili drugih uvjeta zahtjeva, a zaobilaženje može biti potrebno kako bi se izbjegli lažno pozitivni. U slučaju kada je zaobilaženje namijenjeno rješavanju tačno jednog prekršaja, ni više ni manje, takvo zaobilaženje bi se moglo opisati kao "zaobilaženje jednim pogotkom"."
hints_want_to_block: "!! Većina korisnika će vjerojatno htjeti da se ovo blokira, bez obzira je li stvarno ili lažno. To se može postići tako da se ne odabere "pokušati provjeriti", već da se odabere "blokirati neprovjerene zahtjeve". Međutim, budući da neki korisnici možda žele moći provjeriti takve zahtjeve (kako bi blokirali negativne, a dopustili pozitivne), umjesto blokiranja takvih zahtjeva putem modula, ovdje su navedene opcije za rukovanje takvim zahtjevima."
