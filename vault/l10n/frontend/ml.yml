hints_client_hints: "!! ഇത് ഒരു താഴ്ന്ന എൻട്രോപ്പി ക്ലയന്റ് സൂചനയാണ്. ക്ലയന്റ് സൂചനകൾ എന്നത് പുതിയതും പരീക്ഷണാത്മകവുമായ ഒരു വെബ് സാങ്കേതികവിദ്യയാണ്, ഇത് ഇതുവരെ എല്ലാ ബ്രൗസറുകളിലും പ്രധാന ക്ലയന്റുകളിലും വ്യാപകമായി പിന്തുണയ്ക്കപ്പെട്ടിട്ടില്ല. <em>കാണുക: {{Links.MDN.Client hints}}.</em> വ്യാപകമായി പിന്തുണയ്ക്കാത്തതിനാൽ, ക്ലയന്റ് സൂചനകൾ വിരലടയാളത്തിന് ഉപയോഗപ്രദമാകുമെങ്കിലും, അഭ്യർത്ഥനകളിൽ അവയുടെ സാന്നിധ്യം അനുമാനിക്കുകയോ ആശ്രയിക്കുകയോ ചെയ്യരുത് (അതായത്, അവരുടെ അഭാവത്തിന്റെ അടിസ്ഥാനത്തിൽ തടയുന്നത് ഒരു മോശം ആശയമാണ്)."
hints_client_honour: "നമ്മൾ ക്ലയന്റിന് എങ്ങനെ നിർദ്ദേശം നൽകിയാലും, ക്ലയന്റ് എന്ത് ചെയ്യണമെന്ന് തിരഞ്ഞെടുക്കുന്നതിൽ നമുക്ക് ആത്യന്തികമായി യാതൊരു നിയന്ത്രണവുമില്ലെന്ന് ഓർമ്മിക്കേണ്ടത് പ്രധാനമാണ്, കൂടാതെ ക്ലയന്റ് നമ്മുടെ നിർദ്ദേശങ്ങൾ പാലിക്കുമെന്ന് യാതൊരു ഉറപ്പുമില്ല."
hints_default_dns:
 പതിവുചോദ്യങ്ങൾ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">"default_dns"-ന് എനിക്ക് എന്ത് ഉപയോഗിക്കാം?</a></em>"
hints_duration:
 SI.: ""ഇന്റർനാഷണൽ സിസ്റ്റം ഓഫ് യൂണിറ്റ്സ്" ഉപയോഗിച്ച് ദൈർഘ്യം വിവരിക്കാൻ കഴിയും. ഉദാഹരണത്തിന്, <strong>1d2h3min4s</strong> അല്ലെങ്കിൽ <strong>1d 2h 3min 4s</strong> എന്നത് ഒരു ദിവസം, രണ്ട് മണിക്കൂർ, മൂന്ന് മിനിറ്റ്, നാല് സെക്കൻഡ് എന്നിവയെ വിവരിക്കാൻ വേണ്ടിയുള്ളതാണ്, അല്ലെങ്കിൽ <strong>5min</strong> വെറും അഞ്ച് മിനിറ്റിനെ വിവരിക്കാൻ വേണ്ടിയുള്ളതാണ്."
 ആർക്ക്ടൈം.: "ആർക്ക്ടൈം നൊട്ടേഷൻ ഉപയോഗിച്ച് ദൈർഘ്യം വിവരിക്കാൻ കഴിയും. ഉദാഹരണത്തിന്, <strong>1d2°3′4″</strong> എന്നത് ഒരു ദിവസം, രണ്ട് മണിക്കൂർ, മൂന്ന് മിനിറ്റ്, നാല് സെക്കൻഡ് എന്നിവയെ വിവരിക്കാൻ വേണ്ടിയുള്ളതാണ്, അല്ലെങ്കിൽ <strong>5″</strong> വെറും അഞ്ച് സെക്കൻഡ് വിവരിക്കാൻ വേണ്ടിയുള്ളതാണ്."
 പ്ലെയിൻ ഇംഗ്ലീഷ്.: "യൂണിറ്റുകൾ പ്ലെയിൻ ഇംഗ്ലീഷിൽ എഴുതി ദൈർഘ്യം വിവരിക്കാൻ കഴിയും. ഉദാഹരണത്തിന്, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> എന്നത് ഒരു ആഴ്ച, രണ്ട് ദിവസം, മൂന്ന് മണിക്കൂർ, നാല് മിനിറ്റ്, അഞ്ച് സെക്കൻഡ് എന്നിവയെ വിവരിക്കാൻ വേണ്ടിയുള്ളതാണ്."
 പരിമിതികൾ.: "നൊട്ടേഷൻ കൂട്ടിക്കലർത്താം, പക്ഷേ യൂണിറ്റുകൾ എല്ലായ്പ്പോഴും ഏറ്റവും വലുതിൽ നിന്ന് ചെറുതിലേക്ക് വിവരിക്കണം, ആവർത്തിക്കാൻ കഴിയില്ല. ഉദാഹരണത്തിന്, <strong>1 week 2 days 3′4″</strong> <span class="txtGn">സാധുവാണ്</span>, അത് ശരിയായി മനസ്സിലാക്കപ്പെടും, പക്ഷേ <strong>3′4″ 1 week 2 days</strong> ഉം <strong>3 hours 3h 3°</strong> ഉം <span class="txtRd">അസാധുവാണ്</span>. നിങ്ങൾ സ്‌പെയ്‌സിംഗ് ഉപയോഗിക്കുന്നുണ്ടോ ഇല്ലയോ എന്നത് CIDRAM-ന് പ്രശ്‌നമല്ല. അക്കങ്ങൾ പ്ലെയിൻ ആയിരിക്കണം, ഫോർമാറ്റ് ചെയ്തിട്ടില്ല. പ്രായോഗികതയ്ക്കായി, ഏറ്റവും വലിയ പിന്തുണയുള്ള യൂണിറ്റ് ഒരു ആഴ്ചയാണ്. കോൺഫിഗറേഷൻ അപ്‌ഡേറ്റ് ചെയ്യുമ്പോൾ, CIDRAM ദൈർഘ്യങ്ങളെ ആർക്ക്‌ടൈമിലേക്ക് സാധാരണമാക്കുന്നു."
hints_has_bypass: "* ഈ ഓപ്ഷന് <code class="s">bypasses➡used</code>-ന് കീഴിൽ ഒരു അനുബന്ധ ബൈപാസ് ഉണ്ട്. ഈ ഓപ്ഷൻ പരിശോധിക്കാൻ ശ്രമിക്കുന്നതിനുള്ള ചെക്ക്ബോക്സ് അടയാളപ്പെടുത്തിയിരിക്കുന്നതുപോലെ തന്നെ അനുബന്ധ ബൈപാസിനായുള്ള ചെക്ക്ബോക്സും അടയാളപ്പെടുത്തിയിട്ടുണ്ടെന്ന് ഉറപ്പാക്കാൻ ശുപാർശ ചെയ്യുന്നു."
hints_http_response_header_code:
 1.: ""സൈലന്റ് മോഡ്" പ്രാബല്യത്തിൽ വരുമ്പോൾ, <code class="s">general➡silent_mode_response_header_code</code> നിർവചിച്ചിരിക്കുന്ന HTTP സ്റ്റാറ്റസ് സന്ദേശം ഉപയോഗിക്കും (ഇതിന് ഏറ്റവും ഉയർന്ന മുൻഗണനയുണ്ട്)."
 2.: "ലംഘന പരിധി കവിഞ്ഞതിനാൽ അഭ്യർത്ഥിക്കുന്ന സ്ഥാപനത്തെ നിരോധിച്ചിരിക്കുമ്പോൾ, "നിരോധിച്ചത്" എന്നതിനുള്ള HTTP സ്റ്റാറ്റസ് സന്ദേശം ഉപയോഗിക്കും."
 3.: "നിരക്ക് പരിധി കാരണം തടയപ്പെടുമ്പോൾ, 429 ഉപയോഗിക്കും, അല്ലെങ്കിൽ വിഭവ വൈരുദ്ധ്യങ്ങൾ കാരണം തടയപ്പെടുമ്പോൾ, <code class="s">signatures➡conflict_response</code> നിർവചിച്ചിരിക്കുന്ന HTTP സ്റ്റാറ്റസ് സന്ദേശം ഉപയോഗിക്കും (ഈ സാഹചര്യത്തിൽ നിരക്ക് പരിമിതപ്പെടുത്തലിനും വിഭവ സംഘർഷങ്ങൾക്കും തുല്യ മുൻഗണനയുണ്ട്)."
 4.: ""HTTP സ്റ്റാറ്റസ് കോഡ് ഓവർറൈഡ്" സജ്ജമാക്കുന്ന ഒരു ഓക്സിലറി നിയമ കാരണം തടയപ്പെടുമ്പോൾ, ആ HTTP സ്റ്റാറ്റസ് കോഡ് ഓവർറൈഡ് ഉപയോഗിക്കപ്പെടും."
 5.: "നിയമപരമായ കാരണങ്ങളാൽ തടയപ്പെടുമ്പോൾ (ഉദാഹരണത്തിന്, "നിയമപരമായ" എന്ന ചുരുക്കെഴുത്ത് പദം ഉപയോഗിക്കുന്ന ഒരു കസ്റ്റം ഒപ്പ് കാരണം തടയപ്പെടുമ്പോൾ), "നിയമപരമായ" എന്നതിനുള്ള HTTP സ്റ്റാറ്റസ് സന്ദേശം ഉപയോഗിക്കും."
 6.: "തടഞ്ഞ മറ്റ് എല്ലാ അഭ്യർത്ഥനകൾക്കും, "സ്ഥിരസ്ഥിതി" എന്നതിനായുള്ള HTTP സ്റ്റാറ്റസ് സന്ദേശം ഉപയോഗിക്കും (ഇതിന് ഏറ്റവും കുറഞ്ഞ മുൻഗണനയുണ്ട്)."
hints_inspection: "* ഓക്സിലറി നിയമങ്ങൾ ഡീബഗ്ഗ് ചെയ്യുന്നതിന് മാത്രം ഉദ്ദേശിച്ചിട്ടുള്ളതാണ്. തടഞ്ഞ ഉപയോക്താക്കൾക്ക് പ്രദർശിപ്പിക്കില്ല."
hints_ipv6_on_32bit: "കുറിപ്പ്: ചില 32-ബിറ്റ് സിസ്റ്റങ്ങളിൽ IPv6 ലുക്കപ്പുകൾ ശരിയായി പ്രവർത്തിച്ചേക്കില്ല."
hints_logging_datetime: "ഉപയോഗപ്രദമായ നുറുങ്ങ്: സമയ ഫോർമാറ്റ് പ്ലെയ്‌സ്‌ഹോൾഡറുകൾ ഉപയോഗിച്ച് നിങ്ങൾക്ക് ലോഗ് ഫയലുകളുടെ പേരുകളിൽ തീയതി/സമയ വിവരങ്ങൾ അറ്റാച്ചുചെയ്യാം. ലഭ്യമായ സമയ ഫോർമാറ്റ് പ്ലെയ്‌സ്‌ഹോൾഡറുകൾ {{Links.ConfigRef.time_format}}-ൽ പ്രദർശിപ്പിക്കും."
