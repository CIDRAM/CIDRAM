 general_disabled_channels: "അഭ്യർത്ഥനകൾ അയയ്ക്കുമ്പോൾ പ്രത്യേക ചാനലുകൾ ഉപയോഗിക്കുന്നതിൽ നിന്ന് CIDRAM-നെ തടയാൻ ഇത് ഉപയോഗിക്കാം (ഉദാഹരണത്തിന്, അപ്ഡേറ്റ് ചെയ്യുമ്പോൾ, ഘടക മെറ്റാഡാറ്റ ലഭ്യമാക്കുമ്പോൾ, മുതലായവ)."
 general_email_notification_address: "CIDRAM-ൽ നിന്ന് ഇമെയിൽ വഴി അറിയിപ്പുകൾ സ്വീകരിക്കാൻ നിങ്ങൾ തിരഞ്ഞെടുത്തിട്ടുണ്ടെങ്കിൽ, ഉദാഹരണത്തിന്, നിർദ്ദിഷ്ട ഓക്സിലറി നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കുമ്പോൾ, ആ അറിയിപ്പുകളുടെ ലഭിക്കേണ്ട സ്വീകർത്താവിന്റെ വിലാസം നിങ്ങൾക്ക് ഇവിടെ വ്യക്തമാക്കാം."
 general_email_notification_name: "CIDRAM-ൽ നിന്ന് ഇമെയിൽ വഴി അറിയിപ്പുകൾ സ്വീകരിക്കാൻ നിങ്ങൾ തിരഞ്ഞെടുത്തിട്ടുണ്ടെങ്കിൽ, ഉദാഹരണത്തിന്, നിർദ്ദിഷ്ട ഓക്സിലറി നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കുമ്പോൾ, ആ അറിയിപ്പുകളുടെ സ്വീകർത്താവിന്റെ പേര് നിങ്ങൾക്ക് ഇവിടെ വ്യക്തമാക്കാം."
 general_email_notification_when: "ജനറേറ്റ് ചെയ്തതിനുശേഷം അറിയിപ്പുകൾ എപ്പോൾ അയയ്ക്കണം."
 general_emailaddr: "നിങ്ങൾക്ക് വേണമെങ്കിൽ, തെറ്റായി അല്ലെങ്കിൽ അബദ്ധവശാൽ തടയപ്പെട്ടാൽ ഉപയോക്താക്കൾക്ക് പിന്തുണ/സഹായം നൽകുന്നതിനായി ഒരു ഇമെയിൽ വിലാസം ഇവിടെ നൽകാം. മുന്നറിയിപ്പ്: ഇവിടെ നൽകിയിരിക്കുന്ന ഏതൊരു ഇമെയിൽ വിലാസവും സ്പാംബോട്ടുകളും സ്ക്രാപ്പറുകളും തീർച്ചയായും കണ്ടെത്തും, അതിനാൽ ഡിസ്പോസിബിൾ വിലാസങ്ങളും കൂടാതെ/അല്ലെങ്കിൽ നിങ്ങൾക്ക് താൽപ്പര്യമില്ലാത്ത വിലാസങ്ങളും മാത്രം നൽകാൻ ശക്തമായി ശുപാർശ ചെയ്യുന്നു (അതായത്, നിങ്ങളുടെ പ്രാഥമിക വ്യക്തിഗത അല്ലെങ്കിൽ പ്രാഥമിക ബിസിനസ്സ് ഇമെയിൽ വിലാസങ്ങൾ നൽകരുത്)."
 general_emailaddr_display_style: "ഉപയോക്താക്കൾക്ക് ഇമെയിൽ വിലാസം എങ്ങനെ നൽകാനാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?"
 general_fields: "തടയുമ്പോൾ ഫീൽഡുകൾക്കുള്ള കോൺഫിഗറേഷൻ."
 general_force_hostname_lookup: "ഹോസ്റ്റ്നെയിം തിരയൽ നിർബന്ധമാക്കണോ? True = അതെ; False = ഇല്ല [സ്ഥിരസ്ഥിതി]. ഹോസ്റ്റ്നെയിം തിരയലുകൾ സാധാരണയായി ആവശ്യാനുസരണം നടത്താറുണ്ട്, പക്ഷേ എല്ലാ അഭ്യർത്ഥനകൾക്കും നിർബന്ധിതമാക്കാം. ലോഗ് ഫയലുകളിൽ കൂടുതൽ വിശദമായ വിവരങ്ങൾ നൽകുന്നതിനുള്ള ഒരു മാർഗമായി അങ്ങനെ ചെയ്യുന്നത് ഉപയോഗപ്രദമായേക്കാം, പക്ഷേ പ്രകടനത്തെ നേരിയ തോതിൽ പ്രതികൂലമായി ബാധിച്ചേക്കാം."
 general_http_response_header_code: "അഭ്യർത്ഥനകൾ തടയുമ്പോൾ ഏത് HTTP സ്റ്റാറ്റസ് സന്ദേശമാണ് CIDRAM അയയ്ക്കേണ്ടത്?"
 general_ipaddr: "ബന്ധിപ്പിക്കൽ അഭ്യർത്ഥനകളുടെ IP വിലാസം എവിടെ കണ്ടെത്താം? (Cloudflare പോലുള്ള സേവനങ്ങൾക്ക് ഉപയോഗപ്രദമാണ്). സ്ഥിരസ്ഥിതി = REMOTE_ADDR. മുന്നറിയിപ്പ്: നിങ്ങൾ എന്താണ് ചെയ്യുന്നതെന്ന് നിങ്ങൾക്കറിയാമെങ്കിൽ മാത്രം ഇത് മാറ്റുക!"
 general_lang: "CIDRAM-നുള്ള സ്ഥിരസ്ഥിതി ഭാഷ വ്യക്തമാക്കുക."
 general_lang_override: "സാധ്യമാകുമ്പോഴെല്ലാം HTTP_ACCEPT_LANGUAGE അനുസരിച്ച് പ്രാദേശികവൽക്കരിക്കണോ? True = അതെ [സ്ഥിരസ്ഥിതി]; False = ഇല്ല."
 general_numbers: "അക്കങ്ങൾ എങ്ങനെ പ്രദർശിപ്പിക്കാനാണ് നിങ്ങൾ ഇഷ്ടപ്പെടുന്നത്? നിങ്ങൾക്ക് ഏറ്റവും ശരിയായി തോന്നുന്ന ഉദാഹരണം തിരഞ്ഞെടുക്കുക."
 general_request_proxy: "ഔട്ട്ബൗണ്ട് അഭ്യർത്ഥനകൾ ഒരു പ്രോക്സി വഴി അയയ്ക്കണമെങ്കിൽ, ആ പ്രോക്സി ഇവിടെ വ്യക്തമാക്കുക. ഇല്ലെങ്കിൽ, ഇത് ശൂന്യമായി വിടുക."
 general_request_proxyauth: "ഒരു പ്രോക്സി വഴിയാണ് ഔട്ട്ബൗണ്ട് അഭ്യർത്ഥനകൾ അയയ്ക്കുന്നതെങ്കിൽ, ആ പ്രോക്സിക്ക് ഒരു ഉപയോക്തൃനാമവും പാസ്‌വേഡും ആവശ്യമുണ്ടെങ്കിൽ, ആ ഉപയോക്തൃനാമവും പാസ്‌വേഡും ഇവിടെ വ്യക്തമാക്കുക (ഉദാഹരണത്തിന്, <code>user:pass</code>). ഇല്ലെങ്കിൽ, ഇത് ശൂന്യമായി വിടുക."
 general_sensitive: "സെൻസിറ്റീവ് പേജുകൾക്കുള്ള പാതകളുടെ ഒരു പട്ടിക. ആവശ്യമുള്ളപ്പോൾ, പട്ടികപ്പെടുത്തിയിരിക്കുന്ന ഓരോ പാതയും പുനർനിർമ്മിച്ച URI-യുമായി താരതമ്യം ചെയ്യുന്നതാണ്. ഒരു ഫോർവേഡ് സ്ലാഷിൽ ആരംഭിക്കുന്ന ഒരു പാത്ത് അക്ഷരാർത്ഥത്തിൽ കണക്കാക്കും, തുടർന്ന് അഭ്യർത്ഥനയുടെ പാത്ത് ഘടകത്തിൽ നിന്ന് താരതമ്യം ചെയ്യപ്പെടും. അല്ലെങ്കിൽ, ഒരു നോൺ-ആൽഫാന്യൂമെറിക് പ്രതീകത്തിൽ ആരംഭിച്ച് അതേ പ്രതീകത്തിൽ (അല്ലെങ്കിൽ അതേ പ്രതീകവും ഒരു ഓപ്ഷണൽ "i" ഫ്ലാഗും) അവസാനിക്കുന്ന ഒരു പാത്ത് ഒരു റെഗുലർ എക്സ്പ്രഷനായി കണക്കാക്കും. മറ്റേതൊരു തരത്തിലുള്ള പാതയും അക്ഷരാർത്ഥത്തിൽ കണക്കാക്കും, കൂടാതെ URI-യുടെ ഏത് ഭാഗത്തുനിന്നും താരതമ്യം ചെയ്യാനും കഴിയും. ഒരു പാത്ത് ഒരു സെൻസിറ്റീവ് പേജായി കണക്കാക്കുന്നുണ്ടോ എന്നത് ചില മൊഡ്യൂളുകൾ എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെ ബാധിച്ചേക്കാം, പക്ഷേ മറ്റുവിധത്തിൽ യാതൊരു ഫലവും ഉണ്ടാക്കുന്നില്ല."
 general_silent_mode: ""പ്രവേശനം നിരസിച്ചു" പേജ് പ്രദർശിപ്പിക്കുന്നതിനുപകരം, തടഞ്ഞ ആക്സസ് ശ്രമങ്ങളെ CIDRAM നിശബ്ദമായി റീഡയറക്ട് ചെയ്യണോ? അതെ എങ്കിൽ, തടഞ്ഞ ആക്‌സസ് ശ്രമങ്ങൾ റീഡയറക്‌ട് ചെയ്യേണ്ട സ്ഥലം വ്യക്തമാക്കുക. ഇല്ലെങ്കിൽ, ഈ വേരിയബിൾ ശൂന്യമായി വിടുക."
