 signatures_conflict_response: "Aynı kaynaklara erişmek için çok fazla eş zamanlı girişim olduğunda (örneğin, aynı kaynaklar için aynı makinedeki birden fazla PHP işlemine eş zamanlı istekler), bu girişimlerden bazıları başarısız olabilir. Nadiren de olsa, bu durumun imza dosyalarını veya modüllerini etkilemesi durumunda, CIDRAM'ın talep hakkında etkili bir karar vermesi engellenebilir. Eğer böyle bir durum gerçekleşirse, istek engellenmeli midir, ve CIDRAM hangi HTTP durum mesajını göndermelidir?"
