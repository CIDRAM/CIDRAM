macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "İhtiyacınız olmayan bazı şeyler olabileceğinden, bu genellikle önerilmez. Bileşenleri ihtiyaç duyulmadığında yüklemek ve etkinleştirmek, performansı olumsuz etkileyebilir."
  install_l10n_core: &RecommendKeepingCore "<code>lang_override</code> yapılandırma yönergesi etkinleştirildiğinde, bir kullanıcının tarayıcısı belirli bir dil tercihi belirtiyorsa, o dil için çekir L10N verileri kurulu olduğu sürece, CIDRAM, belirtilen dilde "erişim reddedildi" sayfasını görüntüleyebilir. Buna göre, tüm çekirdek L10N verilerinin kurulu kalması önerilir."
  install_l10n_fe: &RecommendFEOnlyNeeded "Tercih ettiğiniz dil, <code>lang</code> yapılandırma yönergesi aracılığıyla belirtilebilir. Bu yapıldıktan sonra, tercih ettiğiniz dil için olandan başka herhangi bir ön uç L10N verisine ihtiyaç duymazsınız ve kullanılabilir disk alanını boşaltmak için onu kaldırmak isteyebilirsiniz. Ancak, kaldırmayı veya tutmayı seçerseniz de, herhangi bir zarar vermemelidir."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
