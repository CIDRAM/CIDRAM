 Lock CAPTCHAs to the IP address of the user completing the CAPTCHA but not to the actual user: "Vincula os CAPTCHA ao enderezo IP do usuario que completa o CAPTCHA, pero non ao usuario real.\nAs cookies NON se usan para identificar usuarios. Cando se recupera o acceso despois de completar correctamente un CAPTCHA, aplícase a calquera persoa que se conecte desde o mesmo enderezo IP."
 Lock CAPTCHAs to the user completing the CAPTCHA as well as to their IP address: "Vincula os CAPTCHA ao usuario que completa o CAPTCHA, así como ao seu enderezo IP.\nAs cookies úsanse para identificar os usuarios. Cando se recupera o acceso despois de completar correctamente un CAPTCHA, só se aplica ao usuario que o completou e non persistirá se o seu enderezo IP cambia."
 Lock CAPTCHAs to the user completing the CAPTCHA but not to their IP address: "Vincula os CAPTCHA ao usuario que completa o CAPTCHA, pero non ao seu enderezo IP.\nAs cookies úsanse para identificar os usuarios. Cando se recupera o acceso despois de completar correctamente un CAPTCHA, só se aplica ao usuario que o completou e, mentres a súa cookie siga sendo válida, persistirá, mesmo se o seu enderezo IP cambia."
