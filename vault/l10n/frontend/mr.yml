 general_force_hostname_lookup: "होस्टनाव लुकअपची सक्ती करायची? True = होय; False = नाही [डीफॉल्ट]. होस्टनाव लुकअप सहसा "आवश्यकतेनुसार" आधारावर केले जातात, परंतु सर्व विनंत्यांसाठी ते सक्ती केले जाऊ शकतात. लॉग फायलीमध्ये अधिक तपशीलवार माहिती प्रदान करण्यासाठी असे करणे उपयुक्त ठरू शकते, परंतु कामगिरीवर थोडासा नकारात्मक परिणाम देखील होऊ शकतो."
