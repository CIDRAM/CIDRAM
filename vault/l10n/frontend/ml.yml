 legal_privacy_policy: "ജനറേറ്റ് ചെയ്യുന്ന ഏതൊരു പേജിന്റെയും ഫൂട്ടറിൽ പ്രദർശിപ്പിക്കേണ്ട പ്രസക്തമായ സ്വകാര്യതാ നയത്തിന്റെ വിലാസം. ഒരു URL വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പ്രവർത്തനരഹിതമാക്കാൻ ശൂന്യമായി വിടുക."
 legal_pseudonymise_ip_addresses: "രേഖപ്പെടുത്തിയിരിക്കുന്ന IP വിലാസങ്ങൾ വ്യാജനാമമാക്കണോ? True = അതെ [സ്ഥിരസ്ഥിതി]; False = ഇല്ല."
