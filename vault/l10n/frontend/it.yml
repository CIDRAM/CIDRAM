 Project Honeypot module: "Blocca le richieste dagli IP elencati in Project Honeypot."
 Protocol blocker module: "Fornisce la possibilità di bloccare specifici protocolli di richiesta tramite la configurazione (per esempio, HTTP/0.9, HTTP/1.1, SPDY/3.0, ecc)."
 Referrer spam module: "Il blocco basato sullo spam dei referrer in genere non offre alcun vantaggio significativo in termini di sicurezza, ma in alcuni casi potrebbe essere utile per alcuni utenti, per raccogliere maggiori informazioni sulle richieste e per poterle rapporta."
 Stop Forum Spam module: "Protegge le pagine di registrazione e di accesso agli IP elencati da SFS."
