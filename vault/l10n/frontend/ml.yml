macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "നിങ്ങൾക്ക് ആവശ്യമില്ലാത്ത ചിലത് ഉണ്ടാകാൻ സാധ്യതയുള്ളതിനാൽ, സാധാരണയായി ശുപാർശ ചെയ്യുന്നില്ല. ആവശ്യമില്ലാത്ത ഘടകങ്ങൾ ഇൻസ്റ്റാൾ ചെയ്യുന്നതും സജീവമാക്കുന്നതും പ്രകടനത്തെ പ്രതികൂലമായി ബാധിച്ചേക്കാം."
  install_l10n_core: &RecommendKeepingCore "<code>lang_override</code> കോൺഫിഗറേഷൻ നിർദ്ദേശം പ്രാപ്തമാക്കുമ്പോൾ, ഒരു ഉപയോക്താവിന്റെ ബ്രൗസർ ഒരു പ്രത്യേക ഭാഷാ മുൻഗണന വ്യക്തമാക്കിയിട്ടുണ്ടെങ്കിൽ, ആ ഭാഷയ്ക്കുള്ള കോർ L10N ഡാറ്റ ഇൻസ്റ്റാൾ ചെയ്തിട്ടുണ്ടെങ്കിൽ, CIDRAM-ന് ആ നിർദ്ദിഷ്ട ഭാഷയിൽ "പ്രവേശനം നിരസിച്ചു" പേജ് പ്രദർശിപ്പിക്കാൻ കഴിയും. അതനുസരിച്ച്, എല്ലാ കോർ L10N ഡാറ്റയും ഇൻസ്റ്റാൾ ചെയ്ത നിലയിൽ തന്നെ നിലനിർത്താൻ ശുപാർശ ചെയ്യുന്നു."
  install_l10n_fe: &RecommendFEOnlyNeeded "നിങ്ങളുടെ ഇഷ്ടപ്പെട്ട ഭാഷ <code>lang</code> കോൺഫിഗറേഷൻ നിർദ്ദേശം വഴി വ്യക്തമാക്കാവുന്നതാണ്. ഇത് ചെയ്തുകഴിഞ്ഞാൽ, നിങ്ങളുടെ ഇഷ്ടപ്പെട്ട ഭാഷയ്ക്ക് അല്ലാതെ മറ്റൊരു ഫ്രണ്ട്-എൻഡ് L10N ഡാറ്റയും ആവശ്യമായി വരില്ല, കൂടാതെ ലഭ്യമായ ഡിസ്ക് സ്ഥലം നേരിയ തോതിൽ ശൂന്യമാക്കുന്നതിനായി നിങ്ങൾ അത് നീക്കം ചെയ്യാൻ ആഗ്രഹിച്ചേക്കാം. എന്നിരുന്നാലും, എന്തായാലും, അത് ഒരു ദോഷവും ചെയ്യില്ല."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
