 logging_apache_style_log: "Файл у стилі Apache для журналювання всіх заблокованих спроб доступу. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_error_log: "Файл для журналізації будь-яких виявлених нефатальних помилок. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_log_banned_ips: "Включати в журнали заблоковані запити із забанених IP-адрес? True = Так [Стандарт]; False = Ні."
 logging_log_rotation_action: "Ротація журналу обмежує кількість файлів журналу, які мають існувати одночасно. Під час створення нових файлів журналу, якщо загальна кількість файлів журналу перевищує вказаний ліміт, буде виконано вказану дію. Тут можна вказати бажану дію."
 logging_log_rotation_limit: "Ротація журналу обмежує кількість файлів журналу, які мають існувати одночасно. Під час створення нових файлів журналу, якщо загальна кількість файлів журналу перевищує вказаний ліміт, буде виконано вказану дію. Бажаний ліміт можна вказати тут. Значення 0 вимикає ротацію журналу."
 logging_log_sanitisation: "Під час перегляду даних на фронтенді сторінці журналів, CIDRAM очищає дані журналу перед їх відображенням, щоб захистити користувачів від атак XSS та інших потенційних загроз, які можуть містяться в даних журналу. Однак, як правило, дані не очищаються під час журналізації. Це необхідно для того, щоб дані журналу зберігається акуратно, щоб допомогти будь-якому евристичному аналізу, який може знадобитися в майбутньому. Однак у випадку якщо користувач намагається прочитати дані журналу за допомогою зовнішніх інструментів, і якщо ці зовнішні інструменти не виконують власний процес очищення, користувач може піддатися XSS-атакам. За потреби ви можете змінити типову поведінку за допомогою цієї директиви конфігурації. True = Очистити дані під час запису в журнал (дані зберігаються менш точно, але ризик XSS менший). False = Не очищайте дані під час запису в журнал (дані зберігаються точніше, але ризик XSS вищий) [Стандарт]."
 logging_outbound_request_log: "Файл для реєстрації результатів будь-яких вихідних запитів. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_report_log: "Файл для реєстрації будь-яких звітів, надісланих зовнішнім API. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_serialised_log: "Серіалізований файл для журналювання всіх заблокованих спроб доступу. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_standard_log: "Файл, який читається людиною, для журналювання всіх заблокованих спроб доступу. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 logging_truncate: "Обрізати файли журналу, коли вони досягають певного розміру? Вкажіть максимальний допустимий розмір у Б/КБ/МБ/ГБ/ТБ, перш ніж файл буде обрізано. Стандартне значення 0КБ вимикає обрізка (журнали можуть рости нескінченно). Зауважте: Стосується окремих журналів! Розмір файлів журналу не розглядається разом."
 phpmailer: "Конфігурація для PHPMailer (використовується для двофакторної автентифікації та для сповіщень електронною поштою)."
 phpmailer_add_reply_to_address: "Адреса відповіді для надсилання електронної пошти через SMTP."
 phpmailer_add_reply_to_name: "Ім'я відповіді під час надсилання електронної пошти через SMTP."
 phpmailer_event_log: "Файл для журналізації всіх подій пов'язаних із PHPMailer. Вкажіть назву файлу, або залиште поле порожнім щоб вимкнути його."
 phpmailer_host: "Хост SMTP для вихідної електронної пошти."
