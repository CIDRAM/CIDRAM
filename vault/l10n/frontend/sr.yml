 rate_limiting_max_requests: "Колико захтева може бити послато у оквиру додељеног времена пре ограничавања брзине будућих захтева. Вредност 0 онемогућава ову врсту ограничења брзине. Подразумевано = 0."
 rate_limiting_precision_ipv4: "Прецизност за праћење употребе ИПв4. Вредност одражава величину ЦИДР блока. Подесите на 32 за најбољу прецизност. Подразумевано = 32."
 rate_limiting_precision_ipv6: "Прецизност за праћење употребе ИПв6. Вредност одражава величину ЦИДР блока. Подесите на 128 за најбољу прецизност. Подразумевано = 128."
