 Don_t block the request: "Не блокирајте захтев.\nАко желите да захтеви буду блокирани само када сте сигурни да су злонамерни, или да будете опрезни у вези са лажно позитивним резултатима (по цену повременог проласка нежељеног саобраћаја), изаберите ово. Ако желите да захтеви буду блокирани ако нисте сигурни да су безазлени, или ако желите да останете опрезни (по цену повремених лажно позитивних резултата), изаберите једну од других доступних опција."
