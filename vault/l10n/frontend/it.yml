tip:
 2FA Sent: "Una posta elettronica contenente un codice di autenticazione a due fattori è stata inviata al suo indirizzo di posta elettronica. Si prega di confermare questo codice qui sotto per ottenere l'accesso al front-end. Se non hai ricevuto questa posta elettronica, prova a disconnettersi, attendere 10 minuti e accedi di nuovo per ricevere una nuova posta elettronica contenente un nuovo codice."
 Accounts: "La pagina di conti permette di controllare chi può accedere il front-end di CIDRAM."
 Actions menu: "Bloccare aggiunge 1 al conteggio delle firme. Bypassare sottrae 1 dal conteggio delle firme. Lista bianca imposta il conteggio delle firme su 0 e termina l'elaborazione, saltando completamente tutte le regole successive. Lista grigia imposta il conteggio delle firme su 0, ma non termina l'elaborazione. Profilare non influisce sul conteggio delle firme, ma è utile quando potrebbe essere necessaria una logica più complessa per determinare se eseguire altri tipi di azioni, poiché i profili generati potrebbero essere concatenati alle condizioni delle regole successive. Dopo l'elaborazione, se il conteggio delle firme è pari o superiore a 1, la richiesta verrà bloccata."
 Aggregator: "L'aggregatore consente di esprimere indirizzi IP, CIDR, e maschere di rete nel modo più piccolo possibile. Inserire i dati da aggregare e premere "OK"."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Un valore accettato è qualsiasi CIDR con un intervallo che copra l'indirizzo IP della richiesta. Ad esempio, 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, ecc sarebbero accettati per 1.2.3.4. Per evitare falsi positivi, in genere sono preferibili intervalli più ristretti (ad esempio, 1.2.3.4/32) rispetto a intervalli più ampi (ad esempio, 0.0.0.0/1). La pagina della calcolatrice può essere utilizzata per trovare quali CIDR hanno intervalli che coprono un indirizzo IP specificato."
 Auxiliary Rules Modes: "La modalità di visualizzazione mostra le regole ausiliarie come un elenco compatto per facilitarne la lettura. È possibile espandere le regole nell'elenco e visualizzare ulteriori dettagli cliccando su di esse. Cliccando sul trigramma (☰) verranno visualizzate le opzioni per esportare o eliminare una regola. Le regole possono essere riordinate tramite trascinamento, ovvero trascinando una regola dalla sua posizione esistente alla posizione desiderata. La modalità di modifica è necessaria per modificare le regole ausiliarie, campi modificabili e opzioni per aggiungere nuove condizioni, webhook, o altra logica alle regole secondo necessità fornite nella pagina. È possibile creare nuove regole ausiliarie tramite entrambe le modalità."
 Auxiliary Rules Priority: "Priorità (massimo➡(pari🔄equivalente)➡minore):"
 Auxiliary Rules Webhooks: "Quando viene innescata una regola, CIDRAM tenterà di notificare eventuali webhook collegati all'evento. Un webhook è un URL in grado di ricevere dati POST e potrebbe essere utile se è presente un servizio esterno, un'app, uno script, ecc. ospitato su una rete completamente diversa da CIDRAM, che si desidera gestire i dati generati da CIDRAM sulla richiesta."
 Auxiliary Rules: "Puoi utilizzare questa pagina per creare, eliminare e modificare le regole ausiliarie per CIDRAM."
 Backup: "Questa pagina può essere utilizzata per importare/esportare la configurazione, le regole ausiliarie, ecc. Questa può essere utile se è necessario la migrazione dei dati tra installazioni diverse o versioni principali diverse."
 Cache Data: "Qui puoi rivedere il contenuto della cache."
 Calculator: "La calcolatrice permette di calcolare i CIDR e le maschere di rete di un indirizzo IP."
 Click the component name for more details: "Fare clic sul nome del componente per ulteriori dettagli."
 Configuration: "La pagina di configurazione permette di modificare la configurazione per CIDRAM dal front-end."
 Enter IP address here: "Inserisci l'indirizzo IP qui."
 Enter IP address here (optional): "Inserisci l'indirizzo IP qui (facoltativo)."
 Enter IP addresses here: "Inserisci gli indirizzi IP qui."
 Enter input here: "Inserisci qui l'input."
 Enter queries here: "Inserisci la query qui."
 Enter query here (optional): "Inserisci la query qui (facoltativo)."
 Enter referrer here (optional): "Inserisci la referente qui (facoltativo)."
 Enter user agent here (optional): "Inserisci l'agente utente qui (facoltativo)."
 Enter user agents here: "Inserisci gli agenti utente qui."
 File Manager: "Il file manager consente di eliminare, modificare, caricare e scaricare file. Usare con cautela (si potrebbe rompere l'installazione di questo)."
 Glossary: "Il glossario descrive parte della terminologia utilizzata da CIDRAM, al fine di chiarire il significato previsto nel contesto in cui viene utilizzata."
 Greeting: "Salve, %s."
 Home: "Questa è la pagina principale per il front-end di CIDRAM. Selezionare un collegamento dal menu di navigazione a sinistra per continuare."
 How many infractions to incur: "Quante infrazioni incorrere."
 IP Testing: "La pagina di per il test di IP permette di testare se gli indirizzi IP sono bloccati dalle firme attualmente installati."
 IP Tracking: "La pagina di tracciamento IP consente di verificare lo stato del tracciamento degli indirizzi IP, per verificare quali di essi sono stati vietati, e di revocare il tracciamento loro se si vuole farlo."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Se una richiesta proviene da un indirizzo IPv6 appartenente a un intervallo utilizzato da un meccanismo di transizione IPv6 (ad esempio, 6to4, Teredo, ISATAP, ecc), il campo "indirizzo IP (risoluto)" verrà popolato con l'indirizzo IPv4 a cui quell'indirizzo IPv6 corrisponde in base a tale meccanismo di transizione IPv6 (ad esempio, se l'indirizzo IP è "2002:c0a8:1::", l'indirizzo IP (risoluto) sarà "192.168.0.1"). In tutti gli altri casi, i campi "indirizzo IP (risoluto)" e "indirizzo IP" saranno identici."
 Intersector: "L'intersettore può essere utilizzato per determinare i fattori comuni da due serie di gamme."
 Logs: "Selezionare un file di log dall'elenco sottostante per visualizzare il contenuto di tale file di log."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Si noti che il valore esatto di questa statistica sarà lo stesso mostrato nella pagina delle statistiche al momento dell'elaborazione della regola."
 Number of seconds until it expires: "Numero di secondi prima della scadenza."
 Numeric comparison: "Per utilizzare il confronto numerico, seleziona il confronto diretto delle stringhe o il rilevamento automatico del metodo, assicurati che il valore della condizione sia numerico, e anteponilo all'operatore desiderato.<br />Per esempio, per condizioni "uguali", &gt;=2 fornisce ≥2, &lt;=2 fornisce ≤2, per condizioni "non uguali", &gt;=2 fornisce ≱2, &lt;=2 fornisce ≰2, ecc."
 Range Tables: "Questa pagina mostra alcune informazioni statistiche sugli gamme IP coperti dai file delle firme attualmente attivi."
 Rate Limiting: "Questa pagina mostra l'utilizzo e la disponibilità corrente della quota riguarda la limitazione della velocità."
 Rate limiting is currently disabled: "Nota: La limitazione della velocità è attualmente disattivato, ma può essere attivato tramite la pagina di configurazione."
 Report to AbuseIPDB: "Questa pagina può essere utilizzata per rapportare indirizzi IP ad AbuseIPDB, o per eliminare rapporti precedenti nel caso in cui un indirizzo IP sia stato rapportato per errore."
 Sections List: "Questa pagina elenca le sezioni presenti nei file di firma attualmente attivi."
 See the documentation: "Vedere la <a href="{{Links.CIDRAM.Docs Base Path}}readme.it.md\#user-content-SECTION5" hreflang="it-IT" rel="noopener external"><span class="navicon documentation"></span>documentazione</a> per informazioni sulle varie direttive di configurazione ed i loro scopi."
 Server log snippets, abuse details, etc: "Estratti del registro del server, dettagli sugli abusi, ecc."
 Signature File Fixer: "Il fissatore per i file di firme fornisce un modo per rilevare e risolvere potenziali problemi nei file di firme."
 Specify a URL, or leave blank to disregard: "Specifica un URL, oppure lascia vuoto per ignorarlo."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Specificare un percorso di directory, o lasciare vuoto per utilizzare il percorso di base CIDRAM."
 Specify a value, or leave blank to disregard: "Specificare un valore, oppure lascia vuoto per ignorarlo."
 Statistics tracking is currently disabled: "Nota: Il monitoraggio delle statistiche è attualmente disattivato, ma può essere attivato tramite la pagina di configurazione."
 Statistics: "Questa pagina mostra alcune statistiche di utilizzo relative all'installazione di CIDRAM."
 Subtractor: "Il sottrattore può essere utilizzato per sottrarre un gamma di IP/CIDR/maschere di rete da un altro."
 Updates: "La pagina degli aggiornamenti permette di installare, disinstallare e aggiornare i vari componenti di CIDRAM (il pacchetto di base, le firme, file per L10N, ecc)."
 When available, the value of the country code lookup: "Quando disponibile, il valore della ricerca del codice paese è un codice paese {{Links.ISO.3166}} a 2 cifre. Ad esempio, US per Stati Uniti, RU per Russia, CN per Cina, ecc."
warning: !lazy
 API_Rate_Limited: "Avvertimento: L'accesso all'API %s sembra essere attualmente limitato."
 Cookies: "Nota: CIDRAM utilizza un cookie per autenticare gli accessi. Accedendo, ti dà il suo consenso per creare e memorizzare un cookie dal suo browser."
 Editing PHP files: "Avvertimento: È noto che alcune soluzioni di sicurezza del web hosting vietano automaticamente gli indirizzi IP al rilevamento di tag PHP all'interno delle richieste (ad esempio, quando si modificano i file PHP tramite un browser). CIDRAM non ha modo di sapere se il suo servizio di web hosting utilizza una tale soluzione di sicurezza. Per evitare tali problemi, quando possibile si consiglia di non modificare i file PHP in questo modo."
 IP tests are disabled: "Avvertimento: I test IP sono disabilitati! I file di firma non possono essere utilizzati finché questo non viene risolto."
 JavaScript required: "Avvertimento: Alcune funzionalità del front-end richiedono JavaScript. Per garantire che l'intero front-end si comporti come previsto, si consiglia di abilitare JavaScript."
 Likely to be overwritten: "Avvertimento: Il file che stai attualmente modificando appartiene al componente "%s". È molto probabile che tutte le modifiche apportate a questo file vengano sovrascritte al successivo aggiornamento del componente."
 Likely to become corrupted: "Avvertimento: Sono stati rilevati byte non UTF8 nel file attualmente in fase di modifica. È probabile che il file venga danneggiato se modificato utilizzando questa particolare funzionalità."
 Modules are disabled: "Avvertimento: I moduli sono disabilitati! I moduli non possono essere utilizzati finché questo non viene risolto."
 No modules are active: "Avvertimento: Nessun modulo è attivo! I moduli possono essere attivati utilizzando le pagine di configurazione o aggiornamenti."
 No signature files are active: "Avvertimento: Nessun file di firma attivo! I file di firma possono essere attivati utilizzando le pagine di configurazione o aggiornamenti."
 Operating in dry run mode: "Avvertimento: Operando in modalità di secco! Durante il funzionamento in modalità di secco, le richieste vengono comunque controllate e registrate come eventi di blocco come al solito, ma nulla viene bloccato."
 Operating in maintenance mode: "Avvertimento: Operando in modalità di manutenzione! Durante il funzionamento in modalità di manutenzione, nulla viene controllato, registrato, o bloccato."
 Page termination is disabled: "Avvertimento: La chiusura della pagina è disabilitata! Le richieste non possono essere bloccate correttamente finché questo non viene risolto."
 Proceeding will log out all users: "Avvertimento: Procedendo si disconnetterà tutti gli utenti."
 The auxiliary rules execution stage is currently disabled: "Avvertimento: La fase di esecuzione delle regole ausiliarie è attualmente disabilitata."
 This account is not using a valid password: "Avvertimento: Questo account non utilizzando una password valida!"
 Using the default password: "Avvertimento: Utilizzando la password predefinita!"
