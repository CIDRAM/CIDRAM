 general_numbers: "Як ви віддаєте перевагу відображенню чисел? Виберіть приклад, який вам здається найбільш правильним."
 general_request_proxy: "Якщо ви хочете щоб вихідні запити надсилалися через проксі-сервер, вкажіть цей проксі-сервер тут. Якщо ні, залиште це поле порожнім."
 general_request_proxyauth: "Якщо вихідні запити надсилаються через проксі-сервер, і якщо цей проксі-сервер вимагає ім'я користувача та пароль, вкажіть це ім'я користувача та пароль тут (наприклад, <code>user:pass</code>). Якщо ні, залиште це поле порожнім."
 general_sensitive: "Список шляхів, які вважаються конфіденційними сторінками. Кожен шлях у списку буде перевірено на реконструйований URI, якщо це необхідно. Шлях, який починається з косої риски, розглядатиметься як літерал і відповідатиме, починаючи з компонента шляху запиту. Крім того, шлях, який починається не буквено-цифровим символом і закінчується тим самим символом (або тим самим символом плюс необов'язковий прапорець «i»), буде розглядатися як регулярний вираз. Будь-який інший вид шляху розглядатиметься як літерал і може відповідати будь-якій частині URI. Шлях, який вважається конфіденційною сторінкою, може вплинути на поведінку деяких модулів, але не матиме жодного ефекту в інших випадках."
 general_silent_mode: "Чи повинен CIDRAM мовчки перенаправляти заблоковані спроби доступу замість відображення сторінки «доступ заборонено»? Якщо так, вкажіть місце куди потрібно перенаправляти заблоковані спроби доступу. Якщо ні, залиште цю змінну пустою."
 general_silent_mode_response_header_code: "Яке повідомлення про статус HTTP має надсилати CIDRAM під час тихого перенаправлення спроб заблокованого доступу?"
 general_stages: "Елементи керування для етапів ланцюжка виконання (чи ввімкнено, чи реєструються помилки, тощо)."
 general_statistics: "Контролює яку статистичну інформацію відстежувати."
