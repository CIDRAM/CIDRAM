tip:
 2FA Sent: "En e-post som inneholder en 2FA-kode, er sendt til e-postadressen din. Vennligst bekreft denne koden nedenfor for å få tilgang til frontenden. Hvis du ikke mottok denne e-posten, du kan prøve å logge ut, vente i 10 minutter og logge på igjen for å motta en ny e-post som inneholder en ny kode."
 Accounts: "Du kan kontrollere hvem som kan få tilgang til CIDRAM-frontenden ved hjelp av kontosiden."
 Actions menu: "Blokkere legger til 1 til antallet signaturer. Bypassere trekker 1 fra antallet signaturer. Hvitliste setter antallet signaturer til 0 og avslutter behandlingen, og hopper dermed over alle påfølgende regler helt. Gråliste setter antallet signaturer til 0, men avslutter ikke behandlingen. Profilere påvirker ikke antallet signaturer, men er nyttig når det kan være nødvendig med mer kompleks logikk for å avgjøre om andre typer handlinger skal utføres, ettersom genererte profiler kan være knyttet til betingelsene i påfølgende regler. Hvis antallet signaturer er 1 eller høyere etter behandling, vil forespørselen bli blokkert."
 Aggregator: "Aggregatoren lar deg uttrykke IPer, CIDRer, og nettmasker på den minste mulige måten. Skriv inn dataene som skal aggregeres og trykk «OK»."
 An accepted value is any CIDR with a range that covers the IP address of the request: "En akseptert verdi er en CIDR med et område som dekker IP-adressen til forespørselen. F.eks., vil 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, osv bli akseptert for 1.2.3.4. For å unngå falske positiver er smalere områder (f.eks., 1.2.3.4/32) generelt å foretrekke fremfor bredere områder (f.eks., 0.0.0.0/1). Kalkulatoren kan brukes til å finne hvilke CIDRer som har områder som dekker en spesifisert IP-adresse."
 Auxiliary Rules Modes: "Visningsmodus viser tilleggsregler som en kompakt liste for enkel lesning. Regler i listen kan utvides og ytterligere detaljer vises ved å klikke på dem. Alternativer for å eksportere eller slette en regel vises når du klikker på trigrammet (☰). Regler kan endre rekkefølgen ved å dra og slippe, ved å dra en regel fra den eksisterende posisjonen og til ønsket posisjon. Redigeringsmodus er nødvendig for å endre tilleggsregler, redigerbare felt og alternativer for å legge til nye betingelser, webhooks, eller annen logikk i reglene etter behov som er angitt på siden. New auxiliary rules can be created via either mode."
 Auxiliary Rules Priority: "Prioritet (høyeste➡(lik🔄tilsvarende)➡lavest):"
 Auxiliary Rules Webhooks: "Når en regel utløses, CIDRAM vil prøve å varsle eventuelle tilkoblede nettkroker om hendelsen. En webhook er en URL som kan motta POST-data, og kan være nyttig hvis det finnes en ekstern tjeneste, app, skript osv som ligger på et helt annet nettverk enn CIDRAM, og du vil at dataene som genereres av CIDRAM om forespørselen skal håndtere."
 Auxiliary Rules: "Du kan bruke denne siden til å opprette, slette og endre tilleggsregler for CIDRAM."
 Backup: "Denne siden kan brukes til å importere/eksportere konfigurasjonen din, tilleggsregler din, osv. Dette kan være nyttig hvis du trenger å migrere data på tvers av forskjellige installasjoner eller forskjellige hovedversjoner."
 Cache Data: "Her kan du se innholdet i cachen."
 Calculator: "Kalkulatoren lar deg beregne CIDRene og nettmaskene til en IP-adresse."
 Click the component name for more details: "Klikk på komponentnavnet for flere detaljer."
 Configuration: "Konfigurasjonssiden lar deg endre konfigurasjonen for CIDRAM fra frontenden."
 Enter IP address here: "Skriv inn IP-adressen her."
 Enter IP address here (optional): "Skriv inn IP-adressen her (valgfritt)."
 Enter IP addresses here: "Skriv inn IP-adressene her."
 Enter input here: "Skriv inn innspill her."
 Enter queries here: "Skriv inn spørringer her."
 Enter query here (optional): "Skriv inn spørringen her (valgfritt)."
 Enter referrer here (optional): "Skriv inn referenten her (valgfritt)."
 Enter user agent here (optional): "Skriv inn brukeragent her (valgfritt)."
 Enter user agents here: "Skriv inn brukeragenter her."
 File Manager: "Filbehandleren lar deg slette, redigere, laste opp og laste ned filer. Bruk med forsiktighet (du kan ødelegge installasjonen din med dette)."
 Glossary: "Ordlisten beskriver noe av terminologien som brukes av CIDRAM, for å bidra til å tydeliggjøre den tiltenkte betydningen i konteksten der den brukes."
 Greeting: "Hallo, %s."
 Home: "Dette er hjemmesiden for frontenden av CIDRAM. Velg en lenke fra navigasjonsmenyen til venstre for å fortsette."
 How many infractions to incur: "Hvor mange overtredelser å pådra."
 IP Testing: "IP-testsiden lar deg teste om IP-adresser er blokkert av signaturene som er installert."
 IP Tracking: "IP-sporing-siden lar deg sjekke sporingsstatus for IP-adresser, for å sjekke hvilken av dem som er blitt utestengt, og å oppheve utestengt status eller slutte å spore hvis du vil gjøre det."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Hvis en forespørsel kobler seg til fra en IPv6-adresse som tilhører et område som brukes av en IPv6-overgangsmekanisme (f.eks., 6to4, Teredo, ISATAP, osv), vil feltet «IP-adresse (løst)» fylles ut av IPv4-adressen som den IPv6-adressen oversettes til under den IPv6-overgangsmekanismen (f.eks., hvis «IP-adresse» er «2002:c0a8:1::», vil «IP-adresse (løst)» være «192.168.0.1»). I alle andre tilfeller vil feltene «IP-adresse (løst)» og «IP-adresse» være de samme."
 Intersector: "Kryssverktøyen kan brukes til å bestemme de vanlige faktorene fra to sett med områder."
 Logs: "Velg en loggfil fra listen nedenfor for å se innholdet i den loggfilen."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Merk at den nøyaktige verdien av denne statistikken vil være den samme som den som vises på statistikksiden når regelen behandles."
 Number of seconds until it expires: "Antall sekunder til den utløper."
 Numeric comparison: "For å bruke numerisk sammenligning, velg direkte streng sammenligning eller automatisk metodedeteksjon, sørg for at betingelsens verdi er numerisk, og prefiks den med ønsket operator.<br />F.eks., for «likeverdige» betingelser, &gt;=2 gir ≥2, &lt;=2 gir ≤2, for «ikke likeverdige» betingelser, &gt;=2 gir ≱2, &lt;=2 gir ≰2, osv."
 Range Tables: "Denne siden viser noen grunnleggende statistiske opplysninger om signaturene som dekkes av de aktive signaturfilene."
 Rate Limiting: "Denne siden viser gjeldende kvotebruk og tilgjengelighet med hensyn til hastighetsbegrensning."
 Rate limiting is currently disabled: "Merk: Hastighetsbegrensning er for øyeblikket deaktivert, men kan aktiveres via konfigurasjonssiden."
 Report to AbuseIPDB: "Denne siden kan brukes til å rapportere IP-adresser til AbuseIPDB, eller til å slette tidligere rapporter i tilfelle at en IP-adresse er feilrapportert."
 Sections List: "Denne siden viser hvilke seksjoner som finnes i de aktive signaturfilene."
 See the documentation: "Se <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>dokumentasjonen</a> for informasjon om de ulike konfigurasjonsdirektiver og deres formål."
 Server log snippets, abuse details, etc: "Utdrag fra serverlogg, misbruksdetaljer, osv."
 Signature File Fixer: "Signaturfilfikseren gir en måte å oppdage og fikse potensielle problemer i signaturfiler."
 Specify a URL, or leave blank to disregard: "Angi en URL, eller la feltet stå tomt for å ignorere."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Angi en katalogsti, eller la feltet stå tomt for å bruke CIDRAM-basisstien."
 Specify a value, or leave blank to disregard: "Angi en verdi, eller la feltet stå tomt for å ignorere."
 Statistics tracking is currently disabled: "Merk: Statistikksporing er for øyeblikket deaktivert, men kan aktiveres via konfigurasjonssiden."
 Statistics: "Denne siden viser noen grunnleggende bruksstatistikk angående CIDRAM-installasjonen."
 Subtractor: "Subtraktoren kan brukes til å trekke fra et område med IPer/CIDRer/nettmasker fra et annet."
 Updates: "Oppdateringssiden lar deg installere, avinstallere og oppdatere de forskjellige komponentene i CIDRAM (kjernepakken, signaturer, L10N filer, osv)."
 When available, the value of the country code lookup: "Når det er tilgjengelig, verdien for landskodeoppslaget er en {{Links.ISO.3166}}-landskode med to sifre. F.eks., US for USA, RU for Russland, CN for Kina, osv."
warning: !lazy
 API_Rate_Limited: "Advarsel: Tilgang til %s API ser ut til å være ratebegrenset for øyeblikket."
 Cookies: "Merk: CIDRAM bruker en informasjonskapsel for å godkjenne innlogginger. Ved å logge inn, gir du ditt samtykke til at en informasjonskapsel skal opprettes og lagres av nettleseren din."
 Editing PHP files: "Advarsel: Noen sikkerhetsløsninger for webhotell har vært kjent for å automatisk forby IP-adresser når de oppdager PHP-koder i forespørsler (f.eks., når du prøver å endre PHP-filer via en nettleser). CIDRAM har ingen mulighet til å vite om webhotell tjenesten din bruker en slik sikkerhetsløsning. For å unngå slike problemer, anbefales det å ikke redigere PHP-filer på en slik måte når det er mulig."
 IP tests are disabled: "Advarsel: IP-tester er deaktivert! Signaturfiler kan ikke brukes før dette er løst."
 JavaScript required: "Advarsel: Noen frontend-funksjonalitet krever JavaScript. For å sikre at hele frontenden oppfører seg som forventet, anbefales det å aktivere JavaScript."
 Likely to be overwritten: "Advarsel: Filen du for øyeblikket redigerer tilhører komponenten "%s". Eventuelle endringer i denne filen vil sannsynligvis bli overskrevet neste gang den komponenten oppdateres."
 Likely to become corrupted: "Advarsel: Det ble oppdaget byte som ikke er UTF8 i filen som redigeres. Filen vil sannsynligvis bli ødelagt hvis den redigeres med denne funksjonaliteten."
 Modules are disabled: "Advarsel: Moduler er deaktivert! Moduler kan ikke brukes før dette er løst."
 No modules are active: "Advarsel: Ingen moduler er aktive! Moduler kan aktiveres ved å bruke konfigurasjonssiden eller oppdateringssiden."
 No signature files are active: "Advarsel: Ingen signaturfiler er aktive! Signaturfiler kan aktiveres ved å bruke konfigurasjonssiden eller oppdateringssiden."
 Operating in dry run mode: "Advarsel: Drift i tørrkjøringsmodus! I tørrkjøringsmodus blir forespørsler fortsatt sjekket og logget som blokkeringshendelser som vanlig, men ingenting er blokkert."
 Operating in maintenance mode: "Advarsel: Drift i vedlikeholdsmodus! I vedlikeholdsmodus blir ingenting sjekket, logget, eller blokkert."
 Page termination is disabled: "Advarsel: Sideavslutning er deaktivert! Forespørsler kan ikke blokkeres ordentlig før dette er løst."
 Proceeding will log out all users: "Advarsel: Hvis du fortsetter, logges alle brukere ut."
 The auxiliary rules execution stage is currently disabled: "Advarsel: Utførelsesfasen for tilleggsregler er for øyeblikket deaktivert."
 This account is not using a valid password: "Advarsel: Denne kontoen bruker ikke et gyldig passord!"
 Using the default password: "Advarsel: Bruker standard passordet!"
