 Stop Forum Spam module: "SFS द्वारे सूचीबद्ध केलेल्या IP पत्त्यांपासून नोंदणी आणि लॉगिन पृष्ठांचे संरक्षण करते."
 Tor blocker module: "DNSEL लुकअपद्वारे टोर एक्झिट नोड्समधून प्रवेश प्रतिबंधित करते (IPv4 आणि IPv6 दोन्हींना समर्थन देते)."
Glossary: !lazy
 Entries:
  CIDR: |
   "CIDR" हे "Classless Inter-Domain Routing" चे संक्षिप्त रूप आहे, आणि "CIDRAM" मधील "CIDR" हे नाव येथूनच आले आहे. "CIDRAM" हे "Classless Inter-Domain Routing Access Manager" चे संक्षिप्त रूप आहे.
   CIDRAM च्या संदर्भात, "CIDR" म्हणजे विशेषतः CIDR नोटेशन वापरून व्यक्त केलेले सबनेट.
  खोटे सकारात्मक: |
   सर्वसाधारणपणे, चाचणी करताना, जेव्हा चाचणीचे निकाल "सकारात्मक" (म्हणजे, चाचणीच्या अटी खऱ्या ठरतात) असतात, परंतु ते "नकारात्मक" अपेक्षित असतात (म्हणजे, चाचणीचे निकाल चुकीचे असतात), तेव्हा त्याला "खोटे सकारात्मक" असे म्हणतात. <em>इंग्रजी: "false positive". किंवा पर्यायाने: "फॉल्स पॉझिटिव्ह एरर"; "फॉल्स अलार्म".</em>
   "खरे सकारात्मक", "खरे नकारात्मक", आणि "खोटे नकारात्मक" या काही संबंधित संज्ञा आहेत. <em>इंग्रजी: "true positive", "true negative", "false negative".</em> "खरे सकारात्मक" म्हणजे जेव्हा चाचणीचे निकाल आणि परिस्थितीची वास्तविक स्थिती दोन्ही सत्य (किंवा "सकारात्मक") असतात, आणि "खरे नकारात्मक" म्हणजे जेव्हा चाचणीचे निकाल आणि परिस्थितीची वास्तविक स्थिती दोन्ही असत्य (किंवा "नकारात्मक") असतात. "खरे सकारात्मक" किंवा "खरे नकारात्मक" याला "योग्य अनुमान" मानले जाते.
   "खोटे सकारात्मक" च्या व्यस्त म्हणजे "खोटे नकारात्मक" होय. जेव्हा चाचणीचा निकाल "नकारात्मक" असतो, पण तो "सकारात्मक" येण्याची अपेक्षा असते, तेव्हा त्या निकालाला "खोटे नकारात्मक" असे म्हणतात.
   CIDRAM च्या संदर्भात, या संज्ञा सामान्यतः तेव्हा वापरल्या जातात जेव्हा CIDRAM ने नको ती गोष्ट अवरोधित करते, किंवा जेव्हा ती हवी असलेली गोष्ट अवरोधित करण्यात अयशस्वी ठरते. जेव्हा CIDRAM अशी विनंती अवरोधित करते जी अवरोधित करायला नको होती (उदा., खराब, कालबाह्य, किंवा चुकीच्या स्वाक्षरीमुळे), किंवा जेव्हा ते चुकीच्या कारणांसाठी करते, तेव्हा त्याला "खोटे सकारात्मक" म्हणतात. जेव्हा CIDRAM एखादी विनंती अवरोधित करण्यात अयशस्वी होते जी अवरोधित केली पाहिजे होती (उदा., अनपेक्षित धोके, गहाळ स्वाक्षरी, सदोष मॉड्यूल, किंवा प्रक्रियेतील कमतरतांमुळे), तेव्हा त्याला "खोटे नकारात्मक" म्हणतात (जरी सामान्यतः याला "चुकलेले निदान" असे म्हटले जाते). <em>इंग्रजी: "missed detection".</em>
   | | विनंती अवरोधित करू नये | विनंती अवरोधित केली पाहिजे |
   | विनंती अवरोधित केलेली नाही | खरे नकारात्मक (योग्य अनुमान) | चुकलेले निदान (किंवा खोटे नकारात्मक) |
   | विनंती अवरोधित केली आहे | खोटे सकारात्मक | खरे सकारात्मक (योग्य अनुमान) |
   जर तुम्हाला खोटे सकारात्मक आढळले, तर सर्वप्रथम अपडेट्स पेज तपासा, आणि त्यावर काही "कालबाह्य" म्हणून चिन्हांकित केलेले असल्यास, ते अपडेट करा. त्यानंतरही समस्या कायम राहिल्यास, तुम्ही CIDRAM च्या इश्यू ट्रॅकरवर समस्येची तक्रार नोंदवू शकता.
