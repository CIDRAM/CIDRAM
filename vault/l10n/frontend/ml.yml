 How many infractions to incur: "എത്രയെത്ര നിയമലംഘനങ്ങൾ വരുത്തിവയ്ക്കണം."
 IP Testing: "നിലവിൽ ഇൻസ്റ്റാൾ ചെയ്തിട്ടുള്ള ഒപ്പുകൾ IP വിലാസങ്ങൾ തടഞ്ഞിട്ടുണ്ടോ എന്ന് പരിശോധിക്കാൻ IP പരിശോധന പേജ് നിങ്ങളെ അനുവദിക്കുന്നു."
 IP Tracking: "IP ട്രാക്കിംഗ് പേജ് നിങ്ങളെ IP വിലാസങ്ങളുടെ ട്രാക്കിംഗ് നില പരിശോധിക്കാനും അവയിൽ ഏതാണ് നിരോധിച്ചിരിക്കുന്നതെന്ന് പരിശോധിക്കാനും നിങ്ങൾക്ക് താൽപ്പര്യമുണ്ടെങ്കിൽ നിരോധനങ്ങളോ ട്രാക്കിംഗോ പിൻവലിക്കാനോ അനുവദിക്കുന്നു."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "ഒരു IPv6 സംക്രമണ സംവിധാനം (ഉദാ., 6to4, Teredo, ISATAP, മുതലായവ) ഉപയോഗിക്കുന്ന ഒരു ശ്രേണിയിൽ നിന്നുള്ള ഒരു IPv6 വിലാസത്തിൽ നിന്നാണ് ഒരു അഭ്യർത്ഥന കണക്റ്റ് ചെയ്യുന്നതെങ്കിൽ, "IP വിലാസം (പരിഹരിച്ച)" ഫീൽഡ് ആ IPv6 വിലാസം ആ IPv6 സംക്രമണ സംവിധാനത്തിന് കീഴിൽ വിവർത്തനം ചെയ്യുന്ന IPv4 വിലാസത്താൽ നിറയും (ഉദാഹരണത്തിന്, "IP വിലാസം" "2002:c0a8:1::" ആണെങ്കിൽ, "IP വിലാസം (പരിഹരിച്ച)" "192.168.0.1" ആയിരിക്കും). മറ്റെല്ലാ സാഹചര്യങ്ങളിലും, "IP വിലാസം (പരിഹരിച്ച)", "IP വിലാസം" എന്നീ ഫീൽഡുകൾ ഒന്നുതന്നെയായിരിക്കും."
 Intersector: "രണ്ട് ശ്രേണി സെറ്റുകളിൽ നിന്നുള്ള പൊതു ഘടകങ്ങൾ നിർണ്ണയിക്കാൻ ഇന്റർസെക്ടർ ഉപയോഗിക്കാം."
 Logs: "ഒരു ലോഗ് ഫയലിന്റെ ഉള്ളടക്കം കാണുന്നതിന്, താഴെയുള്ള പട്ടികയിൽ നിന്ന് അത് തിരഞ്ഞെടുക്കുക."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "ഈ സ്ഥിതിവിവരക്കണക്കിന്റെ കൃത്യമായ മൂല്യം, നിയമം പ്രോസസ്സ് ചെയ്യുന്ന സമയത്ത് സ്ഥിതിവിവരക്കണക്ക് പേജിൽ കാണിച്ചിരിക്കുന്നതിന് തുല്യമായിരിക്കുമെന്ന് ശ്രദ്ധിക്കുക."
 Number of seconds until it expires: "കാലാവധി കഴിയുന്നതുവരെയുള്ള സെക്കൻഡുകളുടെ എണ്ണം."
 Numeric comparison: "സംഖ്യാ താരതമ്യം ഉപയോഗിക്കുന്നതിന്, ഡയറക്ട് സ്ട്രിംഗ് താരതമ്യം അല്ലെങ്കിൽ ഓട്ടോമാറ്റിക് രീതി കണ്ടെത്തൽ തിരഞ്ഞെടുക്കുക, അവസ്ഥയുടെ മൂല്യം സംഖ്യയാണെന്ന് ഉറപ്പാക്കുക, തുടർന്ന് ആവശ്യമുള്ള ഓപ്പറേറ്റർ ഉപയോഗിച്ച് അത് പ്രിഫിക്സ് ചെയ്യുക.<br />ഉദാഹരണത്തിന്, "തുല്യം" എന്ന വ്യവസ്ഥകൾക്ക്, &gt;=2 എന്നത് ≥2 നൽകുന്നു, &lt;=2 എന്നത് ≤2 നൽകുന്നു, "തുല്യമല്ല" എന്ന വ്യവസ്ഥകൾക്ക്, &gt;=2 എന്നത് ≱2 നൽകുന്നു, &lt;=2 എന്നത് ≰2 നൽകുന്നു, മുതലായവ."
 Range Tables: "നിലവിൽ സജീവമായ ഒപ്പ് ഫയലുകൾ ഉൾക്കൊള്ളുന്ന IP ശ്രേണികളെക്കുറിച്ചുള്ള ചില അടിസ്ഥാന സ്ഥിതിവിവരക്കണക്കുകൾ ഈ പേജ് കാണിക്കുന്നു."
