hints_asnlookup: "** Потрібна функціональність пошуку ASN (наприклад, через модуль IP-API або BGPView)."
hints_aux_stats: "Зауважте: Статистикою відстеження для допоміжних правил можна керувати зі сторінки допоміжних правил."
hints_cause_fp: "*!! Висока ймовірність виникнення помилкових спрацьовувань через %s."
hints_cclookup: "** Потрібна функціональність пошуку коду країни (наприклад, через модуль IP-API або BGPView)."
hints_client_hints: "!! Це підказка клієнта з низькою ентропією. Це нова експериментальна веб-технологія, яка ще не широко підтримується в усіх браузерах і основних клієнтах. <em>Побачити: {{Links.MDN.Client hints}}.</em> Хоча клієнтські підказки можуть бути корисними для зняття відбитків пальців, оскільки вони не широко підтримуються, не слід припускати чи покладатися на їхню присутність у запитах (тобто, блокування через їх відсутність – погана ідея)."
hints_client_honour: "Незалежно від того, як ми інструктуємо клієнта, важливо пам'ятати, що зрештою ми не маємо контролю над тим, що клієнт вирішить зробити, і немає нульової гарантії, що клієнт виконає наші інструкції."
hints_default_dns:
 FAQ.: "<em><a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#what-can-i-use-for-default_dns" hreflang="en-AU">Що я можу використовувати для «default_dns»?</a></em>"
hints_duration:
 SI.: "Тривалість можна описати за допомогою «Міжнародної системи одиниць». Наприклад, <strong>1d2°3′4″</strong> або <strong>1d 2h 3min 4s</strong> для одного дня, двох годин, трьох хвилин, чотирьох секунд, або <strong>5min</strong> для лише п'яти хвилин."
 Кутовий час.: "Тривалість можна описати за допомогою кутового часу. Наприклад, <strong>1d2°3′4″</strong> для один день, дві години, три хвилини, чотири секунди, або <strong>5″</strong> лише на п'ять секунд."
 Звичайна англійська.: "Тривалість можна описати, написавши одиниці звичайна англійською. Наприклад, <strong>1 week 2 days 3 hours 4 minutes 5 seconds</strong> для одного тижня, двох днів, трьох годин, чотирьох хвилин, п'яти секунд."
 Обмеження.: "Позначення можна змішувати, але одиниці завжди потрібно описувати від найбільшої до найменшої, і їх не можна повторювати. Наприклад, <strong>1 week 2 days 3′4″</strong> <span class="txtGn">дійсний</span> і буде зрозумілий правильно, але <strong>3′4″ 1 week 2 days</strong> і <strong>3 hours 3h 3°</strong> <span class="txtRd">недійсні</span>. CIDRAM не хвилює, використовуєте ви пробіли чи ні. Числа мають бути простими та неформатованими. Щоб бути практичним, найбільшою підтримуваною одиницею є тиждень. Під час оновлення конфігурації, CIDRAM нормалізує тривалість до кутового часу."
hints_has_bypass: "* Ця опція має відповідний байпас під <code class="s">bypasses➡used</code>. Рекомендується переконатися, що прапорець для відповідного байпасу позначено так само, як прапорець для спроби перевірити цю опцію."
hints_http_response_header_code:
 1.: "Коли активовано «тихий режим», використовуватиметься повідомлення про статус HTTP, визначене <code class="s">general➡silent_mode_response_header_code</code> (це має найвищий пріоритет)."
 2.: "Коли суб'єкт що подає запит було заблоковано через перевищення ліміту порушень, буде використано HTTP-повідомлення про статус «забанений»."
 3.: "У разі блокування через обмеження швидкості використовуватиметься код 429, або ж у разі блокування через конфлікти ресурсів використовуватиметься повідомлення про статус HTTP, визначене <code class="s">signatures➡conflict_response</code> (обмеження швидкості та конфлікти ресурсів мають однаковий пріоритет у цьому контексті)."
 4.: "У разі блокування через допоміжне правило, яке встановлює «заміщення коду стану HTTP», буде використано це заміщення коду стану HTTP."
 5.: "У разі блокування з юридичних причин (тобто через користувацький сигнатур, який використовує скорочення «юридичний»), використовуватиметься повідомлення про статус HTTP для «юридичний»."
 6.: "Для всіх інших заблокованих запитів використовуватиметься повідомлення про статус HTTP для «стандарт» (це має найнижчий пріоритет)."
hints_inspection: "* Призначений тільки для налагодження допоміжних правил. Не відображається заблокованим користувачам."
hints_ipv6_on_32bit: "Зауважте: Пошук IPv6 може не працювати належним чином у деяких 32-розрядних системах."
hints_logging_datetime: "Корисна порада: Ви можете додати інформацію про дату й час до імен файлів журналу, використовуючи заповнювачі формату часу. Доступні заповнювачі формату часу відображаються на {{Links.ConfigRef.time_format}}."
