           <li><a href="https://www.stopforumspam.com/forum/" rel="noopener noreferrer external">ഫോറം@Stop Forum Spam</a> – ഫോറം സ്പാം നിർത്തുന്നതിനെക്കുറിച്ചുള്ള ഉപയോഗപ്രദമായ ചർച്ച ഫോറം.</li>
         </ul>
       </li>
       <li><span class="comCat" role="region" aria-controls="menuOUTRS" aria-expanded="false">മറ്റ് ഉപയോഗപ്രദമായ ഉപകരണങ്ങൾ, വിഭവങ്ങൾ, സേവനങ്ങൾ, മുതലായവ.</span>
         <ul class="comSub" id="menuOUTRS">
           <li>{{Links.SFS}} – അറിയപ്പെടുന്ന ഫോറം സ്പാമർമാരുടെ ഒരു ഡാറ്റാബേസ് പരിപാലിക്കുന്നു. സ്പാമർമാരിൽ നിന്ന് വെബ്‌സൈറ്റുകളെയും ഫോറങ്ങളെയും സംരക്ഷിക്കുന്നതിന് ഉപയോഗപ്രദമാണ്.</li>
           <li><a href="https://bgp.he.net/" hreflang="en-US" rel="noopener noreferrer external">Hurricane Electric BGP ടൂൾകിറ്റ്</a> – ASN-കളിൽ നിന്ന് CIDR-കൾ നേടുക, ASN ബന്ധങ്ങൾ നിർണ്ണയിക്കുക, നെറ്റ്‌വർക്ക് നാമങ്ങളെ അടിസ്ഥാനമാക്കി ASN-കൾ കണ്ടെത്തുക, തുടങ്ങിയവ.</li>
           <li>{{Links.BGPView}} – ASN-കളിൽ നിന്ന് CIDR-കൾ നേടുക, ASN ബന്ധങ്ങൾ നിർണ്ണയിക്കുക, നെറ്റ്‌വർക്ക് നാമങ്ങളെ അടിസ്ഥാനമാക്കി ASN-കൾ കണ്ടെത്തുക, തുടങ്ങിയവ.</li>
           <li><a href="https://radar.qrator.net/" hreflang="en" rel="noopener noreferrer external">Qrator-ൽ നിന്നുള്ള Radar</a> – ASN-കളുടെ കണക്റ്റിവിറ്റി പരിശോധിക്കുന്നതിനും ASN-കളെക്കുറിച്ചുള്ള മറ്റ് വിവിധ വിവരങ്ങൾക്കും ഉപയോഗപ്രദമായ ഉപകരണം.</li>
           <li><a href="https://www.spamhaus.org/statistics/botnet-asn/" rel="noopener noreferrer external">സ്പാംഹൗസ് പ്രോജക്റ്റ്</a> – ASN-കൾക്കുള്ള ബോട്ട്‌നെറ്റ് അണുബാധ നിരക്കുകളെക്കുറിച്ചുള്ള റിപ്പോർട്ടുകൾ പ്രദർശിപ്പിക്കുന്നു.</li>
           <li>{{Links.AbuseIPDB}} – അറിയപ്പെടുന്ന ദുരുപയോഗ IP-കളുടെ ഒരു ഡാറ്റാബേസ് പരിപാലിക്കുന്നു.; IP-കൾ പരിശോധിക്കുന്നതിനും റിപ്പോർട്ട് ചെയ്യുന്നതിനുമായി ഒരു API നൽകുന്നു.</li>
           <li>{{Links.IP-API}} – രാജ്യ കോഡ്, പ്രദേശ നാമം, രേഖാംശം, അക്ഷാംശം, തുടങ്ങിയ IP വിലാസങ്ങളെക്കുറിച്ചോ ഹോസ്റ്റ് നാമങ്ങളെക്കുറിച്ചോ ഉള്ള വിവരങ്ങൾ നേടുക.</li>
         </ul>
       </li>
       <li><span class="comCat">വിവര, പഠന വിഭവങ്ങൾ.</span>
         <ul class="comSub" id="menuILR">
           <li>{{Links.PHP.Earth.Website}} – PHP പഠന വിഭവങ്ങളും ചർച്ചയും.</li>
           <li>{{Links.MDN.Homepage}} – ഡെവലപ്പർമാർക്കുള്ള ഉറവിടങ്ങൾ, ഡെവലപ്പർമാർ മുഖേന. HTML, CSS, JavaScript, ആക്‌സസിബിലിറ്റി മറ്റും എന്നിവയെക്കുറിച്ചും പഠിക്കുന്നതിനുള്ള ഒരു മികച്ച ഉറവിടം.</li>
           <li><a href="https://maikuolan.github.io/Vulnerability-Charts/" hreflang="en-AU" rel="noopener noreferrer external">ദുർബലതാ ചാർട്ടുകൾ</a> – വിവിധ പാക്കേജുകൾക്കായുള്ള (HHVM, PHP, phpMyAdmin, Python, മുതലായവ) സുരക്ഷിത/സുരക്ഷിതമല്ലാത്ത പതിപ്പുകൾ പട്ടികപ്പെടുത്തുന്നു.</li>
           <li><a href="https://maikuolan.github.io/Compatibility-Charts/" hreflang="en-AU" rel="noopener noreferrer external">അനുയോജ്യതാ ചാർട്ടുകൾ</a> – വിവിധ പാക്കേജുകൾക്കായുള്ള (CIDRAM, phpMussel, മുതലായവ) പൊരുത്ത വിവരങ്ങൾ പട്ടികപ്പെടുത്തുന്നു.</li>
