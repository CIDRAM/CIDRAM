macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "Ikke generelt anbefalt, siden det sannsynligvis er noen du ikke trenger. Installering og aktivering av komponenter når de ikke er nødvendige kan påvirke ytelsen negativt."
  install_l10n_core: &RecommendKeepingCore "Når <code>lang_override</code>-konfigurasjonsdirektivet er aktivert, hvis en brukers nettleser spesifiserer en bestemt språkpreferanse, så lenge core L10N-data for det språket er installert, kan CIDRAM vise «tilgang nektet»-siden på det angitte språket. Derfor anbefales det å ha alle core L10N-dataene installert."
  install_l10n_fe: &RecommendFEOnlyNeeded "Ditt foretrukne språk kan spesifiseres via <code>lang</code>-konfigurasjonsdirektivet. Når dette er gjort, trenger du neppe noen front-end L10N-data annet enn det for ditt foretrukne språk, og det kanskje vil å fjerne det for marginalt å frigjøre noen tilgjengelig diskplass. Uansett om du velger å fjerne den eller beholde den, bør det ikke gjøre noen skade."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
