 Protocol blocker module: "कॉन्फिगरेशनद्वारे विशिष्ट विनंती प्रोटोकॉल (उदाहरणार्थ, HTTP/0.9, HTTP/1.1, SPDY/3.0, इ) ब्लॉक करण्याची क्षमता प्रदान करते."
