Abuse category: !lazy
 Bad web bot: "Kötü web botu (e-posta adresleri veya içerik için kazıma, robots.txt'yi dikkate almayan tarayıcılar, aşırı istekler, kullanıcı aracısı sahteciliği, vb)."
 Brute-force attacks: "Kaba kuvvet saldırıları (web sayfası oturum açma işlemleri, SMTP, RDP, vb üzerinde kimlik bilgisi kaba kuvvet saldırıları)."
 Categories (at least one is required): "Kategoriler (en az bir tanesi gereklidir)"
 CMS blog comment spam: "CMS blog yorumu spam'i."
 Conjunctive category: "Bağlaç kategorisi (diğer, daha spesifik kategorilerle birlikte kullanın)."
 DDoS attacks: "DDoS saldırıları (genellikle bir botnet'in parçası)."
 DNS compromise: "DNS ihlali (yanlış yönlendirmeyle sonuçlanan DNS kayıtlarını değiştirmek)."
 DNS poisoning: "DNS zehirlenmesi."
 Email sender spoofing: "E-posta gönderen sahtekarlığı."
 Email spam: "Spam e-posta (spam e-posta içeriği, virüslü ekler, kimlik avı e-postaları, vb)."
 Exploited host: "İstismar edilen ana bilgisayar (ana makineye muhtemelen kötü amaçlı yazılım bulaşmış ve başka saldırılar için ya da kötü amaçlı içerik barındırmak için kullanılıyor)."
 FTP brute-force attacks: "FTP kaba kuvvet saldırıları."
 Fraudulent VoIP: "Sahte VoIP."
 Fraudulent orders: "Sahte siparişler."
 Hacking: "Hacklemek."
 IoT targeted: "Nesnelerin İnterneti hedefli kötüye kullanım. Yorumlara ne tür cihazın hedeflendiğine ilişkin bilgileri ekleyin."
 Open proxy, open relay, or tor endpoint: "Açık vekil, açık geçiş, veya tor uç noktası."
 Phishing: "Kimlik avı web siteleri ve/veya e-posta."
 Ping of death: "Ölüm pingi (büyük boyutlu IP paketi)."
 Port scans: "Bağlantı noktası taramaları (açık bağlantı noktalarını ve savunmasız hizmetleri taramak)."
 SQL injection: "SQL enjeksiyonu."
 SSH abuse: "SSH'nin kötüye kullanılması."
 VPN IP: "VPN IP'si."
 Web spam: "Web spam'ı (yorum/forum spam'ı, HTTP yönlendiren spam'ı, veya diğer CMS spam'ı)."
 Webapp attacks: "Web uygulaması saldırıları (yüklü web uygulamalarına, CMS'ye, veya e-ticaret çözümlerine karşı kullanılacak güvenlik açıklarını veya istismarları araştırmak, örneğin, WordPress, Drupal, phpMyAdmin, vb)."
Extended Description: !lazy
 AbuseIPDB module: "AbuseIPDB'de listelenen IP'lerden gelen istekleri engeller."
 BGPView module: "CIDRAM için ASN ve ülke kodu arama olanağı sağlamak için {{Links.BGPView}} API'den yararlanır, ASN'lerin ve ülkelerin CIDRAM yapılandırması aracılığıyla engellenmesini veya beyaz listeye eklenmesini sağlamak, ve Facebook isteklerini doğrulamak için sosyal ağ doğrulaması için bir araç sağlamak. (Bu modülü kullanırsanız, aynı amaca hizmet ettikleri için IP-API modülünü kullanmanıza gerek kalmaz)."
 Bad TLDs blocker module: "Spam gönderenler, bilgisayar korsanları ve diğer haince varlıklar tarafından sıkça TLD'lere ait kullanılan ana bilgisayarları engeller."
 Bad hosts blocker module: "Spam gönderenler, bilgisayar korsanları ve diğer haince varlıklar tarafından sıkça kullanılan ana bilgisayarları engeller."
 Bot user agents module: "İstenmeyen botlar ve nefret dolu faaliyetlerle ilişkili kullanıcı aracılarını engeller."
 Bypasses: "Varsayılan imza bypass'lar, normalde ana paketle birlikte verilir."
 Cookie scanner module: "Tehlikeli çerezlere karşı bazı sınırlı koruma sağlar."
 HTTP version checker module: "CIDRAM yapılandırması aracılığıyla belirli protokolleri ve HTTP sürümlerini engellemeyi mümkün kılar."
 IP-API module: "CIDRAM için ASN ve ülke kodu arama olanağı sağlamak için {{Links.IP-API}} API'den yararlanır, ASN'lerin ve ülkelerin CIDRAM yapılandırması aracılığıyla engellenmesini veya beyaz listeye eklenmesini sağlamak, ve Facebook isteklerini doğrulamak için sosyal ağ doğrulaması için bir araç sağlamak. (Bu modülü kullanırsanız, aynı amaca hizmet ettikleri için BGPView modülünü kullanmanıza gerek kalmaz)."
 IPv4: &ExtDesCloud "İstenmeyen bulut servislerini ve insan olmayan uç noktaları engeller."
 IPv4-Bogons: &ExtDesBogons "Bogon/martian CIDR'leri engeller."
 IPv4-ISPs: &ExtDesISPs "Tehlikeli ve spam yapan ISS'leri engeller (çoklu hizmet ağları içerir; bunlar insan ve ayrıca insan dışı uç noktaları içerebilir)."
 IPv4-Nonblocking: &ExtDesNonblocking "Profil oluşturma için kullanışlıdır, ancak kendi başına hiçbir şeyi engellemez."
 IPv4-Other: &ExtDesOther "Proxy, VPN ve diğer çeşitli istenmeyen hizmetler için CIDR'leri engeller."
 IPv6: *ExtDesCloud
 IPv6-Bogons: *ExtDesBogons
 IPv6-ISPs: *ExtDesISPs
 IPv6-Nonblocking: *ExtDesNonblocking
 IPv6-Other: *ExtDesOther
 Optional security extras module: "İsteklerde yaygın olarak kullanılan çeşitli saldırı vektörlerine karşı bazı sınırlı koruma sağlar."
 PHPMailer: "E-posta göndermeyi içeren herhangi bir işlev kullanmak için gereklidir.<br />{{Links.PHPMailer.PHPMailer}}, {{Links.PHPMailer.License}} lisansı üzerinden kullanılabilir."
 Project Honeypot module: "Project Honeypot'de listelenen IP'lerden gelen istekleri engeller."
 Protocol blocker module: "Yapılandırma yoluyla belirli istek protokollerini engelleme yeteneği sağlar (örneğin, HTTP/0.9, HTTP/1.1, SPDY/3.0, vb)."
 Referrer spam module: "Yönlendiren spam'e dayalı engelleme genellikle anlamlı bir güvenlik avantajı sağlamaz, ancak bazı durumlarda, bazı kullanıcılar için istekler hakkında daha fazla bilgi toplamak ve bunu rapor edebilmek için yararlı olabilir."
 Stop Forum Spam module: "SFS tarafından listelenen IP'lere karşı kayıt ve oturum açma sayfalarını korur."
 Tor blocker module: "DNSEL aramaları aracılığıyla Tor çıkış düğümlerinden erişimi yasaklar (IPv4 ve IPv6'yı ikisi de destekleniyor)."
