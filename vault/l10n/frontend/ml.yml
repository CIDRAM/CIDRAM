tip:
 2FA Sent: "രണ്ട്-ഘടക പ്രാമാണീകരണ കോഡ് അടങ്ങിയ ഒരു ഇമെയിൽ നിങ്ങളുടെ ഇമെയിൽ വിലാസത്തിലേക്ക് അയച്ചു. ഫ്രണ്ട്-എൻഡിലേക്ക് ആക്‌സസ് ലഭിക്കുന്നതിന് താഴെയുള്ള ഈ കോഡ് സ്ഥിരീകരിക്കുക. ഈ ഇമെയിൽ ലഭിച്ചില്ലെങ്കിൽ, ലോഗ് ഔട്ട് ചെയ്ത്, 10 മിനിറ്റ് കാത്തിരുന്ന്, പുതിയ കോഡ് അടങ്ങിയ പുതിയ ഇമെയിൽ ലഭിക്കാൻ വീണ്ടും ലോഗിൻ ചെയ്യാൻ ശ്രമിക്കുക."
 Accounts: "CIDRAM ഫ്രണ്ട്-എൻഡ് ആർക്കൊക്കെ ആക്‌സസ് ചെയ്യാമെന്ന് നിയന്ത്രിക്കാൻ അക്കൗണ്ടുകൾ പേജ് നിങ്ങളെ അനുവദിക്കുന്നു."
 Actions menu: "തടയപ്പെടുമ്പോൾ ഒപ്പുകളുടെ എണ്ണത്തിൽ 1 കൂടി ചേർക്കുന്നു. ബൈപാസ് ചെയ്യുമ്പോൾ ഒപ്പുകളുടെ എണ്ണത്തിൽ നിന്ന് 1 കുറയ്ക്കുന്നു. വൈറ്റ്‌ലിസ്റ്റ് ചെയ്യുമ്പോൾ ഒപ്പുകളുടെ എണ്ണം 0 ആയി സജ്ജീകരിക്കുകയും പ്രോസസ്സിംഗ് അവസാനിപ്പിക്കുകയും ചെയ്യുന്നു, അങ്ങനെ തുടർന്നുള്ള നിയമങ്ങൾ പൂർണ്ണമായും ഒഴിവാക്കുന്നു. ഗ്രേലിസ്റ്റ് ചെയ്യുമ്പോൾ ഒപ്പുകളുടെ എണ്ണം 0 ആയി സജ്ജീകരിക്കുന്നു, പക്ഷേ പ്രോസസ്സിംഗ് അവസാനിപ്പിക്കുന്നില്ല. പ്രൊഫൈൽ ചെയ്യുക ഒപ്പുകളുടെ എണ്ണത്തെ ബാധിക്കില്ല, എന്നാൽ മറ്റ് തരത്തിലുള്ള പ്രവർത്തനങ്ങൾ നടത്തണോ വേണ്ടയോ എന്ന് നിർണ്ണയിക്കാൻ കൂടുതൽ സങ്കീർണ്ണമായ യുക്തി ആവശ്യമായി വരുമ്പോൾ ഇത് ഉപയോഗപ്രദമാകും, കാരണം ജനറേറ്റ് ചെയ്ത പ്രൊഫൈലുകൾ തുടർന്നുള്ള നിയമങ്ങളുടെ വ്യവസ്ഥകളുമായി ബന്ധിപ്പിച്ചിരിക്കാം. പ്രോസസ്സിംഗിന് ശേഷം, ഒപ്പുകളുടെ എണ്ണം 1 അല്ലെങ്കിൽ അതിൽ കൂടുതലാണെങ്കിൽ, അഭ്യർത്ഥന തടയപ്പെടും."
 Aggregator: "അഗ്രഗേറ്റർ നിങ്ങളെ IP-കൾ, CIDR-കൾ, നെറ്റ്മാസ്കുകൾ എന്നിവ ഏറ്റവും ചെറിയ രീതിയിൽ പ്രകടിപ്പിക്കാൻ അനുവദിക്കുന്നു. സമാഹരിക്കേണ്ട ഡാറ്റ നൽകി "ശരി" അമർത്തുക."
 An accepted value is any CIDR with a range that covers the IP address of the request: "അഭ്യർത്ഥനയുടെ IP വിലാസം ഉൾക്കൊള്ളുന്ന ഒരു ശ്രേണിയിലുള്ള ഏതൊരു CIDR ഉം സ്വീകാര്യമായ ഒരു മൂല്യമാണ്. ഉദാഹരണത്തിന്, 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, മുതലായവ 1.2.3.4 ന് സ്വീകരിക്കപ്പെടും. തെറ്റായ പോസിറ്റീവുകൾ ഒഴിവാക്കാൻ, വിശാലമായ ശ്രേണികളേക്കാൾ (ഉദാ., 0.0.0.0/1) ഇടുങ്ങിയ ശ്രേണികളാണ് (ഉദാ., 1.2.3.4/32) പൊതുവെ അഭികാമ്യം. ഒരു നിശ്ചിത IP വിലാസം ഉൾക്കൊള്ളുന്ന ശ്രേണികൾ ഏതൊക്കെ CIDR-കൾക്കാണെന്ന് കണ്ടെത്താൻ കാൽക്കുലേറ്റർ പേജ് ഉപയോഗിക്കാം."
 Auxiliary Rules Modes: "എളുപ്പത്തിൽ വായിക്കുന്നതിനായി കാഴ്ച മോഡ് ഓക്സിലറി നിയമങ്ങൾ ഒരു ഒതുക്കമുള്ളത് പട്ടിക പ്രദർശിപ്പിക്കുന്നു. നിയമങ്ങളെക്കുറിച്ചുള്ള കൂടുതൽ വിശദാംശങ്ങൾ ക്ലിക്ക് ചെയ്യുമ്പോൾ കാണിക്കും. ട്രിഗ്രാം (☰) ക്ലിക്ക് ചെയ്യുമ്പോൾ ഒരു നിയമം കയറ്റുമതി ചെയ്യുന്നതിനോ ഇല്ലാതാക്കുന്നതിനോ ഉള്ള ഓപ്ഷനുകൾ കാണിക്കും. ഒരു നിയമം നിലവിലുള്ള സ്ഥാനത്ത് നിന്ന് ആവശ്യമുള്ള സ്ഥാനത്തേക്ക് വലിച്ചിട്ടുകൊണ്ട് നിയമങ്ങൾ പുനഃക്രമീകരിക്കാൻ കഴിയും. ഓക്സിലറി നിയമങ്ങൾ പരിഷ്കരിക്കാൻ എഡിറ്റ് മോഡ് ആവശ്യമാണ്, പേജിൽ നൽകിയിരിക്കുന്ന നിയമങ്ങളിൽ ആവശ്യാനുസരണം പുതിയ വ്യവസ്ഥകൾ, വെബ്‌ഹുക്കുകൾ, അല്ലെങ്കിൽ മറ്റ് ലോജിക്കുകൾ ചേർക്കുന്നതിനുള്ള എഡിറ്റ് ചെയ്യാവുന്ന ഫീൽഡുകളും ഓപ്ഷനുകളും. രണ്ട് മോഡുകളിലൂടെയും പുതിയ ഓക്സിലറി നിയമങ്ങൾ സൃഷ്ടിക്കാൻ കഴിയും."
 Auxiliary Rules Priority: "മുൻഗണന (ഏറ്റവും ഉയർന്ന➡(തുല്യം🔄തത്തുല്യമായ)➡ഏറ്റവും താഴ്ന്നത്):"
 Auxiliary Rules Webhooks: "ഒരു നിയമം പ്രവർത്തനക്ഷമമാകുമ്പോൾ, ഇവന്റിനെക്കുറിച്ച് കണക്റ്റുചെയ്‌തിരിക്കുന്ന ഏതെങ്കിലും വെബ്‌ഹുക്കുകളെ അറിയിക്കാൻ CIDRAM ശ്രമിക്കും. വെബ്‌ഹുക്ക് എന്നത് POST ഡാറ്റ സ്വീകരിക്കാൻ കഴിവുള്ള ഒരു URL ആണ്, കൂടാതെ അഭ്യർത്ഥനയെക്കുറിച്ച് CIDRAM ജനറേറ്റ് ചെയ്യുന്ന ഡാറ്റ കൈകാര്യം ചെയ്യാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്ന CIDRAM-ൽ നിന്ന് തികച്ചും വ്യത്യസ്തമായ ഒരു നെറ്റ്‌വർക്കിൽ ഹോസ്റ്റ് ചെയ്‌തിരിക്കുന്ന ഒരു ബാഹ്യ സേവനം, ആപ്പ്, സ്ക്രിപ്റ്റ്, മുതലായവ ഉണ്ടെങ്കിൽ അത് ഉപയോഗപ്രദമാകും."
 Auxiliary Rules: "CIDRAM-നുള്ള ഓക്സിലറി നിയമങ്ങൾ സൃഷ്ടിക്കാനും ഇല്ലാതാക്കാനും പരിഷ്കരിക്കാനും നിങ്ങൾക്ക് ഈ പേജ് ഉപയോഗിക്കാം."
 Backup: "നിങ്ങളുടെ കോൺഫിഗറേഷൻ, ഓക്സിലറി നിയമങ്ങൾ, മുതലായവ ഇറക്കുമതി/കയറ്റുമതി ചെയ്യാൻ ഈ പേജ് ഉപയോഗിക്കാം. വ്യത്യസ്ത ഇൻസ്റ്റാളേഷനുകളിലോ വ്യത്യസ്ത പ്രധാന പതിപ്പുകളിലോ ഡാറ്റ മൈഗ്രേറ്റ് ചെയ്യണമെങ്കിൽ ഇത് ഉപയോഗപ്രദമാകും."
 Cache Data: "കാഷെയിലെ ഉള്ളടക്കങ്ങൾ നിങ്ങൾക്ക് ഇവിടെ അവലോകനം ചെയ്യാൻ കഴിയും."
 Calculator: "ഒരു IP വിലാസത്തിന്റെ CIDR-കളും നെറ്റ്മാസ്കുകളും കണക്കാക്കാൻ കാൽക്കുലേറ്റർ നിങ്ങളെ അനുവദിക്കുന്നു."
 Click the component name for more details: "കൂടുതൽ വിവരങ്ങൾക്ക് ഘടകത്തിന്റെ പേരിൽ ക്ലിക്ക് ചെയ്യുക."
 Configuration: "ഫ്രണ്ട്-എൻഡിൽ നിന്ന് CIDRAM-നുള്ള കോൺഫിഗറേഷൻ പരിഷ്കരിക്കാൻ കോൺഫിഗറേഷൻ പേജ് നിങ്ങളെ അനുവദിക്കുന്നു."
