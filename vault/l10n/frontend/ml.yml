 captcha_usemode: "എപ്പോഴാണ് CAPTCHAകൾ നൽകേണ്ടത്? പിന്തുണയ്ക്കുന്ന ഓരോ ദാതാവിനും അനുയോജ്യമായ പെരുമാറ്റം നിങ്ങൾക്ക് ഇവിടെ വ്യക്തമാക്കാം."
 components: "CIDRAM ഉപയോഗിക്കുന്ന ഘടകങ്ങൾ സജീവമാക്കുന്നതിനും നിർജ്ജീവമാക്കുന്നതിനുമുള്ള കോൺഫിഗറേഷൻ. സാധാരണയായി അപ്‌ഡേറ്റ് പേജ് വഴി പൂരിപ്പിക്കും, പക്ഷേ മികച്ച നിയന്ത്രണത്തിനും അപ്‌ഡേറ്റ് പേജ് തിരിച്ചറിയാത്ത ഇഷ്‌ടാനുസൃത ഘടകങ്ങൾക്കുമായി ഇവിടെ നിന്ന് കൈകാര്യം ചെയ്യാനും കഴിയും."
 components_events: "ഇവന്റ് ഹാൻഡ്‌ലറുകൾ. സാധാരണയായി CIDRAM ആന്തരികമായി പ്രവർത്തിക്കുന്ന രീതി പരിഷ്കരിക്കുന്നതിനോ അധിക പ്രവർത്തനങ്ങൾ നൽകുന്നതിനോ ഉപയോഗിക്കുന്നു."
