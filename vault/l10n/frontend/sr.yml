 200 OK: "200 OK\nНајмање робустан, али најприлагодљивији корисницима. Аутоматизовани захтеви ће највероватније протумачити овај одговор као индикацију да је захтев био успешан. Препоручује се за захтеве који нису блокирани."
 301 Moved Permanently: "301 Moved Permanently (Трајно премештено)\nУпућује клијента да је преусмеравање ТРАЈНО и да метод захтева који се користи за преусмеравање МОЖЕ бити другачији од метода захтева који се користи за почетни захтев."
 302 Found: "302 Found (Пронађено)\nУпућује клијента да је преусмеравање ПРИВРЕМЕНО и да метод захтева који се користи за преусмеравање МОЖЕ бити другачији од метода захтева који се користи за почетни захтев."
 307 Temporary Redirect: "307 Temporary Redirect (Привремено преусмеравање)\nУпућује клијента да је преусмеравање ПРИВРЕМЕНО и да метод захтева који се користи за преусмеравање НЕ може бити другачији од метода захтева који се користи за почетни захтев."
 308 Permanent Redirect: "308 Permanent Redirect (Трајно преусмеравање)\nУпућује клијента да је преусмеравање ТРАЈНО и да метод захтева који се користи за преусмеравање НЕ може бити другачији од метода захтева који се користи за почетни захтев."
 403 Forbidden: "403 Forbidden (Забрањено)\nРобуснији, али мање прилагођен корисницима. Препоручује се за већину општих околности."
 409 Conflict: "409 Conflict (Сукоб)\nПрепоручује се за сукобе ресурса (нпр., сукоби спајања, сукоби приступа датотекама, итд). Не препоручује се у другим контекстима."
 410 Gone: "410 Gone (Нестало)\nМоже изазвати проблеме приликом решавања лажно позитивних, јер ће неки прегледачи кеширати ову статусну поруку и неће слати накнадне захтеве, чак ни након што буду деблокирани. Може бити најпожељније у неким контекстима, за одређене врсте саобраћаја."
 418 I_m a teapot: "418 I'm a teapot (Ја сам чајник)\nРеференца на првоаприлску шалу ({{Links.RFC2324}}). Веома је мало вероватно да ће га разумети било који клијент, бот, прегледач, или неко други. Обезбеђено за забаву и практичност, али се генерално не препоручује."
 429 Too Many Requests: "429 Too Many Requests (Превише захтева)\nПрепоручује се за ограничавање брзине, приликом суочавања са DDoS нападима, и за спречавање поплаве. Не препоручује се у другим контекстима."
 451 Unavailable For Legal Reasons: "451 Unavailable For Legal Reasons (Није доступно из правних разлога)\nПрепоручује се приликом блокирања првенствено из правних разлога. Не препоручује се у другим контекстима."
 503 Service Unavailable: "503 Service Unavailable (Услуга није доступна)\nНајробуснији, али најмање прилагођен корисницима. Препоручује се за време напада, или за време изузетно упорног нежељеног саобраћаја."
