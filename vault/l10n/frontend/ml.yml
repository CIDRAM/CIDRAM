Abuse category: !lazy
 Bad web bot: "മോശം വെബ് ബോട്ട് (ഇമെയിൽ വിലാസങ്ങൾ, ഉള്ളടക്കം എന്നിവയ്ക്കായി സ്‌ക്രാപ്പ് ചെയ്യൽ, robots.txt-നെ മാനിക്കാത്ത ക്രാളറുകൾ എന്നിവയ്‌ക്കായി, അമിതമായ അഭ്യർത്ഥനകൾ, ഉപയോക്തൃ ഏജന്റിനെ കബളിപ്പിക്കൽ, മുതലായവ)."
 Brute-force attacks: "ബ്രൂട്ട്-ഫോഴ്‌സ് ആക്രമണങ്ങൾ (വെബ്‌പേജ് ലോഗിനുകൾ, SMTP, RDP, മുതലായവയിലെ ക്രെഡൻഷ്യൽ ബ്രൂട്ട്-ഫോഴ്‌സ് ആക്രമണങ്ങൾ)."
 Categories (at least one is required): "വിഭാഗങ്ങൾ (കുറഞ്ഞത് ഒന്നെങ്കിലും ആവശ്യമാണ്)"
 CMS blog comment spam: "CMS ബ്ലോഗ് കമന്റ് സ്പാം."
 Conjunctive category: "സംയോജിത വിഭാഗം (മറ്റ്, കൂടുതൽ നിർദ്ദിഷ്ട വിഭാഗങ്ങളുമായി സംയോജിച്ച് ഉപയോഗിക്കുക)."
 DDoS attacks: "DDoS ആക്രമണങ്ങൾ (സാധാരണയായി ഒരു ബോട്ട്‌നെറ്റിന്റെ ഭാഗമാണ്)."
 DNS compromise: "DNS കോംപ്രമൈസ് (അനുചിതമായ റീഡയറക്ഷന് കാരണമാകുന്ന DNS റെക്കോർഡുകൾ മാറ്റുന്നു)."
 DNS poisoning: "DNS വിഷബാധ."
 Email sender spoofing: "ഇമെയിൽ അയച്ചയാളെ കബളിപ്പിക്കൽ."
 Email spam: "ഇമെയിൽ സ്പാം (സ്പാം ഇമെയിൽ ഉള്ളടക്കം, ബാധിച്ച അറ്റാച്ചുമെന്റുകൾ, ഫിഷിംഗ് ഇമെയിലുകൾ, മുതലായവ)."
 Exploited host: "ചൂഷണം ചെയ്യപ്പെട്ട ഹോസ്റ്റ് (ഹോസ്റ്റ് മാൽവെയർ ബാധിച്ചിരിക്കാനും മറ്റ് ആക്രമണങ്ങൾക്കോ ക്ഷുദ്ര ഉള്ളടക്കം ഹോസ്റ്റ് ചെയ്യുന്നതിനോ ഉപയോഗിക്കാനും സാധ്യതയുണ്ട്)."
 FTP brute-force attacks: "FTP ബ്രൂട്ട്-ഫോഴ്‌സ് ആക്രമണങ്ങൾ."
 Fraudulent VoIP: "വഞ്ചനാപരമായ VoIP."
 Fraudulent orders: "വഞ്ചനാപരമായ ഓർഡറുകൾ."
 Hacking: "ഹാക്കിംഗ്."
 IoT targeted: "IoT ലക്ഷ്യമിട്ടുള്ള ദുരുപയോഗം. ഏത് തരത്തിലുള്ള ഉപകരണമാണ് ലക്ഷ്യമിട്ടത് എന്നതിനെക്കുറിച്ചുള്ള വിവരങ്ങൾ കമന്റുകളിൽ ഉൾപ്പെടുത്തുക."
 Open proxy, open relay, or tor endpoint: "ഓപ്പൺ പ്രോക്സി, ഓപ്പൺ റിലേ, അല്ലെങ്കിൽ ടോർ എൻഡ്‌പോയിന്റ്."
 Phishing: "ഫിഷിംഗ് വെബ്‌സൈറ്റുകൾ കൂടാതെ/അല്ലെങ്കിൽ ഇമെയിൽ."
 Ping of death: "പിങ് ഓഫ് ഡെത്ത് (വലുപ്പമേറിയ IP പാക്കറ്റ്)."
 Port scans: "പോർട്ട് സ്കാനുകൾ (തുറന്ന പോർട്ടുകൾക്കും ദുർബലമായ സേവനങ്ങൾക്കുമായി സ്കാനിംഗ്)."
 SQL injection: "SQL ഇഞ്ചക്ഷൻ."
 SSH abuse: "SSH ദുരുപയോഗം."
 VPN IP: "VPN IP."
 Web spam: "വെബ് സ്പാം (കമന്റ്/ഫോറം സ്പാം, HTTP റഫറർ സ്പാം, അല്ലെങ്കിൽ മറ്റ് CMS സ്പാം)."
 Webapp attacks: "വെബ്‌ആപ്പ് ആക്രമണങ്ങൾ (ദുർബലതകൾക്കോ ചൂഷണങ്ങൾക്കോ വേണ്ടിയുള്ള അന്വേഷണം, അല്ലെങ്കിൽ ഇൻസ്റ്റാൾ ചെയ്ത വെബ്‌ആപ്പുകൾ, CMS, അല്ലെങ്കിൽ ഇ-കൊമേഴ്‌സ് സൊല്യൂഷനുകൾ എന്നിവ ചൂഷണം ചെയ്യാൻ ശ്രമിക്കുന്നത്, ഉദാഹരണത്തിന്, വേർഡ്പ്രസ്സ്, ഡ്രൂപ്പൽ, പിഎച്ച്പിമൈഅഡ്മിൻ, തുടങ്ങിയവ)."
Extended Description: !lazy
 AbuseIPDB module: "AbuseIPDB-യിൽ പട്ടികപ്പെടുത്തിയിരിക്കുന്ന IP-കളിൽ നിന്നുള്ള അഭ്യർത്ഥനകൾ തടയുന്നു."
 BGPView module: "ഇത് CIDRAM-ന് ഒരു ASN, രാജ്യ കോഡ് തിരയൽ സൗകര്യം നൽകുന്നതിന് {{Links.BGPView}} API-യെ സ്വാധീനിക്കുന്നു, CIDRAM കോൺഫിഗറേഷൻ വഴി ASN-കളെയും രാജ്യങ്ങളെയും തടയാനോ വൈറ്റ്‌ലിസ്റ്റ് ചെയ്യാനോ പ്രാപ്തമാക്കുന്നു, കൂടാതെ Facebook അഭ്യർത്ഥനകൾ പരിശോധിക്കുന്നതിന് സോഷ്യൽ നെറ്റ്‌വർക്കിംഗ് സ്ഥിരീകരണത്തിനുള്ള ഒരു മാർഗവും നൽകുന്നു. (നിങ്ങൾ ഈ മൊഡ്യൂൾ ഉപയോഗിക്കുകയാണെങ്കിൽ, IP-API മൊഡ്യൂൾ ഉപയോഗിക്കേണ്ടതില്ല, കാരണം അവ ഒരേ ഉദ്ദേശ്യം നിറവേറ്റുന്നു)."
 Bad TLDs blocker module: "സ്പാമർമാർ, ഹാക്കർമാർ, മറ്റ് ദുഷ്ട സ്ഥാപനങ്ങൾ എന്നിവർ പതിവായി ഉപയോഗിക്കുന്ന TLD-കളിൽ ഉൾപ്പെടുന്ന ഹോസ്റ്റുകളെ തടയുന്നു."
 Bad hosts blocker module: "സ്പാമർമാർ, ഹാക്കർമാർ, മറ്റ് ദുഷ്ട സ്ഥാപനങ്ങൾ എന്നിവർ പതിവായി ഉപയോഗിക്കുന്ന ബ്ലോക്കുകൾ ഹോസ്റ്റുകൾ."
 Bot user agents module: "അനാവശ്യ ബോട്ടുകളും ദുഷ്‌പ്രവൃത്തികളുമായി ബന്ധപ്പെട്ട ഉപയോക്തൃ ഏജന്റുമാരെ തടയുന്നു."
 Bypasses: "സ്ഥിരസ്ഥിതി ഒപ്പ് ബൈപാസ് ഫയലുകൾ സാധാരണയായി പ്രധാന പാക്കേജിൽ ഉൾപ്പെടുത്തിയിരിക്കും."
 Cookie scanner module: "അപകടകരമായ കുക്കികൾക്കെതിരെ പരിമിതമായ ചില പരിരക്ഷകൾ നൽകുന്നു."
 HTTP version checker module: "CIDRAM കോൺഫിഗറേഷൻ വഴി നിർദ്ദിഷ്ട പ്രോട്ടോക്കോളുകളും HTTP പതിപ്പുകളും തടയുന്നത് സാധ്യമാക്കുന്നു."
 IP-API module: "ഇത് CIDRAM-ന് ഒരു ASN, രാജ്യ കോഡ് തിരയൽ സൗകര്യം നൽകുന്നതിന് {{Links.IP-API}} API-യെ സ്വാധീനിക്കുന്നു, CIDRAM കോൺഫിഗറേഷൻ വഴി ASN-കളെയും രാജ്യങ്ങളെയും തടയാനോ വൈറ്റ്‌ലിസ്റ്റ് ചെയ്യാനോ പ്രാപ്തമാക്കുന്നു, കൂടാതെ Facebook അഭ്യർത്ഥനകൾ പരിശോധിക്കുന്നതിന് സോഷ്യൽ നെറ്റ്‌വർക്കിംഗ് സ്ഥിരീകരണത്തിനുള്ള ഒരു മാർഗവും നൽകുന്നു. (നിങ്ങൾ ഈ മൊഡ്യൂൾ ഉപയോഗിക്കുകയാണെങ്കിൽ, BGPView മൊഡ്യൂൾ ഉപയോഗിക്കേണ്ടതില്ല, കാരണം അവ ഒരേ ഉദ്ദേശ്യം നിറവേറ്റുന്നു)."
 IPv4: &ExtDesCloud "അനാവശ്യ ക്ലൗഡ് സേവനങ്ങളും മനുഷ്യേതര എൻഡ്‌പോയിന്റുകളും തടയുന്നു."
 IPv4-Bogons: &ExtDesBogons "ബോഗൺ/മാർഷ്യൻ CIDR-കൾ തടയുന്നു."
 IPv4-ISPs: &ExtDesISPs "അപകടകരവും സ്പാമും ആയ ISP-കളെ തടയുന്നു (മൾട്ടിപ്ലേ നെറ്റ്‌വർക്കുകൾ ഉൾപ്പെടുന്നു, അതിൽ മനുഷ്യനും മനുഷ്യനല്ലാത്തതുമായ എൻഡ്‌പോയിന്റുകൾ അടങ്ങിയിരിക്കാം)."
 IPv4-Nonblocking: &ExtDesNonblocking "പ്രൊഫൈലിങ്ങിന് ഉപയോഗപ്രദമാണ്, പക്ഷേ സ്വന്തമായി ഒന്നും തടയുന്നില്ല."
 IPv4-Other: &ExtDesOther "പ്രോക്സികൾ, VPN-കൾ, മറ്റ് അനാവശ്യ സേവനങ്ങൾ എന്നിവയ്‌ക്കുള്ള CIDR-കൾ തടയുന്നു."
 IPv6: *ExtDesCloud
 IPv6-Bogons: *ExtDesBogons
 IPv6-ISPs: *ExtDesISPs
 IPv6-Nonblocking: *ExtDesNonblocking
 IPv6-Other: *ExtDesOther
 Optional security extras module: "അഭ്യർത്ഥനകളിൽ സാധാരണയായി ഉപയോഗിക്കുന്ന വിവിധ ആക്രമണ വെക്റ്ററുകൾക്കെതിരെ പരിമിതമായ ചില പരിരക്ഷകൾ നൽകുന്നു."
 PHPMailer: "ഇമെയിൽ അയയ്ക്കുന്നത് ഉൾപ്പെടുന്ന ഏതൊരു പ്രവർത്തനത്തിനും ആവശ്യമാണ്.<br />{{Links.PHPMailer.PHPMailer}} {{Links.PHPMailer.License}} ലൈസൻസ് വഴി ലഭ്യമാണ്."
 Project Honeypot module: "Project Honeypot (പ്രോജക്റ്റ് ഹണിപോട്ടിൽ) പട്ടികപ്പെടുത്തിയിരിക്കുന്നു IP-കളിൽ നിന്നുള്ള അഭ്യർത്ഥനകൾ തടയുന്നു."
 Protocol blocker module: "കോൺഫിഗറേഷൻ വഴി നിർദ്ദിഷ്ട അഭ്യർത്ഥന പ്രോട്ടോക്കോളുകൾ തടയാനുള്ള കഴിവ് നൽകുന്നു (ഉദാഹരണത്തിന്, HTTP/0.9, HTTP/1.1, SPDY/3.0, തുടങ്ങിയവ)."
 Referrer spam module: "റഫറർ സ്പാം അടിസ്ഥാനമാക്കി തടയുന്നത് സാധാരണയായി അർത്ഥവത്തായ സുരക്ഷാ ആനുകൂല്യങ്ങളൊന്നും നൽകില്ല, എന്നാൽ ചില സന്ദർഭങ്ങളിൽ, അഭ്യർത്ഥനകളെക്കുറിച്ചുള്ള കൂടുതൽ വിവരങ്ങൾ ശേഖരിക്കുന്നതിനും അത് റിപ്പോർട്ട് ചെയ്യാൻ കഴിയുന്നതിനും ചില ഉപയോക്താക്കൾക്ക് ഉപയോഗപ്രദമാകും."
 Stop Forum Spam module: "SFS പട്ടികപ്പെടുത്തിയിരിക്കുന്ന IP-കളിൽ നിന്ന് രജിസ്ട്രേഷൻ, ലോഗിൻ പേജുകളെ സംരക്ഷിക്കുന്നു."
 Tor blocker module: "DNSEL ലുക്കപ്പുകൾ വഴി ടോർ എക്സിറ്റ് നോഡുകളിൽ നിന്നുള്ള ആക്‌സസ് നിരോധിക്കുന്നു (IPv4, IPv6 എന്നിവയെ പിന്തുണയ്ക്കുന്നു)."
Glossary: !lazy
 Entries:
  CIDR: |
   "CIDR" എന്നത് "Classless Inter-Domain Routing" എന്നതിന്റെ ചുരുക്കപ്പേരാണ്, അവിടെ നിന്നാണ് "CIDRAM" ലെ "CIDR" എന്ന വാക്കിന്റെ ഉത്ഭവം. "CIDRAM" എന്നത് "Classless Inter-Domain Routing Access Manager" എന്നതിന്റെ ചുരുക്കപ്പേരാണ്.
   CIDRAM-ന്റെ പശ്ചാത്തലത്തിൽ, "CIDR" (അല്ലെങ്കിൽ "CIDR-കൾ") എന്നത് CIDR നൊട്ടേഷൻ ഉപയോഗിച്ച് പ്രകടിപ്പിക്കുന്ന സബ്‌നെറ്റുകളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
  തെറ്റായ പോസിറ്റീവ്: |
   പൊതുവേ, ഒരു പരിശോധന നടത്തുമ്പോൾ, പരിശോധനയുടെ ഫലങ്ങൾ "പോസിറ്റീവ്" ആണെങ്കിൽ (അതായത്, പരിശോധനയുടെ അവസ്ഥകൾ ശരിയാണെന്ന് കണ്ടെത്തിയാൽ), പക്ഷേ "നെഗറ്റീവ്" ആയിരിക്കുമെന്ന് പ്രതീക്ഷിക്കുകയാണെങ്കിൽ (അതായത്, പരിശോധനയുടെ ഫലങ്ങൾ തെറ്റാണ്), അതിനെ "തെറ്റായ പോസിറ്റീവ്" എന്ന് വിളിക്കുന്നു. <em>ഇംഗ്ലീഷ്: "false positive". അല്ലെങ്കിൽ പകരമായി: "തെറ്റായ പോസിറ്റീവ് പിശക്"; "തെറ്റായ അലാറം".</em>
   "യഥാർത്ഥ പോസിറ്റീവ്", "യഥാർത്ഥ നെഗറ്റീവ്", "തെറ്റായ നെഗറ്റീവ്" എന്നിവയാണ് ചില അനുബന്ധ പദങ്ങൾ. <em>ഇംഗ്ലീഷ്: "true positive", "true negative", "false negative".</em> "യഥാർത്ഥ പോസിറ്റീവ്" എന്നത് പരിശോധനാ ഫലങ്ങളും അവസ്ഥയുടെ യഥാർത്ഥ അവസ്ഥയും രണ്ടും ശരിയാകുന്നതിനെയാണ് (അല്ലെങ്കിൽ "പോസിറ്റീവ്") സൂചിപ്പിക്കുന്നത്, കൂടാതെ "യഥാർത്ഥ നെഗറ്റീവ്" എന്നത് പരിശോധനാ ഫലങ്ങളും അവസ്ഥയുടെ യഥാർത്ഥ അവസ്ഥയും രണ്ടും തെറ്റാകുന്നതിനെയാണ് (അല്ലെങ്കിൽ "നെഗറ്റീവ്") സൂചിപ്പിക്കുന്നത്. "യഥാർത്ഥ പോസിറ്റീവ്" അല്ലെങ്കിൽ "യഥാർത്ഥ നെഗറ്റീവ്" എന്നത് "ശരിയായ അനുമാനം" ആയി കണക്കാക്കപ്പെടുന്നു.
   ഒരു "തെറ്റായ പോസിറ്റീവ്" ന്റെ വിപരീതം ഒരു "തെറ്റായ നെഗറ്റീവ്" ആണ്. പരിശോധനാ ഫലങ്ങൾ "നെഗറ്റീവ്" ആയിരിക്കുകയും "പോസിറ്റീവ്" ആയിരിക്കുമെന്ന് പ്രതീക്ഷിക്കുകയും ചെയ്താൽ, ഫലങ്ങളെ "തെറ്റായ നെഗറ്റീവ്" എന്ന് വിളിക്കുന്നു.
   CIDRAM-ന്റെ പശ്ചാത്തലത്തിൽ, ഈ പദങ്ങൾ സാധാരണയായി CIDRAM അത് ചെയ്യരുതാത്ത എന്തെങ്കിലും തടയുമ്പോഴോ, അല്ലെങ്കിൽ അത് ചെയ്യേണ്ട എന്തെങ്കിലും തടയുന്നതിൽ പരാജയപ്പെടുമ്പോഴോ ആണ് സൂചിപ്പിക്കുന്നത്. തടയാൻ പാടില്ലാത്ത ഒരു അഭ്യർത്ഥന CIDRAM തടയപ്പെടുമ്പോൾ (ഉദാഹരണത്തിന്, മോശം, കാലഹരണപ്പെട്ട, അല്ലെങ്കിൽ തെറ്റായ ഒപ്പുകൾ കാരണം), അല്ലെങ്കിൽ തെറ്റായ കാരണങ്ങളാൽ അങ്ങനെ ചെയ്യുമ്പോൾ, അത് "തെറ്റായ പോസിറ്റീവ്" ആണ്. തടയപ്പെടേണ്ട ഒരു അഭ്യർത്ഥന CIDRAM തടയുന്നതിൽ പരാജയപ്പെടുമ്പോൾ (ഉദാഹരണത്തിന്, അപ്രതീക്ഷിത ഭീഷണികൾ, നഷ്ടപ്പെട്ട ഒപ്പുകൾ, തകരാറുള്ള മൊഡ്യൂളുകൾ, അല്ലെങ്കിൽ പ്രക്രിയയിലെ പോരായ്മകൾ എന്നിവ കാരണം), അത് "തെറ്റായ നെഗറ്റീവ്" ആയി മാറുന്നു (സാധാരണയായി "നഷ്ടപ്പെട്ട കണ്ടെത്തൽ" എന്ന് വിശേഷിപ്പിക്കപ്പെടുന്നു). <em>ഇംഗ്ലീഷ്: "missed detection".</em>
   | | അഭ്യർത്ഥന തടയാൻ പാടില്ല | അഭ്യർത്ഥന തടയണം |
   | അഭ്യർത്ഥന തടഞ്ഞിട്ടില്ല | യഥാർത്ഥ നെഗറ്റീവ് (ശരിയായ അനുമാനം) | നഷ്ടപ്പെട്ട കണ്ടെത്തൽ (അല്ലെങ്കിൽ തെറ്റായ നെഗറ്റീവ്) |
   | അഭ്യർത്ഥന തടഞ്ഞു | തെറ്റായ പോസിറ്റീവ് | യഥാർത്ഥ പോസിറ്റീവ് (ശരിയായ അനുമാനം) |
   തെറ്റായ പോസിറ്റീവുകൾ നേരിടുകയാണെങ്കിൽ, ആദ്യം അപ്‌ഡേറ്റുകൾ പേജ് പരിശോധിക്കുക, എന്തെങ്കിലും കാലഹരണപ്പെട്ടതായി അടയാളപ്പെടുത്തിയിട്ടുണ്ടെങ്കിൽ, അത് അപ്ഡേറ്റ് ചെയ്യുക. അതിനുശേഷം, പ്രശ്നം ഇപ്പോഴും നിലനിൽക്കുകയാണെങ്കിൽ, നിങ്ങൾക്ക് CIDRAM-ന്റെ ഇഷ്യൂ ട്രാക്കറിൽ പ്രശ്നം റിപ്പോർട്ട് ചെയ്യാം.
