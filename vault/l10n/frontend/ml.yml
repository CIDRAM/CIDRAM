 Blocked non-verified: "തടഞ്ഞു സ്ഥിരീകരിക്കാത്തത്"
 Delete orphaned values: "അനാഥ മൂല്യങ്ങൾ ഇല്ലാതാക്കുക."
 Enable this stage: "ഈ ഘട്ടം പ്രാപ്തമാക്കണോ?"
