macro: !lazy
 Description:
  activate_modules: &MayImpactPerformance "Генерално се не препоручује, јер вероватно постоје неки који вам нису потребни. Инсталирање и активирање компоненти када нису потребне може негативно утицати на перформансе."
  install_l10n_core: &RecommendKeepingCore "Када је омогућена директива за конфигурацију <code>lang_override</code>, ако кориснички прегледач наведе одређену језичку преференцију, све док су инсталирани основни L10N подаци за тај језик, ЦИДРАМ може да прикаже страницу „приступ забрањен“ на том наведеном језику. Сходно томе, препоручује се да сви основни L10N подаци остану инсталирани."
  install_l10n_fe: &RecommendFEOnlyNeeded "Ваш жељени језик може бити наведен путем конфигурационе директиве <code>lang</code>. Када се ово уради, мало је вероватно да ће вам бити потребни било какви L10N подаци са фронт-енда осим оних за ваш жељени језик, и можда ћете желети да их уклоните како бисте мало ослободили расположиви простор на диску. У сваком случају, то неће проузроковати никакву штету."
  install_modules: *MayImpactPerformance
  uninstall_l10n_core: *RecommendKeepingCore
  uninstall_l10n_fe: *RecommendFEOnlyNeeded
