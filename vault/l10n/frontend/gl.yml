 general_emailaddr: "Se o desexa, pode proporcionar aquí un enderezo de correo electrónico para que se lle proporcione aos usuarios cando estean bloqueados, para ser utilizado como punto de contacto de apoio e/ou asistencia en caso de que sexan bloqueados por erro. AVISO: Calquera que sexa o enderezo de correo electrónico que proporciones aquí, seguramente será adquirido por spambots e scrapers durante o seu uso aquí e, por conseguinte, se decides proporcionar un enderezo de correo electrónico aquí, recoméndase encarecidamente que te asegures de que o enderezo de correo electrónico proporcionado aquí sexa desbotable ou un enderezo que non lle importa que sexa obxecto de spam (noutras palabras, probablemente non queira utilizar os seus enderezos de correo electrónico persoais ou empresariais principais)."
 general_emailaddr_display_style: "Como preferirías que se lles presentase o enderezo de correo electrónico aos usuarios?"
 general_fields: "Controis para os campos durante eventos de bloqueo (cando se bloquea unha solicitude)."
 general_force_hostname_lookup: "Forzar buscas de nomes de host? True/Verdadeiro = Si; False/Falso = Non [Predeterminado]. As buscas de nomes de host normalmente realízanse "según sexa necesario", pero pódense forzar para todas as solicitudes. Facelo pode ser útil como medio para proporcionar información máis detallada nos ficheiros de rexistro, pero tamén pode ter un efecto lixeiramente negativo no rendemento."
 general_http_response_header_code: "Que mensaxe de estado HTTP debe enviar CIDRAM ao bloquear solicitudes?"
 general_ipaddr: "Onde atopar o enderezo IP das solicitudes de conexión? (Útil para servizos como Cloudflare). Predeterminado = REMOTE_ADDR. AVISO: Non cambies isto a menos que saibas o que estás facendo!"
 general_lang: "Especifique o idioma predeterminado para CIDRAM."
 general_lang_override: "Localizar segundo HTTP_ACCEPT_LANGUAGE sempre que sexa posible? True/Verdadeiro = Si [Predeterminado]; False/Falso = Non."
 general_numbers: "Como prefires que se mostren os números? Selecciona o exemplo que che pareza máis correcto."
 general_request_proxy: "Se queres que as solicitudes de saída se envíen a través dun proxy, especifica ese proxy aquí. Se non, deixa isto en branco."
 general_request_proxyauth: "Se envías solicitudes de saída a través dun proxy e se ese proxy require un nome de usuario e un contrasinal, especifica ese nome de usuario e contrasinal aquí (por exemplo, <code>user:pass</code>). Se non, deixa isto en branco."
 general_sensitive: "Unha lista de camiños para considerar páxinas sensibles. Cada camiño listada comprobarase co URI reconstruído cando sexa necesario. Un camiño que comeza cunha barra inclinada será tratado como un literal, e corresponderá a partir do compoñente de camiño da solicitude. En caso contrario, un camiño que comeza cun carácter non alfanumérico e remata con ese mesmo carácter (ou ese mesmo carácter máis unha marca "i" opcional) tratarase como unha expresión regular. Calquera outro tipo de camiño tratarase como un literal, e pode coincidir con calquera parte do URI. Se un camiño é considerado como unha páxina sensible pode afectar o comportamento dalgúns módulos, pero non ten ningún efecto doutro xeito."
 general_silent_mode: "Debería CIDRAM redirixir silenciosamente os intentos de acceso bloqueados en lugar de mostrar a páxina "acceso denegado"? Se si, especifique a localización á que redirixir os intentos de acceso bloqueado. Se non, deixe esta variable en branco."
 general_silent_mode_response_header_code: "Que mensaxe de estado HTTP debe enviar CIDRAM cando redirecciona silenciosamente os intentos de acceso bloqueado?"
 general_stages: "Controis para as fases da cadea de execución (se está activada, se se rexistran erros, etc)."
 general_statistics: "Controla a información estatística que se rastrexa."
 general_statistics_captchas: "Controla a información estatística que se rastrexa para os CAPTCHA."
 general_time_format: "O formato de notación de data/hora utilizado por CIDRAM. Pódense engadir opcións adicionais previa solicitude."
 general_time_offset: "Desfase de fuso horario en minutos."
 general_timezone: "Utilízase para especificar o fuso horario a utilizar (por exemplo, Africa/Cairo, America/New_York, Asia/Tokyo, Australia/Perth, Europe/Berlin, Pacific/Guam, etc). Especifique "SYSTEM" para que PHP se ocupe de isto automaticamente."
 ipapi: "Configuración para o módulo IP-API (ofrece unha función de busca de código de país e ASN para CIDRAM)."
