 Lock CAPTCHAs to the IP address of the user completing the CAPTCHA but not to the actual user: "कॅप्चा पूर्ण करणाऱ्या वापरकर्त्याच्या IP पत्त्यावर कॅप्चा लॉक करा पण प्रत्यक्ष वापरकर्त्याला नाही.\nवापरकर्त्यांना ओळखण्यासाठी कुकीज वापरल्या जात नाहीत. कॅप्चा यशस्वीरित्या पूर्ण झाल्यामुळे जेव्हा प्रवेश परत मिळतो, तेव्हा तो त्याच IP पत्त्यावरून कनेक्ट होणाऱ्या कोणालाही लागू होतो."
 Lock CAPTCHAs to the user completing the CAPTCHA as well as to their IP address: "कॅप्चा पूर्ण करणाऱ्या वापरकर्त्याला तसेच त्यांच्या IP पत्ताला कॅप्चा लॉक करा.\nवापरकर्त्यांना ओळखण्यासाठी कुकीज वापरल्या जातात. कॅप्चा यशस्वीरित्या पूर्ण झाल्यामुळे जेव्हा प्रवेश परत मिळतो, तेव्हा तो फक्त कॅप्चा पूर्ण करणाऱ्या वापरकर्त्याला लागू होतो आणि त्यांचा IP पत्ता बदलल्यास ते बंद केले जातील."
 Lock CAPTCHAs to the user completing the CAPTCHA but not to their IP address: "कॅप्चा पूर्ण करणाऱ्या वापरकर्त्याला कॅप्चा लॉक करा पण त्यांच्या IP पत्ताला नाही.\nवापरकर्त्यांना ओळखण्यासाठी कुकीज वापरल्या जातात. कॅप्चा यशस्वीरित्या पूर्ण झाल्यामुळे जेव्हा प्रवेश परत मिळतो, तेव्हा तो फक्त कॅप्चा पूर्ण करणाऱ्या वापरकर्त्याला लागू होतो आणि जोपर्यंत त्यांची कुकी वैध राहते तोपर्यंत, त्यांचा IP पत्ता बदलला तरीही, ती कायम राहते."
