 the_signature_: "Засіб виправлення сигнатуру також можна використовувати через CLI:"
 to_calculate_c: "Щоб обчислити CIDR за IP-адресою:"
 to_test_whethe: "Щоб перевірити, чи IP-адреса заблокована CIDRAM:"
 to_quit_type_q: "Щоб вийти, введіть «q», «quit», або «exit», а потім натисніть enter."
 you_can_also_a: "Ви також можете агрегувати IP-адреси та CIDR таким чином:"
 you_can_also_c: |
  Ви також можете об'єднувати команди (приклад читає з деяких файлів, агрегує
  їхній вміст, а потім записує агреговані дані в output.dat):
 you_can_also_r: "Ви також можете читати з файлів:"
