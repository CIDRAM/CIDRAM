 Glossary: "CIDRAM ഉപയോഗിക്കുന്ന ചില പദാവലികൾ ഗ്ലോസറി വിവരിക്കുന്നു, ഇത് ഉപയോഗിക്കുന്ന സന്ദർഭത്തിൽ ഉദ്ദേശിച്ച അർത്ഥം വ്യക്തമാക്കാൻ സഹായിക്കുന്നു."
