<table>
<tr>
  <td class="nav big">
{nav}  </td>
  <td class="right extend">
    <div class="s" id="stateMsg">{state_msg}</div>
    <table>
      <tr>
        <td class="h2 big"><div class="s">{field.Username}</div></td>
        <td class="h2 big"><div class="s">{field.Permissions}</div></td>
        <td class="h2 big"><div class="s">{field.Set new password}</div></td>
        <td class="h2f extend"><div class="s"><span class="big">{field.Options}</span><span class="mob">{link.Accounts}</span></div></td>
      </tr>
      <tr>
        <form action="?cidram-page=accounts" method="POST"><input name="cidram-form-target" type="hidden" value="accounts" /><input name="do" type="hidden" value="create-account" />
          <td class="h1 big"><input name="username" type="text" placeholder="{field.Username}" autocomplete="username" /></td>
          <td class="h1 big">
            <select name="permissions" title="{field.Permissions}" onchange="javascript:var x=document.getElementById('permsOther');this.value==='0'?(x.classList.add('configOpenPos'),x.classList.remove('configInitPos')):(x.classList.add('configInitPos'),x.classList.remove('configOpenPos'))"><option value="1">{label.Complete access}</option><option value="3">Cronable API</option><option value="0">{label.Partial access}</option></select>
            <div id="permsOther" class="configInitPos scrollTrans">
              <input type="checkbox" id="permLogs" name="permLogs" /> <label class="s" for="permLogs">{link.Logs}</label><br />
              <input type="checkbox" id="permStatistics" name="permStatistics" /> <label class="s" for="permStatistics">{link.Statistics} (+{field.Clear all})</label><br />
              <input type="checkbox" id="permIPTesting" name="permIPTesting" /> <label class="s" for="permIPTesting">{link.IP Testing}</label><br />
              <input type="checkbox" id="permRangeTools" name="permRangeTools" /> <label class="s" for="permRangeTools">{label.Range tools}</label>
            </div>
          </td>
          <td class="h1 big"><input name="password" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:this.value.length>0?(w('pwdWarn',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value.toLowerCase())||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':'')),document.getElementById('pwdBar').style.background=calculatePasswordEntropy(this.value,1)):(w('pwdWarn',''),document.getElementById('pwdBar').style.background='none')" onkeyup="javascript:this.value.length>0?(w('pwdWarn',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value.toLowerCase())||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':'')),document.getElementById('pwdBar').style.background=calculatePasswordEntropy(this.value,1)):(w('pwdWarn',''),document.getElementById('pwdBar').style.background='none')" /><small><br /><span id="pwdWarn"></span></small><div id="pwdBar" style="width:150px;height:2px;overflow:visible"></div></td>
          <td class="h1f extend">
            <div class="s big"><input type="submit" value="{field.Create new account}" /></div>
            <div class="s mob">
              <input name="username_mob" type="text" placeholder="{field.Username}" autocomplete="username" /><br />
              <select name="permissions_mob" title="{field.Permissions}" onchange="javascript:var x=document.getElementById('permsOtherMob');this.value==='0'?(x.classList.add('configOpenPos'),x.classList.remove('configInitPos')):(x.classList.add('configInitPos'),x.classList.remove('configOpenPos'))"><option value="1">{label.Complete access}</option><option value="3">Cronable API</option><option value="0">{label.Partial access}</option></select>
              <div id="permsOtherMob" class="configInitPos scrollTrans">
                <input type="checkbox" id="permLogsMob" name="permLogsMob" /> <label class="s" for="permLogsMob">{link.Logs}</label><br />
                <input type="checkbox" id="permStatisticsMob" name="permStatisticsMob" /> <label class="s" for="permStatisticsMob">{link.Statistics} (+{field.Clear all})</label><br />
                <input type="checkbox" id="permIPTestingMob" name="permIPTestingMob" /> <label class="s" for="permIPTestingMob">{link.IP Testing}</label><br />
                <input type="checkbox" id="permRangeToolsMob" name="permRangeToolsMob" /> <label class="s" for="permRangeToolsMob">{label.Range tools}</label>
              </div>
              <input name="password_mob" type="password" placeholder="{field.Password}" autocomplete="new-password" onchange="javascript:this.value.length>0?(w('pwdWarnMob',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value.toLowerCase())||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':'')),document.getElementById('pwdBarMob').style.background=calculatePasswordEntropy(this.value,1)):(w('pwdWarnMob',''),document.getElementById('pwdBarMob').style.background='none')" onkeyup="javascript:this.value.length>0?(w('pwdWarnMob',calculatePasswordEntropy(this.value)+(vulnerablePasswords.includes(this.value.toLowerCase())||this.value.length<8?'<span class=\u{22}txtRd\u{22}>{PassInOnListWarn}</span>':'')),document.getElementById('pwdBarMob').style.background=calculatePasswordEntropy(this.value,1)):(w('pwdWarnMob',''),document.getElementById('pwdBarMob').style.background='none')" /><small><br /><span id="pwdWarnMob"></span></small><div id="pwdBarMob" style="width:150px;height:2px;overflow:visible"></div><br />
              <input type="submit" value="{field.Create new account}" />
            </div>
          </td>
        </form>
      </tr>
{Accounts}
    </table>
  </td>
</tr>
</table>
