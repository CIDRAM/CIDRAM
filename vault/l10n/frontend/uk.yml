tip:
 2FA Sent: "На вашу електронну адресу надіслано електронний лист із кодом двофакторної автентифікації. Підтвердьте цей код нижче, щоб отримати доступ до фронтенду. Якщо ви не отримали цей електронний лист, спробуйте вийти, зачекати 10 хвилин і увійти знову, щоб отримати новий електронний лист із новим кодом."
 Accounts: "Сторінка облікових записів дозволяє вам контролювати, хто може отримати доступ до фронтенду CIDRAM."
 Actions menu: "Блокування додає 1 до кількості сигнатурів. Обхід віднімає 1 від кількості сигнатурів. Білий список встановлює кількість сигнатурів на 0 та завершує обробку, таким чином повністю пропускаючи будь-які наступні правила. Сірий список встановлює кількість сигнатурів на 0, але не завершує обробку. Профілювання не впливає на кількість сигнатурів, але корисне коли може знадобитися складніша логіка для визначення того, чи слід виконувати інші види дій, оскільки згенеровані профілі можуть бути прив'язаний з умовами наступних правил. Після обробки, якщо кількість сигнатурів дорівнює 1 або більше, запит буде заблоковано."
 Aggregator: "Агрегатор дозволяє виражати IP-адреси, CIDR, і мережеві маски в найкомпактніший спосіб. Введіть дані для агрегування та натисніть «ОК»."
 An accepted value is any CIDR with a range that covers the IP address of the request: "Прийнятним значенням є будь-який CIDR з діапазоном, що охоплює IP-адресу запиту. Наприклад, 1.2.3.0/24, 1.2.0.0/16, 1.0.0.0/8, тощо будуть прийнятні для 1.2.3.4. Щоб уникнути хибнопозитивних результатів, вужчі діапазони (наприклад, 1.2.3.4/32) зазвичай кращі за ширші діапазони (наприклад, 0.0.0.0/1). Сторінку калькулятора можна використовувати щоб знайти CIDR які мають діапазони, що охоплюють задану IP-адресу."
 Auxiliary Rules Modes: "У режимі перегляду допоміжні правила відображаються у вигляді компактного списку для зручного читання. Правила у списку можна розгорнути та переглянути додаткові деталі, натиснувши на них. Опції експорту або видалення правила відображатимуться після натискання на триграму (☰). Правила можна змінити порядок за допомогою перетягування, перетягнувши правило з його поточної позиції на потрібну позицію. Режим редагування потрібен для зміни допоміжних правил, редаговані поля та опції для додавання нових умов, веб-хуків, або іншої логіки до правил за потреби, що надаються на сторінці. Нові допоміжні правила можна створювати в будь-якому з цих режимів."
 Auxiliary Rules Priority: "Пріоритет (найвищий➡(рівні🔄еквівалент)➡найнижчий):"
 Auxiliary Rules Webhooks: "Коли правило тригеровано, CIDRAM спробує сповістити будь-які підключені веб-хуки про подію. Веб-хук — це URL-адреса, здатна отримувати дані POST, і може бути корисною, якщо зовнішній сервіс, додаток, скрипт, тощо розміщено в зовсім іншій мережі ніж CIDRAM, і ви хочете щоб дані, згенеровані CIDRAM щодо запиту, оброблялися нею."
 Auxiliary Rules: "Ви можете використовувати цю сторінку для створення, видалення, та модифікація допоміжних правил для CIDRAM."
 Backup: "Цю сторінку можна використовувати для імпорту/експорту конфігурації, допоміжних правил, тощо. Це може бути корисним, якщо вам потрібно перенести дані між різними установками або різними основними версіями."
 Cache Data: "Тут ви можете переглянути вміст кешу."
 Calculator: "Калькулятор дозволяє обчислити CIDR і мережеві маски з IP-адреси."
 Click the component name for more details: "Клацніть назву компонента, щоб дізнатися більше."
 Configuration: "Сторінка конфігурації дозволяє змінювати конфігурацію для CIDRAM з фронтенду."
 Enter IP address here: "Введіть тут IP-адресу."
 Enter IP address here (optional): "Введіть тут IP-адресу (необов'язковий)."
 Enter IP addresses here: "Введіть тут IP-адреси."
 Enter input here: "Введіть тут введені дані."
 Enter queries here: "Введіть запити тут."
 Enter query here (optional): "Введіть запит тут (необов'язковий)."
 Enter referrer here (optional): "Введіть реферера тут (необов'язковий)."
 Enter user agent here (optional): "Введіть користувацький агент тут (необов'язковий)."
 Enter user agents here: "Введіть користувацькі агенти тут."
 File Manager: "Файловий менеджер дозволяє видаляти, редагувати, та завантажувати файли. Використовуйте з обережністю (це може порушити інсталяцію)."
 Glossary: "У глосарії описано деяку термінологію що використовується CIDRAM, щоб допомогти прояснити передбачуване значення в контексті де вона використовується."
 Greeting: "Привіт, %s."
 Home: "Це домашня сторінка фронтенду CIDRAM. Щоб продовжити, виберіть посилання в навігаційному меню ліворуч."
 How many infractions to incur: "Скільки порушень понести."
 IP Testing: "Сторінка тестування IP дозволяє перевірити, чи IP-адреси заблоковані поточними встановленими сигнатурами."
 IP Tracking: "Сторінка відстеження IP дозволяє перевірити статус відстеження IP-адрес, перевірити які з них забанено, а також розблокувати/розвідстежувати, якщо ви хочете."
 If a request connects from an IPv6 address belonging to a range used by an IPv6 transition mechanism: "Якщо запит з'єднується з IPv6-адреси, що належить до діапазону що використовується механізмом переходу IPv6 (наприклад, 6to4, Teredo, ISATAP, тощо), поле «IP-адреса (розв'язав)» буде заповнено IPv4-адресою, до якої ця IPv6-адреса перетворюється відповідно до цього механізму переходу IPv6 (наприклад, «IP-адреса» «2002:c0a8:1::» дає «IP-адреса (розв'язав)» «192.168.0.1»). В усіх інших випадках поля «IP-адреса (розв'язав)» та «IP-адреса» будуть однаковими."
 Intersector: "Перехрестя можна використовувати для визначення спільних факторів із двох наборів діапазонів."
 Logs: "Виберіть файл журналу зі списку нижче, щоб переглянути вміст цього файлу журналу."
 Note that the exact value of this statistic will be the same as that shown at the statistics page at the time the rule is processed: "Точне значення цієї статистики буде таким самим, як відображено на сторінці статистики під час обробки правила."
 Number of seconds until it expires: "Кількість секунд до завершення терміну дії."
 Numeric comparison: "Щоб використати числове порівняння, виберіть пряме порівняння рядків або автоматичне визначення методу, переконайтеся, що значення умови є числовим, і додайте перед ним потрібний оператор.<br />Наприклад, для умов «рівних», &gt;=2 забезпечує ≥2, &lt;=2 забезпечує ≤2, для умов «не рівних», &gt;=2 забезпечує ≱2, &lt;=2 забезпечує ≰2, тощо."
 Range Tables: "На цій сторінці показано базову статистичну інформацію про діапазони IP-адрес, охоплених поточними активними файлами сигнатур."
 Rate Limiting: "На цій сторінці показано поточне використання та доступність для квоти відносно обмеження швидкості."
 Rate limiting is currently disabled: "Зауважте: Обмеження швидкості наразі вимкнено, але його можна ввімкнути на сторінці конфігурації."
 Report to AbuseIPDB: "Цю сторінку можна використовувати для звітування IP-адреси в AbuseIPDB, або для видалення попередніх звітів у випадку, якщо IP-адреса була повідомлена помилково."
 Sections List: "На цій сторінці вказано, які розділи існують у поточних активних файлах сигнатур."
 See the documentation: "Перегляньте <a href="{{Links.CIDRAM.Docs Base Path}}readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external"><span class="navicon documentation"></span>документацію</a> для отримання інформації про різні директиви конфігурації та їх призначення."
 Server log snippets, abuse details, etc: "Фрагменти журналу сервера, деталі зловживань, тощо."
 Signature File Fixer: "Засіб виправлення файлів сигнатур надає спосіб виявлення та усунення потенційних проблем у файлах сигнатури."
 Specify a URL, or leave blank to disregard: "Вкажіть URL-адресу, або залиште поле порожнім щоб ігнорувати."
 Specify a directory path, or leave blank to use the CIDRAM base path: "Вкажіть шлях до каталогу, або залиште поле порожнім щоб використовувати базовий шлях CIDRAM."
 Specify a value, or leave blank to disregard: "Вкажіть значення, або залиште поле порожнім щоб ігнорувати."
 Statistics tracking is currently disabled: "Зауважте: Відстеження статистики наразі вимкнено, але його можна ввімкнути на сторінці конфігурації."
 Statistics: "На цій сторінці показано деякі базові статистичні дані щодо вашого встановлення CIDRAM."
 Subtractor: "Віднімач можна використовувати для віднімання одного діапазону IP/CIDR/мережевих масок з іншого."
 Updates: "Сторінка оновлень дозволяє встановлювати, видаляти, та оновлювати різні компоненти CIDRAM (основний пакет, сигнатури, файли L10N, тощо)."
 When available, the value of the country code lookup: "Якщо доступно, значенням пошуку коду країни є двозначний код країни за стандартом {{Links.ISO.3166}}. Наприклад, US для Сполучених Штатів, RU для Росії, CN для Китаю, тощо."
warning: !lazy
 API_Rate_Limited: "Попередження: Здається, доступ до %s API наразі обмежений."
 Cookies: "Зауважте: CIDRAM використовує файли cookie для автентифікації входу. Увійшовши в систему, ви даєте свою згоду на створення та збереження файлів cookie вашим браузером."
 Editing PHP files: "Попередження: Відомо, що деякі рішення безпеки веб-хостингу автоматично забаняють IP-адреси після виявлення тегів PHP у запитах (наприклад, під час спроби змінити файли PHP через браузер). CIDRAM не знає, коли ваша служба веб-хостингу використовує таке рішення безпеки. Щоб уникнути таких проблем, рекомендується не редагувати PHP-файли таким чином, коли це можливо."
 IP tests are disabled: "Попередження: Перевірка файлів сигнатур вимкнена! Файли сигнатур не можна використовувати, доки це не буде вирішено."
 JavaScript required: "Попередження: Деяких фронтенд функціональність потрібен JavaScript. Щоб переконатися, що весь фронтенд працює належним чином, рекомендується ввімкнути JavaScript."
 Likely to be overwritten: "Попередження: Файл, який ви зараз редагуєте, належить компоненту «%s». Будь-які зміни, внесені до цього файлу, дуже ймовірно, будуть перезаписані під час наступного оновленні компонента."
 Likely to become corrupted: "Попередження: У файлі який наразі редагується виявлено байти, що не відповідають UTF8. Файл, ймовірно, буде пошкоджено якщо його редагувати за допомогою цього конкретного засобу."
 Modules are disabled: "Попередження: Модулі вимкнено! Модулі не можна використовувати, доки це не буде вирішено."
 No modules are active: "Попередження: Немає активних модулів! Модулі можна активувати за допомогою сторінок конфігурації або оновлень."
 No signature files are active: "Попередження: Немає активних файлів сигнатури! Файли сигнатури можна активувати за допомогою сторінок конфігурації або оновлень."
 Operating in dry run mode: "Попередження: Робота в режимі сухого ходу! У режимі сухого ходу запити все ще, як зазвичай, перевіряються та журналюються як події блокування, але нічого не блокується."
 Operating in maintenance mode: "Попередження: Робота в режимі обслуговування! У режимі обслуговування нічого не перевіряється, не журналювався, і не блокується."
 Page termination is disabled: "Попередження: Зупинка сторінки вимкнена! Запити не можуть бути належним чином заблоковані, доки це не буде вирішено."
 Proceeding will log out all users: "Попередження: Продовження призведе до виходу всіх користувачів."
 The auxiliary rules execution stage is currently disabled: "Попередження: Етап виконання допоміжних правил наразі вимкнено."
 This account is not using a valid password: "Попередження: Цей обліковий запис використовує недійсний пароль!"
 Using the default password: "Попередження: Використовується стандартний пароль!"
