 projecthoneypot_max_ts_for_captcha: "कॅप्चा सेवा देण्यास परवानगी असलेल्या जास्तीत जास्त धमकी स्कोअर (१ आणि १०० मधील संख्या असणे आवश्यक आहे). डीफॉल्ट = १०."
 projecthoneypot_minimum_threat_score: "CIDRAM ला IP पत्ता अवरोधित करण्यासाठी आवश्यक असलेला किमान धोका स्कोअर (१ आणि १०० मधील संख्या असणे आवश्यक आहे). डीफॉल्ट = १०."
 projecthoneypot_type_of_visitor: "प्रोजेक्ट हनीपॉटने ठरवल्याप्रमाणे अभ्यागताच्या प्रकारानुसार अवरोधित करायचे की प्रोफाइल करायचे याचे नियंत्रण."
 protocol: "प्रोटोकॉल ब्लॉकर मॉड्यूलसाठी कॉन्फिगरेशन."
 protocol_blocked: "निवडलेले प्रोटोकॉल अवरोधित केले जातील."
 protocol_reason_message: "अशा विनंत्या अवरोधित केल्यावर प्रदर्शित होणारा कारण संदेश."
 quic: "क्विक क्लाउड सुसंगतता मॉड्यूल कॉन्फिगरेशन."
 quic_positive_action: "क्विक क्लाउडकडून विनंती आल्यावर CIDRAM ने कोणती कृती करावी? डीफॉल्ट क्रिया = बायपास करा."
 rate_limiting: "दर मर्यादा घालण्यासाठी कॉन्फिगरेशन (सामान्य वापरासाठी शिफारसित नाही)."
 rate_limiting_allowance_period: "वापराचा मागोवा घेण्यासाठी कालावधी. डीफॉल्ट = 0°0′0″."
 rate_limiting_exceptions: "अपवाद (म्हणजेच, ज्या विनंत्या दर मर्यादित नसाव्यात). दर मर्यादा सक्षम केली असेल तरच संबंधित."
 rate_limiting_hint: "लक्षात ठेवा की इतर सर्व CIDRAM वैशिष्ट्यांप्रमाणेच, CIDRAM चे दर मर्यादा वैशिष्ट्य फक्त त्या पृष्ठांसाठी आणि संसाधनांसाठी लागू केले जाऊ शकते ज्यांच्याशी CIDRAM जोडलेले आहे. याचा अर्थ असा की जोडलेले PHP संसाधनांद्वारे दिल्याशिवाय, PHP नसलेली संसाधने समाविष्ट केली जाणार नाहीत. जर तुम्ही दर मर्यादा लागू करण्यासाठी सर्व्हर मॉड्यूल, cPanel, किंवा इतर कोणतेही नेटवर्क टूल वापरू शकत असाल, तर CIDRAM च्या दर मर्यादा वैशिष्ट्याऐवजी ते वापरणे चांगले होईल. हे देखील लक्षात ठेवा की एक उत्सुक आणि दृढनिश्चयी वापरकर्ता त्यांचा IP पत्ता फिरवून किंवा CIDRAM ला अद्याप माहिती नसलेल्या प्रॉक्सी किंवा VPN प्रदात्याकडे स्विच करून दर मर्यादा सहजपणे टाळू शकतो, आणि लक्षात ठेवा की दर मर्यादा अंतिम वापरकर्त्यांसाठी खूप त्रासदायक असू शकते. कधीकधी ते आवश्यक असू शकते, परंतु क्वचितच इष्ट असते."
 rate_limiting_max_bandwidth: "भविष्यातील विनंत्या मर्यादित करण्यापूर्वी भत्ता कालावधीत परवानगी असलेली कमाल बँडविड्थ. ० चे मूल्य या प्रकारच्या दर मर्यादा अक्षम करते. डीफॉल्ट = 0KB."
 rate_limiting_max_requests: "भविष्यातील विनंत्या दर मर्यादित करण्यापूर्वी भत्ता कालावधीत परवानगी असलेल्या विनंत्यांची कमाल संख्या. ० चे मूल्य या प्रकारच्या दर मर्यादा अक्षम करते. डीफॉल्ट = 0."
 rate_limiting_precision_ipv4: "IPv4 वापर ट्रॅक करण्यासाठी वापरायची अचूकता. मूल्य CIDR ब्लॉक आकाराचे प्रतिबिंबित करते. सर्वोत्तम अचूकतेसाठी 32 वर सेट करा. डीफॉल्ट = 32."
 rate_limiting_precision_ipv6: "IPv6 वापर ट्रॅक करण्यासाठी वापरायची अचूकता. मूल्य CIDR ब्लॉक आकाराचे प्रतिबिंबित करते. सर्वोत्तम अचूकतेसाठी 128 वर सेट करा. डीफॉल्ट = 128."
 rate_limiting_segregate: "वेगवेगळ्या डोमेन आणि होस्टसाठी कोटा वेगळे करावेत की शेअर करावेत? True = कोटा वेगळे केले जातील. False = कोटा वाटून घेतले जातील [डीफॉल्ट]."
 sfs: "Stop Forum Spam मॉड्यूलसाठी कॉन्फिगरेशन."
 signatures: "स्वाक्षऱ्या, स्वाक्षरी फायली, मॉड्यूल, इत्यादींसाठी कॉन्फिगरेशन."
 signatures_conflict_response: "जेव्हा एकाच संसाधनांमध्ये प्रवेश करण्यासाठी एकाच वेळी खूप जास्त प्रयत्न केले जातात (उदाहरणार्थ, एकाच मशीनवर एकाच संसाधनांसाठी अनेक PHP प्रक्रियांना एकाच वेळी विनंत्या करणे), तेव्हा त्यातील काही प्रयत्न अयशस्वी होऊ शकतात. जर याचा स्वाक्षरी फायली किंवा मॉड्यूलवर परिणाम झाला तर क्वचित आणि अशक्य परिस्थितीत, CIDRAM ला विनंतीबद्दल प्रभावी निर्णय घेण्यापासून रोखले जाऊ शकते. जर असे घडले, तर विनंती अवरोधित करावी का, आणि CIDRAM ने कोणता HTTP स्थिती संदेश पाठवावा?"
 signatures_default_tracktime: "IP पत्ते किती काळ ट्रॅक करायचे. डीफॉल्ट = 7d0°0′0″ (१ आठवडा)."
 signatures_infraction_limit: "IP ट्रॅकिंगद्वारे बंदी घालण्यापूर्वी IP-ला जास्तीत जास्त किती उल्लंघने करण्याची परवानगी आहे. डीफॉल्ट = १०."
 signatures_shorthand: "दिलेल्या लघुलेखन शब्दांचा वापर करणाऱ्या स्वाक्षरीशी सकारात्मक जुळणी झाल्यास विनंतीचे काय करायचे याचे नियंत्रण करते."
 signatures_tracking_override: "मॉड्यूलना ट्रॅकिंग पर्याय ओव्हरराइड करण्याची परवानगी द्यायची का? True = होय [डीफॉल्ट]; False = नाही."
 supplementary_cache_options: "पूरक कॅशे पर्याय. टीप: ही मूल्ये बदलल्याने तुम्हाला लॉग आउट करण्याची शक्यता आहे."
 supplementary_cache_options_enable_apcu: "कॅशिंगसाठी APCu वापरून पहायचे की नाही ते निर्दिष्ट करते. डीफॉल्ट = True."
 supplementary_cache_options_enable_memcached: "कॅशिंगसाठी Memcached वापरून पहायचे की नाही ते निर्दिष्ट करते. डीफॉल्ट = False."
 supplementary_cache_options_enable_pdo: "कॅशिंगसाठी PDO वापरून पहायचे की नाही ते निर्दिष्ट करते. डीफॉल्ट = False."
 supplementary_cache_options_enable_redis: "कॅशिंगसाठी Redis वापरून पहायचे की नाही ते निर्दिष्ट करते. डीफॉल्ट = False."
