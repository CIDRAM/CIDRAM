Glossary: !lazy
 Entries:
  CIDR:
   pt-BR: |
    "CIDR" é uma sigla para "Classless Inter-Domain Routing" (Roteamento Interdomínio Sem Classes), que é de onde vem o "CIDR" em "CIDRAM". "CIDRAM" é uma sigla para "Classless Inter-Domain Routing Access Manager" (Gerenciador de Acesso de Roteamento Interdomínio Sem Classes).
    No contexto do CIDRAM, "CIDR" (ou "CIDRs") refere-se especificamente a sub-redes expressas usando a notação CIDR.
   pt-PT: |
    "CIDR" é uma sigla para "Classless Inter-Domain Routing" (Roteamento Interdomínio Sem Classes), que é de onde vem o "CIDR" em "CIDRAM". "CIDRAM" é uma sigla para "Classless Inter-Domain Routing Access Manager" (Gerenciador de Acesso de Roteamento Interdomínio Sem Classes).
    No contexto do CIDRAM, "CIDR" (ou "CIDRs") refere-se especificamente a sub-redes expressas utilizando a notação CIDR.
  Falso positivo:
   pt-BR: |
    Em geral, ao realizar um teste, quando os resultados são "positivos" (ou seja, as condições do teste são verdadeiras), mas o esperado (ou deveria ter sido) "negativo" (ou seja, os resultados do teste são errôneos), isso é chamado de "falso positivo". <em>Inglês: "false positive". Ou, em alternativa: "erro falso positivo"; "falso alarme".</em>
    Alguns termos relacionados são "verdadeiro positivo", "verdadeiro negativo", e "falso negativo". <em>Inglês: "true positive", "true negative", "false negative".</em> Um "verdadeiro positivo" ocorre quando os resultados do teste e o estado real da condição são ambos verdadeiros (ou "positivos"), e um "verdadeiro negativo" ocorre quando os resultados do teste e o estado real da condição são ambos falsos (ou "negativos"). Um "verdadeiro positivo" ou um "verdadeiro negativo" é considerado uma "inferência correta".
    O inverso de um "falso positivo" é um "falso negativo". Quando o resultado do teste é "negativo", mas o esperado (ou deveria ter sido) "positivo", o resultado é chamado de "falso negativo".
    No contexto do CIDRAM, esses termos normalmente se referem a quando o CIDRAM bloqueia algo que não deveria, ou quando não consegue bloquear algo que deveria. Quando o CIDRAM bloqueia uma solicitação que não deveria ter sido bloqueada (por exemplo, devido a assinaturas deficientes, desatualizadas, ou incorretas), ou quando o faz por motivos errados, isso é um "falso positivo". Quando o CIDRAM não consegue bloquear uma solicitação que deveria ter sido bloqueada (por exemplo, devido a ameaças imprevistas, assinaturas ausentes, módulos defeituosos, ou deficiências no processo), isso é um "falso negativo" (embora normalmente descrito como uma "detecção perdida"). <em>Inglês: "missed detection".</em>
    | | A solicitação NÃO deve ser bloqueada | A solicitação DEVE ser bloqueada |
    | A solicitação NÃO está bloqueada | Verdadeiro negativo (inferência correta) | Detecção perdida (ou falso negativo) |
    | A solicitação ESTÁ bloqueada | Falso positivo | Verdadeiro positivo (inferência correta) |
    Se você encontrar falsos positivos, primeiro verifique a página de atualizações e, se algo estiver marcado como desatualizado, atualize. Depois disso, se o problema persistir, você poderá relatá-lo no sistema de rastreamento de problemas do CIDRAM.
   pt-PT: |
    Em geral, ao realizar um teste, quando os resultados são "positivos" (ou seja, as condições do teste são verdadeiras), mas o esperado (ou deveria ter sido) "negativo" (ou seja, os resultados do teste são erróneos), isto é designado por "falso positivo". <em>Inglês: "false positive". Ou, em alternativa: "erro falso positivo"; "falso alarme".</em>
    Alguns termos relacionados são "verdadeiro positivo", "verdadeiro negativo", e "falso negativo". <em>Inglês: "true positive", "true negative", "false negative".</em> Um "verdadeiro positivo" ocorre quando os resultados do teste e o estado real da condição são ambos verdadeiros (ou "positivos"), e um "verdadeiro negativo" ocorre quando os resultados do teste e o estado real da condição são ambos falsos (ou "negativos"). Um "verdadeiro positivo" ou um "verdadeiro negativo" é considerado uma "inferência correta".
    O inverso de um "falso positivo" é um "falso negativo". Quando o resultado do teste é "negativo", mas o esperado (ou deveria ter sido) "positivo", o resultado é designado por "falso negativo".
    No contexto do CIDRAM, estes termos referem-se normalmente a quando o CIDRAM bloqueia algo que não deveria, ou quando não consegue bloquear algo que deveria. Quando o CIDRAM bloqueia um solicitação que não deveria ter sido bloqueado (por exemplo, devido a assinaturas deficientes, desatualizadas, ou incorretas), ou quando o faz por motivos errados, isto é um "falso positivo". Quando o CIDRAM não consegue bloquear um solicitação que deveria ter sido bloqueado (por exemplo, devido a ameaças imprevistas, assinaturas ausentes, módulos defeituosos, ou deficiências no processo), isto é um "falso negativo" (embora normalmente descrito como uma "deteção perdida"). <em>Inglês: "missed detection".</em>
    | | A solicitação NÃO deve ser bloqueada | A solicitação DEVE ser bloqueada |
