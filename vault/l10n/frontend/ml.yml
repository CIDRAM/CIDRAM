 IP Tracking: "IP ട്രാക്കിംഗ് പേജ് നിങ്ങളെ IP വിലാസങ്ങളുടെ ട്രാക്കിംഗ് നില പരിശോധിക്കാനും അവയിൽ ഏതാണ് നിരോധിച്ചിരിക്കുന്നതെന്ന് പരിശോധിക്കാനും നിങ്ങൾക്ക് താൽപ്പര്യമുണ്ടെങ്കിൽ നിരോധനങ്ങളോ ട്രാക്കിംഗോ പിൻവലിക്കാനോ അനുവദിക്കുന്നു."
 Intersector: "രണ്ട് ശ്രേണി സെറ്റുകളിൽ നിന്നുള്ള പൊതു ഘടകങ്ങൾ നിർണ്ണയിക്കാൻ ഇന്റർസെക്ടർ ഉപയോഗിക്കാം."
 Logs: "ഒരു ലോഗ് ഫയലിന്റെ ഉള്ളടക്കം കാണുന്നതിന്, താഴെയുള്ള പട്ടികയിൽ നിന്ന് അത് തിരഞ്ഞെടുക്കുക."
 Number of seconds until it expires: "കാലാവധി കഴിയുന്നതുവരെയുള്ള സെക്കൻഡുകളുടെ എണ്ണം."
 Numeric comparison: "സംഖ്യാ താരതമ്യം ഉപയോഗിക്കുന്നതിന്, ഡയറക്ട് സ്ട്രിംഗ് താരതമ്യം അല്ലെങ്കിൽ ഓട്ടോമാറ്റിക് രീതി കണ്ടെത്തൽ തിരഞ്ഞെടുക്കുക, അവസ്ഥയുടെ മൂല്യം സംഖ്യയാണെന്ന് ഉറപ്പാക്കുക, തുടർന്ന് ആവശ്യമുള്ള ഓപ്പറേറ്റർ ഉപയോഗിച്ച് അത് പ്രിഫിക്സ് ചെയ്യുക.<br />ഉദാഹരണത്തിന്, "തുല്യം" എന്ന അവസ്ഥകൾക്ക്, &gt;=2 എന്നത് ≥2 നൽകുന്നു, &lt;=2 എന്നത് ≤2 നൽകുന്നു, "തുല്യമല്ല" എന്ന അവസ്ഥകൾക്ക്, &gt;=2 എന്നത് ≱2 നൽകുന്നു, &lt;=2 എന്നത് ≰2 നൽകുന്നു, മുതലായവ."
 Range Tables: "നിലവിൽ സജീവമായ ഒപ്പ് ഫയലുകൾ ഉൾക്കൊള്ളുന്ന IP ശ്രേണികളെക്കുറിച്ചുള്ള ചില അടിസ്ഥാന സ്ഥിതിവിവരക്കണക്കുകൾ ഈ പേജ് കാണിക്കുന്നു."
 Rate Limiting: "നിരക്ക് പരിധി സംബന്ധിച്ച നിലവിലെ ക്വാട്ട ഉപയോഗവും ലഭ്യതയും ഈ പേജ് കാണിക്കുന്നു."
 Rate limiting is currently disabled: "കുറിപ്പ്: നിരക്ക് പരിധി നിലവിൽ പ്രവർത്തനരഹിതമാക്കിയിരിക്കുന്നു, പക്ഷേ കോൺഫിഗറേഷൻ പേജ് വഴി പ്രവർത്തനക്ഷമമാക്കാം."
 Report to AbuseIPDB: "ഈ പേജ് ഉപയോഗിച്ച് IP വിലാസങ്ങൾ AbuseIPDB-യിലേക്ക് റിപ്പോർട്ട് ചെയ്യാം, അല്ലെങ്കിൽ ഒരു IP വിലാസം തെറ്റായി റിപ്പോർട്ട് ചെയ്യപ്പെട്ടിട്ടുണ്ടെങ്കിൽ മുൻ റിപ്പോർട്ടുകൾ ഇല്ലാതാക്കാം."
 Sections List: "നിലവിൽ സജീവമായ ഒപ്പ് ഫയലുകളിൽ ഏതൊക്കെ വിഭാഗങ്ങളാണുള്ളതെന്ന് ഈ പേജ് പട്ടികപ്പെടുത്തുന്നു."
 See the documentation: "വിവിധ കോൺഫിഗറേഷൻ നിർദ്ദേശങ്ങളെയും അവയുടെ ഉദ്ദേശ്യങ്ങളെയും കുറിച്ചുള്ള വിവരങ്ങൾക്ക് <a href="https://github.com/CIDRAM/Docs/blob/master/readme.en.md\#user-content-SECTION5" hreflang="en" rel="noopener external">ഡോക്യുമെന്റേഷൻ</a> കാണുക."
 Server log snippets, abuse details, etc: "സെർവർ ലോഗ് സ്‌നിപ്പെറ്റുകൾ, ദുരുപയോഗ വിശദാംശങ്ങൾ, മുതലായവ."
 Signature File Fixer: "ഒപ്പ് ഫയലുകളിലെ സാധ്യമായ പ്രശ്നങ്ങൾ കണ്ടെത്തി പരിഹരിക്കുന്നതിനുള്ള ഒരു മാർഗം ഒപ്പ് ഫയൽ ഫിക്സർ നൽകുന്നു."
 Specify a value, or leave blank to disregard: "ഒരു മൂല്യം വ്യക്തമാക്കുക, അല്ലെങ്കിൽ അവഗണിക്കാൻ ശൂന്യമായി വിടുക."
 Statistics tracking is currently disabled: "കുറിപ്പ്: സ്ഥിതിവിവരക്കണക്ക് ട്രാക്കിംഗ് നിലവിൽ പ്രവർത്തനരഹിതമാക്കിയിരിക്കുന്നു, പക്ഷേ കോൺഫിഗറേഷൻ പേജ് വഴി പ്രവർത്തനക്ഷമമാക്കാം."
 Statistics: "നിങ്ങളുടെ CIDRAM ഇൻസ്റ്റാളേഷനെക്കുറിച്ചുള്ള ചില അടിസ്ഥാന ഉപയോഗ സ്ഥിതിവിവരക്കണക്കുകൾ ഈ പേജ് കാണിക്കുന്നു."
 Subtractor: "ഒരു ശ്രേണിയിലുള്ള IP-കൾ/CIDR-കൾ/നെറ്റ്മാസ്കുകൾ എന്നിവ മറ്റൊന്നിൽ നിന്ന് കുറയ്ക്കാൻ സബ്‌ട്രാക്ടർ ഉപയോഗിക്കാം."
 Updates: "അപ്ഡേറ്റ്സ് പേജ് നിങ്ങളെ CIDRAM-ന്റെ വിവിധ ഘടകങ്ങൾ (കോർ പാക്കേജ്, സിഗ്നേച്ചറുകൾ, L10N ഫയലുകൾ, മുതലായവ) ഇൻസ്റ്റാൾ ചെയ്യാനും, അൺഇൻസ്റ്റാൾ ചെയ്യാനും, അപ്ഡേറ്റ് ചെയ്യാനും അനുവദിക്കുന്നു."
