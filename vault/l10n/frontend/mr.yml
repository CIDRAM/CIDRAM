 general_sensitive: "संवेदनशील पृष्ठे मानण्यासाठी मार्गांची यादी. आवश्यकतेनुसार सूचीबद्ध केलेला प्रत्येक मार्ग पुनर्निर्मित URI सोबत तपासला जाईल. फॉरवर्ड स्लॅशने सुरू होणारा मार्ग लिटरल मानला जाईल आणि विनंत्याच्या मार्ग घटकाशी जुळवला जाईल. अन्यथा, जो मार्ग अक्षरांक नसलेल्या वर्णाने सुरू होतो आणि त्याच वर्णाने (किंवा तोच वर्ण आणि पर्यायी "i" ध्वज) संपतो तो नियमित अभिव्यक्ती म्हणून मानला जाईल. इतर कोणत्याही प्रकारचा मार्ग लिटरल मानला जाईल आणि तो URI च्या कोणत्याही भागातून जुळू शकतो. एखादा मार्ग संवेदनशील पृष्ठ म्हणून गणला जातो की नाही याचा काही मॉड्यूल्सच्या वर्तनावर परिणाम होऊ शकतो, परंतु अन्यथा त्याचा कोणताही परिणाम होत नाही."
