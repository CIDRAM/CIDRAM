Glossary: !lazy
 Entries:
  CIDR: |
   "CIDR" è l'acronimo di "Classless Inter-Domain Routing", da cui deriva la sigla "CIDR" in "CIDRAM", essendo "CIDRAM" l'acronimo di "Classless Inter-Domain Routing Access Manager".
   Nel contesto di CIDRAM, "CIDR" si riferisce specificamente alle sottoreti espresse utilizzando la notazione CIDR.
  Falso positivo: |
   In generale, quando si esegue un test e i risultati sono "positivi" (ovvero, le condizioni del test risultano vere), ma ci si aspettava che fossero (o avrebbero dovuto essere) "negativi" (ovvero, i risultati del test sono errati), si parla di "falso positivo". <em>Inglese: "false positive". Oppure, in alternativa: "errore falso positivo"; "falso allarme".</em>
   Alcuni termini correlati sono "vero positivo", "vero negativo", e "falso negativo". <em>Inglese: "true positive", "true negative", "false negative".</em> Un "vero positivo" si verifica quando i risultati del test e lo stato effettivo della condizione sono entrambi veri (o "positivi"), mentre un "vero negativo" si verifica quando i risultati del test e lo stato effettivo della condizione sono entrambi falsi (o "negativi"). Un "vero positivo" o un "vero negativo" è considerato un'"inferenza corretta".
   L'opposto di un "falso positivo" è un "falso negativo". Quando i risultati del test sono "negativi", ma ci si aspettava che fossero (o avrebbero dovuto essere) "positivi", si parla di "falso negativo".
   Nel contesto di CIDRAM, questi termini si riferiscono in genere ai casi in cui CIDRAM blocca qualcosa che non dovrebbe, o quando non riesce a bloccare qualcosa che dovrebbe. Quando CIDRAM blocca una richiesta che non avrebbe dovuto essere bloccata (ad esempio, a causa di firme errate, obsolete, o non valide), o quando lo fa per motivi sbagliati, si parla di "falso positivo". Quando CIDRAM non riesce a bloccare una richiesta che avrebbe dovuto essere bloccata (ad esempio, a causa di minacce impreviste, firme mancanti, moduli difettosi, o lacune nel processo), si parla di "falso negativo" (anche se in genere viene descritto come "mancata rilevazione"). <em>Inglese: "missed detection".</em>
   | | La richiesta NON dovrebbe essere bloccata | La richiesta DOVREBBE essere bloccata |
   | La richiesta NON è bloccata | Vero negativo (inferenza corretta) | Mancata rilevazione (o falso negativo) |
   | La richiesta È bloccata | Falso positivo | Vero positivo (inferenza corretta) |
   Se riscontri falsi positivi, controlla prima la pagina degli aggiornamenti e, se qualcosa è contrassegnato come non aggiornato, aggiornalo. Successivamente, se il problema persiste, è possibile segnalarlo tramite il sistema di segnalazione dei problemi di CIDRAM.
 Indexes:
